# Culvert HA Cluster — Control Plane + Standby + Data Plane workers
#
# DEPLOYMENT MODEL — read first:
#   HA/DP nodes BUILD the proxy image from source (`build: .`), so this file
#   must be deployed ALONGSIDE the source tree (git clone / release tarball),
#   NOT copied on its own. This differs from the single-node quick-start
#   (`scripts/install.sh` + `docker-compose.yml`), which is source-free and
#   runs a pinned `culvert/proxy:pinned` image.
#
#   DAY-2 UPDATES are OUT-OF-BAND for HA: pull the new source and run
#   `docker compose -f docker-compose.ha.yml build && … up -d` on each node.
#   Release Management (the signed catalog + maintenance-agent dispatch) drives
#   upgrades for the SINGLE-NODE installer path only — it retags/recreates
#   `culvert/proxy:pinned`, which HA nodes do not run, so it does not reach them.
#
# Deploy:
#   0. Check out the Culvert source on each node (this file lives at its root).
#   1. Copy this file to BOTH CP servers (Server A + Server B)
#   2. On Server A:  docker compose -f docker-compose.ha.yml up -d
#   3. Open GUI at https://server-a:9090
#      → Enable Control Plane (gRPC :50051)
#      → Import enterprise certs (optional)
#      → Enable HA → enter server-a's reachable address
#      → Copy the standby deploy command
#   4. On Server B:  set HA_JOIN + HA_TOKEN env vars, then:
#      docker compose -f docker-compose.ha.yml up -d
#   5. On DP servers: set ENROLL_URL env var, then:
#      docker compose -f docker-compose.ha.yml --profile dp up -d
#
# Everything after step 2 is configured from the GUI.
# The GUI generates the exact env vars you need for steps 4-5.
#
# Enterprise TLS certs:
#   Mount your certs into /certs/ and set CP_CERT/CP_KEY/CP_CA env vars.
#   The GUI "Enable Control Plane" form also accepts cert paths.

services:

  # ── ClamAV antivirus daemon ─────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:1.4
    container_name: culvert-clamav
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
      - CLAMAV_NO_MILTERD=true
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ── Culvert proxy (CP, Standby, or DP — configured at runtime via GUI) ─────
  proxy:
    build: .
    container_name: culvert
    restart: unless-stopped
    # Long-form `condition: service_healthy` is REQUIRED here, as it is in
    # docker-compose.yml: the short-form list (`- clamav`) waits only for the
    # clamav container to START, not for its healthcheck to pass. ClamAV's own
    # healthcheck carries start_period: 300s for the first-boot signature
    # download, and an unreachable ClamAV is FAIL-OPEN (see
    # diagnostics_clamav_scan.go — "scanned content is being forwarded WITHOUT
    # an antivirus verdict"), so the short form forwarded bodies unscanned for
    # minutes on every HA/DP boot and node reboot. CHAOS-121.
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "8080:8080"   # HTTP/HTTPS proxy
      - "1080:1080"   # SOCKS5 proxy (optional)
      - "9090:9090"   # Admin Web UI
      - "50051:50051" # gRPC (cluster communication)
    volumes:
      - proxy-data:/data
      # Mount enterprise certs (optional):
      # - ./certs:/certs:ro
    environment:
      - TZ=UTC
      # ── HA Standby (set these on Server B only) ────────────────
      # Get these values from the GUI "Enable HA" deploy command.
      - HA_JOIN=${HA_JOIN:-}         # e.g. server-a.internal:50051
      - HA_TOKEN=${HA_TOKEN:-}       # e.g. a3f8c1d2... (startup script's guard reads this)
      # The same value, under the name culvert itself reads (haTokenEnv). It is
      # passed by ENVIRONMENT and never as a flag: see the standby arm below.
      - CULVERT_HA_TOKEN=${HA_TOKEN:-}
      # ── Enterprise TLS (optional) ─────────────────────────────
      - CP_CERT=${CP_CERT:-}         # e.g. /certs/grpc-cert.pem
      - CP_KEY=${CP_KEY:-}           # e.g. /certs/grpc-key.pem
      - CP_CA=${CP_CA:-}             # e.g. /certs/grpc-ca.pem
      - CULVERT_CA_PASSPHRASE=${CULVERT_CA_PASSPHRASE:-}
      - CULVERT_LOG_PASSPHRASE=${CULVERT_LOG_PASSPHRASE:-} # encrypts saved request logs (/data/logstore); falls back to the CA passphrase
      # Session-cookie HMAC signing key — REQUIRED on every node in this
      # multi-node/HA file so admin sessions stay valid cluster-wide
      # (docs/OPERATIONS.md §3); leave unset to let each node generate its
      # own (sessions will not carry over between nodes/restarts).
      - CULVERT_SESSION_SECRET=${CULVERT_SESSION_SECRET:-}
    # The image's ENTRYPOINT is exec-form `["./culvert"]` (Dockerfile), so a
    # `command:` is APPENDED TO IT as argv — it does not replace the process.
    # Without the override below the container therefore ran
    #   ./culvert sh -c '<the script>'
    # and Go's flag package stops parsing at the first non-flag token, so "sh"
    # and everything after it landed in flag.Args() and EVERY flag the script
    # builds was silently discarded. main.go has no flag.NArg() guard and no
    # one-shot command matches, so the process fell straight through into
    # normal startup with ALL FLAG DEFAULTS (empty -ca-path, -policy,
    # -audit-log, -cluster-db, -cp-grpc-addr, --ha-join/--ha-token, --enroll,
    # -clamav-addr) and still passed its /health check. Every other compose
    # file in this repo hands the entrypoint a FLAG LIST for exactly this
    # reason; this file is the one that embeds a shell, so it is the one that
    # must move the shell into the entrypoint. CHAOS-121.
    entrypoint: ["/bin/sh", "-c"]
    # Graceful-shutdown envelope — the same cross-artifact contract
    # docker-compose.yml carries, which this file never received (CHAOS-121).
    # defaultShutdownBudget (main_shutdown.go) is Total 45s and the worst case
    # adds one shutdownHookGrace per late phase: 45 + 2x3 = 51s. Docker's
    # DEFAULT grace is 10s, which SIGKILLs the node inside the EARLY phase and
    # skips the whole drain plus the entire durability reserve — the cluster
    # store flush, the request-log queue drain, a clean badger close (an
    # unclean one is what CHAOS-50's boot-path quarantine exists for) and the
    # audit-log close. TestChaos121_ComposeStopGraceCoversTheShutdownEnvelope
    # pins every culvert service in every compose file to that worst case.
    stop_grace_period: 60s
    command:
      - |
        ARGS="-port 8080
          -ui-port 9090
          -ca-path /data/ca.bundle
          -blocklist /data/blocklist.txt
          -policy /data/policy.json
          -logfile /data/proxy.log
          -audit-log /data/audit.jsonl
          -geoip-db /app/GeoLite2-Country.mmdb
          -clamav-addr tcp:clamav:3310
          -yara-rules-dir /data/yara
          -threat-feed-db /data/threatfeeds.json
          -cat-feed-db /data/catfeeddb
          -ui-users-file /data/ui_users.json
          -fileprofiles-file /data/fileprofiles.json
          -idp-profiles-file /data/idp_profiles.json
          -cluster-db /data/cluster.json"

        if [ -n "$$CP_CERT" ]; then
          ARGS="$$ARGS -cp-grpc-cert $$CP_CERT -cp-grpc-key $$CP_KEY"
        fi
        if [ -n "$$CP_CA" ]; then
          ARGS="$$ARGS -cp-grpc-ca $$CP_CA"
        fi
        if [ -n "$$HA_JOIN" ]; then
          # A well-formed but EMPTY --ha-token is not just cosmetically
          # wrong: clusterStartupConfig.haJoinMode() (cluster_startup_config.go)
          # requires BOTH --ha-join and --ha-token to be non-empty to treat
          # this boot as a standby join. This same ARGS string also sets
          # -cp-grpc-addr :50051, so an empty --ha-token=  makes loadCluster
          # fall through to cpMode() instead — the container comes up
          # HEALTHY as an independent, ACTIVE Control Plane that never joins
          # or replicates from Server A (a silent split-brain, worse than
          # the crash it replaces). Refuse to start rather than let that
          # happen silently (Codex review, PR #1337).
          if [ -z "$$HA_TOKEN" ]; then
            echo "ERROR: HA_JOIN is set but HA_TOKEN is empty — refusing to start (would silently come up as an independent Control Plane instead of joining as a standby). Set HA_TOKEN from Server A's 'Enable HA' deploy command." >&2
            exit 1
          fi
          # The token is NOT put on the command line. It reaches culvert
          # through CULVERT_HA_TOKEN (haTokenEnv in main.go), which this
          # service exports below, for the reason the CA and log passphrases
          # do the same: argv is world-readable inside the PID namespace via
          # /proc/<pid>/cmdline, while /proc/<pid>/environ is restricted to
          # the process owner, and this token is the key-wrapping passphrase
          # for the CLUSTER CA private key in the HA state bundle
          # (controlplane_server.go, CAKeyEncrypted) — a reader can join as a
          # standby and unwrap that key. CHAOS-121 made this script actually
          # run, which is what first expanded the value into argv; moving it
          # to the environment is what keeps the fix from costing the secret.
          #
          # -ha-token still exists and still wins when set, so an operator
          # invoking culvert directly is unaffected.
          ARGS="$$ARGS -cp-grpc-addr :50051 --ha-join $$HA_JOIN"
        fi

        exec ./culvert $$ARGS
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Data Plane worker (activate with --profile dp) ─────────────────────────
  # Usage: ENROLL_URL=culvert://enroll/cp:50051/TOKEN?ca-fp=sha256:FINGERPRINT \
  #          docker compose --profile dp up -d
  # The ?ca-fp=... suffix is NOT optional: callEnrollRPC (dp_enrollment.go)
  # connects to the Control Plane over insecure gRPC, so the fingerprint is
  # the only check against an impersonated CP answering the enrollment call.
  # Omitting it accepts and persists whatever CA the far end presents. The
  # GUI's "Enable HA" / node-enrollment panel gives you the exact URL,
  # fingerprint included — paste it verbatim rather than hand-typing this
  # example. See parseEnrollURL in dp_enrollment.go for the format the
  # `--enroll` flag actually expects.
  dp:
    build: .
    container_name: culvert-dp
    restart: unless-stopped
    profiles: ["dp"]
    # Long-form `condition: service_healthy` is REQUIRED here, as it is in
    # docker-compose.yml: the short-form list (`- clamav`) waits only for the
    # clamav container to START, not for its healthcheck to pass. ClamAV's own
    # healthcheck carries start_period: 300s for the first-boot signature
    # download, and an unreachable ClamAV is FAIL-OPEN (see
    # diagnostics_clamav_scan.go — "scanned content is being forwarded WITHOUT
    # an antivirus verdict"), so the short form forwarded bodies unscanned for
    # minutes on every HA/DP boot and node reboot. CHAOS-121.
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "1080:1080"
    volumes:
      - dp-data:/data
    environment:
      - TZ=UTC
      - ENROLL_URL=${ENROLL_URL:-}
    # The image's ENTRYPOINT is exec-form `["./culvert"]` (Dockerfile), so a
    # `command:` is APPENDED TO IT as argv — it does not replace the process.
    # Without the override below the container therefore ran
    #   ./culvert sh -c '<the script>'
    # and Go's flag package stops parsing at the first non-flag token, so "sh"
    # and everything after it landed in flag.Args() and EVERY flag the script
    # builds was silently discarded. main.go has no flag.NArg() guard and no
    # one-shot command matches, so the process fell straight through into
    # normal startup with ALL FLAG DEFAULTS (empty -ca-path, -policy,
    # -audit-log, -cluster-db, -cp-grpc-addr, --ha-join/--ha-token, --enroll,
    # -clamav-addr) and still passed its /health check. Every other compose
    # file in this repo hands the entrypoint a FLAG LIST for exactly this
    # reason; this file is the one that embeds a shell, so it is the one that
    # must move the shell into the entrypoint. CHAOS-121.
    entrypoint: ["/bin/sh", "-c"]
    # Graceful-shutdown envelope — the same cross-artifact contract
    # docker-compose.yml carries, which this file never received (CHAOS-121).
    # defaultShutdownBudget (main_shutdown.go) is Total 45s and the worst case
    # adds one shutdownHookGrace per late phase: 45 + 2x3 = 51s. Docker's
    # DEFAULT grace is 10s, which SIGKILLs the node inside the EARLY phase and
    # skips the whole drain plus the entire durability reserve — the cluster
    # store flush, the request-log queue drain, a clean badger close (an
    # unclean one is what CHAOS-50's boot-path quarantine exists for) and the
    # audit-log close. TestChaos121_ComposeStopGraceCoversTheShutdownEnvelope
    # pins every culvert service in every compose file to that worst case.
    stop_grace_period: 60s
    command:
      - |
        ARGS="-port 8080
          -ca-path /data/ca.bundle
          -blocklist /data/blocklist.txt
          -policy /data/policy.json
          -logfile /data/proxy.log
          -audit-log /data/audit.jsonl
          -geoip-db /app/GeoLite2-Country.mmdb
          -clamav-addr tcp:clamav:3310
          -yara-rules-dir /data/yara
          -threat-feed-db /data/threatfeeds.json
          -cat-feed-db /data/catfeeddb
          -fileprofiles-file /data/fileprofiles.json
          -idp-profiles-file /data/idp_profiles.json"

        if [ -n "$$ENROLL_URL" ]; then
          ARGS="$$ARGS --enroll $$ENROLL_URL"
        fi

        exec ./culvert $$ARGS
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  proxy-data:
  dp-data:
  clamav-db:
