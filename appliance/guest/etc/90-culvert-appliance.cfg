# Culvert appliance cloud-init policy. The appliance's operator user is
# `culvert` (sudo, NO password — the first boot mints a one-time console
# password; SSH is key-only). cloud-init still honours OVF/NoCloud/guestinfo
# input for hostname, ssh keys, user-data and network.
system_info:
  default_user:
    name: culvert
    gecos: Culvert appliance operator
    groups: [adm, sudo]
    lock_passwd: true
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
ssh_pwauth: false
package_update: false
package_upgrade: false
# Never let a datasource re-create the Ubuntu cloud default user.
disable_root: true
preserve_hostname: false
