# Culvert appliance: let unattended-upgrades restart ordinary services
# automatically, but NEVER the container runtime — a docker/containerd restart
# is a maintenance-window action (live-restore keeps containers up, but the
# operator decides when). Kernel/ucode notices stay informational.
$nrconf{restart} = 'a';
$nrconf{override_rc}{qr(^docker)} = 0;
$nrconf{override_rc}{qr(^containerd)} = 0;
$nrconf{override_rc}{qr(^culvert-maint)} = 0;
$nrconf{kernelhints} = 0;
