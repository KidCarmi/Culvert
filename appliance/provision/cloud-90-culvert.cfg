# Culvert appliance cloud-init policy.
# The default (LOCAL console) user is 'culvert'. Imported public keys are
# staged by firstboot for the separate read-only 'culvert-operator' SSH user.
# OVF/NoCloud `public-keys` and
# `password` apply to it; `password` is one-time (change forced at first login).
system_info:
  default_user:
    name: culvert
    gecos: Culvert appliance administrator
    groups: [adm, sudo]
    sudo: ["ALL=(ALL:ALL) ALL"]
    shell: /bin/bash
    lock_passwd: true
# Only datasources an appliance import can present. OVF covers vSphere
# (guestinfo.ovfEnv) and VirtualBox (ISO); NoCloud covers a hand-made seed ISO.
datasource_list: [ NoCloud, VMware, OVF, None ]
ssh_pwauth: false
disable_root: true
# cloud-init must not grow a second admin on an appliance; only the default user.
users:
  - default
# Regenerate host keys per instance (none ship in the image).
ssh_deletekeys: true
ssh_genkeytypes: [ed25519, ecdsa]
