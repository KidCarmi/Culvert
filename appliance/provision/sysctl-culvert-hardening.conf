# Culvert appliance: kernel runtime settings that close attack surface the
# appliance never uses. Installed as /etc/sysctl.d/99-culvert-hardening.conf
# (systemd-sysctl applies it from the first boot on).
#
# kernel.io_uring_disabled = 2: io_uring is refused for EVERY process, root
# included. The exact HWE kernel builds CONFIG_IO_URING=y and Ubuntu's
# linux-hwe-7.0/noble tracker still lists open io_uring CVEs (CVE-2026-98858,
# HIGH, SQPOLL). Nothing on the appliance uses it: Docker/containerd, the Go
# proxy and ClamAV use epoll, and Docker's default seccomp profile
# (moby/profiles/seccomp v0.2.4) already denies io_uring_setup/enter/register
# inside containers. This setting closes the HOST side, the one the container
# profile cannot cover (#1528 M2, ASTRA 27 Oct).
kernel.io_uring_disabled = 2
