# Culvert appliance: kernel modules the appliance never uses, made unloadable.
#
# The appliance runs Ubuntu's supported HWE kernel (manifest.env
# GUEST_KERNEL_META); its open CVE list (Ubuntu tracker: needed/pending, no
# fixed package yet) and that of the GA kernel it replaced include HIGH and
# CRITICAL findings in the subsystems below. Nothing on the appliance needs
# them, but each is otherwise loadable on demand: sctp/dccp/tipc/rxrpc and
# Bluetooth autoload when any process — a container included — opens such a
# socket, nfsd when an NFS server starts, and kvm_amd/kvm_intel through udev's
# CPU modalias whenever the hypervisor exposes hardware virtualization to the
# guest. `install ... /bin/false` makes every load attempt fail (autoload goes
# through modprobe too), and `blacklist` keeps them out of alias matching.
#
# Every module also gets an EMPTY `softdep` line, and that is load-bearing:
# kmod IGNORES a module's `install` command whenever its own soft
# dependencies resolve to real modules (ksmbd's `crc32` pre-dep loads
# crc32-pclmul), so without the override `install ksmbd /bin/false` was
# never consulted and ksmbd loaded. The empty softdep replaces the module's
# own list, which makes the install command the step that decides. It is
# applied to every entry so a kernel update that adds a softdep cannot
# silently void a rule. The build checks the FINAL step of each module's
# resolution, not merely that an `install /bin/false` line appears, for every
# module this file denies.
#
#   sctp           CVE-2026-64564 (CRITICAL, ASCONF DEL-IP use-after-free)
#   nfsd           CVE-2026-53398 (CRITICAL, SECINFO_NO_NAME decode)
#   kvm, kvm_amd,  CVE-2026-63940 (CRITICAL, KVM SEV port I/O; kvm_amd) —
#   kvm_intel      an appliance is a guest and runs no virtual machines
#   ksmbd, cifs    in-kernel SMB server and client: open HIGH CVEs, and the
#                  appliance neither serves nor mounts SMB
#   can*, pppoe,   socket families that autoload from any process (a container
#   pppox          included) and carry open HIGH CVEs; nothing here uses them
#   ib_core and    the RDMA stack: no RDMA hardware here, yet ib_core autoloads
#   the rdma_*     on an AF_NETLINK/NETLINK_RDMA socket from any process, and
#   modules        RDMA core carries open HIGH CVEs
#   dccp, tipc     unused network protocols with a long exploit history (dccp
#                  is no longer built since kernel 6.16; the rule stays so a
#                  kernel change can never make it loadable unnoticed)
#   ip_vs          CVE-2026-80714 (HIGH): IPVS is Docker Swarm's load balancer;
#                  the appliance runs no swarm
#   openvswitch    CVE-2026-74465 (HIGH): no Open vSwitch datapath here
#   vxlan          CVE-2026-80681 (HIGH): Docker overlay/swarm networking only;
#                  the appliance uses bridge networks
#   target_core_*  CVE-2026-80691 (HIGH, iblock): the LIO SCSI target; the
#                  appliance exports no storage
#   snd, snd_pcm,  CVE-2026-80716 (HIGH, ALSA pcm): no sound device or audio
#   soundcore      use on an appliance
#   bluetooth and  five open HIGH CVEs on the HWE kernel (ISO/SCO/mgmt/hci_sync);
#   its drivers    AF_BLUETOOTH autoloads from any process; no Bluetooth here
#   rxrpc, kafs    AFS (CVE-2026-74506, HIGH) and its AF_RXRPC transport, which
#                  autoloads from any process; the appliance mounts no AFS
#   amdgpu, idpf,  drivers for hardware the appliance never has (AMD GPU, Intel
#   scsi_debug     IPU NIC) and a test driver, each with an open HIGH CVE
#
# The HWE kernel's linux-modules package carries EVERY module (6,900 on
# 7.0.0-38; the GA 6.8 linux-modules carried 1,011 and left the rest to
# linux-modules-extra, which the appliance never installed). The modules
# below were NOT on the GA disk and an unprivileged process — a container
# included — can make them load: a socket family (socket()), a generic
# netlink family (a family lookup), or a sock_diag request. Denying them
# restores the GA disk's unprivileged autoload surface. The build refuses
# any other module with such an alias unless it is listed in
# net-autoload-reviewed.txt (each of those was already on the GA disk).
#   batman_adv, caif_socket, cfg80211, gtp, kcm, l2tp_core, l2tp_ip,
#   l2tp_ip6, l2tp_netlink, l2tp_ppp, macsec, mpls_router, mptcp_diag, nfc,
#   ovpn, qrtr, rds, smc, smc_diag, tipc_diag, xsk_diag
#
# vsock stays loadable: VMware Tools (open-vm-tools) uses it.
#
#   nvmet,         the NVMe-over-Fabrics TARGET (CVE-2026-64535 CRITICAL on the
#   nvmet_tcp      GA kernel, nvmet-tcp): an appliance exports no storage. On
#                  the GA disk these lived in linux-modules-extra; the HWE
#                  linux-modules ships them, so they are denied explicitly.
#                  ib_srpt (the other GA CRITICAL) ships too and depends on
#                  the denied ib_core, so it cannot load.
# (modprobe treats "-" and "_" in a module name as the same character.)
blacklist sctp
blacklist nfsd
blacklist kvm
blacklist kvm_amd
blacklist kvm_intel
blacklist ksmbd
blacklist cifs
blacklist can
blacklist can_raw
blacklist can_bcm
blacklist can_gw
blacklist can_isotp
blacklist can_j1939
blacklist pppoe
blacklist pppox
blacklist ib_core
blacklist ib_cm
blacklist iw_cm
blacklist rdma_cm
blacklist ib_uverbs
blacklist rdma_ucm
blacklist ib_umad
blacklist dccp
blacklist tipc
install sctp /bin/false
install nfsd /bin/false
install kvm /bin/false
install kvm_amd /bin/false
install kvm_intel /bin/false
install ksmbd /bin/false
install cifs /bin/false
install can /bin/false
install can_raw /bin/false
install can_bcm /bin/false
install can_gw /bin/false
install can_isotp /bin/false
install can_j1939 /bin/false
install pppoe /bin/false
install pppox /bin/false
install ib_core /bin/false
install ib_cm /bin/false
install iw_cm /bin/false
install rdma_cm /bin/false
install ib_uverbs /bin/false
install rdma_ucm /bin/false
install ib_umad /bin/false
install dccp /bin/false
install tipc /bin/false
softdep sctp pre: post:
softdep nfsd pre: post:
softdep kvm pre: post:
softdep kvm_amd pre: post:
softdep kvm_intel pre: post:
softdep ksmbd pre: post:
