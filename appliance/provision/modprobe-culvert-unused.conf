# Culvert appliance: kernel modules the appliance never uses, made unloadable.
#
# The shipped kernel is the newest the pinned Ubuntu snapshot offers, and its
# open CVE list (Ubuntu tracker status "affected", no fixed 6.8.0 package yet)
# includes CRITICAL findings in these subsystems. Nothing on the appliance
# needs them, but each is otherwise loadable on demand: sctp/dccp/tipc
# autoload when any process — a container included — opens such a socket,
# nfsd when an NFS server starts, and kvm_amd/kvm_intel through udev's CPU
# modalias whenever the hypervisor exposes hardware virtualization to the
# guest. `install ... /bin/false` makes every load attempt fail (autoload goes
# through modprobe too), and `blacklist` keeps them out of alias matching.
#
# Every module also gets an EMPTY `softdep` line, and that is load-bearing:
# kmod IGNORES a module's `install` command whenever its own soft
# dependencies resolve to real modules (ksmbd's `crc32` pre-dep loads
# crc32-pclmul), so without the override `install ksmbd /bin/false` was
# never consulted and ksmbd loaded. The empty softdep replaces the module's
# own list, which makes the install command the step that decides. It is
# applied to every entry so a kernel update that adds a softdep cannot
# silently void a rule. The build checks the FINAL step of each module's
# resolution, not merely that an `install /bin/false` line appears.
#
#   sctp           CVE-2026-64564 (CRITICAL, ASCONF DEL-IP use-after-free)
#   nfsd           CVE-2026-53398 (CRITICAL, SECINFO_NO_NAME decode)
#   kvm, kvm_amd,  CVE-2026-63940 (CRITICAL, KVM SEV port I/O; kvm_amd) —
#   kvm_intel      an appliance is a guest and runs no virtual machines
#   ksmbd, cifs    in-kernel SMB server and client: open HIGH CVEs, and the
#                  appliance neither serves nor mounts SMB
#   can*, pppoe,   socket families that autoload from any process (a container
#   pppox          included) and carry open HIGH CVEs; nothing here uses them
#   ib_core and    the RDMA stack: no RDMA hardware here, yet ib_core autoloads
#   the rdma_*     on an AF_NETLINK/NETLINK_RDMA socket from any process, and
#   modules        RDMA core carries open HIGH CVEs
#   dccp, tipc     unused network protocols with a long exploit history
#
# vsock stays loadable: VMware Tools (open-vm-tools) uses it.
#
# The other two CRITICALs on this kernel (nvmet-tcp, RDMA srpt) live in
# nvmet-tcp.ko and ib_srpt.ko, which ship in linux-modules-extra: not
# installed, so not on the disk at all. (modprobe treats "-" and "_" in a
# module name as the same character.)
blacklist sctp
blacklist nfsd
blacklist kvm
blacklist kvm_amd
blacklist kvm_intel
blacklist ksmbd
blacklist cifs
blacklist can
blacklist can_raw
blacklist can_bcm
blacklist can_gw
blacklist can_isotp
blacklist can_j1939
blacklist pppoe
blacklist pppox
blacklist ib_core
blacklist ib_cm
blacklist iw_cm
blacklist rdma_cm
blacklist ib_uverbs
blacklist rdma_ucm
blacklist ib_umad
blacklist dccp
blacklist tipc
install sctp /bin/false
install nfsd /bin/false
install kvm /bin/false
install kvm_amd /bin/false
install kvm_intel /bin/false
install ksmbd /bin/false
install cifs /bin/false
install can /bin/false
install can_raw /bin/false
install can_bcm /bin/false
install can_gw /bin/false
install can_isotp /bin/false
install can_j1939 /bin/false
install pppoe /bin/false
install pppox /bin/false
install ib_core /bin/false
install ib_cm /bin/false
install iw_cm /bin/false
install rdma_cm /bin/false
install ib_uverbs /bin/false
install rdma_ucm /bin/false
install ib_umad /bin/false
install dccp /bin/false
install tipc /bin/false
softdep sctp pre: post:
softdep nfsd pre: post:
softdep kvm pre: post:
softdep kvm_amd pre: post:
softdep kvm_intel pre: post:
softdep ksmbd pre: post:
softdep cifs pre: post:
softdep can pre: post:
softdep can_raw pre: post:
softdep can_bcm pre: post:
softdep can_gw pre: post:
softdep can_isotp pre: post:
softdep can_j1939 pre: post:
softdep pppoe pre: post:
softdep pppox pre: post:
softdep ib_core pre: post:
softdep ib_cm pre: post:
softdep iw_cm pre: post:
softdep rdma_cm pre: post:
softdep ib_uverbs pre: post:
softdep rdma_ucm pre: post:
softdep ib_umad pre: post:
softdep dccp pre: post:
softdep tipc pre: post:
