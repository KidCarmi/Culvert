#!/usr/sbin/nft -f
# Culvert appliance host firewall (bootstrap posture).
#
# INPUT: drop by default; accept loopback, established/related, ICMP/ICMPv6,
# and exactly the three appliance ports: 22 (SSH, key-only), 8080 (proxy +
# PAC + /health + /ready), 9090 (admin UI, HTTPS).
#
# Docker manages its OWN tables (ip/ip6 nat + filter via iptables-nft) for the
# published ports and container egress; those traverse FORWARD/NAT, not this
# input chain, so this file defines no forward policy. Traffic from the Docker
# bridges to the host is accepted so container → host paths (e.g. the proxy's
# maintenance-agent socket directory bind-mount, Docker's embedded DNS) keep
# working. Tighten source ranges here (or via the admin UI's -ui-allow-ip) once
# the management network is known.
table inet culvert
flush table inet culvert
table inet culvert {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    iifname { "docker0", "br-*" } accept
    tcp dport 22 accept comment "SSH (key-only)"
    tcp dport 8080 accept comment "Culvert proxy / PAC / health"
    tcp dport 9090 accept comment "Culvert admin UI (HTTPS)"
    counter drop
  }
}
