# Culvert appliance SSH posture (drop-in; Ubuntu's sshd_config stays package-owned).
# Routine key-only SSH uses a dedicated, unprivileged identity. The local
# culvert administrator is reachable through tty1/PAM, never SSH.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
UsePAM yes
AuthenticationMethods publickey
AllowUsers culvert-operator
AuthorizedKeysFile /etc/ssh/culvert-authorized-keys/culvert-operator
ForceCommand /opt/culvert-appliance/bin/culvert-access --ssh
DisableForwarding yes
PermitUserRC no
PermitUserEnvironment no
PermitTunnel no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
MaxAuthTries 4
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
