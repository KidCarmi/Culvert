# Culvert appliance SSH posture (drop-in; Ubuntu's sshd_config stays package-owned).
# Key-only access for the 'culvert' administrator; no root, no passwords.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers culvert
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
MaxAuthTries 4
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
