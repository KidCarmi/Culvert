# Installed only in a candidate guest by install.sh. PAM login remains required.
[Service]
ExecStart=
ExecStart=-/opt/culvert-appliance/bin/culvert-console --login
StandardOutput=tty
StandardError=tty
Environment=TERM=linux
# Clear remaining processes in this unit on stop/restart, not just its leader.
KillMode=control-group
SendSIGHUP=yes
TimeoutStopSec=5s
RestartSec=2s
