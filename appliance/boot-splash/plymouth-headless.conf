# Culvert appliance: no Plymouth splash on a machine with no display controller.
# Installed as a drop-in for plymouth-start (boot) and plymouth-{reboot,
# poweroff,halt,kexec} (shutdown). The initramfs already ended Plymouth at boot
# (culvert-splash-message); without this the real root would start it again,
# and a shutdown would start it too, holding back kernel messages and capturing
# systemd's stop lines on the serial console, which is when a hung shutdown is
# diagnosed. A failed ExecCondition= skips the unit; it is not a failure.
[Service]
ExecCondition=/opt/culvert-appliance/bin/culvert-has-display
