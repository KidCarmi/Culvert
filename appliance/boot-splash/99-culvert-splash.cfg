# Culvert boot presentation. Keep Ubuntu's root, recovery and serial-console
# parameters, Ubuntu's bootloader identity, and a fully informative serial log:
#  - no GRUB_DISTRIBUTOR override: grub-install derives the UEFI bootloader id
#    from it, and the signed shim/GRUB chain is built around /EFI/ubuntu, so a
#    routine grub-efi/shim update must keep installing there;
#  - no `quiet` (and any inherited `quiet` is removed): it lowers the kernel
#    console log level on EVERY console, including ttyS0, which is where boot
#    failures are diagnosed; `plymouth.ignore-serial-consoles` already keeps the
#    splash off serial, so the branded screen costs serial nothing;
#  - no `systemd.show_status=auto`: per-unit start lines on serial show where a
#    slow boot spends its time.
# grub-mkconfig sources this under /bin/sh (dash): POSIX syntax only.
culvert_boot_default=""
for culvert_boot_option in ${GRUB_CMDLINE_LINUX_DEFAULT:-}; do
    case $culvert_boot_option in
        quiet) ;;
        *) culvert_boot_default="${culvert_boot_default:+$culvert_boot_default }$culvert_boot_option" ;;
    esac
done
GRUB_CMDLINE_LINUX_DEFAULT=$culvert_boot_default
for culvert_boot_option in splash plymouth.ignore-serial-consoles; do
    case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
        *" $culvert_boot_option "*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }$culvert_boot_option" ;;
    esac
done
unset culvert_boot_option culvert_boot_default
