# Keep Ubuntu's root, recovery and serial-console parameters. This drop-in
# changes normal boot presentation only; removing splash reveals boot details.
GRUB_DISTRIBUTOR="Culvert"
for culvert_boot_option in quiet splash plymouth.ignore-serial-consoles systemd.show_status=auto; do
    case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
        *" $culvert_boot_option "*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }$culvert_boot_option" ;;
    esac
done
unset culvert_boot_option
