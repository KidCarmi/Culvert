# Culvert appliance: plymouthd daemon settings (copied into the initramfs by
# Ubuntu's plymouth hook; read before plymouthd.defaults, first value wins).
#
# The kernel runs with nomodeset, so no DRM or framebuffer device ever
# appears. Plymouth would wait DeviceTimeout (Ubuntu default 8 s) for one,
# holding tty1 in graphics mode with nothing drawn. A boot that finishes the
# splash inside that window leaves tty1 in graphics mode and the console menu
# never shows. With a 0.1 s wait the text splash draws immediately.
# No Theme= here: the theme is still chosen by the default.plymouth alternative.
[Daemon]
DeviceTimeout=0.1
