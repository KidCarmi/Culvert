# Culvert Content Backlog
#
# The prioritized queue for the autonomous content factory. Every item is
# built against verified product evidence (see CONTENT-STANDARD.md). Status
# values: todo | in_progress | blocked | done. Priority: critical | high |
# medium | low. Items are worked highest-priority-first; ties broken by
# dependency order (foundational items first).
#
# type: doc  = documentation-website article
#       yt   = YouTube package
#       train = administrator-training outline
#       meta = content-infrastructure / index work

meta:
  product: Culvert
  product_summary: >-
    Self-hosted Secure Web Gateway and identity-aware forward proxy
    (HTTP/HTTPS/SOCKS5/WebSocket) shipped as a single Go binary.
  content_root: content/
  standard: CONTENT-STANDARD.md
  evidence_hierarchy:
    - runtime_implementation
    - automated_test_coverage
    - public_api_or_config_contract
    - authoritative_architecture_decision
    - reproducible_lab_evidence

items:
  # ---- Critical: foundational, everything else references these ----
  - id: C-001
    title: "Product overview: what Culvert is and its verified capabilities"
    type: doc
    priority: critical
    status: done
    audience: [evaluator, security-engineer, admin]
    path: content/docs/01-overview/what-is-culvert.md
    evidence_areas: [README.md, main.go, "internal/*", docs/architecture.md]
    depends_on: []
    notes: >-
      Capability inventory verified against code. Each capability row must map
      to a source file/test/API. Explicitly separate supported vs. planned.

  - id: C-002
    title: "Architecture overview (website edition): request pipeline + CP/DP"
    type: doc
    priority: critical
    status: done
    audience: [security-engineer, admin, architect]
    path: content/docs/01-overview/architecture.md
    evidence_areas: [docs/architecture.md, proxy.go, controlplane.go, policy.go]
    depends_on: [C-001]
    notes: >-
      Adapt/verify the request pipeline and CP/DP model against current code;
      Mermaid diagrams faithful to the actual stages. Do not merely mirror
      docs/architecture.md — verify each stage still exists.

  - id: C-003
    title: "Getting started: first boot, setup wizard, readiness verification"
    type: doc
    priority: critical
    status: done
    audience: [admin]
    path: content/docs/02-getting-started/quick-start.md
    evidence_areas: [README.md, scripts/install.sh, docker-compose.yml, healthcheck.go]
    depends_on: [C-001]
    notes: >-
      Every command validated against the built binary / compose file. Health
      and readiness endpoints verified against healthcheck.go.

  # ---- High: core capability administration guides ----
  - id: H-010
    title: "Policy engine & Zero-Trust egress policy authoring"
    type: doc
    priority: high
    status: done
    audience: [security-engineer, admin]
    path: content/docs/03-policy/policy-engine.md
    evidence_areas: [policy.go, "internal/urlcat", "internal/sslbypass", proxy.go]
    depends_on: [C-002]
    notes: 8 condition types, first-match, default-deny, actions, TLS action.

  - id: H-011
    title: "TLS inspection administration guide"
    type: doc
    priority: high
    status: done
    audience: [security-engineer, admin]
    path: content/docs/04-tls-inspection/tls-inspection.md
    evidence_areas: [ca.go, "internal/ca", proxy_tunnel.go, docs/operator/decryption-profiles.md]
    depends_on: [H-010]
    notes: CA lifecycle, leaf signing, per-host bypass, cache bounds, passphrase.

  - id: H-012
    title: "Identity & access: OIDC, SAML, LDAP, TOTP 2FA, admin RBAC"
    type: doc
    priority: high
    status: done
    audience: [security-engineer, admin]
    path: content/docs/05-identity/identity-and-access.md
    evidence_areas: [auth_oidc.go, auth_saml.go, auth_ldap.go, "internal/totp", ui_rbac.go]
    depends_on: [C-002]
    notes: Multi-IdP routing, RBAC roles, session security.

  - id: H-013
    title: "Observability: metrics, dashboard, logs, syslog, alerts, audit"
    type: doc
    priority: high
    status: done
    audience: [admin, sre]
    path: content/docs/06-observability/observability.md
    evidence_areas: [metrics.go, events.go, logger.go, syslog.go, alerts.go, "internal/audit"]
    depends_on: [C-002]
    notes: Prometheus namespace, SSE, syslog RFC modes, signed webhooks, audit ring.

  - id: H-014
    title: "YouTube: What is Culvert (product intro, 3-4 min)"
    type: yt
    priority: high
    status: done
    audience: [evaluator, security-engineer]
    path: content/youtube/01-what-is-culvert/
    evidence_areas: [C-001]
    depends_on: [C-001]
    notes: Narration grounded in the verified capability inventory.

  - id: H-015
    title: "YouTube: Deploy Culvert in 5 minutes (quick-start demo)"
    type: yt
    priority: high
    status: done
    audience: [admin]
    path: content/youtube/02-deploy-in-5-minutes/
    evidence_areas: [C-003]
    depends_on: [C-003]
    notes: Every command reproduced/validated; failure & recovery path real.

  # ---- Medium: deeper capability + operations ----
  - id: M-020
    title: "Content security: ClamAV, YARA, threat feeds, DPI, file blocking, CDR"
    type: doc
    priority: medium
    status: done
