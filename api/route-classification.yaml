# Culvert API route classification & exemption manifest
# AUTHORITY: this file classifies EVERY registered admin-API route.
# Generated from the live uiRoutes table; hand-maintained thereafter.
# The route-coverage gate (internal/apicontract) enforces:
#   * every live route+method has a row here (no unclassified route),
#   * every row maps to a live route (no stale row),
#   * documented:true rows appear as an operation in the OpenAPI spec,
#   * exempt rows carry owner + reason + future expiry + security_class,
#   * no expired exemption survives, and no exemption is set beyond the
#     270-day horizon (MaxExemptionHorizonDays) — exemptions may not defer
#     documentation indefinitely,
#   * each row's min_role/mutating/audit_expected MATCH the live router
#     (ROLE/MUTATING/AUDIT DRIFT), so the manifest is a projection of the
#     C1.5-verified uiRoutes, not an independent copy.
#
# NOTE on dynamic dispatchers (apiIdPRouter, apiBootstrapRouter): these are
# single prefix registrations that dispatch multiple sub-actions internally.
# While exempt they are covered by the prefix row; when DOCUMENTED they must be
# broken out into explicit per-operation spec paths ({param} + openapi_path),
# because a method:"*" documented row only proves a single method exists.
# See docs/api/API-CONTRIBUTING.md for the workflow.
version: 1
baseline_exemption_expiry: &baseline '2027-01-31'
