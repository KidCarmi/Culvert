      operationId: deleteCDRInstance
      tags: [cluster]
      summary: Delete CDR instance (local only)
      description: >-
        Remove an enrolled instance from THIS appliance's registry and
        shred its local mTLS material. LOCAL ONLY — Sluice keeps
        trusting the issued client certificate until it expires or is
        revoked on the Sluice side — EVERY still-valid generation of the
        credential lineage; the response and the audit record carry all
        of their fingerprints (the Sluice-side revocation keys) so that
        remains possible after the local shred. An UNRESOLVED renewal
        (a generation with an operation id but no fingerprint — the
        RenewCert response was lost) is resolved AUTHORITATIVELY through
        Sluice's EnrollStatus BEFORE any mutation (works with CDR disabled,
        no pool, no poller, right after a restart): NOT_ISSUED drops the
        intent, ISSUED binds the fingerprint durably and it is then
        reported as still trusted; when the engine cannot be asked (503)
        or the outcome cannot be persisted (409) NOTHING changes. Use
        /api/cdr/instances/revoke to actually revoke the credential.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: cdr.instance.remove
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Instance removed locally.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [removed, clientCertFingerprint, clientCertFingerprints]
                properties:
                  removed: { type: string }
                  clientCertFingerprint:
                    type: string
                    description: "SHA-256 fingerprint of the active orphaned client cert (sha256:<hex>); empty when unknown (legacy entry with an unreadable cert)."
                  clientCertFingerprints:
                    type: array
                    items: { type: string }
                    description: "EVERY still-valid generation Sluice keeps trusting after this local removal (active first)."
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: Instance not found. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '409':
          description: An unresolved renewal was resolved but its outcome could not be persisted; nothing changed. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '503':
          description: An unresolved renewal could not be resolved against the engine; nothing changed. Body is plain text.
          content:
            text/plain: { schema: { type: string } }

