  /api/support/bundles/{id}/upload:
    get:
      operationId: getSupportBundleUpload
      tags: [support]
      summary: One bundle's upload status
      description: >-
        Returns one support bundle's upload-queue entry — state, attempts, and the
        signed delivery receipt if delivered. Read-only.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.1.0
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Upload status for the bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadEntry' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: Bundle not queued for upload. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
    post:
      operationId: consentSupportBundleUpload
      tags: [support]
      summary: Consent to upload a bundle to TAC (DESTRUCTIVE — egress)
      description: >-
        Explicit per-bundle upload consent: seals the READY bundle to the
        configured TAC recipient and enqueues it for the background worker to
        deliver. Fails closed unless upload is enabled, a TAC trust key is
        configured, the bundle is READY, and confirm=true with a valid case_id.
        Causes outbound egress of the (encrypted) bundle. Admin-only and audited.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.1.0
      x-culvert-danger-level: high
      x-culvert-audit-event: support.upload
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentUploadRequest' }
            example: { case_id: "00123456", confirm: true }
      responses:
        '202':
          description: Bundle sealed and enqueued for upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadEntry' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409':
          description: Precondition not met (upload disabled, no TAC key, or bundle not READY). Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '500':
          description: Seal/enqueue failed. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
