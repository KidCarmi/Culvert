      x-culvert-danger-level: medium
      x-culvert-audit-event: authpolicy.reorder
      parameters:
        - name: ifVersion
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Optional running-generation assertion (from GET /api/authpolicy version).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthReorderRequest' }
      responses:
        '200':
          description: Reorder auth policy rules.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: 'Malformed input, independent of the rulebase (grammar, body shape, a missing name, a bad timezone, an id that belongs to the other rule type), or — WITH a matching ifVersion assertion — a request that conflicts with the very rulebase it asserted (name or priority already in use, an order list that does not cover the set): reloading would change nothing.' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409': { description: 'Version fence conflict ({error, currentVersion, yourVersion}); or — WITHOUT an ifVersion assertion — a request that conflicts with the CURRENT rulebase (name/priority already in use, a priority that now belongs to the other rule type, an order list that no longer covers the set), decided inside the coordinator fence: {error, currentVersion} — refresh and reapply, the mutation did not run.' }
        '500': { description: 'Durable persist failed — the reorder was rolled back.' }
