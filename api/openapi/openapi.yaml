        blocked: { type: array, items: { type: number }, nullable: true }
    ClusterStatus:
      type: object
      description: Cluster node role and enrollment status (fields vary by role).
      required: [role]
      additionalProperties: true
      properties:
        role: { type: string }
        nodeID: { type: string }
        grpcCompressionEnabled: { type: boolean, description: 'Resolved CULVERT_CLUSTER_GRPC_COMPRESSION value for this node (startup-scoped, read-only here).' }
    ClusterNodes:
      type: object
      required: [nodes]
      additionalProperties: true
      properties:
        nodes: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
    NodeConvergence:
      type: object
      description: One data-plane node's convergence state relative to the control plane.
      additionalProperties: false
      required: [node_id, config_version, versions_behind, converged, fp_mismatch, reporting]
      properties:
        node_id: { type: string }
        config_version: { type: integer, format: int64 }
        versions_behind: { type: integer, format: int64 }
        converged: { type: boolean }
        fp_mismatch: { type: boolean, description: At the CP version but a different blocklist fingerprint (drift). }
        reporting: { type: boolean, description: Node reported T3 telemetry (old data planes omit it). }
        uptime: { type: string }
    FleetConvergence:
      type: object
      description: Control-plane aggregate of fleet config-sync convergence.
      additionalProperties: false
      required: [cp_version, node_count, converged, stragglers]
      properties:
        cp_version: { type: integer, format: int64 }
        cp_fp: { type: string, description: Newest blocklist fingerprint for the current version ("" when the ring has none). }
        node_count: { type: integer }
        converged: { type: integer }
        stragglers: { type: integer }
        nodes: { type: array, items: { $ref: '#/components/schemas/NodeConvergence' }, nullable: true }
    ClusterMetrics:
      type: object
      description: Aggregated per-node cluster metrics.
      additionalProperties: true
    ClusterHA:
      type: object
      description: High-availability status.
      required: [enabled, role]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        role: { type: string }
    SupportStatus:
      type: object
      description: Supportability status (debug level, bundle state, retention).
      additionalProperties: true
    BackupsStatus:
      type: object
      description: >-
        Backup archive listing read from the CP-local maintenance agent.
        `available:false` means the agent could not be reached or is not
        configured; `backups` is newest-first when available.
      additionalProperties: true
    UpstreamEntry:
      type: object
      description: >-
        One effective parent-proxy entry (2F-C Upstream v2). Credential-FREE by
        construction: `url`/`authority` never carry userinfo beyond the
        username, `credentialState` is DERIVED server-side (never accepted
        from a client) and the probe/eligibility verdicts are the pool's own.
        `source: yaml` entries are read-only through the API (409 yaml_owned).
      required: [id, url, authority, scheme, host, port, source, revision, credentialState, probe, health, healthy, eligible, circuit, failures]
      additionalProperties: false
      properties:
        id: { type: string, description: 'Server-assigned ULID (managed) or `yaml-<digest>` (config.yaml).' }
        url: { type: string, description: 'Legacy field — `scheme://host:port` with NO userinfo of any kind (the username is its own field).' }
        authority: { type: string, description: 'Canonical `scheme://[username@]host:port`.' }
        scheme: { type: string, enum: [http, https] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        source: { type: string, enum: [managed, yaml] }
        revision: { type: integer, format: int64, description: 'Per-entry optimistic-concurrency token (echo on PUT/DELETE/credential).' }
        credentialState: { type: string, enum: [none, configured, unusable, mismatch, requiresReplacement] }
        probe: { $ref: '#/components/schemas/UpstreamProbe' }
        health: { $ref: '#/components/schemas/UpstreamHealth' }
        healthy: { type: boolean, description: 'Legacy — true only when the probe is `healthy`.' }
        eligible: { type: boolean, description: 'Selectable now (credential usable AND probe unprobed/healthy AND breaker admitting).' }
        circuit: { type: string, enum: [closed, open, half-open] }
        failures: { type: integer, format: int64 }
        openedAtMs: { type: integer, format: int64 }
        retryAfterMs: { type: integer, format: int64 }
    UpstreamProbe:
      type: object
      description: Compatibility alias of `health` (same verdict, legacy field names).
      required: [status, reason]
      additionalProperties: false
      properties:
        status: { type: string, enum: [unprobed, healthy, unhealthy] }
        reason: { type: string, enum: [none, connect_failed, timeout, proxy_auth_failed, probe_http_error, credential_ineligible] }
        checkedAt: { type: string }
        source: { type: string, enum: [periodic, manual] }
    UpstreamHealth:
      type: object
      description: 'Per-entry health truth: the last classified probe verdict, when it landed, and whether the periodic loop or an operator produced it.'
      required: [status, reason]
      additionalProperties: false
      properties:
        status: { type: string, enum: [unprobed, healthy, unhealthy] }
        reason: { type: string, enum: [none, connect_failed, timeout, proxy_auth_failed, probe_http_error, credential_ineligible] }
        lastProbeAt: { type: string, description: RFC3339; absent while unprobed. }
        source: { type: string, enum: [periodic, manual] }
    UpstreamEffective:
      type: object
      required: [mode, entries, eligible, fallbackTotal, since]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [no_pool, chained, no_eligible_parent, direct_fallback] }
        entries: { type: integer }
        eligible: { type: integer }
        fallbackTotal: { type: integer, format: int64 }
        since: { type: string, description: 'RFC3339 instant the current mode was first observed (re-stamped only on a transition).' }
    UpstreamMigration:
      type: object
      description: Boot-time legacy→v2 migration outcome (node-local, bounded reason; never a URL or credential).
      required: [state]
      additionalProperties: false
      properties:
        state: { type: string, enum: [none, ok, degraded] }
        reason: { type: string }
        at: { type: string }
        migrated: { type: integer }
        sealed: { type: integer }
        yamlOwned: { type: integer }
    UpstreamKeyState:
      type: object
      description: Node-local credential-key availability (`.upstream_cred_key`); `keyId` is a public fingerprint, never key material.
      required: [state]
      additionalProperties: false
      properties:
        state: { type: string, enum: [present, missing, unreadable, unused] }
        keyId: { type: string }
    UpstreamDegraded:
      type: object
      description: 'A bounded validation degradation. `degraded` = the STORED managed document was rejected at load (managed entries unpublished; every managed mutation, import and key creation refused with 409 document_rejected until repair + restart). `yamlDegraded` = the config.yaml seed was refused whole (independent; never cleared by the managed document loading).'
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string }
        count: { type: integer }
    ConfigImportResult:
      type: object
      description: >-
        Import answer. `dryRun:true` answers add `sections`, `settings`, the
        upstream `plan` and `importDigest`; commits add `cluster_publish_rejected`
        when the fleet publish was refused. Upstream is reported as COUNTS only.
      required: [ok]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        dryRun: { type: boolean }
        mode: { type: string, enum: [merge, replace] }
        exportedAt: { type: string }
        upstream: { $ref: '#/components/schemas/UpstreamImportSummary' }
        plan: { $ref: '#/components/schemas/UpstreamImportPlan' }
        importDigest: { type: string, description: 'Deterministic identity of the plan against the current document (`sha256:…`).' }
        cluster_publish_rejected: { type: string }
    UpstreamImportSummary:
      type: object
      description: 'Counts-only upstream import summary (C5): never an id, authority or credential.'
      required: [preserved, omitted, cleared, requiresReplacement]
      additionalProperties: false
      properties:
        preserved: { type: integer, description: 'Existing credentials kept (id resolved uniquely, authority unchanged).' }
        omitted: { type: integer, description: 'Incoming entries whose export declared a credential the export omitted by construction.' }
        cleared: { type: integer, description: 'Credentials cleared by the import — always 0 (an import never clears; it refuses).' }
        requiresReplacement: { type: integer, description: 'Entries landing in the requiresReplacement state (declared credential that could not be inherited).' }
    UpstreamImportPlan:
      type: object
      description: >-
        The whole-file upstream import plan (C9), computed before any store is
        touched. Identities and actions only — never an authority, username or
        credential. Incoming: preserve | create | update | requiresReplacement;
        existing: retain | remove. Any removal/replacement/authority change of a
        credentialed entry lists it under credentialClearRequired.
      required: [mode, incoming, existing, credentialClearRequired, counts, yamlOwnedSkipped]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [merge, replace] }
        incoming:
          type: array
          items: { $ref: '#/components/schemas/UpstreamPlanItem' }
        existing:
          type: array
          items: { $ref: '#/components/schemas/UpstreamPlanItem' }
        credentialClearRequired:
          type: array
          items: { type: string }
        counts:
          type: object
          additionalProperties: { type: integer }
        yamlOwnedSkipped: { type: integer, description: 'Incoming entries whose authority config.yaml owns on this node (read-only, never adopted).' }
        legacy: { type: boolean, description: 'The payload carried only the pre-2F-D upstreamProxies list (authority-keyed compatibility rule).' }
    UpstreamPlanItem:
      type: object
      required: [id, action]
      additionalProperties: false
      properties:
        id: { type: string }
        action: { type: string, enum: [preserve, create, update, requiresReplacement, retain, remove] }
    UpstreamImportRefusal:
      type: object
      description: >-
        Structured refusal of the upstream section of an import. 409 codes
        carry the complete `plan`; 400 schema codes carry the offending entry
        `index` when one applies (never the offending value).
      required: [error, code]
      additionalProperties: true
      properties:
        error: { type: string }
        code:
          type: string
          enum: [credential_clear_required, import_stale, document_rejected,
                 invalid_credential_state, invalid_upstream_credentials_marker, schema_mismatch,
                 invalid_entry, duplicate_id, ambiguous_upstream_sections, credentials_not_importable]
        index: { type: integer, description: 'Zero-based index of the offending upstream entry (entry-level 400s only).' }
        plan: { $ref: '#/components/schemas/UpstreamImportPlan' }
    UpstreamProbeSummary:
      type: object
      description: 'Counts-only outcome of one manual probe run (what the audit line carries).'
      required: [probed, healthy, unhealthy, skipped]
      additionalProperties: false
      properties:
        probed: { type: integer }
        healthy: { type: integer }
        unhealthy: { type: integer }
        skipped: { type: integer, description: 'Credential-ineligible entries, not probed.' }
    UpstreamConfig:
      type: object
      description: >-
        The Upstream v2 read model (2F-C). `entries` and the legacy `proxies`
        carry the same credential-free rows; `revision` is the managed-document
        token every bulk mutation must echo; `migration`/`key`/`degraded` are
        the node-local truth an operator needs to understand an ineligible
        credential. Scope is always node-local (never CP→DP synced).
      required: [enabled, proxies, entries, revision, mode, effective, coverage, probe, direct_fallback, migration, key, credentialsIneligible, credentialsRequiringReplacement, scope]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        mode: { type: string, enum: [no_pool, chained, no_eligible_parent, direct_fallback] }
        effective: { $ref: '#/components/schemas/UpstreamEffective' }
        coverage:
          type: object
          description: 'Backend-derived chaining coverage per client path (PX-1: only the plain-HTTP forward path is chained; CONNECT, WebSocket and SOCKS5 client traffic egress direct).'
          required: [plainHttp, connect, websocket, socks5, summary]
          additionalProperties: false
          properties:
            plainHttp: { type: string, enum: [chained] }
            connect: { type: string, enum: [direct] }
            websocket: { type: string, enum: [direct] }
            socks5: { type: string, enum: [direct] }
            summary: { type: string, enum: [plain_http_only] }
        probe:
          type: object
          description: The periodic health-probe configuration armed at startup (config.yaml upstream.health_interval).
          required: [configured, interval]
          additionalProperties: false
          properties:
            configured: { type: boolean }
            interval: { type: string, description: 'Go duration; "0s" when no periodic probe runs.' }
        revision: { type: integer, format: int64 }
        entries: { type: array, items: { $ref: '#/components/schemas/UpstreamEntry' }, nullable: true }
        proxies: { type: array, items: { $ref: '#/components/schemas/UpstreamEntry' }, nullable: true, description: 'Legacy alias of `entries`.' }
        direct_fallback:
          type: object
          description: CHAOS-11 fail-open visibility — whether the pool is currently bypassed to DIRECT egress (all parents unhealthy or circuit-open) and how many requests have fallen back since startup.
          additionalProperties: false
          required: [active, total]
          properties:
            active: { type: boolean }
            total: { type: integer, format: int64 }
        migration: { $ref: '#/components/schemas/UpstreamMigration' }
        key: { $ref: '#/components/schemas/UpstreamKeyState' }
        degraded: { $ref: '#/components/schemas/UpstreamDegraded' }
        yamlDegraded: { $ref: '#/components/schemas/UpstreamDegraded' }
        credentialsIneligible: { type: integer, description: 'Entries whose credential is unusable, mismatched or requires replacement (never selected, never probed).' }
        credentialsRequiringReplacement: { type: integer, description: '2F-D (C12): entries in the distinct requiresReplacement state — restored from a backup (which omits credentials by design) or imported with a declared credential this node never held; ineligible until each is replaced (T2) or cleared (T3).' }
        scope: { type: string, enum: [node-local] }
        ok: { type: boolean, description: 'Present on mutation answers.' }
        summary: { $ref: '#/components/schemas/UpstreamProbeSummary' }
        yamlOwned: { type: integer, description: 'v1 adapter — incoming authorities skipped because config.yaml owns them.' }
        entry: { $ref: '#/components/schemas/UpstreamEntryDTO' }
    UpstreamEntryDTO:
      type: object
      description: The entry a create/update/credential mutation just produced.
      required: [id, scheme, host, port, authority, source, revision, credentialState]
      additionalProperties: false
      properties:
        id: { type: string }
        scheme: { type: string }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        authority: { type: string }
        source: { type: string }
        revision: { type: integer, format: int64 }
        credentialState: { type: string, enum: [none, configured, unusable, mismatch, requiresReplacement] }
    UpstreamEntrySpec:
      type: object
      description: >-
        Create/update body for a managed entry (2F-C). The password is NEVER
        part of this body — it is set write-only through the credential
        endpoint. A body carrying `credentialState` or `credential_configured`
        is refused (400). `revision` is the DOCUMENT revision on create and the
        ENTRY revision on update (428 missing, 409 stale, 404 vanished).
      required: [scheme, host, revision]
      additionalProperties: false
      properties:
        scheme: { type: string, enum: [http, https] }
        host: { type: string }
        port: { type: integer, description: '0 or absent ⇒ the scheme default (80/443).' }
        username: { type: string }
        revision: { type: integer, format: int64 }
    UpstreamCredentialRequest:
      type: object
      x-culvert-sensitive: true
      description: >-
        Write-only credential operation. `replace` seals the password under
        the node-local key (T2; 409 key_unusable when no key can be used);
        `clear` removes it (T3 — `confirm` must equal the entry id; 409
        confirm_required otherwise). The password is never returned, logged,
        audited or persisted in cleartext.
      required: [action, revision]
      additionalProperties: false
      properties:
        action: { type: string, enum: [replace, clear] }
        password: { type: string, writeOnly: true }
        confirm: { type: string }
        revision: { type: integer, format: int64, description: 'The ENTRY revision.' }
    UpstreamRefusal:
      type: object
      description: >-
        Structured 2F-C refusal. `code` is bounded: precondition_required (428),
        stale (409, `current.revision`), vanished (404), yaml_owned (409),
        credential_bound (409 — authority change while a credential exists;
        clear it first), credential_present (409 — delete refused), confirm_required
        (409, `current.confirmValue`), credentialed_entries_present (409 — the v1
        bulk adapter while any managed entry holds a credential),
        duplicate_authority (409, `count`), no_credential (409 — clear on an entry
        without material), invalid_entry / userinfo_not_allowed /
        credential_state_not_accepted / invalid_password / invalid_action /
        invalid_json (400), key_unusable (409), document_rejected (409 — the
        stored document failed validation at load; nothing is accepted until
        repair), persist_failed / seal_failed (500 — nothing was changed).
      required: [error, code, current]
      additionalProperties: false
      properties:
        error: { type: string }
        code: { type: string }
        current: { type: object, additionalProperties: true }
        count: { type: integer }

    # ── Slice 3 tranche 6: cluster/support/diagnostics read-model schemas ──────────
    ClusterCAInfo:
      type: object
      description: Cluster CA info (fingerprint, validity, readiness).
      additionalProperties: true
    ClusterTokens:
      type: object
      required: [tokens]
      additionalProperties: false
      properties:
        tokens: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
    ClusterAudit:
      type: object
      required: [entries, total]
      additionalProperties: false
      properties:
        entries: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        total: { type: integer }
    BandwidthPolicies:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    ClusterRateLimits:
      type: object
      required: [enabled]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
    ClusterRevocations:
      type: object
      required: [local_revoked, cluster_mode]
      additionalProperties: true
      properties:
        local_revoked: { type: integer }
        cluster_mode: { type: boolean }
    ClusterRotation:
      type: object
      required: [active]
      additionalProperties: true
      properties:
        active: { type: boolean }
    SupportRetention:
      type: object
      required: [keep, max_age_days]
      additionalProperties: true
      properties:
        keep: { type: integer }
        max_age_days: { type: integer }
        defaults: { type: object, additionalProperties: true }
    OperatorContract:
      type: object
      description: Aggregated operator diagnostics contract (health, posture, and remediation hints).
      additionalProperties: true

    # ── Slice 3 tranche 7: remaining reads (node-groups/support/scan) ──────────────
    NodeGroups:
      type: object
      description: Node group definitions and selectors.
      additionalProperties: true
    NodeGroupMembership:
      type: object
      description: Nodes matching a node group's label selector.
      additionalProperties: true
    SupportBundles:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    SupportDebugLevel:
      type: object
      description: Support debug-level state.
      additionalProperties: true
    UploadConfigStatus:
      type: object
      description: Node-local support-bundle upload posture.
      additionalProperties: false
      required: [enabled, state, credential_set]
      properties:
        enabled: { type: boolean }
        state: { type: string, enum: [not_enabled, enabled] }
        origin: { type: string, description: "Configured destination origin (present when set)." }
        origin_host: { type: string, description: "Host derived from the origin, for display." }
        credential_set: { type: boolean, description: "Whether a bearer credential is stored (the value is never exposed)." }
    SetUploadConfig:
      type: object
      description: >-
        Arm/disarm the upload posture. Enabling requires a non-empty origin; a bare
        disable ({} or {"enabled":false}) is always accepted.
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        origin: { type: string, description: "Destination origin URL; required to enable." }
        credential: { type: string, format: password, description: "Bearer credential to store; empty keeps the existing one." }
        clear_credential: { type: boolean, description: "Explicitly remove the stored credential." }
    UploadReceipt:
      type: object
      description: Signed delivery receipt for an uploaded support bundle.
      additionalProperties: false
      properties:
        bundle_sha256: { type: string }
        received_at: { type: string }
        sig: { type: string, description: "Signature over the receipt (public verification material)." }
    UploadEntry:
      type: object
      description: One support-bundle upload-queue entry (no secret fields).
      additionalProperties: false
      required: [bundle_id, case_id, state, attempts, key_id, updated_at]
      properties:
        bundle_id: { type: string }
        case_id: { type: string }
        state: { type: string, description: "Upload state machine value." }
        attempts: { type: integer }
        key_id: { type: string, description: "TAC trust key id the bundle was sealed to." }
        updated_at: { type: string }
        last_error: { type: string, description: "Last delivery error (present only after a failed attempt)." }
        receipt: { $ref: '#/components/schemas/UploadReceipt' }
    UploadQueue:
      type: object
      description: The outbound support-bundle upload queue.
      additionalProperties: false
      required: [uploads]
      properties:
        uploads: { type: array, items: { $ref: '#/components/schemas/UploadEntry' }, nullable: true }
        max: { type: integer, description: "Maximum queue size." }
    ConsentUploadRequest:
      type: object
      description: Explicit per-bundle upload consent.
      additionalProperties: false
      required: [case_id, confirm]
      properties:
        case_id: { type: string, description: "Support case the bundle is evidence for (mandatory)." }
        confirm: { type: boolean, description: "Must be true — explicit operator consent to egress." }
    TACTrustKey:
      type: object
      description: One TAC recipient trust key (public material only).
      additionalProperties: false
      required: [key_id, alg, public_key, fingerprint, source, active]
      properties:
        key_id: { type: string }
        alg: { type: string, description: "Key algorithm (x25519)." }
        public_key: { type: string, description: "Public key material (base64); never a private key." }
        fingerprint: { type: string }
        source: { type: string, description: "Where the key was resolved from (\"baked\" default root, or \"configured\" via CULVERT_TAC_TRUST_KEYS)." }
        active: { type: boolean }
    TACTrustStatus:
      type: object
      description: >-
        Resolved TAC trust set. On a malformed CULVERT_TAC_TRUST_KEYS the handler
        returns configured=false with a sanitized error and an empty key list.
      additionalProperties: false
      required: [configured, keys]
      properties:
        configured: { type: boolean, description: "True when at least one key is present and one is active." }
        active_key: { type: string, description: "Key id of the active recipient (omitted on error)." }
        keys: { type: array, items: { $ref: '#/components/schemas/TACTrustKey' }, nullable: true }
        max: { type: integer, description: "Maximum trust keys accepted." }
        alg: { type: string, description: "Expected key algorithm." }
        error: { type: string, description: "Sanitized configuration error (present only on misconfiguration)." }
    SupportTelemetryPreview:
      type: object
      description: >-
        The exact support-telemetry sample that would be sealed and sent
        right now, IF telemetry were enabled — it is not; no consent switch,
        sender, or egress exists in this build. This is a lossless rendering
        of the complete inner sample: schema_version and registry_hash
        identify the governed metric schema (any eligible-metric or
        bucket-definition change bumps registry_hash); sample_epoch and
        sequence are the non-identifying delivery-identity fields the wire
        contract carries (sample_epoch is a random per-process token, never a
        stable appliance fingerprint; Slice 1 has no delivery sequence
        counter yet, so sequence is always 0); metrics are the current values
        of exactly the telemetry-eligible entries in the scoped
        support-metric registry. Does not imply future previews will be
        byte-for-byte identical — only the schema/eligible-set identity is
        stable.
      additionalProperties: false
      required: [schema_version, registry_hash, generated_at, sample_epoch, sequence, metrics]
      properties:
        schema_version: { type: integer, enum: [3], description: "Governed telemetry wire-schema version." }
        registry_hash: { type: string, pattern: "^[0-9a-f]{64}$", description: "Lowercase-hex SHA-256 over the governed eligibility schema (metric id/type/privacy-class/eligibility/bucket-definition)." }
        generated_at: { type: string, format: date-time, description: "RFC3339 UTC timestamp this sample was built." }
        sample_epoch: { type: string, pattern: "^[0-9a-f]{32}$", description: "Non-identifying, caller-supplied per-process-lifetime random token (128-bit hex). Never a stable appliance fingerprint." }
        sequence: { type: integer, minimum: 0, description: "Per-epoch delivery sequence number. Always 0 in Slice 1 (no delivery counter exists yet)." }
        metrics: { type: object, description: "Telemetry-eligible metric id -> current scalar value.", additionalProperties: { type: number } }
    TelemetryConfigStatus:
      type: object
      description: >-
        Node-local telemetry consent/config posture (M7 Slice 2). Still zero
        egress — no sender exists in this build. The bearer credential is
        never exposed; only credential_set is reported.
      additionalProperties: false
      required: [enabled, effective_enabled, credential_set, status]
      properties:
        enabled: { type: boolean, description: "The persisted operator intent (may be true even when not effectively enabled, e.g. after an explicit credential clear)." }
        effective_enabled: { type: boolean, description: "True only when enabled, the origin is a valid canonical https endpoint, and a well-formed bearer credential is configured." }
        origin: { type: string, format: uri, description: "Canonical https origin (present when configured)." }
        credential_set: { type: boolean, description: "Whether a bearer credential is stored. The value itself is never returned. May be true while status is credential_invalid." }
        status: { type: string, enum: [disabled, origin_invalid, credential_missing, credential_invalid, ready], description: "disabled: enabled=false. origin_invalid: no/invalid origin. credential_missing: origin valid but no credential. credential_invalid: a credential is stored but is malformed (blank, over-length, or containing control characters) and is therefore unusable. ready: fully configured (does NOT mean anything is sending — no sender exists yet)." }
    SetTelemetryConfig:
      type: object
      description: >-
        Set the telemetry consent/config posture. Enabling requires a valid
        https origin AND a bearer credential (existing, preserved, or newly
        supplied) — an origin-only request is rejected (400). A bare disable
        ({} or {"enabled":false}) is always accepted.
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        origin: { type: string, description: "Destination origin (https, no userinfo/path/query/fragment, no private/internal literal IP); required to enable." }
        credential:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 4096
          description: >-
            Bearer credential to store; empty keeps the existing one.
            Write-only — never returned by any response. Must not contain
            control characters.
        clear_credential: { type: boolean, description: "Explicitly remove the stored credential (mutually exclusive with credential)." }
    SupportRecipients:
      type: object
      required: [recipients, max]
      additionalProperties: false
      properties:
        recipients: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        max: { type: integer }
    ScanExclusions:
      type: object
      required: [hashes, hosts]
      additionalProperties: true
      properties:
        hashes: { type: array, items: { type: string }, nullable: true }
        hosts: { type: array, items: { type: string }, nullable: true }
        revision:
          type: string
          description: "Server-owned content-derived revision. Echo back as `ifRevision` on the write for stale-overwrite protection; a mismatch is the structured 409 ({error, currentRevision, yourRevision})."
    YARARules:
      type: object
      description: YARA rule inventory — directory, files, per-file rule names, compiled names.
      additionalProperties: true
    AutoExcludeTunables:
      type: object
      required: [defaults, bounds]
      additionalProperties: true
      properties:
        defaults: { type: object, additionalProperties: true }
        bounds: { type: object, additionalProperties: true }
    ConfigDiff:
      type: object
      required: [from, to, changes]
      additionalProperties: true
      properties:
        from: { type: integer }
        to: { type: integer }
        changes: { type: object, additionalProperties: true, nullable: true }

    # ── Slice 3 tranche 8: write request schemas ──────────────────────────────────
    SetBlocklistMode:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [block, allow] }
    SetDefaultAction:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: [allow, deny] }
    SetLogLevel:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level: { type: string }
    AddSSLBypass:
      type: object
      description: Provide a single pattern or a list.
      additionalProperties: false
      properties:
        pattern: { type: string }
        patterns: { type: array, items: { type: string } }
    SetSessionTimeout:
      type: object
      required: [hours]
      additionalProperties: false
      properties:
        hours: { type: integer }
    SetRedaction:
      type: object
      description: >-
        EXACTLY ONE ACTION per request (2E-B correction). Either a POSTURE
        write ({"redact_hosts": true|false} — field PRESENCE is the command;
        an absent field is never read as false) or a ROTATION
        ({"rotate_key": true, "operation_id": "...", "ifRevision": "..."} —
        posture preserved). Refused with 400 and no mutation: an empty body,
        rotate_key:false alone, a rotation without operation_id or
        ifRevision, and any body carrying both redact_hosts and
        rotate_key:true (ambiguous — never silently resolved).
      additionalProperties: false
      properties:
        redact_hosts: { type: boolean, description: "Posture action: enable (true) or disable (false). Its PRESENCE selects the posture action; it must be absent on a rotation." }
        rotate_key: { type: boolean, description: "Rotation action (true only): mint a new node-local pseudonym key (breaks correlation with older records). Requires operation_id and ifRevision; must not be combined with redact_hosts. rotate_key:false selects no action." }
        operation_id:
          type: string
          description: "REQUIRED for a rotation: caller-generated opaque operation id (1-64 chars of [A-Za-z0-9._-]), fresh per operation, never reused. The appliance records a durable non-secret receipt for it atomically with the rotation; a replay of the same id is answered from the receipt (already_applied:true) and NEVER mints another key. The idempotency lookup runs BEFORE the stale fence, so a lost-response retry cannot become a second rotation."
        ifRevision:
          type: string
          description: "Stale-writer fence (2E-B): the revision from the GET. A mismatch is the structured 409 with no mutation. OPTIONAL for a posture write (absent keeps the legacy replacement contract; the v2 client always asserts it); REQUIRED for a rotation."
    SetOCSP:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
    SetConnLimit:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        maxPerIP: { type: integer }
    SetDPIBypass:
      type: object
      required: [hosts]
      additionalProperties: false
      properties:
        hosts: { type: array, items: { type: string } }
        ifRevision:
          type: string
          description: "Optional stale-writer fence (2E-A): the `revision` from the matching GET. When present, a mismatch refuses the write with the structured 409 and no mutation; when absent, the legacy last-writer-wins contract applies."
    SetMetricsToken:
      type: object
      required: [token]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        token: { type: string, format: password }

    # ── Slice 3 tranche 9: more write request schemas ─────────────────────────────
    SecurityUpdate:
      type: object
      description: Partial update — supply only the fields to change.
      additionalProperties: false
      properties:
        ipFilterMode: { type: string, enum: ["", allow, block] }
        ipAdd: { type: string }
        ipRemove: { type: string }
        ipList: { type: array, items: { type: string } }
        rateLimitRPM: { type: integer }
        rateLimitExemptAdd: { type: string }
        rateLimitExemptDel: { type: string }
    UpstreamUpdate:
      type: object
      description: >-
        Credential-free v1 bulk replacement of the MANAGED entries (2F-C
        compatibility adapter). Any URL carrying userinfo is refused (400
        userinfo_not_allowed); any invalid entry refuses the whole list; the
        call is refused 409 credentialed_entries_present while a managed entry
        holds a credential (a credentialed entry is never replaced or removed by
        omission); YAML-owned authorities are skipped; `revision` must echo the
        document revision (428/409).
      required: [proxies]
      additionalProperties: false
      properties:
        proxies: { type: array, items: { type: object, additionalProperties: false, required: [url], properties: { url: { type: string } } } }
        revision: { type: integer, format: int64 }
    AddFileblock:
      type: object
      description: Provide a single extension or a list.
      additionalProperties: false
      properties:
        extension: { type: string }
        extensions: { type: array, items: { type: string } }
    SetScanExclusions:
      type: object
      additionalProperties: false
      properties:
        hashes: { type: array, items: { type: string } }
        hosts: { type: array, items: { type: string } }
        ifRevision:
          type: string
          description: "Optional stale-writer fence (2E-A): the `revision` from the matching GET. When present, a mismatch refuses the write with the structured 409 and no mutation; when absent, the legacy last-writer-wins contract applies."
    SetDomainAllowlist:
      type: object
      required: [domains]
      additionalProperties: false
      properties:
        domains: { type: array, items: { type: string } }
        ifRevision:
          type: string
          description: "Optional stale-writer fence (2E-A): the `revision` from the matching GET. When present, a mismatch refuses the write with the structured 409 and no mutation; when absent, the legacy last-writer-wins contract applies."
    SetYARASettings:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        timeout_secs: { type: integer, format: int64 }
        max_inflight: { type: integer, format: int64 }
        on_timeout: { type: string }
        on_saturation: { type: string }
        alert_degraded: { type: boolean }
        ifRevision:
          type: string
          description: "Optional stale-writer fence (2E-A): the `revision` from the matching GET. When present, a mismatch refuses the write with the structured 409 and no mutation; when absent, the legacy last-writer-wins contract applies."
    SetLogsRetention:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        retentionDays: { type: integer }
        retentionMaxGB: { type: number }
        criticalDiskPct: { type: integer }

    # ── Slice 3 tranche 10: write request schemas ─────────────────────────────────
    UpsertCategoryGroup:
      type: object
      required: [name, categories]
      additionalProperties: false
      properties:
        name: { type: string }
        categories: { type: array, items: { type: string } }
    SetInitialAdmin:
      type: object
      required: [user, pass]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        user: { type: string }
        pass: { type: string, format: password, minLength: 8 }
    SetNetworkSettings:
      type: object
      additionalProperties: false
      properties:
        base_url: { type: string }
        ui_sans: { type: array, items: { type: string } }
        trust_forwarded_headers: { type: boolean }
        trusted_proxy_cidrs: { type: array, items: { type: string } }
    SetSessionSecret:
      type: object
      required: [secret]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        secret: { type: string, format: password, minLength: 64 }
    AddBlocklistException:
      type: object
      description: Provide a single host or a list.
      additionalProperties: false
      properties:
        host: { type: string }
        hosts: { type: array, items: { type: string } }

    # ── Slice 3 tranche 11: write request schemas ─────────────────────────────────
    AddBlocklistFeed:
      type: object
      required: [url, interval]
      additionalProperties: false
      properties:
        url: { type: string }
        interval: { type: string, description: "e.g. 24h, or off" }
    SupportRetentionPatch:
      type: object
      description: Partial support-bundle retention update.
      additionalProperties: true

    # ── Slice 3 tranche 12: action + CRUD schemas ─────────────────────────────────
    AlertWebhookList:
      type: object
      required: [webhooks]
      additionalProperties: false
      properties:
        webhooks:
          type: array
          nullable: true
          description: >-
            Configured webhooks with the signing secret redacted. Each item also
            carries a read-only `signing_degraded` boolean: true means this
            webhook was configured with an HMAC signing secret the node cannot
            decrypt (typically after restoring a backup onto a fresh volume —
            the signing key is node-local and never archived), so its
            deliveries carry no X-Culvert-Signature until the secret is
            re-entered. It is server-derived and ignored on create/update.
          items: { type: object, additionalProperties: true }
    TunablesPatch:
      type: object
      description: Adaptive auto-exclude tunables patch (subset of tunable fields).
      additionalProperties: true
    ClusterTokenInput:
      type: object
      description: Enrollment token request (ttl/label).
      additionalProperties: true

    # ── Slice 3 tranche 13: schemas ───────────────────────────────────────────────
    ValidateYARA:
      type: object
      description: Provide the rule source via `source` (or the `rule` alias).
      additionalProperties: false
      properties:
        source: { type: string }
        rule: { type: string }
    NodeGroupInput:
      type: object
      description: Node group definition (rich object; open superset).
      additionalProperties: true
    AddRecipient:
      type: object
      description: Support-bundle recipient (rich object; open superset).
      additionalProperties: true

    # ── Slice 3 tranche 14: item-route schemas ────────────────────────────────────
    PACPoolItem:
      type: object
      description: A single PAC pool (open superset) plus its 2F-A `etag` token on reads.
      additionalProperties: true
    PACProfileItem:
      type: object
      description: A single PAC profile (open superset).
      additionalProperties: true
    PACExceptionItem:
      type: object
      description: A single PAC posture exception (open superset).
      additionalProperties: true
    YARARuleItem:
      type: object
      description: A single YARA rule file (open superset).
      additionalProperties: true

    # ── Slice 3 tranche 15: cdr/release read schemas ──────────────────────────────
    CDRConfig:
      type: object
      required: [enabled, failMode, clientActive, failOpen]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        endpoint: { type: string }
        failMode:
          type: string
          description: "\"open\" or \"closed\" (YAML-validated); NOT runtime-mutable — render any other value verbatim as unknown."
        defaultProfile: { type: string }
        defaultMode: { type: string }
        timeoutSec: { type: integer }
        maxFileSizeMB: { type: integer }
        chunkSizeKB: { type: integer }
        serverFingerprint: { type: string }
        certsDir: { type: string }
        clientActive: { type: boolean }
        failOpen:
          type: boolean
          description: Server-derived; true unless failMode is exactly "closed".
    CDRHealth:
      type: object
      description: CDR sidecar health (shape varies).
      additionalProperties: true
    CDRInstances:
      type: object
      description: Enrolled CDR instances.
      additionalProperties: true
    CDRPolicies:
      type: object
      required: [rules, count, integrity]
      additionalProperties: true
      properties:
        rules: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        count: { type: integer }
        integrity: { $ref: '#/components/schemas/CDRPolicyIntegrity' }
    CDRPolicyIntegrity:
      type: object
      description: "Identity truth of the durable policy store: ok=false means the file carries duplicate or empty rule names (loaded verbatim, nothing silently chosen). While degraded, POST is refused (409), DELETE by an ambiguous name is refused (409), and the operator repairs by position (DELETE ?name=<verbatim>&position=<n>)."
      required: [ok, issues]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [kind, name, positions]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [duplicate_name, empty_name] }
              name: { type: string }
              positions: { type: array, items: { type: integer } }
    CDRCredentialGeneration:
      type: object
      description: "One issued client credential in an instance's lineage (non-secret). Sluice keeps trusting every live generation until it expires or is revoked there."
      required: [seq, state, source]
      additionalProperties: false
      properties:
        seq: { type: integer }
        fingerprint: { type: string }
        notAfterUnix: { type: integer }
        state: { type: string, enum: [renewing, staged, active, superseded, orphaned, revoked] }
        issuedAt: { type: string }
        operationId: { type: string }
        source: { type: string, enum: [enroll, renewal, legacy] }
    CDREnrollReceipt:
      type: object
      description: "Durable, non-secret enrollment operation receipt."
      required: [operationId, name, endpoint, serverFingerprint, state, startedAt, updatedAt]
      additionalProperties: false
      properties:
        operationId: { type: string }
        name: { type: string }
        endpoint: { type: string }
        serverFingerprint: { type: string }
        state: { type: string, enum: [dispatched, stored, issued_not_stored, not_issued, revoked] }
        fingerprint: { type: string }
        actor: { type: string }
        startedAt: { type: string }
        updatedAt: { type: string }
        note: { type: string }
    CDREnrollReceipts:
      type: object
      required: [receipts, count, unresolved, integrity]
      additionalProperties: false
      properties:
        receipts: { type: array, items: { $ref: '#/components/schemas/CDREnrollReceipt' }, nullable: true }
        count: { type: integer }
        unresolved: { type: integer }
        integrity:
          type: object
          description: "Receipt-file truth (R12.8): ok=false means DEGRADED — duplicate ids, bad grammar, impossible states, missing identity fields or more than the cap; no new enrollment is created until repaired by position."
          required: [ok, issues]
          additionalProperties: false
          properties:
            ok: { type: boolean }
            issues:
              type: array
              items:
                type: object
                required: [kind, positions]
                additionalProperties: false
                properties:
                  kind: { type: string, enum: [duplicate_operation, invalid_operation_id, invalid_state, missing_identity, over_capacity, unparsable_file] }
                  operationId: { type: string }
                  positions: { type: array, items: { type: integer } }
    CDREnrollResult:
      type: object
      description: "Enrollment success with the ACTUAL post-operation facts (R13)."
      required: [instance, stored, operationId, receiptState, receiptRecorded, cdrEnabled, clientActive, autoEnable]
      additionalProperties: false
      properties:
        instance: { $ref: '#/components/schemas/GenericRead' }
        stored: { type: boolean }
        operationId: { type: string }
        receiptState: { type: string, enum: [stored, dispatched] }
        receiptRecorded: { type: boolean, description: "false when the receipt's stored transition could not be persisted (it stays dispatched; recovery classifies LANDED from the registry)." }
        receiptError: { type: string }
        cdrEnabled: { type: boolean, description: "The truthful runtime flag after the operation." }
        clientActive: { type: boolean }
        clientInitError: { type: string }
        autoEnable:
          type: object
          required: [attempted, succeeded, error]
          additionalProperties: false
          properties:
            attempted: { type: boolean }
            succeeded: { type: boolean, description: "false with a non-empty error when the durable sentinel write failed — CDR stays DISABLED; the credential IS stored, so enable CDR from the toggle, never re-enroll." }
            error: { type: string }
    CDREnrollRecovery:
      type: object
      required: [operationId, classification, retryable, revoked, hasReceipt]
      additionalProperties: true
      properties:
        operationId: { type: string }
        classification: { type: string, enum: [LANDED_AND_STORED, ISSUED_BUT_NOT_STORED, NOT_ISSUED, AMBIGUOUS] }
        fingerprint: { type: string, description: "Issued client-cert fingerprint when Sluice reports ISSUED." }
        revoked: { type: boolean, description: "Sluice already denies the issued fingerprint." }
        name: { type: string }
        endpoint: { type: string }
        receiptState: { type: string }
        hasReceipt: { type: boolean }
        retryable: { type: boolean, description: "AMBIGUOUS and worth retrying." }
        error: { type: string }
        receiptUpdated: { type: boolean, description: "false when the classification is authoritative but the local receipt transition could not be persisted (previous state kept)." }
        receiptError: { type: string }
        revocation:
          type: object
          description: "Exact revocation path for ISSUED_BUT_NOT_STORED."
          additionalProperties: true
          properties:
            fingerprint: { type: string }
            apiAvailable: { type: boolean, description: "A pooled client not holding the fingerprint can issue POST /api/cdr/instances/revoke {fingerprint}." }
            cli: { type: string, description: "Sluice-host command when apiAvailable is false." }
    ReleaseCurrent:
      type: object
      description: Current installed release.
      additionalProperties: true
    DispatchStatus:
      type: object
      description: Release dispatch/upgrade status.
      additionalProperties: true

    GenericWriteInput:
      type: object
      description: Endpoint-specific write payload (rich object; open superset — see the handler).
      additionalProperties: true

    GenericRead:
      type: object
      description: Endpoint-specific read model (open superset — see the handler).
      additionalProperties: true

    SyslogConfig:
      type: object
      required: [addr, format]
      additionalProperties: false
      properties:
        addr: { type: string }
        format: { type: string }
        drops: { type: integer }
        panics: { type: integer }
    SetSyslogBody:
      type: object
      additionalProperties: false
      properties:
        addr: { type: string }
        format: { type: string }
    OTLPPushHealth:
      type: object
      additionalProperties: true
      properties:
        failureCount: { type: integer }
        lastError: { type: string }
        lastErrorAt: { type: string }
        lastSuccessAt: { type: string }
        droppedSpans: { type: integer }
    OTLPConfig:
      type: object
      required: [enabled]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        endpoint: { type: string }
        hasAuth: { type: boolean }
        authHeaderName: { type: string }
        metricsHealth: { $ref: '#/components/schemas/OTLPPushHealth' }
        tracesHealth: { $ref: '#/components/schemas/OTLPPushHealth' }
    SetOTLPBody:
      type: object
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        endpoint: { type: string }
        authHeaderName: { type: string }
        authHeaderValue: { type: string, format: password }
    UIAllowIPs:
      type: object
      required: [ips]
      additionalProperties: false
      properties:
        ips: { type: array, items: { type: string }, nullable: true }
    SetUIAllowIPsBody:
      type: object
      required: [ips]
      additionalProperties: false
      properties:
        ips: { type: array, items: { type: string } }
    SetDefaultAuthOutcomeBody:
      type: object
      required: [defaultAuthOutcome]
      additionalProperties: false
      properties:
        defaultAuthOutcome: { type: string, enum: [Default, Exempt] }
    GeoIPStatus:
      type: object
      required: [enabled]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        dbPath: { type: string }
        dbBuildDate: { type: string, format: date-time, description: "MaxMind build timestamp embedded in the loaded .mmdb; omitted when no database is loaded." }
        dbAgeDays: { type: integer, description: "Days since dbBuildDate; omitted when no database is loaded." }
        lastError: { type: string, description: 'Most recent database-load failure, if any (e.g. bad path, corrupt/expired .mmdb). Present only when the last load attempt failed; destCountry policy rules do not match while this is set.' }
        lastErrorAt: { type: string, format: date-time, description: 'When lastError was recorded (RFC 3339). Present only alongside lastError.' }

    IdPList:
      type: object
      required: [persisted, profiles]
      additionalProperties: false
      properties:
        persisted: { type: boolean }
        profiles: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
    AddURLCatHost:
      type: object
      required: [category, host]
      additionalProperties: false
      properties:
        category: { type: string }
        host: { type: string }
    AlertHistory:
      type: object
      required: [deliveries, retry_queue_depth, retry_exhausted_total, retry_dropped_total, dedup_tracked, dedup_evictions_total]
      additionalProperties: false
      properties:
        deliveries: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        retry_queue_depth: { type: integer, description: "Failed webhook deliveries currently queued for retry." }
        retry_exhausted_total: { type: integer, description: "Deliveries that used up all retry attempts and were permanently dropped." }
        retry_dropped_total: { type: integer, description: "Deliveries dropped because the retry queue was at capacity." }
        dedup_tracked: { type: integer, description: "Alert dedup keys currently held inside the 30s suppression window (bounded)." }
        dedup_evictions_total: { type: integer, description: "Dedup keys evicted at the cap. Non-zero means the alert key space is being flooded with unique details, so duplicate suppression is degraded — alerts may deliver more than once per window, never fewer." }
    PACExceptionsList:
      type: object
      required: [exceptions]
      additionalProperties: false
      properties:
        exceptions: { type: array, items: { type: object, additionalProperties: true }, nullable: true }

    BlockPageConfig:
      type: object
      required: [html]
      additionalProperties: false
      properties:
        html: { type: string }
    SetBlockPageBody:
      type: object
      required: [html]
      additionalProperties: false
      properties:
        html: { type: string }
    LockoutsList:
      type: object
      required: [lockouts]
      additionalProperties: false
      properties:
        lockouts: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
    ClearLockoutBody:
      type: object
      required: [username]
      additionalProperties: false
      properties:
        username: { type: string }
    URLCategoryLookup:
      type: object
      required: [host, category]
      additionalProperties: true
      properties:
        host: { type: string }
        category: { type: string }
        tier: { type: string }
        matchedBy: { type: string }
        blocked: { type: boolean }
        blockSource: { type: string }
    URLCatFeedStatusEntry:
      type: object
      required: [configured]
      additionalProperties: false
      properties:
        configured: { type: boolean }
        entries: { type: integer, description: "UT1 only: total domains parsed on the last successful sync (the feed's full corpus size)." }
        hostsAddedLastSync: { type: integer, description: "SaaS only: hosts newly merged on the last sync. 0 is normal/healthy once the feed is fully merged - it is NOT the feed's total size." }
        lastSync: { type: string, description: "RFC3339 UTC timestamp of the last successful sync, or empty if never synced." }
        intervalSeconds: { type: integer }
        syncFailures: { type: integer }
    URLCatFeedStatus:
      type: object
      required: [ut1, saas]
      additionalProperties: false
      properties:
        ut1: { $ref: '#/components/schemas/URLCatFeedStatusEntry' }
        saas: { $ref: '#/components/schemas/URLCatFeedStatusEntry' }
    SaaSFeedSettings:
      type: object
      description: >-
        Configured SaaS signed category-feed settings plus resolved effective
        values. runtime_activation_available is always false until the signed-feed
        client ships; this schema deliberately carries no last_success / active
        version / freshness / provenance.
      required: [managed, enabled, url, protocol, refresh_seconds, official_url, editable, runtime_activation_available]
      additionalProperties: true
      properties:
        revision:
          type: string
          description: Server-owned content-derived settings revision (managed/enabled/resolved official URL/protocol/refresh/schema). Echo back via ?ifRevision= on the PUT; a mismatch is the structured 409 ({error, currentRevision, yourRevision}).
        managed: { type: boolean, description: "true ⇒ enabled is authoritative; false ⇒ on-by-default (never explicitly configured)." }
        enabled: { type: boolean }
        url: { type: string, description: "Configured manifest URL ('' ⇒ the built-in official endpoint)." }
        protocol: { type: string, enum: [signed_manifest_v1], description: "Signed-only; not downgradeable." }
        refresh_seconds: { type: integer, format: int64, description: "Poll cadence in seconds (0 ⇒ the 24h default; effective min 1h)." }
        official_url: { type: string, description: "The official built-in feed endpoint the empty URL resolves to and the only accepted origin." }
        editable: { type: boolean, description: "false on a managed data-plane node (feed policy is control-plane-authoritative)." }
        runtime_activation_available: { type: boolean, description: "Always false in this release — configuration is stored but no feed is fetched, verified, activated, or served yet." }
        note: { type: string }
        resolved:
          type: object
          additionalProperties: false
          properties:
            url: { type: string }
            protocol: { type: string }
            enabled: { type: boolean }
            refresh_seconds: { type: integer, format: int64 }
        resolve_error: { type: string }
    SetSaaSFeedSettings:
      type: object
      description: SaaS feed configuration update. All fields optional.
      additionalProperties: false
      properties:
        managed: { type: boolean, description: "Presence toggle: omit ⇒ managed becomes true (a PUT is explicit management)." }
        enabled: { type: boolean, description: "Presence toggle: omit ⇒ enabled defaults true." }
        url: { type: string, description: "Official-origin manifest URL; '' ⇒ the built-in official endpoint. Any non-official value is rejected (no generic mirror)." }
        protocol: { type: string, enum: ['', signed_manifest_v1], description: "'' ⇒ signed_manifest_v1. No other value is accepted (no unsigned/raw fallback)." }
        refresh: { type: string, description: "Go duration (e.g. '24h'); '' ⇒ default. Min-clamped to 1h." }
    CategoryOverrides:
      type: object
      description: >-
        Admin category overrides layered on the feed snapshot. Each key carries
        host+subdomain suffix scope. A wholly-empty object clears every override.
      additionalProperties: false
      properties:
        added:
          type: object
          description: "host → category to insert."
          additionalProperties: { type: string }
        recategorized:
          type: object
          description: "host → category to repoint."
          additionalProperties: { type: string }
        tombstones:
          type: array
          description: "hosts to suppress (self + subdomains)."
          items: { type: string }
    SaaSFeedOverridesResponse:
      type: object
      required: [overrides, editable]
      additionalProperties: false
      properties:
        overrides: { $ref: '#/components/schemas/CategoryOverrides' }
        editable: { type: boolean, description: "false on a managed data-plane node." }
        revision:
          type: string
          description: Server-owned override revision (the durable authority fingerprint; the sentinel "none" for an empty set). Echo back via ?ifRevision= on the PUT for stale-overwrite protection; a mismatch is the structured 409 ({error, currentRevision, yourRevision}).
    SaaSFeedActivationDelta:
      type: object
      additionalProperties: false
      description: "Host-count change of the last SUCCESSFUL activation. null in never_succeeded."
      properties:
        hosts_added: { type: integer }
        hosts_removed: { type: integer }
        hosts_changed: { type: integer }
    SaaSFeedStatus:
      type: object
      additionalProperties: true
      description: "Signed SaaS category-feed runtime status (read-only). Nullable fields render null when absent."
      required: [state, configured, enabled, managed, authority, protocol, active_source, provenance, signature_status, compiled_trusted, stale, host_count, category_count, override_count, failures_since_start, consecutive_failures, never_succeeded]
      properties:
        state:
          type: string
          enum: [disabled, waiting_for_authority, recovering, embedded, fresh, stale, syncing, degraded, critical]
        configured: { type: boolean }
        enabled: { type: boolean }
        managed: { type: boolean }
        authority: { type: string, description: "standalone / control-plane / managed-dp" }
        protocol: { type: string }
        url: { type: string }
        active_source: { type: string, enum: [embedded, downloaded, cached, resumed] }
        provenance: { type: string, enum: [embedded, downloaded, cached] }
        signature_status: { type: string, enum: [verified, failed, compiled_trusted] }
        compiled_trusted: { type: boolean }
        stale: { type: boolean }
        host_count: { type: integer }
        category_count: { type: integer }
        override_count: { type: integer }
        not_modified: { type: boolean }
        failures_since_start: { type: integer }
        consecutive_failures: { type: integer }
        never_succeeded: { type: boolean }
        syncing: { type: boolean }
        waiting_for_authority: { type: boolean }
        recovering: { type: boolean }
        critical: { type: boolean }
        active_feed_version: { type: integer, nullable: true }
        config_revision: { type: string, nullable: true }
        override_revision: { type: string, nullable: true }
        generated_at: { type: string, format: date-time, nullable: true }
        manifest_expires_at: { type: string, format: date-time, nullable: true }
        expires_in_days: { type: integer, nullable: true }
        last_attempt: { type: string, format: date-time, nullable: true }
        last_successful_check: { type: string, format: date-time, nullable: true }
        last_successful_activation: { type: string, format: date-time, nullable: true }
        next_attempt: { type: string, format: date-time, nullable: true }
        last_outcome: { type: string, nullable: true, enum: [ok, no_change, error, canceled, skipped] }
        last_error_class: { type: string, nullable: true }
        last_http_status: { type: integer, nullable: true }
        last_activation_delta:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/SaaSFeedActivationDelta' } ]
        critical_reason: { type: string }
        detail: { type: string }
    SaaSFeedRefreshResult:
      type: object
      additionalProperties: false
      required: [refreshed, status]
      properties:
        refreshed: { type: boolean, description: "true only when a strictly-greater generation activated." }
        status:
          type: string
          enum: [activated, no_change, failed, skipped, canceled, in_progress, unavailable]
        state: { type: string }
    SetClusterLabels:
      type: object
      required: [node_id]
      additionalProperties: false
      properties:
        node_id: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
    SetClusterMode:
      type: object
      required: [grpc_addr]
      additionalProperties: false
      properties:
        grpc_addr: { type: string, description: "Control-plane gRPC listen address (host:port); required." }
        cert_file: { type: string }
        key_file: { type: string }
        ca_file: { type: string }
    MovePolicyRule:
      type: object
      additionalProperties: false
      properties:
        priority: { type: integer }
        position: { type: string }
        targetName: { type: string }
    ReorderPolicy:
      type: object
      required: [priorities]
      additionalProperties: false
      properties:
        priorities: { type: array, items: { type: integer } }
    AuthReorderRequest:
      type: object
      description: Exactly one of ids (stable rule ULIDs, preferred — reorder-safe) or the legacy priorities; either way every auth rule exactly once in the desired order. Resolved against one fenced running snapshot; the same priority values are redistributed so access-rule ordering is never disturbed.
      additionalProperties: false
      properties:
        ids: { type: array, items: { type: string } }
        priorities: { type: array, items: { type: integer } }

    DecryptionProfileFull:
      type: object
      description: A TLS-inspection decryption profile. The empty string always means "inherit the engine/rule default"; empty enum fields are omitted from responses. `inspectHttp2` is TRI-STATE — absent/null = inherit, true = native HTTP/2 inspection, false = force strip; clients must never collapse the absent state into false. `certVerification` deliberately has NO "permissive" value (retired; legacy persisted values are fail-closed-migrated to "strict" server-side).
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        inspectHttp2: { type: boolean, nullable: true }
        certVerification: { type: string, enum: ['', strict, skip] }
        onUnsupported: { type: string, enum: ['', fail-close, fail-open] }
        onInspectError: { type: string, enum: ['', fail-close, fail-open] }
        minTlsVersion: { type: string, enum: ['', '1.2', '1.3'] }
        maxTlsVersion: { type: string, enum: ['', '1.2', '1.3'] }
        stallTimeoutSecs: { type: integer, description: '0 = inherit the engine default; otherwise clamped to [5, 3600] seconds by the backend.' }
        created_at: { type: string }
        updated_at: { type: string }

    URLCategoryEntry:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }
        hosts: { type: array, items: { type: string }, nullable: true }
        builtIn: { type: boolean }
    URLCategoryState:
      type: object
      required: [categories, revision, builtInAuthority]
      additionalProperties: false
      properties:
        categories:
          type: array
          items: { type: object, additionalProperties: true }
          description: Every category (name/hosts/builtIn + feedBacked UT1 enrichment + the server-owned `writable` mutability truth — false exactly for a BuiltIn row whose classes are currently served from a committed signed feed generation; the browser never derives this from builtIn/provenance/state).
        revision:
          type: string
          description: Server-owned restart-stable semantic taxonomy revision. Echo back via ?ifRevision= on mutations; a mismatch is the structured 409 ({error, currentRevision, yourRevision}).
        builtInAuthority:
          type: string
          enum: [signed-feed, local]
          description: Page-level ownership truth for BuiltIn categories, derived from the live effective view's source — "signed-feed" while a committed signed generation's classes serve (built-in rows are read-only on the v2 surface, managed via SaaS Overrides; a v2 mutation is the structured 409 {error, owner, manageWith:"saas-overrides"}); "local" while the embedded baseline / raw store serves (built-in rows editable).
    URLCategoryUpdate:
      type: object
      description: URL-category update body — the category name is the required `name` query parameter; the body carries only the replacement hosts.
      additionalProperties: false
      properties:
        hosts: { type: array, items: { type: string }, nullable: true }
    FileblockProfileFull:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        extensions: { type: array, items: { type: string }, nullable: true }
    RewriteRuleFull:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer }
        stableId: { type: string }
        host: { type: string }
        req_set: { type: object, additionalProperties: { type: string } }
        req_add: { type: object, additionalProperties: { type: string } }
        req_remove: { type: array, items: { type: string } }
        resp_set: { type: object, additionalProperties: { type: string } }
        resp_add: { type: object, additionalProperties: { type: string } }
        resp_remove: { type: array, items: { type: string } }

    AddBlocklistEntry:
      type: object
      description: Provide a single host or a list.
      additionalProperties: false
      properties:
        host: { type: string }
        hosts: { type: array, items: { type: string } }
    DPIPatternInput:
      type: object
      description: Provide a single pattern or a list.
      additionalProperties: false
      properties:
        pattern: { type: string }
        patterns: { type: array, items: { type: string } }
    AlertWebhook:
      type: object
      required: [name, url]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        events: { type: array, items: { type: string }, nullable: true }
        enabled: { type: boolean }
        secret: { type: string, format: password }

    PACPoolInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        endpoints: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        collectionEtag:
          type: string
          description: 2F-A — required on CREATE (or as the `collectionEtag` query parameter).
        etag:
          type: string
          description: 2F-A — required on PUT (or as the `etag` query parameter).
    PACProfileInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        poolId: { type: string }
        rules: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        privateNetworks: { type: string }
        availabilityMode: { type: string }
        collectionEtag:
          type: string
          description: 2F-A — required on CREATE (or as the `collectionEtag` query parameter).
        revision:
          type: integer
          format: int64
          description: 2F-A — required on PUT (or as the `revision` query parameter); must equal the loaded revision.
        confirm:
          allOf: [{ $ref: '#/components/schemas/PACConfirm' }]
          description: 2F-B — echoes the bound challenge when the change introduces new DIRECT paths.
    IdPProfileInput:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [oidc, saml, ldap] }
        emailDomains: { type: array, items: { type: string }, nullable: true }
        enabled: { type: boolean }
        priority: { type: integer }
        knownGroups: { type: array, items: { type: string }, nullable: true }
        oidc: { type: object, additionalProperties: true, nullable: true }
        saml: { type: object, additionalProperties: true, nullable: true }
        ldap: { $ref: '#/components/schemas/LDAPProfileConfigInput' }
    LDAPProfileConfigInput:
      type: object
      description: |
        LDAP/Active Directory profile settings (ADR-0027). bindPassword is a
        WRITE-ONLY input: never returned by reads, preserved when omitted on
        update, cleared only when present and empty. Read responses carry the
        derived bindCredentialConfigured flag instead.
      required: [url, baseDn]
      additionalProperties: false
      nullable: true
      properties:
        url: { type: string, description: "ldap://host[:port] or ldaps://host[:port] (host[:port] only — no credentials, path, or query)." }
        startTls: { type: boolean, description: "Upgrade a plain ldap:// connection with StartTLS. Invalid together with ldaps://." }
        tlsSkipVerify: { type: boolean, description: "UNSAFE — disable certificate verification (self-signed dev directories only)." }
        bindDn: { type: string, description: "Service-account DN used to locate users; empty = anonymous bind." }
        bindPassword: { type: string, description: "Write-only service-account credential." }
        bindCredentialConfigured: { type: boolean, description: "Read-only response metadata; ignored on write." }
        baseDn: { type: string }
        userFilter: { type: string, description: "Search filter template with exactly one %s placeholder. Default (sAMAccountName=%s)." }
        emailAttribute: { type: string, description: "Default mail." }
        nameAttribute: { type: string, description: "Default displayName." }
        groupAttribute: { type: string, description: "Default memberOf; values are kept verbatim (full group DNs)." }
        requiredGroup: { type: string, description: "Legacy provider-level access gate (direct membership). Prefer Access Rules over identity groups." }
        cacheTtlSeconds: { type: integer, description: "Authoritative auth-result cache TTL. 0 = default (300)." }
    IdPTestRequest:
      type: object
      required: [profile]
      additionalProperties: false
      properties:
        profile: { $ref: '#/components/schemas/IdPProfileInput' }
        testUsername: { type: string, description: "Optional directory login to run the full identity test." }
        testPassword: { type: string, description: "Transient test credential — never persisted, logged, or audited." }
    IdPTestReport:
      type: object
      required: [ok, steps]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        steps:
          type: array
          items:
            type: object
            required: [name, label, ok]
            additionalProperties: false
            properties:
              name: { type: string }
              label: { type: string }
              ok: { type: boolean }
              skipped: { type: boolean }
              durationMs: { type: integer, format: int64 }
              detail: { type: string }
              error: { type: string, description: "Sanitized, length-bounded server error text." }
              action: { type: string, description: "Actionable operator hint for a failed stage." }
        identity:
          type: object
          nullable: true
          additionalProperties: false
          required: [sub, groupCount]
          properties:
            sub: { type: string }
            email: { type: string }
            name: { type: string }
            groupCount: { type: integer }
            groups: { type: array, items: { type: string }, description: "Bounded sample of resolved groups." }
    SetPolicyDraftBody:
      type: object
      required: [require_commit]
      additionalProperties: false
      properties:
        require_commit: { type: boolean }
    CreateConfigVersionBody:
      type: object
      additionalProperties: false
      properties:
        version: { type: integer }
        dry_run: { type: boolean }
    DiscoverIdPBody:
      type: object
      required: [issuer]
      additionalProperties: false
      properties:
        issuer: { type: string }
    RevokeClusterBody:
      type: object
      additionalProperties: false
      properties:
        node_id: { type: string }
        reason: { type: string }
    YARARuleInput2:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }
        source: { type: string }
        ifRevision:
          type: string
          description: "Optional stale-writer fence (2E-A): the `revision` from the matching GET. When present, a mismatch refuses the write with the structured 409 and no mutation; when absent, the legacy last-writer-wins contract applies A fenced CREATE asserts the literal sentinel `new` and refuses (409) when the rule file already exists; a fenced UPDATE asserts the content revision of the source it edited."
    SupportRecipient:
      type: object
      description: A support-bundle recipient (create/update response — includes derived + rotation metadata).
      additionalProperties: false
      required: [name, public_key, fingerprint, created_at]
      properties:
        name: { type: string }
        public_key: { type: string }
        fingerprint: { type: string, description: "Derived fingerprint of the public key." }
        created_at: { type: string }
        created_by: { type: string }
        rotated_at: { type: string, description: "Last in-place key-rotation time." }
        rotated_by: { type: string }

    BandwidthPolicyInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }
        label_selector: { type: object, additionalProperties: { type: string } }
        max_bytes_per_sec: { type: integer, format: int64 }
        priority: { type: integer }
        created_at: { type: string }
    DispatchReleaseBody:
      type: object
      required: [agent]
      additionalProperties: false
      properties:
        release_id: { type: string }
        channel: { type: string }
        agent: { type: string }
        pre_backup: { type: boolean }
        no_rollback: { type: boolean }
        passphrase_ref: { type: string }
        idempotency_key: { type: string }

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Node liveness/health probe
      description: |
        Unauthenticated health check for load balancers. Returns 200 with
        `status:ok` when this node is standalone or the HA leader; returns 503
        with `status:standby` on a non-leader HA node.
      security: []
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Node is healthy and holds (or does not require) write authority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { status: ok, role: standalone, leader: true, write_authority: true, version: v1.0.203 }
        '503':
          description: HA standby node — not currently the writable leader.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { status: standby, role: standby, leader: false, write_authority: false, version: v1.0.203 }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }

  /api/setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Whether first-boot setup is still required
      description: Unauthenticated. Returns `{needsSetup:true}` until an admin credential (or explicit open mode) is configured.
      security: []
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Setup state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
              example: { needsSetup: true, ui_tls_fallback: false }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }

  /api/setup/complete:
    post:
      operationId: completeSetup
      tags: [setup]
      summary: Set the initial administrator credential (one-time bootstrap)
      description: |
        One-time bootstrap. Sets the first admin credential, or enables explicit
        open mode with `{unauth:true}`. Returns 403 once auth is already
        configured. Rate-limited per source IP.
      security: []
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: setup.complete
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupCompleteRequest' }
            # No example: the required field is secret-bearing, and Gate 10
            # forbids credential-shaped values in examples. The schema
            # documents the required shape.
      responses:
        '200':
          description: Initial admin configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }
        '429': { $ref: '#/components/responses/PlainTooManyRequests' }

  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate and issue an admin session cookie
      description: |
        Verifies credentials (local bcrypt or configured IdP), enforces account
        lockout, and — when TOTP is enrolled — a second step. On success sets the
        `ps_ui_session` cookie and returns `{ok,user,role}`.
      security: []
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: auth.login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            # No example: the required field is secret-bearing, and Gate 10
            # forbids credential-shaped values in examples. The schema
            # documents the required shape.
      responses:
        '200':
          description: Authenticated (session cookie set), or TOTP second step required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
              example: { ok: true, user: admin, role: admin }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }
        '429': { $ref: '#/components/responses/PlainTooManyRequests' }

  /api/auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Current session authentication state
      description: Returns whether the caller holds a valid session (or Basic credentials) and the resolved role.
      security:
        - sessionCookie: []
        - basicAuth: []
        - {}
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Session state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStatus' }
              example: { loggedIn: true, user: admin, role: admin }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }

  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current admin session
      description: Revokes the session token and clears the cookie.
      security:
        - sessionCookie: []
        - {}
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: low
      x-culvert-audit-event: auth.logout
      responses:
        '200':
          description: Session cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              example: { ok: true }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }

  /api/auth/users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List admin users
      description: Returns all admin UI users (without password material).
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: User list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
              example: { users: [ { username: admin, role: admin } ] }
        '403': { $ref: '#/components/responses/PlainForbidden' }
    post:
      operationId: upsertUser
      tags: [auth]
      summary: Create or update an admin user
      description: Creates a new admin user or updates an existing one's password/role. Admin-only and audited.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: auth.user.upsert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
            # No example: the required field is secret-bearing, and Gate 10
            # forbids credential-shaped values in examples. The schema
            # documents the required shape.
      responses:
        '200':
          description: User created or updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
    delete:
      operationId: deleteUser
      tags: [auth]
      summary: Delete an admin user
      description: Removes the user identified by the `username` query parameter.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: auth.user.delete
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
      responses:
        '204':
          description: User removed (no response body).
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      description: Changes the authenticated user's own password after verifying the current one. Audited.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: auth.password.change
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            # Both fields are secret-bearing, so this operation carries no
            # example (Gate 10); the schema documents the required shape.
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/stats:
    get:
      operationId: getStats
      tags: [dashboard]
      summary: Aggregate proxy counters and health flags
      description: Returns aggregate request counters plus persistence, HA, and RBAC-mode health flags for the dashboard.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Counters snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsSummary' }
              example: { total: 1000, allowed: 900, blocked: 90, authFail: 10 }
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/top-hosts:
    get:
      operationId: getTopHosts
      tags: [dashboard]
      summary: Top destination hosts by request volume
      description: Returns the most-requested destination hosts (approximate lower bounds past the internal counter cap).
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Ranked host counters (approximate lower bounds past the internal cap).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/governance/control-plane:
    get:
      operationId: getGovernanceControlPlane
      tags: [governance]
      summary: Control-plane RBAC governance surface
      description: Route inventory, C2 enforcement mode, the six C2 counters, and derived governance health.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Governance snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernanceControlPlane' }
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/ca/status:
    get:
      operationId: getCAStatus
      tags: [security]
      summary: Internal CA status
      description: Returns internal CA state — root info, leaf cache, rotation, and dual-CA status.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: CA state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CAStatus' }
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/ca/rotate:
    post:
      operationId: rotateCA
      tags: [security]
      summary: Force rotation of the internal CA (DESTRUCTIVE)
      description: |
        Forces a CA rotation using a two-step confirmation-token flow: the first
        POST returns `{status:"pending_confirmation", confirmation_token}` and
        emits a `ca.rotate_requested` audit event; re-POSTing with the token
        applies the rotation and emits `ca.rotate`. Re-signs future leaf
        certificates under a new root; clients that pinned the previous root will
        fail until they re-trust. Admin-only and audited.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: ca.rotate
      requestBody:
        required: false
        description: |
          Omit (or send `{}`) on the first step to request rotation and receive a
          token. On the second step send `{confirm:true, confirmation_token}` with
          the token from the first response to apply the rotation.
        content:
          application/json:
