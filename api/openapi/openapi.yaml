  /api/config/import:
    post:
      operationId: importConfig
      tags: [config]
      summary: Import a configuration backup (DESTRUCTIVE)
      description: |
        Replaces configuration from an uploaded backup envelope. Overwrites live
        policy, security, and cluster settings. Admin-only and audited.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: config.import
      parameters:
        - name: dryRun
          in: query
          required: false
          description: >-
            `1` or `true`: validate, plan and diff without applying anything.
            The answer carries the whole-file upstream `plan` (C9), a
            deterministic `importDigest` and the counts-only `upstream` summary.
          schema: { type: string, enum: ['1', 'true'] }
        - name: mode
          in: query
          required: false
          description: "`replace` wipes stores before applying; default is merge."
          schema: { type: string, enum: [merge, replace] }
        - name: importDigest
          in: query
          required: false
          description: >-
            The digest a dry-run returned. A commit re-plans under the
            authoritative lock and answers 409 `import_stale` when the upstream
            document changed since the plan was computed.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigBackup' }
      responses:
        '200':
          description: >-
            Configuration imported (or, with dryRun, planned). The upstream
            section is reported as counts only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigImportResult' }
              example: { ok: true, mode: merge, upstream: { preserved: 1, omitted: 1, cleared: 0, requiresReplacement: 0 } }
        '400':
          description: >-
            Malformed request. Upstream-section schema violations are
            STRUCTURED JSON (`UpstreamImportRefusal`, validated before any
            store is touched): `invalid_credential_state` — a v2 entry carries
            a missing or unrecognized `credentialState` (the offending entry
            `index` is named; the value is never echoed);
            `invalid_upstream_credentials_marker` — a `upstream_proxies_v2`
            section without the exact `upstream_credentials: "omitted"`
            marker; `schema_mismatch` — a v2 section under a backup version
            other than 2, a legacy `upstreamProxies` list outside version 1 or
            carrying the marker, or a marker without the section;
            `invalid_entry`, `duplicate_id`, `ambiguous_upstream_sections`,
            `credentials_not_importable`. Other malformed input (invalid JSON,
            unsupported version) stays plain text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamImportRefusal' }
              example: { error: 'invalid upstream proxies: invalid_credential_state at entry 1: credentialState must be one of none, configured, unusable, mismatch, requiresReplacement', code: invalid_credential_state, index: 1 }
            text/plain:
              schema: { type: string }
              example: "unsupported backup version"
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409':
          description: >-
            `credential_clear_required` — the import would remove, replace or
            change the authority of a parent proxy that HOLDS a credential or
            is in the durable `requiresReplacement` state (the marker is
            resolved only by the Tier-2 replace / Tier-3 clear credential
            endpoint, never by an import); the complete plan is attached and
            NOTHING was mutated. `import_stale` — the echoed importDigest no
            longer matches the document. `document_rejected` — the stored
            upstream document is rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamImportRefusal' }

