      x-culvert-permission: operator
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: category_group.update
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: string }
          description: Stable group ID (rename-safe addressing). Without it the body `name` addresses the group (legacy) and no rename is possible.
        - name: ifVersion
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Optional optimistic-concurrency assertion of the store generation from the list read; a mismatch returns 409 without mutating.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertCategoryGroup' }
      responses:
        '200':
          description: Updated (restart-durable on 2xx).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { description: 'No group carries the given id.' }
        '409': { description: 'Name already in use, or version fence conflict ({error, currentVersion, yourVersion}).' }
        '500': { description: 'Durable persistence failed. Either the object mutation was rolled back (nothing changed), or — on a rename — the object rename is durable but a policy display-name refresh could not be persisted (enforcement unchanged; names reconcile at the next restart). The body states which.' }
    delete:
      operationId: deleteCategoryGroup
      tags: [policy]
      summary: Delete URL category group
      description: Deletes a URL category group by id or name. Fails closed (409 with the referencedBy payload) while any policy rule — running or staged in an active draft candidate — references the group.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: operator
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: category_group.delete
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: string }
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: ifVersion
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Optional optimistic-concurrency assertion of the store generation from the list read; a mismatch returns 409 without mutating.
      responses:
        '200':
          description: Deleted (restart-durable on 2xx).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { description: 'No group carries the given id.' }
        '409': { description: 'Referenced by policy rules ({error, object, referencedBy}), or version fence conflict ({error, currentVersion, yourVersion}).' }
        '500': { description: 'Durable persistence failed — the delete was rolled back; the group still exists.' }

