openapi: 3.0.4
info:
  title: Culvert Admin API
  version: 1.2.0
  x-culvert-api-contract-version: 1.2.0
  description: |
    Machine-readable contract for the Culvert admin/control-plane REST API served
    on the UI port (`-ui-port`, default 9090).

    **Scope.** This document describes the HTTP/JSON admin API only. Two other
    Culvert network surfaces are intentionally NOT modelled here because they are
    not RESTful and OpenAPI cannot describe them faithfully:

      * the forward-proxy data path (HTTP CONNECT / plain-HTTP forward / SOCKS5)
        served on `-port` — a proxy protocol, not a resource API;
      * the Control-Plane ↔ Data-Plane gRPC stream — described by protobuf.

    **Accuracy over aspiration.** Every operation, schema, status code, and
    content type below reflects the *actual* runtime behavior of the handler, not
    a target design. Notably, error responses are currently emitted by
    `http.Error` as `text/plain`; that is documented as-is here. The proposed
    structured JSON error envelope is a *future* target recorded in
    docs/api/API-STYLE-GUIDE.md and the consistency risk register — it is NOT yet
    the runtime behavior and therefore is NOT asserted by this contract.

    **Air-gap.** This appliance and its documentation are designed for on-prem,
    internet-isolated deployment. No operation here depends on an external
    service, and the rendered documentation vendors all assets locally.

    This baseline (contract version 1.0.0) documents a representative,
    security-spanning subset of operations. The remaining registered routes are
    explicitly classified — and time-boxed for documentation — in
    api/route-classification.yaml, which the route-coverage CI gate enforces
    against the live router.
  license:
    name: See repository LICENSE
    url: https://github.com/KidCarmi/Culvert

servers:
  - url: /
    description: |
      The appliance serves this API relative to the UI host:port. Paths are
      absolute from the server root (e.g. https://appliance.example:9090/api/stats).

tags:
  - name: health
    description: Unauthenticated liveness/health probes for load balancers and monitors.
  - name: setup
    description: First-boot bootstrap of the initial administrator credential.
  - name: auth
    description: Admin session authentication and RBAC user management.
  - name: dashboard
    description: Read-only operational counters and telemetry.
  - name: governance
    description: Control-plane RBAC governance surface (admin-only, read-only).
  - name: security
    description: Certificate-authority and TLS-inspection security controls.
  - name: config
    description: Configuration export/import (backup & restore).
  - name: policy
    description: Policy engine, blocklist, and TLS-inspection policy reads.
  - name: pac
    description: Proxy auto-config (PAC) settings.
  - name: settings
    description: Appliance settings — logging, session, connection limits.
  - name: cluster
    description: Control-plane / data-plane cluster status and upstream pool.
  - name: support
    description: Supportability — status, bundles, diagnostics.

# ── Security schemes ──────────────────────────────────────────────────────────
# The runtime accepts EITHER a signed session cookie (browser flow) OR HTTP Basic
# credentials (CLI/API callers) on protected routes. Public routes accept neither.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ps_ui_session
      description: |
        HMAC-SHA256-signed admin session cookie issued by POST /api/auth/login.
        Carries the authenticated subject and RBAC role. Dynamic Secure flag
        based on TLS state; default TTL 8h.
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic credentials for CLI/API callers, verified against the local
        user store (bcrypt) or a configured external IdP.

  # ── Reusable responses (ACTUAL behavior: text/plain via http.Error) ──────────
  responses:
    PlainBadRequest:
      description: Malformed request (invalid JSON, missing/invalid parameter). Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "invalid JSON"
    PlainUnauthorized:
      description: Missing or invalid credentials. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "Invalid credentials"
    PlainForbidden:
      description: Authenticated but insufficient RBAC role. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "Forbidden: insufficient role"
    PlainConflict:
      description: Request conflicts with the node's role (e.g. a control-plane-managed setting cannot be edited locally on a data-plane node). Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "saas feed config is control-plane managed on this data-plane node"
    PlainNotFound:
      description: Resource not found within the caller's authorized scope (uniform across tenants). Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "admin_not_found"
    PlainMethodNotAllowed:
      description: HTTP method not supported by this route. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "method not allowed"
    PlainTooManyRequests:
      description: Rate-limited / account lockout in effect. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "too many attempts, locked for 300s"

  schemas:
    # ── Health ────────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      description: |
        Node health. Additional fields (term, write_authority, lease_*,
        request-log health) are present depending on HA mode; the contract pins
        only the always-present discriminator.
      required: [status]
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [ok, standby]
        role:
          type: string
          enum: [standalone, leader, standby]
        leader: { type: boolean }
        write_authority: { type: boolean }
        version:
          type: string
          description: |
            Build-time release identity (linker-injected `main.version`, e.g.
            `v1.0.203`; `dev` for local/untagged builds). Signed release binaries
            self-report their exact tag here so runtime identity is verifiable.

    # ── Setup ───────────────────────────────────────────────────────────────────
    SetupStatus:
      type: object
      required: [needsSetup, ui_tls_fallback]
      additionalProperties: false
      properties:
        needsSetup:
          type: boolean
          description: True until an initial admin credential (or explicit open mode) is configured.
        ui_tls_fallback: { type: boolean, description: "True when self-signed TLS setup failed at startup and the admin UI fell back to plain HTTP. Exposed pre-authentication so the setup wizard can warn before the initial admin password is submitted. The FLAG only - this route is unauthenticated, so the underlying self-sign error (which can quote an operator-configured SAN or hostname) is NOT returned here; it is on the viewer-gated GET /api/settings/network and in the server log." }
    SetupCompleteRequest:
      type: object
      description: Provide credentials, OR set unauth=true for explicit open mode.
      additionalProperties: false
      properties:
        user: { type: string }
        pass: { type: string, format: password, minLength: 8 }
        unauth: { type: boolean }
    OkResponse:
      type: object
      required: [ok]
      additionalProperties: true
      properties:
        ok: { type: boolean }

    # ── Auth ────────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [user, pass]
      additionalProperties: false
      properties:
        user: { type: string }
        pass: { type: string, format: password }
        totp:
          type: string
          description: 6-digit TOTP or a backup code; omitted on the first step.
    LoginResult:
      type: object
      description: |
        On success `{ok,user,role}`. When TOTP is enrolled but not yet supplied,
        the handler instead returns `{totp_required:true}` with HTTP 200 and no
        session — the client must resubmit with `totp`.
      additionalProperties: true
      properties:
        ok: { type: boolean }
        user: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        totp_required: { type: boolean }
    AuthStatus:
      type: object
      required: [loggedIn]
      additionalProperties: true
      properties:
        loggedIn: { type: boolean }
        user: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        ui_tls_fallback: { type: boolean, description: "True when self-signed TLS setup failed at startup and the admin UI fell back to plain HTTP. Exposed pre-authentication so the login overlay can warn before credentials are submitted. The FLAG only - this route is unauthenticated, so the underlying self-sign error (which can quote an operator-configured SAN or hostname) is NOT returned here; it is on the viewer-gated GET /api/settings/network and in the server log." }
    Role:
      type: string
      enum: [admin, operator, viewer]
    User:
      type: object
      additionalProperties: true
      properties:
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    UserList:
      type: object
      required: [users]
      additionalProperties: false
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/User' }
    CreateUserRequest:
      type: object
      required: [username, password, role]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, format: password, minLength: 8 }
        role: { $ref: '#/components/schemas/Role' }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }

    # ── Dashboard ────────────────────────────────────────────────────────────────
    StatsSummary:
      type: object
      description: Aggregate proxy counters plus persistence/HA health flags.
      required: [total, allowed, blocked]
      additionalProperties: true
      properties:
        total: { type: integer, format: int64 }
        allowed: { type: integer, format: int64 }
        blocked: { type: integer, format: int64 }
        authFail: { type: integer, format: int64 }
        blocklistSz: { type: integer }
        uptime: { type: string }
        proxyPort: { type: integer }
        uiPort: { type: integer }
        authEnabled: { type: boolean }
        c2Mode: { type: string, enum: [enforce, shadow] }

    # ── CA / security ─────────────────────────────────────────────────────────────
    CAStatus:
      type: object
      description: Internal CA state (opaque superset; fields depend on rotation/dual-CA mode).
      additionalProperties: true

    # ── Decryption exclusions ─────────────────────────────────────────────────────
    DecryptionExclusions:
      type: object
      description: Adaptive decryption-exclusion cache listing plus stats and blast-radius.
      additionalProperties: true

    # ── Config backup ────────────────────────────────────────────────────────────
    ConfigBackup:
      type: object
      description: |
        Opaque configuration backup envelope. May embed sensitive material
        (session HMAC, IdP secrets, upstream credentials) — treat as a secret at
        rest and in transit.
      additionalProperties: true
      x-culvert-sensitive: true
      x-culvert-open-justification: >-
        The backup envelope is intentionally an opaque superset of every config
        surface; its exact members vary by feature set and version, so it cannot
        be a closed schema. Sensitivity is enforced operationally (0600 at rest,
        admin-only + audited transfer), not by the contract shape.

    GovernanceControlPlane:
      type: object
      description: C3 governance surface — route inventory, C2 mode, counters, derived health.
      additionalProperties: true

    # ── Slice 3: read-model schemas ───────────────────────────────────────────────
    PolicyRule:
      type: object
      description: A single Culvert policy rule (Stage-2 access rule). All fields are optional on create/update; read-only fields (hitCount/lastHit/created/modified) are echoed on read.
      additionalProperties: false
      properties:
        priority: { type: integer }
        name: { type: string }
        sourceIP: { type: string }
        sourceIdentity: { type: string }
        sourceGroup: { type: string }
        authSource: { type: string }
        destFQDN: { type: string }
        destCategory: { type: string }
        destCategoryGroup: { type: string }
        destCategoryGroupId: { type: string }
        destCountry: { type: array, items: { type: string }, nullable: true }
        schedule: { $ref: '#/components/schemas/PolicySchedule' }
        sslAction: { type: string }
        fileFiltering: { type: boolean }
        fileProfile: { type: string }
        logFullUri: { type: boolean }
        logTraffic: { type: boolean, nullable: true }
        tlsSkipVerify: { type: boolean }
        stripAlpn: { type: boolean, nullable: true }
        decryptionProfile: { type: string }
        decryptionProfileId: { type: string }
        action: { type: string }
        redirectURL: { type: string }
        enabled: { type: boolean, nullable: true }
        id: { type: string }
        ruleType: { type: string }
        subjectMatch: { type: object, additionalProperties: true, nullable: true }
        auth: { type: object, additionalProperties: true, nullable: true }
        hitCount: { type: integer, format: int64 }
        lastHit: { type: string }
        createdAt: { type: string }
        modifiedAt: { type: string }
        modifiedBy: { type: string }
        comment: { type: string }
    PolicySchedule:
      type: object
      additionalProperties: false
      properties:
        days: { type: array, items: { type: string }, nullable: true }
        timeStart: { type: string }
        timeEnd: { type: string }
        timezone: { type: string }
    PolicyList:
      type: object
      required: [rules, count, version, updatedAt, draft]
      additionalProperties: false
      properties:
        rules: { type: array, items: { $ref: '#/components/schemas/PolicyRule' } }
        count: { type: integer }
        version: { type: integer, format: int64 }
        updatedAt: { type: string }
        draft: { type: boolean }
    AuthPolicyList:
      type: object
      required: [rules, count, defaultAction, note]
      additionalProperties: false
      properties:
        rules: { type: array, items: { type: object, additionalProperties: true } }
        count: { type: integer }
        defaultAction: { type: string, enum: [allow, deny] }
        note: { type: string }
    DefaultActionStatus:
      type: object
      required: [defaultAction]
      additionalProperties: false
      properties:
        defaultAction: { type: string, enum: [allow, deny] }
    BlocklistModeStatus:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [block, allow] }
    SecurityConfig:
      type: object
      required: [ipFilterMode, rateLimitRPM, rateLimitOn]
      additionalProperties: false
      properties:
        ipFilterMode: { type: string }
        ipList: { type: array, items: { type: string }, nullable: true }
        rateLimitRPM: { type: integer }
        rateLimitOn: { type: boolean }
        rateLimitExempt: { type: array, items: { type: string }, nullable: true }
    SSLBypassList:
      type: object
      required: [patterns, count]
      additionalProperties: false
      properties:
        patterns: { type: array, items: { type: string }, nullable: true }
        count: { type: integer }
    OCSPStatus:
      type: object
      required: [enabled, cacheLen, failClosedTotal, revokedTotal, lastFailClosedAt]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        cacheLen: { type: integer }
        failClosedTotal: { type: integer, format: int64 }
        revokedTotal: { type: integer, format: int64 }
        lastFailClosedAt: { type: string }
    SessionTimeout:
      type: object
      required: [hours]
      additionalProperties: false
      properties:
        hours: { type: integer }
    PACConfig:
      type: object
      required: [proxyHost, proxyPort]
      additionalProperties: false
      properties:
        proxyHost: { type: string }
        proxyPort: { type: integer }
        exclusions: { type: array, items: { type: string }, nullable: true }
    ConnLimitStatus:
      type: object
      required: [enabled, maxPerIP, activeIPs, rejectedTotal]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        maxPerIP: { type: integer }
        activeIPs: { type: integer }
        rejectedTotal: { type: integer, format: int64, description: "Cumulative connections refused for exceeding the per-IP cap (process lifetime; never reset)." }
    LoggerConfig:
      type: object
      required: [logFile, logMaxMB, logFormat]
      additionalProperties: false
      properties:
        logFile: { type: string }
        logMaxMB: { type: integer }
        logFormat: { type: string }
    DecryptionHealth:
      type: object
      description: TLS-inspection health — sessions, failures, coverage, trend, and the adaptive auto-exclude cache.
      required: [sessions, failures, coverage, autoexclude]
      additionalProperties: true
      properties:
        sessions: { type: object, additionalProperties: true }
        failures: { type: object, additionalProperties: true }
        coverage: { type: object, additionalProperties: true }
        trend: { type: array, items: { type: object, additionalProperties: true } }
        autoexclude: { type: object, additionalProperties: true }

    # ── Slice 3 tranche 2: settings/policy read-model schemas ─────────────────────
    SettingsSummary:
      type: object
      required: [authEnabled, user, proxyPort, uiPort, defaultAuthOutcome]
      additionalProperties: false
      properties:
        authEnabled: { type: boolean }
        user: { type: string }
        proxyPort: { type: integer }
        uiPort: { type: integer }
        defaultAuthOutcome: { type: string, enum: [Default, Exempt] }
    LogLevel:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level: { type: string }
    NetworkSettings:
      type: object
      required: [base_url, trust_forwarded_headers, ui_tls_fallback]
      additionalProperties: false
      properties:
        base_url: { type: string }
        ui_sans: { type: array, items: { type: string }, nullable: true }
        trust_forwarded_headers: { type: boolean }
        trusted_proxy_cidrs: { type: array, items: { type: string }, nullable: true }
        ui_tls_fallback: { type: boolean, description: "True when self-signed TLS setup failed at startup and the admin UI fell back to plain HTTP." }
        ui_tls_fallback_reason: { type: string, description: "The self-sign error, when ui_tls_fallback is true." }
        ui_custom_cert_uploaded: { type: boolean, description: "True when a custom UI certificate uploaded via POST /api/certs/upload (target=ui) is saved to disk and will be used on the next restart." }
        ui_custom_cert_active: { type: boolean, description: "True when the running UI server was started using the uploaded custom certificate (i.e. it is already live, not just saved pending a restart)." }
    RewriteList:
      type: object
      required: [rules, count]
      additionalProperties: false
      properties:
        rules: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        count: { type: integer }
    CategoryGroups:
      type: object
      required: [groups, names]
      additionalProperties: false
      properties:
        groups: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        names: { type: array, items: { type: string }, nullable: true }
    MetricsConfig:
      type: object
      required: [tokenSet, path]
      additionalProperties: false
      properties:
        tokenSet: { type: boolean }
        path: { type: string }
    LogsRetention:
      type: object
      description: Log-store retention posture (fields vary by enabled/disk state).
      required: [enabled, configurable]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        configurable: { type: boolean }
        retentionDays: { type: integer }
        encrypted: { type: boolean }
    CAKeyProvider:
      type: object
      required: [provider, isExternal, caReady, dualCAActive]
      additionalProperties: false
      properties:
        provider: { type: string }
        isExternal: { type: boolean }
        caReady: { type: boolean }
        dualCAActive: { type: boolean }
    PolicyDraftStatus:
      type: object
      description: Policy draft/require-commit state; diff/version/shadows appear only when a draft is active.
      required: [requireCommit, active, actor, startedAt]
      additionalProperties: true
      properties:
        requireCommit: { type: boolean }
        active: { type: boolean }
        actor: { type: string }
        startedAt: { type: string }
    SessionSecretStatus:
      type: object
      required: [shared]
      additionalProperties: false
      properties:
        shared: { type: boolean }

    # ── Slice 3 tranche 3: blocklist/urlcat/fileblock/scan read-model schemas ──────
    HostList:
      type: object
      required: [hosts, count]
      additionalProperties: false
      properties:
        hosts: { type: array, items: { type: string }, nullable: true }
        count: { type: integer }
    ExtensionList:
      type: object
      required: [extensions, count]
      additionalProperties: false
      properties:
        extensions: { type: array, items: { type: string }, nullable: true }
        count: { type: integer }
    BlocklistFeedList:
      type: object
      required: [feeds]
      additionalProperties: false
      properties:
        feeds:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
            properties:
              url: { type: string }
              interval: { type: string }
              last_sync: { type: string }
              last_error: { type: string }
              imported_count: { type: integer }
              attributed_count: { type: integer }
    URLCategoryList:
      type: array
      nullable: true
      items:
        type: object
        additionalProperties: true
        properties:
          name: { type: string }
          feedBacked: { type: boolean }
    FileblockProfileList:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    ConfigVersionList:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    DecryptionProfiles:
      type: object
      required: [profiles, names]
      additionalProperties: false
      properties:
        profiles: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        names: { type: array, items: { type: string }, nullable: true }
    DPIConfig:
      type: object
      required: [patterns, count, blocked_total]
      additionalProperties: false
      properties:
        patterns: { type: array, items: { type: string }, nullable: true }
        count: { type: integer }
        blocked_total: { type: integer, format: int64 }
    DPIBypass:
      type: object
      required: [hosts]
      additionalProperties: false
      properties:
        hosts: { type: array, items: { type: string }, nullable: true }
    SecurityScanStatus:
      type: object
      description: Security-scan service status (fields vary by scan-service mode).
      required: [enabled]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        scan_svc_mode: { type: string }
        stat_scan_timeout:
          type: integer
          description: Body scans that exceeded the scan budget and were refused (fail-closed).
        stat_clam_saturated:
          type: integer
          description: >-
            Body scans that could not obtain a ClamAV slot within the scan budget. The daemon is
            healthy; the node is at scanning capacity. Reported separately from
            stat_clam_scan_error because the operator response differs (add capacity vs. fix the
            daemon).
        stat_scan_late_discard:
          type: integer
          description: >-
            Clean verdicts computed after the scan budget expired and discarded; the fail-closed
            refusal stands. A correctness signal — non-zero means content is being decided by the
            deadline rather than by the scan engines.
        scan_inflight:
          type: integer
          description: >-
            Body scans currently running, including scans whose caller already gave up and was
            served the fail-closed refusal.
        stat_remote_scan_fail:
          type: integer
          description: >-
            Remote scan-sidecar FAULTS that forwarded content unscanned (fail-open): unreachable,
            HTTP error, unreadable or unintelligible reply, or a 200 carrying no affirmative
            verdict. Slowness and capacity are NOT here — those fail closed and are counted as
            stat_scan_timeout.
        stat_remote_scan_saturated:
          type: integer
          description: >-
            Remote scans the sidecar refused for capacity (HTTP 429). Fail-closed, and also counted
            as stat_scan_timeout. Reported separately from stat_remote_scan_fail because the
            operator response differs (add scanning capacity vs. fix the sidecar).
        remote_scan_inflight:
          type: integer
          description: >-
            Remote scan round trips currently in flight. The saturation gauge for a sidecar
            deployment, where scan_inflight is structurally zero.

    # ── Slice 3 tranche 4: scan/pac/decryption/release read-model schemas ──────────
    ScanSvcConfig:
      type: object
      required: [remote_enabled]
      additionalProperties: true
      properties:
        remote_enabled: { type: boolean }
        remote_url: { type: string }
    ScanCache:
      type: object
      required: [enabled]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        cache_hits: { type: integer }
        cache_misses: { type: integer }
        cache_size: { type: integer }
    DomainAllowlist:
      type: object
      required: [domains]
      additionalProperties: false
      properties:
        domains: { type: array, items: { type: string }, nullable: true }
    YARASettings:
      type: object
      description: YARA engine runtime settings (fields vary by build/config).
      additionalProperties: true
    DecryptionRedaction:
      type: object
      description: Global destination-privacy posture (traffic-log host pseudonymization).
      required: [redact_hosts]
      additionalProperties: false
      properties:
        redact_hosts:
          description: "Boolean posture flag (false = off), or an array of redacted hosts on legacy builds."
        scope: { type: string, description: The privacy scope this posture governs (traffic_destination). }
        scope_fields: { type: array, items: { type: string }, description: The destination fields pseudonymized when the posture is on. }
        key_provisioned: { type: boolean, description: Whether this node holds a pseudonym key (the key value is never exposed). }
        note: { type: string, description: Human-readable explanation of the posture's behavior and limitations. }
    PACPools:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    PACProfiles:
      type: object
      required: [profiles, pools]
      additionalProperties: true
      properties:
        defaultProfile: { type: object, additionalProperties: true, nullable: true }
        profiles: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        pools: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
    PACPostureInventory:
      type: object
      description: Direct-access PAC posture inventory (shape varies).
      additionalProperties: true
