        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409': { description: 'Name already in use, or version fence conflict ({error, currentVersion, yourVersion}).' }
        '500': { description: 'Durable persistence failed — the mutation was rolled back; nothing changed.' }
    put:
      operationId: updateDecryptionProfile
      tags: [policy]
      summary: Update decryption profile
      description: Updates a decryption profile. With `?id=` (stable-ID addressing, preferred) a changed `name` performs a RENAME — the stable ID (and therefore the adaptive-decryption exclusion scope and security generation) is preserved and the denormalized name on referencing policy rules (running and any open draft candidate) is cascaded server-side.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: operator
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
