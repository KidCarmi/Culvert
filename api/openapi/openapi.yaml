        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
    post:
      operationId: requestMCPToolApproval
      tags: [mcp]
      summary: Request an MCP tool-trust approval
      description: Create a pending tool-trust request bound to an exact reviewed fingerprint digest for a declared purpose. Both shadow_evaluation and live_execution are issuable — live_execution ONLY under stronger governance (a mandatory finite expiry no longer than 24h, four-eyes at approval, and exact-current-state revalidation) and it is bound to the caller's authenticated principal, never an anonymous actor. A live_execution grant is a TRUST decision only — it never arms an executor, activates Canary, or makes a tool catalog.Usable. The reviewed per-record catalog revision (catalog_revision, the tool's Revision from the inventory view) is REQUIRED — a zero/omitted value is rejected — so the exact-target contract cannot be bypassed by not asserting a revision. This is NOT a grant — it never changes catalog eligibility. The tenant comes from the query scope, validated against the server's ownership; the client never submits server facts. Fails closed on a stale target (fingerprint or catalog revision omitted or advanced).
      security: [ { sessionCookie: [] }, { basicAuth: [] } ]
      x-culvert-visibility: admin-supported
      x-culvert-permission: operator
      x-culvert-tenant-scope: tenant
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: mcp.tooltrust.request
      parameters:
        - { name: tenant, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [server_id, tool_name, fingerprint, catalog_revision]
              properties:
                server_id: { type: string, minLength: 1, maxLength: 256, description: 'Nonempty; backend limit is 256 UTF-8 BYTES (maxLength counts characters).' }
                tool_name: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._/-]+$', description: 'Catalog tool token: nonempty, at most 128 bytes, ASCII [A-Za-z0-9._/-] only (limits.DefaultCatalog MaxNameBytes). A value outside this contract can never identify a catalog tool.' }
                fingerprint: { type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-fA-F]{64}$', description: 64-char hex of the reviewed 32-byte tool fingerprint digest }
                catalog_revision: { type: integer, format: int64, minimum: 1, description: The reviewed per-record catalog revision (the tool's Revision from the inventory view). REQUIRED — a zero/omitted value is rejected so the exact-target contract cannot be bypassed. }
                purpose: { type: string, enum: [shadow_evaluation, live_execution], description: 'Declared purpose (omit to default to shadow_evaluation). live_execution is issuable ONLY under stronger governance: it REQUIRES a finite expires_in_seconds within 24h (a 0/no-expiry value is rejected), four-eyes at approval (a distinct authenticated requester and approver), and exact-current-state revalidation. It never arms execution or makes a tool catalog.Usable.' }
                reason: { type: string, maxLength: 512, description: 'Optional free-text reason. The backend limit is 512 UTF-8 BYTES (maxLength counts characters, so multi-byte input may be rejected below this).' }
                ticket_ref: { type: string, maxLength: 128, description: 'Optional external ticket reference. The backend limit is 128 UTF-8 BYTES (maxLength counts characters, so multi-byte input may be rejected below this).' }
                expires_in_seconds: { type: integer, format: int64, minimum: 0, maximum: 315360000, description: 'TTL in seconds. For shadow_evaluation, 0 means no expiry. For live_execution it is REQUIRED and must be 1..86400 (≤24h) — a 0/no-expiry value is rejected. Range is 0..315360000 (~10 years); a negative or larger value is rejected.' }
      responses:
        '200': { description: Pending approval created, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/PlainConflict' }
        '503':
          description: The durable approval store could not be written (full/read-only disk); the mutation is retryable once storage recovers. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
  /api/mcp/tool-approval-decision:
    post:
      operationId: decideMCPToolApproval
      tags: [mcp]
      summary: Approve/reject/revoke an MCP tool-trust approval
      description: Decide a tool-trust request. approve routes by the stored purpose. For a shadow_evaluation approval it re-verifies the exact reviewed fingerprint against current facts and materializes catalog.Usable. For a live_execution approval it enforces FOUR-EYES on the caller's authenticated principal (a distinct requester and approver), re-verifies exact current state and the ≤24h TTL, and records a live grant WITHOUT any catalog promotion (live trust never makes a tool catalog.Usable). revoke immediately withdraws an active grant; reject terminates a pending request. Trust is not authorization — runtime policy stays authoritative for every call, and approving a live grant arms NOTHING (no executor, no live tier, no Canary transition). Never executes, calls upstream, or materializes a credential.
      security: [ { sessionCookie: [] }, { basicAuth: [] } ]
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: tenant
      x-culvert-stability: stable
