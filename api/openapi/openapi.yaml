  /api/cdr/instances/enroll:
    post:
      operationId: enrollCDRInstance
      tags: [cluster]
      summary: Enroll CDR instance
      description: >-
        Exchange a Sluice enrollment token for an mTLS client credential
        and register the instance. NON-idempotent — the token is
        single-use (consume-and-delete on the Sluice side). Every dispatch
        carries a 128-bit operation identity (client-supplied
        `operationId`, or server-minted) that Sluice v0.3 binds durably to
        the issued fingerprint BEFORE responding, and the appliance
        persists a non-secret recovery receipt BEFORE the RPC (no receipt
        ⇒ nothing is sent, 503). An unknown outcome (502 naming the
        operation) is resolved through
        /api/cdr/instances/enroll/recover, never by blind retry; a
        repeated dispatch of an already-issued operation is refused (409)
        with the credential recorded as issued-but-not-stored; a local
        persistence failure after issuance (500) records the issued
        fingerprint on the receipt and in the audit trail so it can be
        revoked. First successful enrollment auto-enables CDR (persisted
        sentinel).
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: cdr.instance.enroll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, endpoint, token, serverFingerprint]
              properties:
                name: { type: string, description: "Instance name ([A-Za-z0-9][A-Za-z0-9_.-]{0,63})." }
                endpoint: { type: string, description: "CDR sidecar endpoint (host:port)." }
                token: { type: string, description: "One-time enrollment token." }
                serverFingerprint: { type: string, description: "TOFU pin of the server certificate." }
                operationId:
                  type: string
                  pattern: "^[A-Za-z0-9._-]{16,64}$"
                  description: "Client-minted recovery identity (16–64 chars of [A-Za-z0-9._-]); server-minted when absent. Recorded on the receipt and bound by Sluice to the issued fingerprint."
      responses:
        '200':
          description: Enrolled and registered. The body reports the ACTUAL post-operation state (R13) — never assume auto-enable succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CDREnrollResult' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409':
          description: An instance with that name is already enrolled; OR the operation id ALREADY EXISTS (the binding operationId→name+endpoint+pin+actor is immutable — any repeated dispatch, an exact retry included, performs NO RPC and the body names the current receipt state + the recovery path); OR this operation id already issued a credential at Sluice that is not stored here (recorded issued-but-not-stored; revoke it or resolve it). Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '500':
          description: Sluice issued the credential but local persistence failed; the issued fingerprint is named in the body, on the receipt and in the audit trail — revoke it. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '502':
          description: The Sluice Enroll RPC failed. A definite refusal (bad/consumed/expired token, fingerprint mismatch) marks the receipt not_issued; an UNKNOWN outcome (unreachable/timeout) names the operation id — resolve via /api/cdr/instances/enroll/recover before retrying. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '503':
          description: The recovery receipt could not be persisted (or the receipt store is DEGRADED / full); NO enrollment was sent. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
  /api/cdr/instances/enroll/recover:
    post:
      operationId: recoverCDREnrollment
      tags: [cluster]
      summary: Resolve an enrollment operation
      description: >-
        Fresh, authoritative resolution of one enrollment (or renewal)
        operation through Sluice's EnrollStatus, classified as
        LANDED_AND_STORED (issued and held in the registry),
        ISSUED_BUT_NOT_STORED (issued at Sluice, not held here — the
        response carries the exact revocation path: the API by
        fingerprint when a pooled client can issue it, else the
        Sluice-host CLI command), NOT_ISSUED, or AMBIGUOUS (Sluice could
        not be asked; retry). Updates only the local receipt; never
        mints, stores or revokes anything. When a receipt exists its BOUND
        endpoint + TOFU pin are authoritative — a supplied value that
        conflicts is refused with 409 before any network activity; the
        values are consulted only for a receipt-less recovery. A failed
        receipt transition is reported (receiptUpdated=false +
        receiptError) with the previous durable state kept.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: cdr.instance.enroll.recover
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operationId]
              properties:
                operationId: { type: string, pattern: "^[A-Za-z0-9._-]{16,64}$" }
                endpoint: { type: string, description: "Override when no receipt exists." }
                serverFingerprint: { type: string, description: "Override when no receipt exists." }
      responses:
        '200':
          description: Classification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CDREnrollRecovery' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409':
          description: The supplied endpoint or server fingerprint conflicts with the receipt's immutable binding; nothing was sent. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
  /api/cdr/instances/enroll/receipts:
    get:
      operationId: getCDREnrollReceipts
      tags: [cluster]
      summary: Enrollment recovery receipts
      description: >-
        The bounded list of durable, non-secret enrollment operation
        receipts (dispatched / stored / issued_not_stored / not_issued /
        revoked). Never carries a token or key material.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Receipts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CDREnrollReceipts' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
    delete:
      operationId: deleteCDREnrollReceipt
      tags: [cluster]
      summary: Remove an enrollment receipt
      description: >-
        Removes one TERMINAL receipt (stored / not_issued / revoked) by
        operation id — local bookkeeping only; nothing changes at Sluice.
        An unresolved receipt (dispatched / issued_not_stored) is REFUSED
        with 409: it is the only durable identity of an operation whose
        credential may exist. While the receipt file is DEGRADED, the
        fenced positional repair `?position=N&operationId=<verbatim>`
        removes one defective record.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: cdr.instance.enroll.receipt.remove
      parameters:
        - name: operationId
          in: query
          required: true
          schema: { type: string }
        - name: position
          in: query
          required: false
          schema: { type: integer }
          description: Degraded-store repair only — the 0-based record position, fenced on the verbatim operationId.
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [removed]
                properties:
                  removed: { type: string }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: Receipt not found. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '409':
          description: The receipt is unresolved (dispatched / issued_not_stored) and cannot be removed; or the positional repair fence did not match. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
  /api/cdr/instances/revoke:
    post:
      operationId: revokeCDRInstance
      tags: [cluster]
      summary: Revoke CDR instance credential
      description: >-
        Tell Sluice to refuse the named instance's client credentials —
        EVERY still-valid generation in its lineage (RevokeClient by
        SHA-256 fingerprint) — and only after Sluice PROVES a durable
        deny for each (v0.3 outcome REVOKED / ALREADY_REVOKED /
        TOMBSTONED, or a v0.2 revoked=true) prune the local registry
        entry and shred the local PEMs. A response that proves nothing
        (revoked=false with no outcome — e.g. an unknown fingerprint on a
        v0.2 server) is 502 and prunes NOTHING. Per-generation progress
        is durable, so a failure midway is retried safely. Sluice
        refuses self-revocation, so at least one OTHER enrolled,
        reachable instance is required to issue the call — a
        single-instance deployment gets 503. An UNRESOLVED renewal is
        resolved authoritatively through EnrollStatus first (R11) so the
        issued-but-unrecorded credential is part of the whole-lineage
        revocation; when it cannot be resolved (503) or persisted (409)
        nothing changes. With `fingerprint` instead of `name`, an orphaned
        credential (issued-but-not-stored enrollment, lost renewal) is
        revoked directly.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: cdr.instance.revoke_rpc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, description: "Enrolled instance whose credentials to revoke (all live generations). Mutually exclusive with fingerprint." }
                fingerprint: { type: string, description: "Orphaned credential to revoke directly (sha256:<64 hex>). Mutually exclusive with name." }
                reason: { type: string, description: "Free-text revocation reason (recorded in the Sluice ledger + audit trail)." }
      responses:
        '200':
          description: Durable deny PROVEN for every targeted fingerprint; local registry pruned (name mode).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [revoked, fingerprint, fingerprints, outcomes, localPruned]
                properties:
                  revoked: { type: string, description: "The instance name ('' in fingerprint mode)." }
                  fingerprint: { type: string, description: "The primary (active) revoked fingerprint." }
                  fingerprints: { type: array, items: { type: string }, description: "Every fingerprint proven revoked by this call." }
                  outcomes:
                    type: object
                    additionalProperties: { type: string, enum: [revoked, already_revoked, tombstoned] }
                    description: "Per-fingerprint Sluice-reported outcome."
                  localPruned: { type: boolean, description: "false when the deny is proven but a local record (registry prune / lineage / receipt) could not be persisted (retry is idempotent)." }
                  receiptsUnrecorded: { type: array, items: { type: string }, description: "Fingerprint mode: receipts whose revoked transition could not be persisted (previous state kept)." }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: Instance not found. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '502':
          description: The Sluice RevokeClient RPC failed OR its response proved no durable deny (revoked=false with no outcome); NOTHING was pruned or shredded locally; retry is safe (idempotent on the Sluice side). Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '409':
          description: An unresolved renewal was resolved but its outcome could not be persisted; nothing changed. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '503':
          description: No other enrolled, reachable instance to issue the revoke (Sluice refuses self-revocation), OR an unresolved renewal could not be resolved against the engine; nothing changed. Body is plain text.
          content:
            text/plain: { schema: { type: string } }

