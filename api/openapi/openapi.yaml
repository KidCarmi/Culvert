      responses:
        '200':
          description: HTTP header rewrite rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewriteList' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '503':
          description: Rewrite MANAGEMENT identity is not durable on this node — the legacy list serializes stableId, so it answers the SAME structured `{error, degraded:"rewrite-identity", reason}` as GET /api/rewrite/state instead of exposing ephemeral identities. Healthy behavior is unchanged; traffic rewrite enforcement continues.
    post:
      operationId: addRewriteRule
      tags: [policy]
      summary: Add rewrite rule
      description: Adds an HTTP header rewrite rule.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: operator
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: rewrite.add
      parameters:
        - name: ifRevision
          in: query
          required: false
          description: Optional revision assertion (the `revision` from GET /api/rewrite/state); a mismatch returns the structured 409 without mutating. Any client-supplied stableId in the body is ignored — the server owns identity on create.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RewriteRuleFull' }
      responses:
        '200':
          description: The created rule with its server-assigned stableId (and process-local integer id).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewriteRuleFull' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409':
          description: Stale revision assertion; carries the current revision.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '503':
          description: Rewrite MANAGEMENT identity is not durable on this node — structured `{error, degraded:"rewrite-identity", reason}`; mutations refuse until durable identity is established (fix persistence, restart).
    delete:
      operationId: deleteRewriteRule
      tags: [policy]
      summary: Delete rewrite rule
      description: Deletes a rewrite rule by id.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: operator
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: rewrite.delete
      parameters:
        - name: id
          in: query
          required: false
          description: Legacy process-local integer id (compatibility addressing).
          schema: { type: string }
        - name: stableId
          in: query
          required: false
          description: Durable rule identity (preferred v2 addressing).
          schema: { type: string }
        - name: ifRevision
          in: query
          required: false
          description: Optional revision assertion (GET /api/rewrite/state); mismatch returns the structured 409 without mutating.
          schema: { type: string }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409':
          description: Stale revision assertion; carries the current revision.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '503':
          description: Rewrite MANAGEMENT identity is not durable on this node — structured `{error, degraded:"rewrite-identity", reason}`; mutations refuse until durable identity is established (fix persistence, restart).

