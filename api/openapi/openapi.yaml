          name: { type: string }
          feedBacked: { type: boolean }
    FileblockProfileList:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    FileblockProfileState:
      type: object
      required: [profiles, revision, count]
      additionalProperties: false
      description: v2 file-profile state — profiles + the server-owned restart-stable content revision, from one committed snapshot.
      properties:
        profiles: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        revision: { type: string }
        count: { type: integer }
    ConfigVersionList:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    DecryptionProfiles:
      type: object
      required: [profiles, names, version]
      additionalProperties: false
      properties:
        profiles: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        names: { type: array, items: { type: string }, nullable: true }
        version:
          type: integer
          format: int64
          description: Durable per-store mutation generation. Echo it back as the optional `ifVersion` query parameter on POST/PUT/DELETE for optimistic concurrency; a mismatch returns the structured 409 conflict ({error, currentVersion, yourVersion}).
    DPIConfig:
      type: object
      required: [patterns, count, blocked_total]
      additionalProperties: false
      properties:
        patterns: { type: array, items: { type: string }, nullable: true }
        count: { type: integer }
        blocked_total: { type: integer, format: int64 }
        editable:
          type: boolean
          description: "Ownership signal (2E-A-2): false on a managed Data Plane node, where DPI patterns are control-plane managed (cluster-synced) and local writes are refused with 409."
    DPIBypass:
      type: object
      required: [hosts]
      additionalProperties: false
      properties:
        hosts: { type: array, items: { type: string }, nullable: true }
        revision:
          type: string
          description: "Server-owned content-derived revision, derived from the SAME committed snapshot as `hosts` (coherent pair). Echo back as `ifRevision` on the write for stale-overwrite protection; a mismatch is the structured 409 ({error, currentRevision, yourRevision})."
    SecurityScanStatus:
      type: object
      description: Security-scan service status (fields vary by scan-service mode).
      required: [enabled]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        scan_svc_mode: { type: string }
        stat_scan_timeout:
          type: integer
          description: Body scans that exceeded the scan budget and were refused (fail-closed).
        stat_clam_saturated:
          type: integer
          description: >-
            Body scans that could not obtain a ClamAV slot within the scan budget. The daemon is
            healthy; the node is at scanning capacity. Reported separately from
            stat_clam_scan_error because the operator response differs (add capacity vs. fix the
            daemon).
        stat_scan_late_discard:
          type: integer
          description: >-
            Clean verdicts computed after the scan budget expired and discarded; the fail-closed
            refusal stands. A correctness signal — non-zero means content is being decided by the
            deadline rather than by the scan engines.
        scan_inflight:
          type: integer
          description: >-
            Body scans currently running, including scans whose caller already gave up and was
            served the fail-closed refusal.
        stat_remote_scan_fail:
          type: integer
          description: >-
            Remote scan-sidecar FAULTS that forwarded content unscanned (fail-open): unreachable,
            HTTP error, unreadable or unintelligible reply, or a 200 carrying no affirmative
            verdict. Slowness and capacity are NOT here — those fail closed and are counted as
            stat_scan_timeout.
        stat_remote_scan_saturated:
          type: integer
          description: >-
            Remote scans the sidecar refused for capacity (HTTP 429). Fail-closed, and also counted
            as stat_scan_timeout. Reported separately from stat_remote_scan_fail because the
            operator response differs (add scanning capacity vs. fix the sidecar).
        remote_scan_inflight:
          type: integer
          description: >-
            Remote scan round trips currently in flight. The saturation gauge for a sidecar
            deployment, where scan_inflight is structurally zero.

    # ── Slice 3 tranche 4: scan/pac/decryption/release read-model schemas ──────────
    ScanSvcConfig:
      type: object
      required: [remote_enabled]
      additionalProperties: true
      properties:
        remote_enabled: { type: boolean }
        remote_url: { type: string }
    ScanCache:
      type: object
      required: [enabled]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        cache_hits: { type: integer }
        cache_misses: { type: integer }
        cache_size: { type: integer }
    DomainAllowlist:
      type: object
      required: [domains]
      additionalProperties: false
      properties:
        domains: { type: array, items: { type: string }, nullable: true }
        revision:
          type: string
          description: "Server-owned content-derived revision, derived from the SAME committed snapshot as `domains` (coherent pair). Echo back as `ifRevision` on the write for stale-overwrite protection; a mismatch is the structured 409 ({error, currentRevision, yourRevision})."
        editable:
          type: boolean
          description: "Ownership signal (2E-A-2): false on a managed Data Plane node, where the allowlist is control-plane managed (cluster-synced) and local writes are refused with 409."
    YARASettings:
      type: object
      description: YARA engine runtime settings (fields vary by build/config).
      additionalProperties: true
    DecryptionRedaction:
      type: object
      description: "Global destination-privacy posture (traffic-log destination pseudonymization). Node-local — outside export/import, config-version rollback, and CP→DP sync. Controls what destination information is retained in logs/observability; it does NOT control whether traffic is decrypted."
      required: [redact_hosts]
      additionalProperties: false
      properties:
        redact_hosts:
          description: "Boolean posture flag (false = off), or an array of redacted hosts on legacy builds."
        scope: { type: string, description: The privacy scope this posture governs (traffic_destination). }
        scope_fields: { type: array, items: { type: string }, description: The destination fields pseudonymized when the posture is on. }
        key_provisioned: { type: boolean, description: Whether this node holds a pseudonym key (the key value is never exposed). }
        key_id:
          type: string
          description: "NON-SECRET pseudonym-generation identifier (2E-B): random, never derived from key material; empty when no key is installed. Changes iff a new key is installed. A changed key_id alone does NOT identify WHOSE rotation landed — operation attribution comes from rotation_receipts."
        rotation_seq:
          type: integer
          description: "Durable monotonic key-generation sequence, node-local, advanced by every new-key install (rotation or enable-path mint) atomically with the key. An unchanged sequence proves no rotation landed in between — the NOT-LANDED half of unknown-outcome resolution."
        rotation_receipts:
          type: array
          description: "Bounded (newest-last, FIFO window) NON-SECRET receipts of client-identified rotations. A caller resolving a lost rotation response checks for ITS operation_id here: receipt present = that operation landed exactly once; absent with rotation_seq unchanged = it did not land; absent with the sequence advanced = ambiguous (another admin may have rotated; the receipt may also have aged out of the window) — never claim landed/not-landed, never blindly rotate again."
          items:
            type: object
            additionalProperties: false
            required: [operation_id, key_id, seq]
            properties:
              operation_id: { type: string, description: "The caller-generated opaque id of the rotation operation." }
              key_id: { type: string, description: "The NON-SECRET pseudonym generation that rotation produced." }
              seq: { type: integer, description: "The rotation sequence that operation advanced to." }
              ts: { type: string, description: "Informational RFC3339 timestamp of the rotation." }
        revision:
          type: string
          description: "Server-owned content-derived revision over (redact_hosts, key_id), from the SAME committed snapshot (coherent pair). Echo back as ifRevision on the PUT for stale-overwrite protection; a mismatch is the structured 409 ({error, currentRevision, yourRevision})."
        note: { type: string, description: Human-readable explanation of the posture's behavior and limitations. }
    PACPools:
      type: array
      nullable: true
      description: Each pool carries its 2F-A `etag` token (computed on read, never stored).
      items: { type: object, additionalProperties: true }
    PACProfiles:
      type: object
      required: [profiles, pools]
      additionalProperties: true
      properties:
        defaultProfile: { type: object, additionalProperties: true, nullable: true }
        profiles: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        pools: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        collectionEtag:
          type: string
          description: 2F-A collection token every profile/pool CREATE must echo.
        poolEtags:
          type: object
          description: 2F-A per-pool tokens (pool id → etag) every pool PUT/DELETE must echo.
          additionalProperties: { type: string }
    PACPostureInventory:
      type: object
      description: Direct-access PAC posture inventory (shape varies).
      additionalProperties: true
    ReleaseStatus:
      type: object
      description: Release-management status — catalog availability, verify mode, and freshness.
      required: [available]
      additionalProperties: true
      properties:
        available: { type: boolean }
        reason: { type: string }
        verify_mode: { type: string }
        sigstore_warn: { type: string, description: "Present only when a Sigstore trust override (identity/trusted-root) did not take effect." }
    ObjectReferences:
      type: object
      description: Reverse references from named objects (categories, groups, profiles) to policy rules.
      additionalProperties: true

    # ── Slice 3 tranche 5: dashboard/cluster/support read-model schemas ────────────
    AuditLog:
