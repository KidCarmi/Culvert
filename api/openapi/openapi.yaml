  /api/upstream/health:
    post:
      operationId: checkUpstreamHealth
      tags: [cluster]
      summary: Run a manual upstream probe
      description: >-
        Runs the shared probe classifier now (2F-D, R24 lifecycle): admin-only;
        at most one manual run in flight and at most one accepted run per 10 s
        window (a repeat answers 429 `probe_in_flight` / `probe_rate_limited`
        with `retryAfterSeconds` and leaves NO success audit); every probe is
        bounded at 5 s per entry; an accepted run is audited as
        `upstream.probe.manual` with counts + `scope=node-local`. Bounded
        reasons only — never a raw transport or proxy error. The periodic probe
        loop is unaffected.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: low
      x-culvert-audit-event: upstream.probe.manual
      responses:
        '200':
          description: The run completed; the read model plus a counts-only `summary`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamConfig' }
        '429':
          description: A manual run is in flight or one was accepted less than 10 s ago (no success audit).
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
