  /api/saas-feed/settings:
    get:
      operationId: getSaaSFeedSettings
      tags: [policy]
      summary: SaaS signed category-feed configuration
      description: >-
        Returns the CONFIGURED SaaS signed category-feed settings (url, protocol,
        managed, enabled, refresh) and the resolved effective values. Clearly
        separates configured state from runtime activation state — runtime
        activation (download/verify/activate/serve) is not yet available, so this
        endpoint never reports last_success, an active version, freshness, or
        provenance.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: SaaS feed configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaaSFeedSettings' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
    put:
      operationId: setSaaSFeedSettings
      tags: [policy]
      summary: Set SaaS signed category-feed configuration
      description: >-
        Updates the SaaS signed category-feed configuration. The protocol is
        signed-only (signed_manifest_v1); the URL is constrained to the official
        Culvert feed origin (an empty URL resolves to the built-in official
        endpoint). Configuration only — no feed is downloaded, verified, or
        activated. Denied with 409 on a managed data-plane node (feed policy is
        control-plane-authoritative).
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: saasfeed.settings
      parameters:
        - name: ifRevision
          in: query
          required: false
          schema: { type: string }
          description: Optional settings-revision assertion (from the GET's `revision`); when present the comparison and the durable target write share one serialized save domain, and a stale token returns the structured 409 without applying anything.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSaaSFeedSettings' }
      responses:
        '200':
          description: Updated SaaS feed configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaaSFeedSettings' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409': { $ref: '#/components/responses/PlainConflict' }
  /api/saas-feed/overrides:
    get:
      operationId: getSaaSFeedOverrides
      tags: [policy]
      summary: Admin category overrides
      description: >-
        Returns the admin-owned category overrides (added, recategorized,
        tombstones) layered on the SaaS feed snapshot.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Admin category overrides.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaaSFeedOverridesResponse' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
    put:
      operationId: setSaaSFeedOverrides
      tags: [policy]
      summary: Replace admin category overrides
      description: >-
        Full-set replacement of the admin category overrides. Transmit the
        complete desired set; an empty body ({}) is a deliberate clear of every
        override (an explicit empty replacement that delete-propagates to the
        fleet). Denied with 409 on a managed data-plane node.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: saasfeed.overrides
      parameters:
        - name: ifRevision
          in: query
          required: false
          schema: { type: string }
          description: Optional override-revision assertion (from the GET's `revision`); when present the full-set replacement runs the fenced durable path (2D-B) and a stale token returns the structured 409 without replacing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryOverrides' }
      responses:
        '200':
          description: Updated overrides.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409': { $ref: '#/components/responses/PlainConflict' }
  /api/saas-feed/status:
    get:
      operationId: getSaaSFeedStatus
      tags: [policy]
      summary: SaaS signed category-feed runtime status
      description: >-
        Returns the signed SaaS category-feed's runtime status: the derived state
        (disabled, waiting_for_authority, recovering, embedded, fresh, stale,
        syncing, degraded, critical), serving provenance and signature trust, the
        active feed version and freshness, the composed host/category/override
        footprint, and attempt/failure bookkeeping. Nullable fields (active version,
        timestamps, last activation delta, expires_in_days) render as null when
        absent — never a fabricated zero. Read-only; never reports success before a
        durable activation and live cutover complete.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: SaaS feed runtime status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaaSFeedStatus' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
  /api/saas-feed/refresh:
    post:
      operationId: refreshSaaSFeed
      tags: [policy]
      summary: Trigger a manual SaaS signed-feed refresh
      description: >-
        Triggers a manual refresh of the signed SaaS category feed. Shares the
        runtime's serialized refresh path (singleflight): if a refresh is already in
        flight it returns 202 with status=in_progress and does NOT start a second. A
        manual refresh is an operational action (it mutates no configuration), so it
        is permitted on a managed data-plane node; it is a deterministic no-op when
        the feed is disabled or the node lacks authoritative configuration.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: low
      x-culvert-audit-event: saasfeed.refresh
      responses:
        '200':
          description: Refresh completed (see status for the outcome).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaaSFeedRefreshResult' }
        '202':
          description: A refresh is already in flight (status=in_progress).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaaSFeedRefreshResult' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '503':
          description: The signed-feed runtime is not armed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaaSFeedRefreshResult' }
