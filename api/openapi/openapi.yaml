  /api/rewrite:
    get:
      operationId: getRewrite
      tags: [policy]
      summary: HTTP header rewrite rules
      description: Returns the configured HTTP header rewrite rules.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
