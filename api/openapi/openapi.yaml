      tags: [pac]
      summary: PAC profile lifecycle (node-local truth)
      description: >-
        The node-local lifecycle of one PAC profile: the active spec and its
        revision/digest, the saved draft (+ draftSpecDigest, draftRevision,
        draftDirty, draftDiff), the immutable publish history (revisions carry
        the operationId that produced them), the state machine (state,
        historyState, pendingOp, ambiguous, historyReset) and the decided
        operations. RECOVERY EVIDENCE LIMITS (2F-E correction): `operations`
        lists at most the 20 most recent decisions while the appliance retains
        `operationsRetained` of a cap of `operationsCap`; absence from the
        listed operations therefore proves nothing on its own. A client
        resolving a lost response passes `?operationId=<uuid>` and reads the
        `operation` lookup (the FULL retained ring plus the revision history).
        Non-commit is provable only when the retained ring is complete
        (operationsRetained < operationsCap), no history reset touched it, the
        operation is absent, and the reviewed active revision moved (the
        appliance can no longer commit it). Everything is scope node-local
        (never cluster-synced, never on config-version rollback).
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: operationId
          in: query
          required: false
          description: >-
            Look ONE operation up in the full retained decided ring and the
            revision history; answered in `operation`. Must be a UUID (400
            otherwise).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The node-local lifecycle of the profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PACLifecycle' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: Unknown profile (or the legacy `default`). Body is plain text.
          content:
            text/plain: { schema: { type: string } }
    post:
      operationId: pacProfileLifecycle
      tags: [pac]
      summary: PAC profile lifecycle action
      description: >-
        Admin lifecycle action on a PAC profile. `action` selects the operation
        and the remaining payload varies per action:
        `save_draft` {draft, draftRevision (echo the loaded value; 0 for the
        first draft)} — replaces the node-local draft, never the active
        profile;
        `publish` {operationId (client-minted UUID), draft (the REVIEWED
        candidate, sent verbatim), expectedActiveRevision (or collectionEtag
        when no active profile exists), reason, confirm (when the challenge
        requires it)} — commits the candidate as the next active revision and
        records history revision `revision`;
        `rollback` {operationId, targetN, expectedActiveRevision|collectionEtag,
        reason, confirm} — re-publishes the recorded spec of history revision
        targetN as a NEW revision;
        `repair` {operationId, resolution: accept_active} — records the
        observed active profile after an ambiguous outcome;
        `acknowledge_history_reset` {operationId, expectedActiveRevision,
        expectedActiveSpecDigest}.
        Decisions are AT-MOST-ONCE by operationId: a repeated publish/rollback/
        repair with an operationId the appliance still retains replays the
        recorded status + body byte-for-byte (no second commit); the fence
        (expectedActiveRevision) refuses a repeat whose base moved. The
        `draft`/`confirm` request fields are documented on the GET/PACConfirm
        schemas; responses per action are described under 200.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: PAC_profile.lifecycle
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              additionalProperties: true
              properties:
                action: { type: string, enum: [save_draft, publish, rollback, repair, acknowledge_history_reset] }
                operationId:
                  type: string
                  format: uuid
                  description: >-
                    2F-B — required for publish, rollback, repair and
                    acknowledge_history_reset. Decisions are at-most-once: a repeated
                    operationId returns the recorded result (status and body) without
                    committing again.
                expectedActiveSpecDigest:
                  type: string
                  description: >-
                    2F-B correction — acknowledge_history_reset binds the admin's
                    acknowledgement of a lost node-local history to the active
                    ProfileSpecDigest reviewed (together with expectedActiveRevision);
                    a mismatch is refused `409 history_reset_stale` with `current`.
                    2F-E correction round 3 — publish/rollback may name it too, as an
                    INDEPENDENT fence beside expectedActiveRevision: a replace-mode
                    config import or a config rollback can install a DIFFERENT spec at
                    the SAME active revision, which the revision fence cannot see; a
                    mismatch is refused `409 stale` with `current.expectedActiveSpecDigest`
                    (+ `current.revision`). Optional (a caller that omits it reviewed no
                    digest); the admin frontend always sends it.
                confirm:
                  allOf: [{ $ref: '#/components/schemas/PACConfirm' }]
                  description: 2F-B — echoes the bound challenge when publish/rollback introduces new DIRECT paths.
                resolution:
                  type: string
                  enum: [accept_active]
                  description: 2F-B repair — records the OBSERVED active profile as a repaired revision; never rewrites the active store.
                draftRevision:
                  type: integer
                  format: int64
                  description: 2F-A — save_draft on an existing draft must echo the loaded draftRevision.
                expectedActiveRevision:
                  type: integer
                  format: int64
                  description: 2F-A — publish/rollback must echo the active profile's revision (refusal key `revision`).
                collectionEtag:
                  type: string
                  description: 2F-A — publish/rollback with NO active profile must echo the collection token instead.
                expectedHistoryIncarnation:
                  type: string
                  description: >-
                    2F-E correction round 2 — publish/rollback/repair may name the
                    history epoch they were reviewed in (the lifecycle GET's
                    `historyIncarnation`). A mismatch is refused `409
                    history_incarnation_mismatch` with `current.historyIncarnation`
                    BEFORE the at-most-once replay is consulted: the old epoch's
                    decision records are gone, so a re-sent operationId would
                    otherwise run again. Optional (a caller that omits it reviewed
                    no epoch and has no re-send semantics); the admin frontend
                    always sends it.
      responses:
        '200':
          description: >-
            Lifecycle action result. publish: `{published:true, operationId, revision,
            activeRevision, activeSpecDigest, digest, draftRevision, historyState:
            recorded|pending_reconciliation, scope}`; rollback: `{rolledBack:true,
            toRevision, newRevision, …}`; repair: `{repaired:true, revision, …}`;
            acknowledge_history_reset: `{acknowledged:true, operationId,
            activeRevision, activeSpecDigest, historyState: recorded}`.
            `historyState: pending_reconciliation` means the active profile IS
            committed but one of its node-local post-commit effects (history
            revision, config version keyed by operationId, cluster publication,
            success audit, terminal record) is not yet durable and will be
            completed — never duplicated — by reconciliation (next GET, operation
            or restart); it never means "not published".
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: Unknown rollback target / no history. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '409':
          description: >-
            Structured, keyed by `code`: `stale` (2F-A fence, see PACFenceRefusal),
            `confirm_required` (candidate-bound DIRECT challenge: `challenge`,
            `confirmValue`, `binding`), `challenge_stale` (the reviewed candidate
            changed: `changed` names the fields, a fresh challenge is included),
            `operation_pending` (a previous intent could not be persisted after
            reconciliation), `not_ambiguous` / `active_absent` (repair),
            `history_reset` (the node-local history file was corrupt and
            quarantined; the ACTIVE profile is untouched but publish/rollback are
            refused until an admin acknowledges the loss with
            `acknowledge_history_reset` bound to `current.revision` +
            `current.activeSpecDigest`), `history_reset_stale` (the acknowledgement
            named a different active revision/digest; `current` + `changed`),
            `not_history_reset` (nothing to acknowledge),
            `history_incarnation_mismatch` (2F-E correction round 2: the request
            named a history epoch other than the current one —
            `current.historyIncarnation`; nothing is committed or replayed).
            `stale` is also the refusal of a mismatched `expectedActiveSpecDigest`
            (2F-E correction round 3; `current.expectedActiveSpecDigest` +
            `current.revision`). `concurrent_write` (2F-E correction round 4):
            the active profile store was changed by a writer outside the
            appliance's PAC writer transaction boundary between the review of
            the operation and its commit (detected atomically by a store-
            generation compare-and-swap); nothing was written, the refusal is
            the decided outcome of the operationId (a re-send replays it) —
            review the current state and dispatch a NEW operation.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '428': { $ref: '#/components/responses/PACPreconditionRequired' }
        '500':
          description: >-
            `outcome_unknown` (the active write could not be proven; the intent is
            retained as pending) or `active_write_failed` (proven failure, aborted).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '503':
          description: >-
            `lifecycle_ambiguous` — a previous operation's outcome could not be
            classified from the authoritative active state; publish/rollback are
            refused until an admin repair with resolution `accept_active`.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
