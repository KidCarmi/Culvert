            application/json:
              schema: { $ref: '#/components/schemas/YARARuleItem' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409': { description: 'Stale-writer fence conflict ({error, currentRevision, yourRevision}) — the surface changed since the asserted revision; nothing mutated.' }
        '404':
          description: Not found. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
    delete:
      operationId: deleteYARARuleItem
      tags: [security]
      summary: Delete YARA rule
      description: Deletes a YARA rule file. Destructive — joins the same optimistic-concurrency contract as the writes (2E-A-2).
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: yara.rule.delete
      parameters:
        - name: ifRevision
          in: query
          required: false
          schema: { type: string }
          description: "OPTIONAL stale-delete fence (2E-A-2): the content-derived revision of the rule source the caller reviewed (from the item GET). A mismatch is the structured 409 with no deletion; absent keeps the legacy replacement semantics. The v2 client always asserts it."
      responses:
        '200':
          description: Delete YARA rule ({deleted, yara_rules, cache_cleared}).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: The rule file does not exist. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
        '409': { description: 'Stale-delete fence conflict ({error, currentRevision, yourRevision}) — the rule changed since the asserted revision; nothing deleted.' }
        '500':
          description: The rule exists but removal failed (I/O fault). Body is plain text.
          content:
            text/plain: { schema: { type: string } }

  /api/cdr/config:
    get:
      operationId: getCDRConfig
      tags: [cluster]
      summary: CDR config
      description: Returns CDR (content-disarm) configuration.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: CDR config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CDRConfig' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
    put:
      operationId: setCDRConfig
      tags: [cluster]
      summary: Toggle CDR runtime enable
      description: >-
        Toggle the CDR runtime-enable sentinel. This is the ONLY
        runtime-mutable CDR configuration field — every other setting
        (fail_mode, default_profile, timeouts, sizes) comes from YAML/CLI
        and requires a restart. The toggle is an absolute-state boolean
        (idempotent; last writer wins by design), persisted to the
        /data/cdr_enabled sentinel so it survives restarts, and it
        drives the client pool (enable dials enrolled instances,
        disable drains them). The body must carry an explicit decision:
        `{}`, `null`, a missing or non-boolean `enabled`, unknown fields,
        trailing JSON or an empty body are refused with 400 and mutate
        nothing (no runtime flag, no sentinel, no audit event).
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: cdr.config.toggle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean, description: "Desired absolute runtime-enable state." }
      responses:
        '200':
          description: Toggle applied and persisted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [enabled, clientActive]
                properties:
                  enabled: { type: boolean }
                  clientActive: { type: boolean }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '500':
          description: Sentinel persist failed — neither the durable nor the runtime state changed. Body is plain text.
          content:
            text/plain: { schema: { type: string } }

