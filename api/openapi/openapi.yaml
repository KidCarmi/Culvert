      x-culvert-audit-event: saasfeed.refresh
      responses:
        '200':
          description: Refresh completed (see status for the outcome).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaaSFeedRefreshResult' }
        '202':
          description: A refresh is already in flight (status=in_progress).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaaSFeedRefreshResult' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
