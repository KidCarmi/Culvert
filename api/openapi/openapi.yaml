  /api/upstream/entries:
    post:
      operationId: createUpstreamEntry
      tags: [cluster]
      summary: Create a managed upstream entry
      description: >-
        Creates one managed entry (2F-C): server-assigned ULID, canonical
        authority, no credential (set it afterwards through the credential
        endpoint). Fenced on the document `revision` (428/409); 409
        duplicate_authority when the effective pool (YAML + managed) would
        carry the authority twice. Persisted before the 201 is written.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: upstream.entry.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpstreamEntrySpec' }
      responses:
        '201':
          description: Created (the full read model plus `entry`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamConfig' }
        '400':
          description: invalid_json / invalid_entry / credential_state_not_accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409':
          description: stale / duplicate_authority (`count`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '428': { $ref: '#/components/responses/PACPreconditionRequired' }
        '500':
          description: persist_failed — nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
  /api/upstream/entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateUpstreamEntry
      tags: [cluster]
      summary: Update a managed upstream entry
      description: >-
        Updates scheme/host/port/username (2F-C). Fenced on the ENTRY
        `revision` (428/409/404 vanished). 409 credential_bound when the
        canonical authority would change while a credential exists (clear the
        credential first — there is no combined rebind); 409 yaml_owned for a
        config.yaml entry; 409 duplicate_authority. Persisted before the 200.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: upstream.entry.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpstreamEntrySpec' }
      responses:
        '200':
          description: Updated (the full read model plus `entry`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamConfig' }
        '400':
          description: invalid_json / invalid_entry / credential_state_not_accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: vanished — the entry no longer exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '409':
          description: stale / credential_bound / yaml_owned / duplicate_authority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '428': { $ref: '#/components/responses/PACPreconditionRequired' }
        '500':
          description: persist_failed — nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
    delete:
      operationId: deleteUpstreamEntry
      tags: [cluster]
      summary: Delete a managed upstream entry
      description: >-
        Deletes a credential-free managed entry (2F-C). `?revision=` must echo
        the ENTRY revision (428/409/404). 409 credential_present while the
        entry holds a configured, unusable or mismatched credential (clear it
        first, T3); 409 yaml_owned for a config.yaml entry. Persisted before
        the 200.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: upstream.entry.delete
      parameters:
        - name: revision
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Deleted (the full read model).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamConfig' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: vanished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '409':
          description: stale / credential_present / yaml_owned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '428': { $ref: '#/components/responses/PACPreconditionRequired' }
        '500':
          description: persist_failed — nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
  /api/upstream/entries/{id}/credential:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: setUpstreamCredential
      tags: [cluster]
      summary: Replace or clear an entry's credential (write-only)
      description: >-
        `replace` (T2) seals the password under the node-local
        `.upstream_cred_key` bound to the entry id + authority hash — the
        password is never returned, logged, audited or persisted in cleartext;
        `clear` (T3) requires `confirm` equal to the entry id. Fenced on the
        ENTRY revision (428/409/404); 409 key_unusable when no key can be used
        (never minted while ciphertext exists or after a failed read); 409
        yaml_owned. Persisted before the 200.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: upstream.credential.replace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpstreamCredentialRequest' }
      responses:
        '200':
          description: Applied (the full read model plus `entry`; `credentialState` reflects the new state).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamConfig' }
        '400':
          description: invalid_json / invalid_action / invalid_password (missing or over 1024 bytes) / credential_state_not_accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404':
          description: vanished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '409':
          description: stale / key_unusable / confirm_required (`current.confirmValue`) / no_credential / yaml_owned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '428': { $ref: '#/components/responses/PACPreconditionRequired' }
        '500':
          description: persist_failed / seal_failed — nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }

