      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Upstream proxy pool.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamConfig' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
    post:
      operationId: setUpstream
      tags: [cluster]
      summary: Set upstream proxies (credential-free v1 adapter)
      description: >-
        Replaces the MANAGED entries from a credential-free URL list (2F-C v1
        adapter). Refused 400 on any userinfo or invalid entry (nothing dropped),
        409 credentialed_entries_present while any managed entry holds a
        credential, 428/409 on the document revision fence; YAML-owned
        authorities are skipped. Persisted before the 200 is written.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: upstream.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpstreamUpdate' }
      responses:
        '200':
          description: Updated (the full read model plus `ok` and `yamlOwned`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamConfig' }
        '400':
          description: Invalid JSON, invalid entry, or userinfo in a URL (`code` invalid_json / invalid_entry / userinfo_not_allowed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409':
          description: stale / credentialed_entries_present / duplicate_authority (`count`). Nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamRefusal' }
        '428': { $ref: '#/components/responses/PACPreconditionRequired' }
        '500':
          description: persist_failed — the change could not be made durable; nothing was changed.
          content:
            application/json:
