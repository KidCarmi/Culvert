  /api/decryption/redaction:
    get:
      operationId: getDecryptionRedaction
      tags: [policy]
      summary: Destination-privacy posture
      description: "Returns the node-local destination-privacy posture (traffic-log destination pseudonymization) as ONE coherent snapshot: posture, non-secret pseudonym generation (key_id), the durable rotation sequence + bounded non-secret rotation receipts (operation-identity truth for resolving a lost rotation response), and the revision that fingerprints exactly the returned state."
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Decryption redaction hosts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecryptionRedaction' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
    put:
      operationId: setDecryptionRedaction
      tags: [policy]
      summary: Set destination privacy / rotate pseudonym key
      description: "EXACTLY ONE ACTION per request: sets the destination-privacy posture (redact_hosts present) OR rotates the node-local pseudonym key (rotate_key:true + operation_id + ifRevision) — never both (persist-before-apply: the durable write, including the rotation receipt, lands first; a persist failure leaves the running posture untouched). This governs destination information in logs/observability — NOT whether traffic is decrypted, and the pseudonym key is NOT the TLS inspection Root CA."
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: decryption.redaction.set
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRedaction' }
      responses:
        '200':
          description: "Updated ({redact_hosts, key_rotated, key_id, rotation_seq, revision} plus, for a rotation, {operation_id, already_applied} — the state THIS PUT installed; a rotation and its receipt are durable before this response. An idempotent replay of an already-landed operation_id returns already_applied:true with that operation's receipt facts and mutates nothing)."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409': { description: 'Stale-writer fence conflict ({error, currentRevision, yourRevision}) — the posture or pseudonym generation changed since the asserted revision; nothing mutated and no key was minted.' }
        '500':
          description: Key provisioning/rotation failed, or the durable write failed — the running posture and key are unchanged. Body is plain text.
          content:
            text/plain: { schema: { type: string } }

