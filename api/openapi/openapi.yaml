      tags: [policy]
      summary: Advisory recommendations
      description: Recommendation listing (?id= for one) with evidence, confidence reasons/limits, coverage facts, and SERVER-computed staleness reasons. Advisory only — nothing here can alter enforcement policy.
      security: [ { sessionCookie: [] }, { basicAuth: [] } ]
