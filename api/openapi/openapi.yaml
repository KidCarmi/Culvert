        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409': { description: 'Stale-writer fence conflict ({error, currentRevision, yourRevision}) — the surface changed since the asserted revision; nothing mutated.' }
