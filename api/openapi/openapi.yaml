    post:
      operationId: createConfigVersion
      tags: [config]
      summary: Create config snapshot
      description: Create config snapshot.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: config.version.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConfigVersionBody' }
      responses:
        '200':
          description: |
            Rollback applied, and every store it wrote reached disk
            (`status:rolled_back`, `stores_persisted:true`).
            `runtime_only_surfaces` lists the parts of the snapshot that are
            restored to the RUNNING configuration but are not persisted by this
            path — they are re-read from admin settings on restart and will
            revert (CHAOS-46).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '500':
          description: |
            Either the stored version could not be read, or (CHAOS-27) the
            rollback was applied to the RUNNING configuration but one or more
            stores could not be written to disk — `status:rolled_back_not_durable`
            with `applied:true`, `stores_persisted:false`, and `persist_errors`
            naming the files. The running config has already changed, so the
            recovery is to fix the data directory and re-save, not to retry the
            rollback.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/plain: { schema: { type: string } }
        '503':
          description: |
            `dry_run` only — rewrite MANAGEMENT identity is not durable on this
            node, and the preview diff would compare against the live rewrite
            rules whose StableIDs are known-ephemeral. Answers the SAME
            structured `{error, degraded:"rewrite-identity", reason}` as
            GET /api/rewrite/state instead of exposing ephemeral identities in
            the identity-aware diff. A real (non-dry-run) rollback of a stored
            version remains available; traffic rewrite enforcement continues.

