  /api/upstream:
    get:
      operationId: getUpstream
      tags: [cluster]
      summary: Upstream proxy pool
      description: Returns the Upstream v2 read model (credential-free entries, effective mode, coverage, document revision, node-local migration/key/degraded state).
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
