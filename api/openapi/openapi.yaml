        '403': { $ref: '#/components/responses/PlainForbidden' }
        '503':
          description: Rewrite MANAGEMENT identity is not durable on this node (a refused corrupt settings-owned rewrite slice, or a failed stable-identity migration/ledger write) — structured `{error, degraded:"rewrite-identity", reason}`. Ephemeral StableIDs are never presented as durable management identities; traffic rewrite enforcement continues. Recovery is fixing the settings persistence issue and restarting.

