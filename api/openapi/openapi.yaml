        confirm: { type: boolean, description: "Must be true — explicit operator consent to egress." }
    TACTrustKey:
      type: object
      description: One TAC recipient trust key (public material only).
      additionalProperties: false
      required: [key_id, alg, public_key, fingerprint, source, active]
      properties:
        key_id: { type: string }
        alg: { type: string, description: "Key algorithm (x25519)." }
        public_key: { type: string, description: "Public key material (base64); never a private key." }
        fingerprint: { type: string }
        source: { type: string, description: "Where the key was resolved from (\"baked\" default root, or \"configured\" via CULVERT_TAC_TRUST_KEYS)." }
        active: { type: boolean }
    TACTrustStatus:
      type: object
      description: >-
        Resolved TAC trust set. On a malformed CULVERT_TAC_TRUST_KEYS the handler
        returns configured=false with a sanitized error and an empty key list.
      additionalProperties: false
      required: [configured, keys]
      properties:
        configured: { type: boolean, description: "True when at least one key is present and one is active." }
        active_key: { type: string, description: "Key id of the active recipient (omitted on error)." }
        keys: { type: array, items: { $ref: '#/components/schemas/TACTrustKey' }, nullable: true }
        max: { type: integer, description: "Maximum trust keys accepted." }
        alg: { type: string, description: "Expected key algorithm." }
        error: { type: string, description: "Sanitized configuration error (present only on misconfiguration)." }
    SupportTelemetryPreview:
      type: object
      description: >-
        Live preview of the exact support-telemetry sample that would be
        sealed and sent right now, IF telemetry were enabled — it is not; no
        consent switch, sender, or egress exists in this build. schema_version
        and registry_hash identify the governed metric schema (any eligible-
        metric or bucket-definition change bumps registry_hash); metrics are
        the current values of exactly the telemetry-eligible entries in the
        scoped support-metric registry. Does not imply future previews will
        be byte-for-byte identical — only the schema/eligible-set identity is
        stable.
      additionalProperties: false
      required: [schema_version, registry_hash, generated_at, metrics]
      properties:
        schema_version: { type: integer, description: "Governed telemetry wire-schema version." }
        registry_hash: { type: string, description: "Lowercase-hex SHA-256 over the governed eligibility schema (metric id/type/privacy-class/eligibility/bucket-definition)." }
        generated_at: { type: string, description: "RFC3339 UTC timestamp this sample was built." }
        metrics: { type: object, description: "Telemetry-eligible metric id -> current scalar value.", additionalProperties: { type: number } }
