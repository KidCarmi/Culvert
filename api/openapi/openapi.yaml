openapi: 3.0.4
info:
  title: Culvert Admin API
  version: 1.2.0
  x-culvert-api-contract-version: 1.2.0
  description: |
    Machine-readable contract for the Culvert admin/control-plane REST API served
    on the UI port (`-ui-port`, default 9090).

    **Scope.** This document describes the HTTP/JSON admin API only. Two other
    Culvert network surfaces are intentionally NOT modelled here because they are
    not RESTful and OpenAPI cannot describe them faithfully:

      * the forward-proxy data path (HTTP CONNECT / plain-HTTP forward / SOCKS5)
        served on `-port` — a proxy protocol, not a resource API;
      * the Control-Plane ↔ Data-Plane gRPC stream — described by protobuf.

    **Accuracy over aspiration.** Every operation, schema, status code, and
    content type below reflects the *actual* runtime behavior of the handler, not
    a target design. Notably, error responses are currently emitted by
    `http.Error` as `text/plain`; that is documented as-is here. The proposed
    structured JSON error envelope is a *future* target recorded in
    docs/api/API-STYLE-GUIDE.md and the consistency risk register — it is NOT yet
    the runtime behavior and therefore is NOT asserted by this contract.

    **Air-gap.** This appliance and its documentation are designed for on-prem,
    internet-isolated deployment. No operation here depends on an external
    service, and the rendered documentation vendors all assets locally.

    This baseline (contract version 1.0.0) documents a representative,
    security-spanning subset of operations. The remaining registered routes are
    explicitly classified — and time-boxed for documentation — in
    api/route-classification.yaml, which the route-coverage CI gate enforces
    against the live router.
  license:
    name: See repository LICENSE
    url: https://github.com/KidCarmi/Culvert

servers:
  - url: /
    description: |
      The appliance serves this API relative to the UI host:port. Paths are
      absolute from the server root (e.g. https://appliance.example:9090/api/stats).

tags:
  - name: health
    description: Unauthenticated liveness/health probes for load balancers and monitors.
  - name: setup
    description: First-boot bootstrap of the initial administrator credential.
  - name: auth
    description: Admin session authentication and RBAC user management.
  - name: dashboard
    description: Read-only operational counters and telemetry.
  - name: governance
    description: Control-plane RBAC governance surface (admin-only, read-only).
  - name: security
    description: Certificate-authority and TLS-inspection security controls.
  - name: config
    description: Configuration export/import (backup & restore).
  - name: policy
    description: Policy engine, blocklist, and TLS-inspection policy reads.
  - name: pac
    description: Proxy auto-config (PAC) settings.
  - name: settings
    description: Appliance settings — logging, session, connection limits.
  - name: cluster
    description: Control-plane / data-plane cluster status and upstream pool.
  - name: support
    description: Supportability — status, bundles, diagnostics.

# ── Security schemes ──────────────────────────────────────────────────────────
# The runtime accepts EITHER a signed session cookie (browser flow) OR HTTP Basic
# credentials (CLI/API callers) on protected routes. Public routes accept neither.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ps_ui_session
      description: |
        HMAC-SHA256-signed admin session cookie issued by POST /api/auth/login.
        Carries the authenticated subject and RBAC role. Dynamic Secure flag
        based on TLS state; default TTL 8h.
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic credentials for CLI/API callers, verified against the local
        user store (bcrypt) or a configured external IdP.

  # ── Reusable responses (ACTUAL behavior: text/plain via http.Error) ──────────
  responses:
    PlainBadRequest:
      description: Malformed request (invalid JSON, missing/invalid parameter). Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "invalid JSON"
    PlainUnauthorized:
      description: Missing or invalid credentials. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "Invalid credentials"
    PlainForbidden:
      description: Authenticated but insufficient RBAC role. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "Forbidden: insufficient role"
    PACPreconditionRequired:
      description: >-
        2F-A fence — the mutation carried no precondition token (or a zero one).
        Nothing was changed. `current` carries the authoritative token to echo
        (`revision`, `etag`, `collectionEtag` or `draftRevision`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PACFenceRefusal' }
    PACStale:
      description: >-
        2F-A fence — the echoed precondition token is stale: the object (or the
        collection) changed since it was loaded. Nothing was changed, no audit
        event was recorded and no config version was created. `current` carries
        the authoritative token; reload and retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PACFenceRefusal' }
    PlainConflict:
      description: Request conflicts with the node's role (e.g. a control-plane-managed setting cannot be edited locally on a data-plane node). Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "saas feed config is control-plane managed on this data-plane node"
    PlainNotFound:
      description: Resource not found within the caller's authorized scope (uniform across tenants). Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "admin_not_found"
    PlainMethodNotAllowed:
      description: HTTP method not supported by this route. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "method not allowed"
    PlainTooManyRequests:
      description: Rate-limited / account lockout in effect. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "too many attempts, locked for 300s"

  schemas:
    # ── Health ────────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      description: |
        Node health. Additional fields (term, write_authority, lease_*,
        request-log health) are present depending on HA mode; the contract pins
        only the always-present discriminator.
      required: [status]
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [ok, standby]
        role:
          type: string
          enum: [standalone, leader, standby]
        leader: { type: boolean }
        write_authority: { type: boolean }
        version:
          type: string
          description: |
            Build-time release identity (linker-injected `main.version`, e.g.
            `v1.0.203`; `dev` for local/untagged builds). Signed release binaries
            self-report their exact tag here so runtime identity is verifiable.

    # ── Setup ───────────────────────────────────────────────────────────────────
    SetupStatus:
      type: object
      required: [needsSetup, ui_tls_fallback]
      additionalProperties: false
      properties:
        needsSetup:
          type: boolean
          description: True until an initial admin credential (or explicit open mode) is configured.
        ui_tls_fallback: { type: boolean, description: "True when self-signed TLS setup failed at startup and the admin UI fell back to plain HTTP. Exposed pre-authentication so the setup wizard can warn before the initial admin password is submitted. The FLAG only - this route is unauthenticated, so the underlying self-sign error (which can quote an operator-configured SAN or hostname) is NOT returned here; it is on the viewer-gated GET /api/settings/network and in the server log." }
    SetupCompleteRequest:
      type: object
      description: Provide credentials, OR set unauth=true for explicit open mode.
      additionalProperties: false
      properties:
        user: { type: string }
        pass: { type: string, format: password, minLength: 8 }
        unauth: { type: boolean }
    OkResponse:
      type: object
      required: [ok]
      additionalProperties: true
      properties:
        ok: { type: boolean }

    # ── Auth ────────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [user, pass]
      additionalProperties: false
      properties:
        user: { type: string }
        pass: { type: string, format: password }
        totp:
          type: string
          description: 6-digit TOTP or a backup code; omitted on the first step.
    LoginResult:
      type: object
      description: |
        On success `{ok,user,role}`. When TOTP is enrolled but not yet supplied,
        the handler instead returns `{totp_required:true}` with HTTP 200 and no
        session — the client must resubmit with `totp`.
      additionalProperties: true
      properties:
        ok: { type: boolean }
        user: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        totp_required: { type: boolean }
    AuthStatus:
      type: object
      required: [loggedIn]
      additionalProperties: true
      properties:
        loggedIn: { type: boolean }
        user: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        ui_tls_fallback: { type: boolean, description: "True when self-signed TLS setup failed at startup and the admin UI fell back to plain HTTP. Exposed pre-authentication so the login overlay can warn before credentials are submitted. The FLAG only - this route is unauthenticated, so the underlying self-sign error (which can quote an operator-configured SAN or hostname) is NOT returned here; it is on the viewer-gated GET /api/settings/network and in the server log." }
    Role:
      type: string
      enum: [admin, operator, viewer]
    User:
      type: object
      additionalProperties: true
      properties:
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    UserList:
      type: object
      required: [users]
      additionalProperties: false
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/User' }
    CreateUserRequest:
      type: object
      required: [username, password, role]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, format: password, minLength: 8 }
        role: { $ref: '#/components/schemas/Role' }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }

    # ── Dashboard ────────────────────────────────────────────────────────────────
    StatsSummary:
      type: object
      description: Aggregate proxy counters plus persistence/HA health flags.
      required: [total, allowed, blocked]
      additionalProperties: true
      properties:
        total: { type: integer, format: int64 }
        allowed: { type: integer, format: int64 }
        blocked: { type: integer, format: int64 }
        authFail: { type: integer, format: int64 }
        blocklistSz: { type: integer }
        uptime: { type: string }
        proxyPort: { type: integer }
        uiPort: { type: integer }
        authEnabled: { type: boolean }
        c2Mode: { type: string, enum: [enforce, shadow] }

    # ── CA / security ─────────────────────────────────────────────────────────────
    CAStatus:
      type: object
      description: Internal CA state (opaque superset; fields depend on rotation/dual-CA mode).
      additionalProperties: true

    # ── Decryption exclusions ─────────────────────────────────────────────────────
    DecryptionExclusions:
      type: object
      description: Adaptive decryption-exclusion cache listing plus stats and blast-radius.
      additionalProperties: true

    # ── Config backup ────────────────────────────────────────────────────────────
    ConfigBackup:
      type: object
      description: |
        Opaque configuration backup envelope (`version` 2 since 2F-D; imports
        accept 1 and 2). Upstream parent proxies travel ONLY as the versioned
        `upstream_proxies_v2` representation — `{entries: [{id, scheme, host,
        port, username, credentialState}]}` — beside the constant marker
        `upstream_credentials: "omitted"`: no password, sealed record,
        ciphertext, key id, redaction marker or legacy URL list is ever
        exported (the legacy `upstreamProxies` key is accepted on import only).
        Other sections may still embed sensitive material (session HMAC, IdP
        secrets) — treat as a secret at rest and in transit.
      additionalProperties: true
      x-culvert-sensitive: true
      x-culvert-open-justification: >-
        The backup envelope is intentionally an opaque superset of every config
        surface; its exact members vary by feature set and version, so it cannot
        be a closed schema. Sensitivity is enforced operationally (0600 at rest,
        admin-only + audited transfer), not by the contract shape.

    GovernanceControlPlane:
      type: object
      description: C3 governance surface — route inventory, C2 mode, counters, derived health.
      additionalProperties: true

    # ── Slice 3: read-model schemas ───────────────────────────────────────────────
    PolicyRule:
      type: object
      description: A single Culvert policy rule (Stage-2 access rule). All fields are optional on create/update; read-only fields (hitCount/lastHit/created/modified) are echoed on read.
      additionalProperties: false
      properties:
        priority: { type: integer }
        name: { type: string }
        sourceIP: { type: string }
        sourceIdentity: { type: string }
        sourceGroup: { type: string }
        authSource: { type: string }
        destFQDN: { type: string }
        destCategory: { type: string }
        destCategoryGroup: { type: string }
        destCategoryGroupId: { type: string }
        destCountry: { type: array, items: { type: string }, nullable: true }
        schedule: { $ref: '#/components/schemas/PolicySchedule' }
        sslAction: { type: string }
        fileFiltering: { type: boolean }
        fileProfile: { type: string }
        fileProfileId: { type: string }
        logFullUri: { type: boolean }
        logTraffic: { type: boolean, nullable: true }
        tlsSkipVerify: { type: boolean }
        stripAlpn: { type: boolean, nullable: true }
        decryptionProfile: { type: string }
        decryptionProfileId: { type: string }
        action: { type: string }
        redirectURL: { type: string }
        enabled: { type: boolean, nullable: true }
        id: { type: string }
        ruleType: { type: string }
        subjectMatch: { type: object, additionalProperties: true, nullable: true }
        auth: { type: object, additionalProperties: true, nullable: true }
        hitCount: { type: integer, format: int64 }
        lastHit: { type: string }
        createdAt: { type: string }
        modifiedAt: { type: string }
        modifiedBy: { type: string }
        comment: { type: string }
    PolicySchedule:
      type: object
      additionalProperties: false
      properties:
        days: { type: array, items: { type: string }, nullable: true }
        timeStart: { type: string }
        timeEnd: { type: string }
        timezone: { type: string }
    PolicyList:
      type: object
      required: [rules, count, version, updatedAt, draft]
      additionalProperties: false
      properties:
        rules: { type: array, items: { $ref: '#/components/schemas/PolicyRule' } }
        count: { type: integer }
        version: { type: integer, format: int64 }
        updatedAt: { type: string }
        draft: { type: boolean }
    AuthPolicyList:
      type: object
      required: [rules, count, defaultAction, note, version, updatedAt]
      additionalProperties: false
      properties:
        rules: { type: array, items: { type: object, additionalProperties: true } }
        count: { type: integer }
        defaultAction: { type: string, enum: [allow, deny] }
        note: { type: string }
        version:
          type: integer
          format: int64
          description: RUNNING PolicyStore generation (never a draft candidate's) — echo via ?ifVersion= on mutations for atomic optimistic concurrency (2C.0a).
        updatedAt: { type: string, description: RFC3339 timestamp of the last running-rulebase mutation. }
    DefaultActionStatus:
      type: object
      required: [defaultAction]
      additionalProperties: false
      properties:
        defaultAction: { type: string, enum: [allow, deny] }
    BlocklistModeStatus:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [block, allow] }
    SecurityConfig:
      type: object
      required: [ipFilterMode, rateLimitRPM, rateLimitOn]
      additionalProperties: false
      properties:
        ipFilterMode: { type: string }
        ipList: { type: array, items: { type: string }, nullable: true }
        rateLimitRPM: { type: integer }
        rateLimitOn: { type: boolean }
        rateLimitExempt: { type: array, items: { type: string }, nullable: true }
    SSLBypassList:
      type: object
      required: [patterns, count]
      additionalProperties: false
      properties:
        patterns: { type: array, items: { type: string }, nullable: true }
        count: { type: integer }
    OCSPStatus:
      type: object
      required: [enabled, cacheLen, failClosedTotal, revokedTotal, lastFailClosedAt]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        cacheLen: { type: integer }
        failClosedTotal: { type: integer, format: int64 }
        revokedTotal: { type: integer, format: int64 }
        lastFailClosedAt: { type: string }
    SessionTimeout:
      type: object
      required: [hours]
      additionalProperties: false
      properties:
        hours: { type: integer }
    PACChallengeBinding:
      type: object
      description: >-
        2F-B — everything a typed DIRECT confirmation authorizes. The server
        recomputes it on retry under the publish lock; any changed field is a
        409 `challenge_stale` naming the fields.
      required: [profileId, action, candidateSpecDigest, expectedActiveRevision, poolDigest, artifactDigest, newDirectPaths]
      additionalProperties: false
      properties:
        profileId: { type: string }
        action: { type: string, enum: [create, update, publish, rollback] }
        targetN: { type: integer, format: int64 }
        candidateSpecDigest: { type: string }
        expectedActiveRevision: { type: integer, format: int64 }
        expectedActiveSpecDigest: { type: string }
        poolDigest: { type: string }
        artifactDigest: { type: string }
        newDirectPaths: { type: array, items: { type: string } }
    PACConfirm:
      type: object
      description: >-
        2F-B — the client's echo of a `confirm_required` challenge: the opaque
        versioned challenge token, the server-selected typed `confirmValue`, and
        the reviewed binding. The retired `confirmDirect=<profile id>` form never
        authorizes anything.
      required: [challenge, value, binding]
      additionalProperties: false
      properties:
        challenge: { type: string }
        value: { type: string }
        binding: { $ref: '#/components/schemas/PACChallengeBinding' }
    PACFenceRefusal:
      type: object
      description: Structured 2F-A precondition refusal (428 precondition_required / 409 stale).
      required: [error, code, current]
      additionalProperties: false
      properties:
        error: { type: string }
        code: { type: string, enum: [precondition_required, stale] }
        current:
          type: object
          description: The authoritative token to echo on retry (exactly one key).
          additionalProperties: false
          properties:
            revision: { type: integer, format: int64 }
            draftRevision: { type: integer, format: int64 }
            etag: { type: string }
            collectionEtag: { type: string }
    PACOperationLookup:
      type: object
      description: >-
        2F-E correction — the answer to `GET …/lifecycle?operationId=`: ONE
        operation looked up in the FULL retained decided ring (operationsCap)
        and in the revision history, never only the 20 listed. `found:false`
        means the appliance holds no record of that operationId; it is proof of
        non-commit only when the retained ring is complete and the reviewed
        active revision moved.
      required: [operationId, found, revisionN]
      additionalProperties: false
      properties:
        operationId: { type: string, format: uuid }
        found: { type: boolean }
        state:
          type: string
          enum: [recorded, aborted]
          description: the decided state (present when found)
        status: { type: integer, description: the HTTP status the decision produced (present when found) }
        ts: { type: string, description: "decision time (RFC 3339; present when decided)" }
        revisionN:
          type: integer
          format: int64
          description: the history revision the operation produced; 0 when none (aborted or unknown)
        specDigest:
          type: string
          description: "2F-E correction round 2 — the ProfileSpecDigest the commit put into the active store (present when a revision records the operation); compare with activeSpecDigest for current-active truth"
        storeRevision:
          type: integer
          format: int64
          description: "2F-E correction round 2 — the authoritative active-store revision the commit produced (present when a revision records the operation; 0 on revisions recorded before the field existed); compare with activeRevision for current-active truth — never activeN alone, a direct profile PUT moves the store without moving activeN"
    PACLifecycle:
      type: object
      description: >-
        The node-local lifecycle of one PAC profile (see GET
        /api/pac/profiles/{name}/lifecycle). Scope is node-local — never
        cluster-synced, never on config-version rollback.
      required:
        - profileId
        - activeExists
        - active
        - draft
        - draftDirty
        - activeN
        - revisions
        - draftRevision
        - activeRevision
        - collectionEtag
        - state
        - historyState
        - operations
        - activeSpecDigest
        - draftSpecDigest
        - operationsRetained
        - operationsCap
        - historyIncarnation
        - poolChangedSince
        - scope
      additionalProperties: true
      properties:
        profileId: { type: string }
        activeExists: { type: boolean, description: false ⇒ `active` is a zero profile }
        active: { type: object, additionalProperties: true, description: the active spec (a zero Profile when activeExists is false) }
        draft: { type: object, additionalProperties: true, description: the saved draft (a zero Profile until one is saved — draftRevision 0) }
        draftDirty: { type: boolean }
        activeN: { type: integer, format: int64, description: the currently-serving history revision number (0 = none published) }
        revisions:
          type: array
          description: "the immutable publish history, oldest first (bounded to the last 50); each carries the operationId that produced it and (2F-E correction round 2) `storeRevision`, the authoritative active-store revision the commit produced (0 on revisions recorded before the field existed)"
          items: { type: object, additionalProperties: true }
        draftDiff: { type: object, additionalProperties: true, nullable: true, description: the reviewed difference draft vs active (null when not dirty) }
        draftRevision: { type: integer, format: int64, description: 2F-A fence for save_draft (0 = no draft yet) }
        activeRevision: { type: integer, format: int64, description: 2F-A fence for publish/rollback }
        collectionEtag: { type: string, description: 2F-A fence when no active profile exists }
        state: { type: string, enum: [idle, pending, ambiguous] }
        historyState: { type: string, enum: [recorded, pending_reconciliation, ambiguous, history_reset] }
        pendingOp: { type: object, additionalProperties: true, nullable: true }
        ambiguous: { type: object, additionalProperties: true, nullable: true }
        operations:
          type: array
          description: the 20 most recent decided operations (recorded bodies omitted — replayed by operationId); NOT the whole retained ring
          items: { type: object, additionalProperties: true }
        activeSpecDigest: { type: string, description: "ProfileSpecDigest of the active spec (empty when none)" }
        draftSpecDigest: { type: string, description: "2F-E correction — ProfileSpecDigest of the saved draft (empty when none); the identity a publish binds its recovery marker to" }
        operationsRetained: { type: integer, description: 2F-E correction — decided operations the appliance currently retains for this profile }
        operationsCap: { type: integer, description: "2F-E correction — the retained ring's cap (64); once reached older decisions are evicted and absence proves nothing" }
        historyIncarnation:
          type: string
          description: >-
            2F-E correction round 2 — the durable identity (UUID) of this
            profile's node-local history EPOCH. Stable across draft saves,
            publishes and restarts; ROTATES when the history is discarded: a
            profile delete (+ recreate under the same id, whose revisions
            restart at 1) or a history reset. A client resolving a lost
            response compares it with the epoch it dispatched in: a different
            epoch means the operation's decision record may be gone, so
            absence proves nothing and a re-send would run the operation
            again. Empty when the history is missing altogether (neither an
            active profile nor a record exists). 2F-E correction round 3 —
            the identity is consulted against the AUTHORITATIVE active
            identity on every read and operation: an observed REWIND of the
            active revision, or a DIFFERENT spec at the SAME revision (a
            replace-mode import, a config rollback, a CP→DP snapshot — any
            writer), ROTATES it durably while every piece of evidence
            (revisions, decided operations, the draft) is kept; a profile
            delete records its transition durably BEFORE the active profile
            is removed, so a crash or a failed record removal is finished
            (or the epoch rotated) at the next access/boot and a recreated
            profile never exposes the old epoch; and the identity is ALSO
            empty when it could not be made durable (a failed write at
            migration or mint) — an unpersisted identity is never
            advertised, publish/rollback naming any epoch are refused
            (`409 history_incarnation_mismatch`) and the admin frontend
            withholds dispatch until a durable identity exists.
        operation: { $ref: '#/components/schemas/PACOperationLookup' }
        poolChangedSince: { type: boolean }
        scope: { type: string, enum: [node-local] }
        historyReset: { type: object, additionalProperties: true, description: the store-level reset record when the node-local history file was quarantined }
        previousRevision: { type: integer, format: int64 }
    PACConfig:
      type: object
      required: [proxyHost, proxyPort]
      additionalProperties: false
      properties:
        proxyHost: { type: string }
        proxyPort: { type: integer }
        exclusions: { type: array, items: { type: string }, nullable: true }
        revision:
          type: integer
          format: int64
          description: >-
            Optimistic-concurrency token (2F-A). Reads always carry a non-zero
            value; a POST must echo the value it loaded (428 when absent, 409
            `stale` when it changed). Advances by one per committed save.
    ConnLimitStatus:
      type: object
      required: [enabled, maxPerIP, activeIPs, rejectedTotal]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        maxPerIP: { type: integer }
        activeIPs: { type: integer }
        rejectedTotal: { type: integer, format: int64, description: "Cumulative connections refused for exceeding the per-IP cap (process lifetime; never reset)." }
    LoggerConfig:
      type: object
      required: [logFile, logMaxMB, logFormat]
      additionalProperties: false
      properties:
        logFile: { type: string }
        logMaxMB: { type: integer }
        logFormat: { type: string }
    DecryptionHealth:
      type: object
      description: TLS-inspection health — sessions, failures, coverage, trend, and the adaptive auto-exclude cache.
      required: [sessions, failures, coverage, autoexclude]
      additionalProperties: true
      properties:
        sessions: { type: object, additionalProperties: true }
        failures: { type: object, additionalProperties: true }
