  /api/idp/test:
    post:
      operationId: testIdP
      tags: [auth]
      summary: Test IdP directory connection
      description: |
        Run the staged, candidate-based directory test for an LDAP/Active
        Directory IdP profile BEFORE persisting it: server reachability,
        transport security (LDAPS/StartTLS), service-account bind, Base DN
        search, and — optionally, when a transient test username/password is
        supplied — a full user lookup + authentication + identity mapping.
        The candidate profile is never persisted; an empty ldap.bindPassword
        on a candidate that names an existing profile id reuses the stored
        credential so edits never require retyping the secret. Test-user
        passwords are transient: never persisted, logged, cached, or audited.
        Errors are sanitized and bounded; the HTTP call returns 200 with the
        per-step report even when the directory test fails.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.2.0
      x-culvert-danger-level: low
      x-culvert-audit-event: idp.test
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdPTestRequest' }
      responses:
        '200':
          description: Staged directory-test report (ok=false when any stage failed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdPTestReport' }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
