      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: decryption.tunables.set
      parameters:
        - name: ifRevision
          in: query
          required: false
          schema: { type: string }
          description: "OPTIONAL stale-writer fence (2E-B): the tunables_revision from GET /api/decryption-exclusions. A mismatch is the structured 409 with no mutation; absent keeps the legacy replacement contract. The v2 client always asserts it."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TunablesPatch' }
      responses:
        '200':
          description: "Updated — the RESOLVED set this PUT installed plus its revision (durable AND applied; coherent by construction)."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '409': { description: 'Stale-writer fence conflict ({error, currentRevision, yourRevision}) — the tunables changed since the asserted revision; nothing mutated.' }
        '500':
          description: The durable write failed — the running tunables (and every learned exclusion) are unchanged. Body is plain text.
          content:
            text/plain: { schema: { type: string } }

