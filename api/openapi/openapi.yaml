      parameters:
        - { name: tenant, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approval_id, action]
              properties:
                approval_id: { type: string, minLength: 1, maxLength: 96, description: 'Nonempty; approval IDs are at most 96 UTF-8 bytes, so a longer value can only 404.' }
                action: { type: string, enum: [approve, reject, revoke], description: 'approve materializes catalog.Usable for the exact reviewed fingerprint; reject decides a pending request; revoke withdraws an active grant.' }
                reason: { type: string, maxLength: 512, description: 'Optional free-text reason (used for reject/revoke). The backend limit is 512 UTF-8 BYTES (maxLength counts characters, so multi-byte input may be rejected below this).' }
      responses:
        '200': { description: Decision applied, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '404': { $ref: '#/components/responses/PlainNotFound' }
        '409': { $ref: '#/components/responses/PlainConflict' }
        '503':
          description: The durable approval store could not be written (full/read-only disk); the mutation is retryable once storage recovers. Body is plain text.
          content:
            text/plain: { schema: { type: string } }
