openapi: 3.0.4
info:
  title: Culvert Admin API
  version: 1.0.0
  x-culvert-api-contract-version: 1.0.0
  description: |
    Machine-readable contract for the Culvert admin/control-plane REST API served
    on the UI port (`-ui-port`, default 9090).

    **Scope.** This document describes the HTTP/JSON admin API only. Two other
    Culvert network surfaces are intentionally NOT modelled here because they are
    not RESTful and OpenAPI cannot describe them faithfully:

      * the forward-proxy data path (HTTP CONNECT / plain-HTTP forward / SOCKS5)
        served on `-port` — a proxy protocol, not a resource API;
      * the Control-Plane ↔ Data-Plane gRPC stream — described by protobuf.

    **Accuracy over aspiration.** Every operation, schema, status code, and
    content type below reflects the *actual* runtime behavior of the handler, not
    a target design. Notably, error responses are currently emitted by
    `http.Error` as `text/plain`; that is documented as-is here. The proposed
    structured JSON error envelope is a *future* target recorded in
    docs/api/API-STYLE-GUIDE.md and the consistency risk register — it is NOT yet
    the runtime behavior and therefore is NOT asserted by this contract.

    **Air-gap.** This appliance and its documentation are designed for on-prem,
    internet-isolated deployment. No operation here depends on an external
    service, and the rendered documentation vendors all assets locally.

    This baseline (contract version 1.0.0) documents a representative,
    security-spanning subset of operations. The remaining registered routes are
    explicitly classified — and time-boxed for documentation — in
    api/route-classification.yaml, which the route-coverage CI gate enforces
    against the live router.
  license:
    name: See repository LICENSE
    url: https://github.com/KidCarmi/Culvert

servers:
  - url: /
    description: |
      The appliance serves this API relative to the UI host:port. Paths are
      absolute from the server root (e.g. https://appliance.example:9090/api/stats).

tags:
  - name: health
    description: Unauthenticated liveness/health probes for load balancers and monitors.
  - name: setup
    description: First-boot bootstrap of the initial administrator credential.
  - name: auth
    description: Admin session authentication and RBAC user management.
  - name: dashboard
    description: Read-only operational counters and telemetry.
  - name: governance
    description: Control-plane RBAC governance surface (admin-only, read-only).
  - name: security
    description: Certificate-authority and TLS-inspection security controls.
  - name: config
    description: Configuration export/import (backup & restore).
  - name: policy
    description: Policy engine, blocklist, and TLS-inspection policy reads.
  - name: pac
    description: Proxy auto-config (PAC) settings.
  - name: settings
    description: Appliance settings — logging, session, connection limits.
  - name: cluster
    description: Control-plane / data-plane cluster status and upstream pool.
  - name: support
    description: Supportability — status, bundles, diagnostics.

# ── Security schemes ──────────────────────────────────────────────────────────
# The runtime accepts EITHER a signed session cookie (browser flow) OR HTTP Basic
# credentials (CLI/API callers) on protected routes. Public routes accept neither.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ps_ui_session
      description: |
        HMAC-SHA256-signed admin session cookie issued by POST /api/auth/login.
        Carries the authenticated subject and RBAC role. Dynamic Secure flag
        based on TLS state; default TTL 8h.
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic credentials for CLI/API callers, verified against the local
        user store (bcrypt) or a configured external IdP.

  # ── Reusable responses (ACTUAL behavior: text/plain via http.Error) ──────────
  responses:
    PlainBadRequest:
      description: Malformed request (invalid JSON, missing/invalid parameter). Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "invalid JSON"
    PlainUnauthorized:
      description: Missing or invalid credentials. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "Invalid credentials"
    PlainForbidden:
      description: Authenticated but insufficient RBAC role. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "Forbidden: insufficient role"
    PlainMethodNotAllowed:
      description: HTTP method not supported by this route. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "method not allowed"
    PlainTooManyRequests:
      description: Rate-limited / account lockout in effect. Body is plain text.
      content:
        text/plain:
          schema: { type: string }
          example: "too many attempts, locked for 300s"

  schemas:
    # ── Health ────────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      description: |
        Node health. Additional fields (term, write_authority, lease_*,
        request-log health) are present depending on HA mode; the contract pins
        only the always-present discriminator.
      required: [status]
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [ok, standby]
        role:
          type: string
          enum: [standalone, leader, standby]
        leader: { type: boolean }
        write_authority: { type: boolean }

    # ── Setup ───────────────────────────────────────────────────────────────────
    SetupStatus:
      type: object
      required: [needsSetup]
      additionalProperties: false
      properties:
        needsSetup:
          type: boolean
          description: True until an initial admin credential (or explicit open mode) is configured.
    SetupCompleteRequest:
      type: object
      description: Provide credentials, OR set unauth=true for explicit open mode.
      additionalProperties: false
      properties:
        user: { type: string }
        pass: { type: string, format: password, minLength: 8 }
        unauth: { type: boolean }
    OkResponse:
      type: object
      required: [ok]
      additionalProperties: true
      properties:
        ok: { type: boolean }

    # ── Auth ────────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [user, pass]
      additionalProperties: false
      properties:
        user: { type: string }
        pass: { type: string, format: password }
        totp:
          type: string
          description: 6-digit TOTP or a backup code; omitted on the first step.
    LoginResponse:
      type: object
      description: |
        On success `{ok,user,role}`. When TOTP is enrolled but not yet supplied,
        the handler instead returns `{totp_required:true}` with HTTP 200 and no
        session — the client must resubmit with `totp`.
      additionalProperties: true
      properties:
        ok: { type: boolean }
        user: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        totp_required: { type: boolean }
    AuthStatus:
      type: object
      required: [loggedIn]
      additionalProperties: true
      properties:
        loggedIn: { type: boolean }
        user: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Role:
      type: string
      enum: [admin, operator, viewer]
    User:
      type: object
      additionalProperties: true
      properties:
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    UserList:
      type: object
      required: [users]
      additionalProperties: false
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/User' }
    CreateUserRequest:
      type: object
      required: [username, password, role]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, format: password, minLength: 8 }
        role: { $ref: '#/components/schemas/Role' }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }

    # ── Dashboard ────────────────────────────────────────────────────────────────
    StatsSummary:
      type: object
      description: Aggregate proxy counters plus persistence/HA health flags.
      required: [total, allowed, blocked]
      additionalProperties: true
      properties:
        total: { type: integer, format: int64 }
        allowed: { type: integer, format: int64 }
        blocked: { type: integer, format: int64 }
        authFail: { type: integer, format: int64 }
        blocklistSz: { type: integer }
        uptime: { type: string }
        proxyPort: { type: integer }
        uiPort: { type: integer }
        authEnabled: { type: boolean }
        c2Mode: { type: string, enum: [enforce, shadow] }

    # ── CA / security ─────────────────────────────────────────────────────────────
    CAStatus:
      type: object
      description: Internal CA state (opaque superset; fields depend on rotation/dual-CA mode).
      additionalProperties: true

    # ── Decryption exclusions ─────────────────────────────────────────────────────
    DecryptionExclusions:
      type: object
      description: Adaptive decryption-exclusion cache listing plus stats and blast-radius.
      additionalProperties: true

    # ── Config backup ────────────────────────────────────────────────────────────
    ConfigBackup:
      type: object
      description: |
        Opaque configuration backup envelope. May embed sensitive material
        (session HMAC, IdP secrets, upstream credentials) — treat as a secret at
        rest and in transit.
      additionalProperties: true
      x-culvert-sensitive: true
      x-culvert-open-justification: >-
        The backup envelope is intentionally an opaque superset of every config
        surface; its exact members vary by feature set and version, so it cannot
        be a closed schema. Sensitivity is enforced operationally (0600 at rest,
        admin-only + audited transfer), not by the contract shape.

    GovernanceControlPlane:
      type: object
      description: C3 governance surface — route inventory, C2 mode, counters, derived health.
      additionalProperties: true

    # ── Slice 3: read-model schemas ───────────────────────────────────────────────
    PolicyRule:
      type: object
      description: A single policy rule (rich object; open superset — fields vary by rule type/version).
      additionalProperties: true
      properties:
        priority: { type: integer }
        name: { type: string }
        action: { type: string }
        destFQDN: { type: string }
        sslAction: { type: string }
        enabled: { type: boolean }
    PolicyList:
      type: object
      required: [rules, count, version, updatedAt, draft]
      additionalProperties: false
      properties:
        rules: { type: array, items: { $ref: '#/components/schemas/PolicyRule' } }
        count: { type: integer }
        version: { type: integer, format: int64 }
        updatedAt: { type: string }
        draft: { type: boolean }
    AuthPolicyList:
      type: object
      required: [rules, count, defaultAction, note]
      additionalProperties: false
      properties:
        rules: { type: array, items: { type: object, additionalProperties: true } }
        count: { type: integer }
        defaultAction: { type: string, enum: [allow, deny] }
        note: { type: string }
    DefaultActionStatus:
      type: object
      required: [defaultAction]
      additionalProperties: false
      properties:
        defaultAction: { type: string, enum: [allow, deny] }
    BlocklistModeStatus:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [block, allow] }
    SecurityConfig:
      type: object
      required: [ipFilterMode, rateLimitRPM, rateLimitOn]
      additionalProperties: false
      properties:
        ipFilterMode: { type: string }
        ipList: { type: array, items: { type: string }, nullable: true }
        rateLimitRPM: { type: integer }
        rateLimitOn: { type: boolean }
        rateLimitExempt: { type: array, items: { type: string }, nullable: true }
    SSLBypassList:
      type: object
      required: [patterns, count]
      additionalProperties: false
      properties:
        patterns: { type: array, items: { type: string }, nullable: true }
        count: { type: integer }
    OCSPStatus:
      type: object
      required: [enabled, cacheLen, failClosedTotal, revokedTotal, lastFailClosedAt]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        cacheLen: { type: integer }
        failClosedTotal: { type: integer, format: int64 }
        revokedTotal: { type: integer, format: int64 }
        lastFailClosedAt: { type: string }
    SessionTimeout:
      type: object
      required: [hours]
      additionalProperties: false
      properties:
        hours: { type: integer }
    PACConfig:
      type: object
      required: [proxyHost, proxyPort]
      additionalProperties: false
      properties:
        proxyHost: { type: string }
        proxyPort: { type: integer }
        exclusions: { type: array, items: { type: string }, nullable: true }
    ConnLimitStatus:
      type: object
      required: [enabled, maxPerIP, activeIPs]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        maxPerIP: { type: integer }
        activeIPs: { type: integer }
    LoggerConfig:
      type: object
      required: [logFile, logMaxMB, logFormat]
      additionalProperties: false
      properties:
        logFile: { type: string }
        logMaxMB: { type: integer }
        logFormat: { type: string }
    DecryptionHealth:
      type: object
      description: TLS-inspection health — sessions, failures, coverage, trend, and the adaptive auto-exclude cache.
      required: [sessions, failures, coverage, autoexclude]
      additionalProperties: true
      properties:
        sessions: { type: object, additionalProperties: true }
        failures: { type: object, additionalProperties: true }
        coverage: { type: object, additionalProperties: true }
        trend: { type: array, items: { type: object, additionalProperties: true } }
        autoexclude: { type: object, additionalProperties: true }

    # ── Slice 3 tranche 2: settings/policy read-model schemas ─────────────────────
    SettingsSummary:
      type: object
      required: [authEnabled, user, proxyPort, uiPort, defaultAuthOutcome]
      additionalProperties: false
      properties:
        authEnabled: { type: boolean }
        user: { type: string }
        proxyPort: { type: integer }
        uiPort: { type: integer }
        defaultAuthOutcome: { type: string, enum: [Default, Exempt] }
    LogLevel:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level: { type: string }
    NetworkSettings:
      type: object
      required: [base_url, trust_forwarded_headers]
      additionalProperties: false
      properties:
        base_url: { type: string }
        ui_sans: { type: array, items: { type: string }, nullable: true }
        trust_forwarded_headers: { type: boolean }
        trusted_proxy_cidrs: { type: array, items: { type: string }, nullable: true }
    RewriteList:
      type: object
      required: [rules, count]
      additionalProperties: false
      properties:
        rules: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        count: { type: integer }
    CategoryGroups:
      type: object
      required: [groups, names]
      additionalProperties: false
      properties:
        groups: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        names: { type: array, items: { type: string }, nullable: true }
    MetricsConfig:
      type: object
      required: [tokenSet, path]
      additionalProperties: false
      properties:
        tokenSet: { type: boolean }
        path: { type: string }
    LogsRetention:
      type: object
      description: Log-store retention posture (fields vary by enabled/disk state).
      required: [enabled, configurable]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        configurable: { type: boolean }
        retentionDays: { type: integer }
        encrypted: { type: boolean }
    CAKeyProvider:
      type: object
      required: [provider, isExternal, caReady, dualCAActive]
      additionalProperties: false
      properties:
        provider: { type: string }
        isExternal: { type: boolean }
        caReady: { type: boolean }
        dualCAActive: { type: boolean }
    PolicyDraftStatus:
      type: object
      description: Policy draft/require-commit state; diff/version/shadows appear only when a draft is active.
      required: [requireCommit, active, actor, startedAt]
      additionalProperties: true
      properties:
        requireCommit: { type: boolean }
        active: { type: boolean }
        actor: { type: string }
        startedAt: { type: string }
    SessionSecretStatus:
      type: object
      required: [shared]
      additionalProperties: false
      properties:
        shared: { type: boolean }

    # ── Slice 3 tranche 3: blocklist/urlcat/fileblock/scan read-model schemas ──────
    HostList:
      type: object
      required: [hosts, count]
      additionalProperties: false
      properties:
        hosts: { type: array, items: { type: string }, nullable: true }
        count: { type: integer }
    ExtensionList:
      type: object
      required: [extensions, count]
      additionalProperties: false
      properties:
        extensions: { type: array, items: { type: string }, nullable: true }
        count: { type: integer }
    BlocklistFeedList:
      type: object
      required: [feeds]
      additionalProperties: false
      properties:
        feeds:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
            properties:
              url: { type: string }
              interval: { type: string }
              last_sync: { type: string }
              last_error: { type: string }
              imported_count: { type: integer }
              attributed_count: { type: integer }
    URLCategoryList:
      type: array
      nullable: true
      items:
        type: object
        additionalProperties: true
        properties:
          name: { type: string }
          feedBacked: { type: boolean }
    FileblockProfileList:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    ConfigVersionList:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    DecryptionProfiles:
      type: object
      required: [profiles, names]
      additionalProperties: false
      properties:
        profiles: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        names: { type: array, items: { type: string }, nullable: true }
    DPIConfig:
      type: object
      required: [patterns, count, blocked_total]
      additionalProperties: false
      properties:
        patterns: { type: array, items: { type: string }, nullable: true }
        count: { type: integer }
        blocked_total: { type: integer, format: int64 }
    DPIBypass:
      type: object
      required: [hosts]
      additionalProperties: false
      properties:
        hosts: { type: array, items: { type: string }, nullable: true }
    SecurityScanStatus:
      type: object
      description: Security-scan service status (fields vary by scan-service mode).
      required: [enabled]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        scan_svc_mode: { type: string }

    # ── Slice 3 tranche 4: scan/pac/decryption/release read-model schemas ──────────
    ScanSvcConfig:
      type: object
      required: [remote_enabled]
      additionalProperties: true
      properties:
        remote_enabled: { type: boolean }
        remote_url: { type: string }
    ScanCache:
      type: object
      required: [enabled]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        cache_hits: { type: integer }
        cache_misses: { type: integer }
        cache_size: { type: integer }
    DomainAllowlist:
      type: object
      required: [domains]
      additionalProperties: false
      properties:
        domains: { type: array, items: { type: string }, nullable: true }
    YARASettings:
      type: object
      description: YARA engine runtime settings (fields vary by build/config).
      additionalProperties: true
    DecryptionRedaction:
      type: object
      required: [redact_hosts]
      additionalProperties: false
      properties:
        redact_hosts:
          description: "false (redaction off) or an array of redacted hosts."
    PACPools:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    PACProfiles:
      type: object
      required: [profiles, pools]
      additionalProperties: true
      properties:
        defaultProfile: { type: object, additionalProperties: true, nullable: true }
        profiles: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        pools: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
    PACPostureInventory:
      type: object
      description: Direct-access PAC posture inventory (shape varies).
      additionalProperties: true
    ReleaseStatus:
      type: object
      description: Release-management status — catalog availability, verify mode, and freshness.
      required: [available]
      additionalProperties: true
      properties:
        available: { type: boolean }
        reason: { type: string }
        verify_mode: { type: string }
    ObjectReferences:
      type: object
      description: Reverse references from named objects (categories, groups, profiles) to policy rules.
      additionalProperties: true

    # ── Slice 3 tranche 5: dashboard/cluster/support read-model schemas ────────────
    AuditLog:
      type: object
      required: [entries, count, total, offset, limit]
      additionalProperties: false
      properties:
        entries: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        count: { type: integer }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
    CountryTraffic:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    DashboardHealth:
      type: object
      required: [goroutines, blocklistSize]
      additionalProperties: true
      properties:
        memAllocMB: { type: number }
        memSysMB: { type: number }
        goroutines: { type: integer }
        numGC: { type: integer }
        sseClients: { type: integer }
        blocklistSize: { type: integer }
    DashboardThreats:
      type: object
      required: [clamav, yara, dpi, threatFeed]
      additionalProperties: true
      properties:
        clamav: { type: integer, format: int64 }
        yara: { type: integer, format: int64 }
        dpi: { type: integer, format: int64 }
        threatFeed: { type: integer, format: int64 }
    DashboardTopRules:
      type: object
      required: [rules]
      additionalProperties: false
      properties:
        rules: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
    Timeseries:
      type: object
      required: [data, allowed, blocked]
      additionalProperties: false
      properties:
        data: { type: array, items: { type: number }, nullable: true }
        allowed: { type: array, items: { type: number }, nullable: true }
        blocked: { type: array, items: { type: number }, nullable: true }
    ClusterStatus:
      type: object
      description: Cluster node role and enrollment status (fields vary by role).
      required: [role]
      additionalProperties: true
      properties:
        role: { type: string }
        nodeID: { type: string }
    ClusterNodes:
      type: object
      required: [nodes]
      additionalProperties: true
      properties:
        nodes: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
    ClusterMetrics:
      type: object
      description: Aggregated per-node cluster metrics.
      additionalProperties: true
    ClusterHA:
      type: object
      description: High-availability status.
      required: [enabled, role]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        role: { type: string }
    SupportStatus:
      type: object
      description: Supportability status (debug level, bundle state, retention).
      additionalProperties: true
    UpstreamConfig:
      type: object
      required: [enabled, proxies]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        proxies: { type: array, items: { type: object, additionalProperties: true }, nullable: true }

    # ── Slice 3 tranche 6: cluster/support/diagnostics read-model schemas ──────────
    ClusterCAInfo:
      type: object
      description: Cluster CA info (fingerprint, validity, readiness).
      additionalProperties: true
    ClusterTokens:
      type: object
      required: [tokens]
      additionalProperties: false
      properties:
        tokens: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
    ClusterAudit:
      type: object
      required: [entries, total]
      additionalProperties: false
      properties:
        entries: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        total: { type: integer }
    BandwidthPolicies:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    ClusterRateLimits:
      type: object
      required: [enabled]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
    ClusterRevocations:
      type: object
      required: [local_revoked, cluster_mode]
      additionalProperties: true
      properties:
        local_revoked: { type: integer }
        cluster_mode: { type: boolean }
    ClusterRotation:
      type: object
      required: [active]
      additionalProperties: true
      properties:
        active: { type: boolean }
    SupportRetention:
      type: object
      required: [keep, max_age_days]
      additionalProperties: true
      properties:
        keep: { type: integer }
        max_age_days: { type: integer }
        defaults: { type: object, additionalProperties: true }
    OperatorContract:
      type: object
      description: Aggregated operator diagnostics contract (health, posture, and remediation hints).
      additionalProperties: true

    # ── Slice 3 tranche 7: remaining reads (node-groups/support/scan) ──────────────
    NodeGroups:
      type: object
      description: Node group definitions and selectors.
      additionalProperties: true
    NodeGroupMembership:
      type: object
      description: Nodes matching a node group's label selector.
      additionalProperties: true
    SupportBundles:
      type: array
      nullable: true
      items: { type: object, additionalProperties: true }
    SupportDebugLevel:
      type: object
      description: Support debug-level state.
      additionalProperties: true
    SupportRecipients:
      type: object
      required: [recipients, max]
      additionalProperties: false
      properties:
        recipients: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
        max: { type: integer }
    ScanExclusions:
      type: object
      required: [hashes, hosts]
      additionalProperties: true
      properties:
        hashes: { type: array, items: { type: string }, nullable: true }
        hosts: { type: array, items: { type: string }, nullable: true }
    YARARules:
      type: object
      description: YARA rule inventory — directory, files, per-file rule names, compiled names.
      additionalProperties: true
    AutoExcludeTunables:
      type: object
      required: [defaults, bounds]
      additionalProperties: true
      properties:
        defaults: { type: object, additionalProperties: true }
        bounds: { type: object, additionalProperties: true }
    ConfigDiff:
      type: object
      required: [from, to, changes]
      additionalProperties: true
      properties:
        from: { type: integer }
        to: { type: integer }
        changes: { type: object, additionalProperties: true, nullable: true }

    # ── Slice 3 tranche 8: write request schemas ──────────────────────────────────
    SetBlocklistMode:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [block, allow] }
    SetDefaultAction:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: [allow, deny] }
    SetLogLevel:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level: { type: string }
    AddSSLBypass:
      type: object
      description: Provide a single pattern or a list.
      additionalProperties: false
      properties:
        pattern: { type: string }
        patterns: { type: array, items: { type: string } }
    SetSessionTimeout:
      type: object
      required: [hours]
      additionalProperties: false
      properties:
        hours: { type: integer }
    SetRedaction:
      type: object
      required: [redact_hosts]
      additionalProperties: false
      properties:
        redact_hosts: { type: boolean }
    SetOCSP:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
    SetConnLimit:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        maxPerIP: { type: integer }
    SetDPIBypass:
      type: object
      required: [hosts]
      additionalProperties: false
      properties:
        hosts: { type: array, items: { type: string } }
    SetMetricsToken:
      type: object
      required: [token]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        token: { type: string, format: password }

    # ── Slice 3 tranche 9: more write request schemas ─────────────────────────────
    SecurityUpdate:
      type: object
      description: Partial update — supply only the fields to change.
      additionalProperties: false
      properties:
        ipFilterMode: { type: string, enum: ["", allow, block] }
        ipAdd: { type: string }
        ipRemove: { type: string }
        ipList: { type: array, items: { type: string } }
        rateLimitRPM: { type: integer }
        rateLimitExemptAdd: { type: string }
        rateLimitExemptDel: { type: string }
    UpstreamUpdate:
      type: object
      required: [proxies]
      additionalProperties: false
      properties:
        proxies: { type: array, items: { type: object, additionalProperties: true } }
    AddFileblock:
      type: object
      description: Provide a single extension or a list.
      additionalProperties: false
      properties:
        extension: { type: string }
        extensions: { type: array, items: { type: string } }
    SetScanExclusions:
      type: object
      additionalProperties: false
      properties:
        hashes: { type: array, items: { type: string } }
        hosts: { type: array, items: { type: string } }
    SetDomainAllowlist:
      type: object
      required: [domains]
      additionalProperties: false
      properties:
        domains: { type: array, items: { type: string } }
    SetYARASettings:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        timeout_secs: { type: integer, format: int64 }
        max_inflight: { type: integer, format: int64 }
        on_timeout: { type: string }
        on_saturation: { type: string }
        alert_degraded: { type: boolean }
    SetLogsRetention:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        retentionDays: { type: integer }
        retentionMaxGB: { type: number }
        criticalDiskPct: { type: integer }

    # ── Slice 3 tranche 10: write request schemas ─────────────────────────────────
    UpsertCategoryGroup:
      type: object
      required: [name, categories]
      additionalProperties: false
      properties:
        name: { type: string }
        categories: { type: array, items: { type: string } }
    SetInitialAdmin:
      type: object
      required: [user, pass]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        user: { type: string }
        pass: { type: string, format: password, minLength: 8 }
    SetNetworkSettings:
      type: object
      additionalProperties: false
      properties:
        base_url: { type: string }
        ui_sans: { type: array, items: { type: string } }
        trust_forwarded_headers: { type: boolean }
        trusted_proxy_cidrs: { type: array, items: { type: string } }
    SetSessionSecret:
      type: object
      required: [secret]
      additionalProperties: false
      x-culvert-sensitive: true
      properties:
        secret: { type: string, format: password, minLength: 64 }
    AddBlocklistException:
      type: object
      description: Provide a single host or a list.
      additionalProperties: false
      properties:
        host: { type: string }
        hosts: { type: array, items: { type: string } }

    # ── Slice 3 tranche 11: write request schemas ─────────────────────────────────
    AddBlocklistFeed:
      type: object
      required: [url, interval]
      additionalProperties: false
      properties:
        url: { type: string }
        interval: { type: string, description: "e.g. 24h, or off" }
    DecryptionProfileInput:
      type: object
      description: A decryption profile (rich object; open superset).
      additionalProperties: true
    RewriteRuleInput:
      type: object
      description: An HTTP header rewrite rule (rich object; open superset).
      additionalProperties: true
    SupportRetentionPatch:
      type: object
      description: Partial support-bundle retention update.
      additionalProperties: true

    # ── Slice 3 tranche 12: action + CRUD schemas ─────────────────────────────────
    AlertWebhookList:
      type: object
      required: [webhooks]
      additionalProperties: false
      properties:
        webhooks: { type: array, items: { type: object, additionalProperties: true }, nullable: true }
    AlertWebhookInput:
      type: object
      description: Alert webhook (rich object; open superset).
      additionalProperties: true
    UpstreamSettingsUpdate:
      type: object
      description: Upstream pool settings update.
      additionalProperties: true
    TunablesPatch:
      type: object
      description: Adaptive auto-exclude tunables patch (subset of tunable fields).
      additionalProperties: true
    ClusterTokenInput:
      type: object
      description: Enrollment token request (ttl/label).
      additionalProperties: true

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Node liveness/health probe
      description: |
        Unauthenticated health check for load balancers. Returns 200 with
        `status:ok` when this node is standalone or the HA leader; returns 503
        with `status:standby` on a non-leader HA node.
      security: []
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Node is healthy and holds (or does not require) write authority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { status: ok, role: standalone, leader: true, write_authority: true }
        '503':
          description: HA standby node — not currently the writable leader.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { status: standby, role: standby, leader: false, write_authority: false }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }

  /api/setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Whether first-boot setup is still required
      description: Unauthenticated. Returns `{needsSetup:true}` until an admin credential (or explicit open mode) is configured.
      security: []
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Setup state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
              example: { needsSetup: true }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }

  /api/setup/complete:
    post:
      operationId: completeSetup
      tags: [setup]
      summary: Set the initial administrator credential (one-time bootstrap)
      description: |
        One-time bootstrap. Sets the first admin credential, or enables explicit
        open mode with `{unauth:true}`. Returns 403 once auth is already
        configured. Rate-limited per source IP.
      security: []
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: setup.complete
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupCompleteRequest' }
            example: { user: admin, pass: "changeme-8+chars" }
      responses:
        '200':
          description: Initial admin configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }
        '429': { $ref: '#/components/responses/PlainTooManyRequests' }

  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate and issue an admin session cookie
      description: |
        Verifies credentials (local bcrypt or configured IdP), enforces account
        lockout, and — when TOTP is enrolled — a second step. On success sets the
        `ps_ui_session` cookie and returns `{ok,user,role}`.
      security: []
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: auth.login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { user: admin, pass: "s3cret", totp: "123456" }
      responses:
        '200':
          description: Authenticated (session cookie set), or TOTP second step required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example: { ok: true, user: admin, role: admin }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }
        '429': { $ref: '#/components/responses/PlainTooManyRequests' }

  /api/auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Current session authentication state
      description: Returns whether the caller holds a valid session (or Basic credentials) and the resolved role.
      security:
        - sessionCookie: []
        - basicAuth: []
        - {}
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Session state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStatus' }
              example: { loggedIn: true, user: admin, role: admin }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }

  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current admin session
      description: Revokes the session token and clears the cookie.
      security:
        - sessionCookie: []
        - {}
      x-culvert-visibility: public-supported
      x-culvert-permission: public
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: low
      x-culvert-audit-event: auth.logout
      responses:
        '200':
          description: Session cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              example: { ok: true }
        '405': { $ref: '#/components/responses/PlainMethodNotAllowed' }

  /api/auth/users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List admin users
      description: Returns all admin UI users (without password material).
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: User list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
              example: { users: [ { username: admin, role: admin } ] }
        '403': { $ref: '#/components/responses/PlainForbidden' }
    post:
      operationId: upsertUser
      tags: [auth]
      summary: Create or update an admin user
      description: Creates a new admin user or updates an existing one's password/role. Admin-only and audited.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: auth.user.upsert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
            example: { username: operator1, password: "operator-pass8", role: operator }
      responses:
        '200':
          description: User created or updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
    delete:
      operationId: deleteUser
      tags: [auth]
      summary: Delete an admin user
      description: Removes the user identified by the `username` query parameter.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: auth.user.delete
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
      responses:
        '204':
          description: User removed (no response body).
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      description: Changes the authenticated user's own password after verifying the current one. Audited.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: auth.password.change
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            example: { current_password: "old-pass8", new_password: "new-pass8" }
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/PlainBadRequest' }
        '401': { $ref: '#/components/responses/PlainUnauthorized' }
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/stats:
    get:
      operationId: getStats
      tags: [dashboard]
      summary: Aggregate proxy counters and health flags
      description: Returns aggregate request counters plus persistence, HA, and RBAC-mode health flags for the dashboard.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Counters snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsSummary' }
              example: { total: 1000, allowed: 900, blocked: 90, authFail: 10 }
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/top-hosts:
    get:
      operationId: getTopHosts
      tags: [dashboard]
      summary: Top destination hosts by request volume
      description: Returns the most-requested destination hosts (approximate lower bounds past the internal counter cap).
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Ranked host counters (approximate lower bounds past the internal cap).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/governance/control-plane:
    get:
      operationId: getGovernanceControlPlane
      tags: [governance]
      summary: Control-plane RBAC governance surface
      description: Route inventory, C2 enforcement mode, the six C2 counters, and derived governance health.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Governance snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernanceControlPlane' }
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/ca/status:
    get:
      operationId: getCAStatus
      tags: [security]
      summary: Internal CA status
      description: Returns internal CA state — root info, leaf cache, rotation, and dual-CA status.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: CA state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CAStatus' }
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/ca/rotate:
    post:
      operationId: rotateCA
      tags: [security]
      summary: Force rotation of the internal CA (DESTRUCTIVE)
      description: |
        Forces a CA rotation using a two-step confirmation-token flow: the first
        POST returns `{status:"pending_confirmation", confirmation_token}` and
        emits a `ca.rotate_requested` audit event; re-POSTing with the token
        applies the rotation and emits `ca.rotate`. Re-signs future leaf
        certificates under a new root; clients that pinned the previous root will
        fail until they re-trust. Admin-only and audited.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: non-idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: high
      x-culvert-audit-event: ca.rotate
      requestBody:
        required: false
        description: |
          Omit (or send `{}`) on the first step to request rotation and receive a
          token. On the second step send `{confirm:true, confirmation_token}` with
          the token from the first response to apply the rotation.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                confirm: { type: boolean, description: "Set true on the second step to apply the rotation." }
                confirmation_token: { type: string, description: "Token returned by the first (request) step." }
            example: { confirm: true, confirmation_token: "abc123" }
      responses:
        '200':
          description: |
            Rotation requested (`status:pending_confirmation` with a token) or
            applied, depending on whether a valid confirmation token was supplied.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: { status: pending_confirmation, confirmation_token: "abc123" }
        '403': { $ref: '#/components/responses/PlainForbidden' }
        '500':
          description: Rotation failed. Body is plain text.
          content:
            text/plain: { schema: { type: string } }

  /api/decryption-exclusions:
    get:
      operationId: listDecryptionExclusions
      tags: [security]
      summary: List adaptive decryption-exclusion cache entries
      description: Returns the adaptive decryption-exclusion cache listing plus stats and per-scope blast radius.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: viewer
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      responses:
        '200':
          description: Cache listing plus stats and per-scope blast radius.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecryptionExclusions' }
        '403': { $ref: '#/components/responses/PlainForbidden' }
    delete:
      operationId: evictDecryptionExclusions
      tags: [security]
      summary: Evict one or all decryption-exclusion entries
      description: Evicts a single `(scope,host)` entry, or clears all when no query is given. Operator+ and audited.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: operator
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: idempotent
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: decryption.exclusion.evict
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string }
        - name: host
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Eviction applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              example: { ok: true }
        '403': { $ref: '#/components/responses/PlainForbidden' }

  /api/config/export:
    get:
      operationId: exportConfig
      tags: [config]
      summary: Export the full configuration backup (SENSITIVE)
      description: |
        Returns the complete configuration backup envelope. May contain secrets
        (session HMAC, IdP secrets, upstream credentials). Admin-only and audited.
      security:
        - sessionCookie: []
        - basicAuth: []
      x-culvert-visibility: admin-supported
      x-culvert-permission: admin
      x-culvert-tenant-scope: appliance
      x-culvert-stability: stable
      x-culvert-idempotency: safe
      x-culvert-introduced-version: 1.0.0
      x-culvert-danger-level: medium
      x-culvert-audit-event: config.export
      responses:
        '200':
          description: Configuration backup.
          content:
            application/json:
