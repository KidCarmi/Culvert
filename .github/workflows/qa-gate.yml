## ─────────────────────────────────────────────────────────────────────────────
## Culvert — QA Gate (hard blocking)
## ─────────────────────────────────────────────────────────────────────────────
## Purpose: enforce QA as a hard gate that must be GREEN before a branch can
## merge or release. Unlike the Security Release Gate (which focuses on CVEs,
## secrets, linters, and supply-chain concerns), this workflow is dedicated to
## FUNCTIONAL CORRECTNESS and RUNTIME BEHAVIOR.
##
## Key design choices:
##
##   1. Failures are isolated by LAYER so the root cause is obvious at a
##      glance in the PR checks list:
##
##        · qa-logic        — whole-module compile + `go vet`. A red X here
##                            means the code does not build or vet cleanly.
##        · qa-race         — application-logic regressions: the full race +
##                            coverage suite, run as 4 isolated root-package
##                            shards plus every other package (CI-REDESIGN
##                            stage 5B, qa-race-shards.yml). A red X here means
##                            the code is wrong, independent of infra/OS.
##        · qa-determinism  — repeats the same tests under -shuffle and -count
##                            to surface order-dependent tests and flakes.
##                            A red X here means a test is non-deterministic.
##        · qa-coverage     — enforces a minimum gate-critical coverage floor
##                            on the security-sensitive packages (totp, auth,
##                            session, SSRF helpers). Red = gap in coverage.
##                            It runs NO tests: the profile is produced by the
##                            race run (qa-logic's since stage 2A, qa-race's
##                            since stage 5B) and this job only enforces the
##                            floors on it.
##        · qa-infra-compose — builds the Docker image in isolation and brings
##                            up docker-compose.yml WITHOUT the application
##                            depending on it. Red = container/orchestration
##                            issue, not application code.
##        · qa-os           — runs the binary smoke test on a clean ubuntu
##                            runner with no Docker. Red = OS/environment or
##                            static-link problem.
##        · qa-contract     — asserts schema-stable artefacts (config example,
##                            default policy, on-disk user schema) still parse.
##                            Red = on-disk contract broken for operators.
##
##      These layers are INDEPENDENT with exactly ONE exception, and the
##      exception is real rather than incidental: qa-coverage consumes the
##      coverage profile qa-race publishes, so it genuinely cannot start
##      earlier. Every other job is scheduled in parallel (stage 1) and each
##      carries its own PR-skip condition, so a qa-race failure suppresses
##      only qa-coverage — and still fails the aggregate below, which needs
##      every job. (The unsharded audit — weekly schedule or an opt-in
##      dispatch — is the other consumer of qa-race's evidence; it is outside
##      the ordinary graph — see below.)
##
##      Do not add a `needs:` edge here for ordering alone. Stage 1 removed
##      six that bought nothing but serialised the longest job in front of
##      every one of them; the surviving edge exists because an artifact
##      crosses it.
##
##   2. Every job writes a JUnit-style or step-summary report so failures are
##      visible without digging into raw logs.
##
##   3. The final `qa-gate-approved` job requires ALL jobs to succeed. Branch
##      Protection must mark this job as a required status check.
## ─────────────────────────────────────────────────────────────────────────────

name: QA Gate
# The title names the execution mode so a reporter reading run metadata can
# tell an audit from an ordinary dispatch without the inputs, which the runs
# API does not return (CI-REDESIGN §17). '' keeps GitHub's default title for
# pushes and pull requests.
run-name: ${{ github.event_name == 'schedule' && 'QA Gate · scheduled equivalence audit' || github.event_name == 'workflow_dispatch' && format('QA Gate · dispatch · audit={0}', inputs.unsharded_audit) || '' }}
# Least-privilege default: jobs that need write scopes (packages, checks,
# contents, security-events, pull-requests) declare them at job level.
permissions:
  contents: read


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    # tags trigger removed (CI review P0-3): auto-tag only tags SHAs that
    # already passed this workflow on the main push — the tag re-run was a
    # full duplicate of the identical commit. Release evidence for tags
    # remains via security-release-gate (tags) + ci.yml catalog gate.
  pull_request:
    branches: [main]
  # CI-REDESIGN stage 6B: ONE weekly same-SHA equivalence audit on the default
  # branch — the full main graph PLUS the unsharded reference and the
  # comparison, exactly what a `unsharded_audit: true` dispatch runs. It is
  # never release evidence: release gating reads only event=push runs of main
  # (.github/scripts/require-gate.sh), which a schedule never is.
  # Sunday 06:23 UTC: off the Monday 02:00–06:00 cluster (14 scheduled runs
  # start there), and after every daily cron, so the audit does not queue
  # behind them for runners.
  schedule:
    - cron: "23 6 * * 0"
  workflow_dispatch:
    inputs:
      unsharded_audit:
        # CI-REDESIGN stage 5B. Default false: an ordinary dispatch runs exactly
        # the graph a main push runs. true ADDS the unsharded race reference
        # (the single-process `go test -race ./...` qa-logic used to run) and a
        # comparison of the sharded evidence against it — inventory, results,
        # and every covered block. It is the QUALIFICATION mode for the sharded
        # execution: a lost test or a lost covered block fails it, and the
        # aggregate below then refuses. It is not run on ordinary executions —
        # that would put the original critical path back.
        description: "Also run the unsharded race reference and compare the sharded evidence with it (qualification)"
        type: boolean
        default: false

# Audit executions (the weekly schedule and an `unsharded_audit` dispatch) get
# their OWN group and are never cancelled: a main push must not cancel a
# ~30-minute audit half way, and an audit must not cancel the main-push run
# that is release evidence. Ordinary runs keep the cancel-superseded group.
# The audit predicate appears verbatim everywhere it decides (this group and
# its cancel flag, both audit jobs, the aggregate's require-success);
# ci_perf_report_test.go pins every copy equal.
concurrency:
  group: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.unsharded_audit)) && 'qa-audit' || 'qa-gate' }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.unsharded_audit)) }}

jobs:
  # ─── A. Application-logic gate ──────────────────────────────────────────────
  # Isolates PURE Go correctness. No Docker. No network. A failure here means
  # the committed source code is wrong — not infra, not the runner.
  qa-logic:
    name: "QA · Application logic (compile + vet)"
    # Retirement step 5 (roadmap/CI-REDESIGN.md): PR-time run superseded by the
    # Fast/Deep PR Gates; full behavior retained on main pushes and on
    # workflow_dispatch (this workflow has NO tag trigger — see the `on:` block).
    #
    # Stage 5B moved the race + coverage suite out of this job into qa-race
    # (below). What stays here is what compiling the root test binary alone
    # does NOT replace: `go build ./...` builds every package's non-test code
    # (including main packages the tests never link), and `go vet ./...`
    # checks every package, test files included. The aggregate below treats
    # skipped as pass so the required-check name keeps reporting.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Compile (strict)
        run: go build ./...

      - name: go vet
        run: go vet ./...

  # ─── A2. Race + coverage (sharded) ─────────────────────────────────────────
  # The full race + coverage suite that qa-logic ran as ONE ~25–30-minute
  # process until stage 5B: the root package as 4 isolated shards of one
  # prebuilt binary, every other package whole, and a verdict that proves the
  # evidence complete on its own — exact root partitioning, every
  # source-declared test, and both coverage-block universes exactly. It
  # publishes the authoritative `qa-coverage` profile. See
  # .github/workflows/qa-race-shards.yml and roadmap/CI-REDESIGN.md §14.
  #
  # Owner of the main-push race suite (stage 2B handed it to QA; stage 5B moved
  # it from qa-logic to this job). security-release-gate.yml's `tests-race`
  # still owns tags, the weekly schedule and manual dispatch there.
  qa-race:
    name: "QA · Race + coverage (sharded)"
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/qa-race-shards.yml
    with:
      shards: 4

  # ─── B. Determinism gate ───────────────────────────────────────────────────
  # Re-runs the test suite with -shuffle=on and -count=2 to flush out
  # order-dependent tests and intermittent flakes. A failure here means a test
  # is non-deterministic; the fix is to pin the test's inputs/time/RNG, NOT to
  # mark the build green.
  qa-determinism:
    name: "QA · Determinism (shuffle + count=2)"
    # Independent layer: consumes no output or artifact from qa-logic, so it is
    # scheduled in parallel with it rather than behind it (CI-REDESIGN stage 1).
    # The PR-time skip that `needs: qa-logic` used to cascade is now stated here
    # explicitly — the aggregate still treats a skipped job as a pass.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Determinism — shuffled double-run
        env:
          TEST_SEED: "20260421"
        run: |
          # -shuffle=on picks a random order per package each run; -count=2
          # makes every test run twice in that order. Any test that leaks
          # state between invocations or depends on ordering will fail.
          #
          # Note: we INTENTIONALLY do NOT add -race here. The race detector
          # is covered by qa-race. Combining -race with -shuffle=on on a
          # shared CI runner roughly doubles wall time and surfaces timing
          # sensitivity that is orthogonal to order-dependency — exactly
          # the failure-isolation principle this gate enforces (one job,
          # one layer, one failure class).
          set -o pipefail
          go test -count=2 -shuffle=on -timeout=20m ./... 2>&1 | tee determinism.log \
            || { grep -m1 -- "-test.shuffle " determinism.log || true; \
                 echo "::error::determinism failure — reproduce with the printed -test.shuffle seed (log artifact: qa-determinism-log)"; exit 1; }

      - name: Upload determinism log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-determinism-log
          path: determinism.log
          retention-days: 14

  # ─── C. Gate-critical coverage floor ───────────────────────────────────────
  # Coverage floor is enforced on the SECURITY-SENSITIVE surface specifically.
  # A global 55% number from security-release-gate.yml is a health metric; this
  # gate enforces that the blast-radius files stay well above it.
  #
  # CI-REDESIGN stage 2A: this job no longer RUNS the suite. It used to execute
  # the whole `./...` suite a second time (non-race, 15m budget) with the same
  # TEST_SEED, purely to instrument what the race run had already executed. It
  # only ENFORCES the floors on the race run's profile, so the duplicate
  # execution is gone while the floor table, its calculation and its
  # blast-radius scope are byte-identical. Stage 5B changed only the PRODUCER:
  # the profile is now the sharded race verdict's merged profile (qa-race),
  # judged complete against both block universes before it is published.
  #
  # This is the ONE dependency between substantive jobs (stage 1 removed six
  # that bought nothing). It is deliberate and narrow: this job consumes
  # qa-race's ARTIFACT, so it genuinely cannot start before it. Every other
  # job stays independent.
  qa-coverage:
    name: "QA · Gate-critical coverage floor"
    # `needs:` is the artifact dependency, NOT a scheduling preference. It also
    # makes the gate fail closed in the direction that matters: a failed
    # qa-race publishes no profile, this job never runs, and the aggregate
    # refuses on qa-race's own result. The PR-skip stays stated explicitly so
    # the condition does not depend on the cascade (stage 1's rule).
    needs: qa-race
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `go tool cover -func` resolves each profile line's import path to a
      # source file, so the checkout above and a Go toolchain are both still
      # required even though no test runs here.
      - uses: ./.github/actions/setup-go-cache

      - name: Download coverage profile from qa-race
        # No `run-id`/`github-token`: without them actions/download-artifact
        # reads ONLY the current workflow run, so a floor can never be enforced
        # against some other run's profile. Do not add them.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-coverage

      - name: Assert the downloaded profile is usable
        # The producer already checked this; re-checking here is not redundant.
        # Between the two, the profile crosses the artifact service, and the
        # failure this catches — a truncated or empty download — would otherwise
        # reach `go tool cover` as an unparsable file and could only be read out
        # of a stack trace. Fail closed, with the reason named.
        run: |
          set -euo pipefail
          test -s coverage.out || { echo "::error::no coverage profile from qa-race (missing or empty after download)"; exit 1; }
          head -n1 coverage.out | grep -q '^mode:' || { echo "::error::downloaded coverage.out has no mode line — transfer corrupted or not a profile"; exit 1; }
          lines=$(($(wc -l < coverage.out) - 1))
          [ "$lines" -gt 0 ] || { echo "::error::downloaded coverage.out carries a mode line and no statements"; exit 1; }
          echo "coverage profile: $lines statement blocks, $(head -n1 coverage.out)"

      - name: Enforce coverage floors (global + per-file)
        # Shared with the Fast PR Gate — floors live in
        # .github/scripts/coverage-floor.sh (one table, two event paths).
        # UNCHANGED by stage 2A: same script, same global floor, same per-file
        # table, same averaging. Only where the profile came from moved.
        run: .github/scripts/coverage-floor.sh coverage.out

  # ─── D. Docker Compose infra gate ──────────────────────────────────────────
  # Runs the compose stack INDEPENDENTLY of the Go test run — in PARALLEL with
  # the Go tests, not after them (CI-REDESIGN stage 1). If this job fails, the failure
  # is an infra/orchestration issue — image build, healthcheck, compose graph —
  # NOT application logic; read it against qa-race's result in the same run.
  # That isolation matters: it lets operators ship a hotfix without re-running
  # hours of Go tests.
  qa-infra-compose:
    name: "QA · Docker Compose (infra)"
    # Independent layer: consumes no output or artifact from qa-logic, so it is
    # scheduled in parallel with it rather than behind it (CI-REDESIGN stage 1).
    # The PR-time skip that `needs: qa-logic` used to cascade is now stated here
    # explicitly — the aggregate still treats a skipped job as a pass.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build proxy image (local only)
        run: |
          docker build -t culvert:qa-gate -f Dockerfile .

      - name: Render + validate docker-compose.yml
        run: |
          docker compose -f docker-compose.yml config --quiet

      - name: Bring up stack (proxy only — clamav disabled for determinism)
        # We override the compose file at runtime to bring up only the proxy
        # service. The production compose also wires in clamav, which is slow
        # and whose failure modes would mask application logic issues. The
        # proxy service is exercised here IN ISOLATION.
        #
        # The session secret is generated in the shell (OUTSIDE the heredoc)
        # so the value is a real 64-hex-char string, not the literal text
        # "$(openssl rand -hex 32)". A literal dollar-paren string would fail
        # the hex decode in initSessionSecret() and panic on startup.
        env:
          # Exported here so docker compose's ${VAR} substitution picks it up.
          CULVERT_SESSION_SECRET_VALUE: ""
        run: |
          SESSION_SECRET=$(openssl rand -hex 32)
          export CULVERT_SESSION_SECRET_VALUE="$SESSION_SECRET"

          cat > compose.qa.yml <<'YAML'
          services:
            proxy:
              image: culvert:qa-gate
              ports:
                - "18080:8080"
                - "19090:9090"
              environment:
                - TZ=UTC
                - CULVERT_SESSION_SECRET=${CULVERT_SESSION_SECRET_VALUE}
              command: ["-port","8080","-ui-port","9090"]
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
                interval: 5s
                timeout: 3s
                retries: 12
          YAML

          docker compose -f compose.qa.yml up -d
          # Wait for the healthcheck to flip to healthy. Fail fast if it does
          # not become healthy within the retry budget — this is the boundary
          # between "app issue" (would have failed in qa-race) and "infra
          # issue".
          healthy=0
          for i in $(seq 1 45); do
            cid=$(docker compose -f compose.qa.yml ps -q proxy || true)
            if [ -z "$cid" ]; then
              echo "proxy container not yet created (attempt $i)"
              sleep 2
              continue
            fi
            status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "starting")
            echo "proxy health: $status (attempt $i)"
            if [ "$status" = "healthy" ]; then healthy=1; break; fi
            if [ "$status" = "unhealthy" ]; then
              echo "::error::proxy container reported unhealthy — infrastructure failure"
              docker compose -f compose.qa.yml logs proxy
              exit 1
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::proxy container never became healthy within budget"
            docker compose -f compose.qa.yml logs proxy
            exit 1
          fi
          # Smoke test the public endpoints to confirm they are reachable from
          # the runner (not just inside the container).
          curl -fsS http://127.0.0.1:18080/health || { echo "::error::HTTP health endpoint unreachable"; exit 1; }
          # Admin UI is HTTPS with a self-signed cert; treat non-2xx as OK as
          # long as TLS handshakes and the connection completes.
          curl -sS -k -o /dev/null -w "admin UI HTTP status: %{http_code}\n" https://127.0.0.1:19090/api/auth/status || true

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f compose.qa.yml logs || true

      - name: Tear down
        if: always()
        run: docker compose -f compose.qa.yml down -v || true

  # ─── E. OS / environment gate ──────────────────────────────────────────────
  # Runs a static CGO_ENABLED=0 binary on a clean Ubuntu runner (no Docker,
  # no sidecar). Runs in PARALLEL with qa-race. If qa-race is green in the
  # same run and this job is red, the problem is in the build or the runtime
  # environment, NOT the Go test logic.
  qa-os:
    name: "QA · Bare-metal smoke (no Docker)"
    # Independent layer: consumes no output or artifact from qa-logic, so it is
    # scheduled in parallel with it rather than behind it (CI-REDESIGN stage 1).
    # The PR-time skip that `needs: qa-logic` used to cascade is now stated here
    # explicitly — the aggregate still treats a skipped job as a pass.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Static build
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o culvert .

      - name: Verify binary is static
        run: |
          file culvert
          if ldd culvert 2>&1 | grep -q "not a dynamic executable"; then
            echo "binary is static — good"
          else
            echo "::error::binary has dynamic dependencies — broke CGO_ENABLED=0 guarantee"
            ldd culvert || true
            exit 1
          fi

      - name: Smoke run — start, hit /health, stop
        run: |
          # Runs in a clean shell on the runner itself. If /health responds
          # we know the OS environment + binary combination is good. A
          # failure here with qa-race green in the same run = runner/OS problem.
          export CULVERT_SESSION_SECRET=$(openssl rand -hex 32)
          ./culvert -port 18080 -ui-port 19090 &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              echo "proxy healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::binary did not become healthy on bare OS — environment/runtime failure"
          exit 1

  # ─── F. On-disk contract gate ──────────────────────────────────────────────
  # The config file, default policy, and persisted user schema are part of the
  # OPERATOR CONTRACT. Changing them silently breaks upgrades for existing
  # deployments. This job asserts those artefacts still parse with the current
  # build. Failing here = deliberate or accidental schema break.
  qa-contract:
    name: "QA · On-disk contract"
    # Independent layer: consumes no output or artifact from qa-logic, so it is
    # scheduled in parallel with it rather than behind it (CI-REDESIGN stage 1).
    # The PR-time skip that `needs: qa-logic` used to cascade is now stated here
    # explicitly — the aggregate still treats a skipped job as a pass.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Build
        run: go build -o culvert .

      - name: Binary exists and is executable
        # Sanity: guarantees the "Persisted users file schema" step below
        # has a binary to exercise.  -validate-config is intentionally NOT
        # invoked here because the CLI does not implement it yet; the test
        # below covers the same contract at the unit level.
        run: test -x ./culvert

      - name: Persisted users file schema is stable
        # We assert the published JSON schema — the tests in
        # qa_gate_test.go::TestConfig_TOTPLastCounter_PersistsThroughFile
        # already write and re-read the on-disk format. Here we re-run
        # that single test with -v so a schema break is called out loudly.
        run: go test -v -run TestConfig_TOTPLastCounter_PersistsThroughFile ./...

      - name: Backup archive size bounds hold at production size
        # The backup/restore archive is part of the operator contract, and its
        # decompression-bomb bounds are fixed: 256 MiB per entry, 512 MiB in
        # aggregate (restore.go). The ordinary suite proves the SAME parser
        # with kilobyte limits plus the production per-entry bound (a header,
        # no body); the production AGGREGATE bound needs 256 MiB of real body
        # read before the overflowing header, which costs tens of seconds under
        # -race, so it runs here, without -race (CI-REDESIGN stage 6A). The
        # test skips unless the env var is set, so a PASS line is required: a
        # SKIP, a missing test or any failure fails this job, and with it the
        # QA gate — a mandatory release-evidence row.
        # restore_limits_lane_test.go pins this step.
        env:
          CULVERT_RESTORE_PRODUCTION_SIZE: "1"
        run: |
          set -o pipefail
          go test -count=1 -v -run '^TestReadTarball_ProductionAggregateBound_Integration$' . | tee restore-limits.log
          grep -q -- '^--- PASS: TestReadTarball_ProductionAggregateBound_Integration ' restore-limits.log \
            || { echo "::error::the production-size restore aggregate bound did not PASS (skipped or missing)"; exit 1; }

  # ─── G. Maintenance Agent (cmd/culvert-maint) ──────────────────────────────
  # The agent is a separate Go module — `go test ./...` from the repo root
  # does NOT descend into nested modules, so its tests would silently fall
  # outside the gate without an explicit job here. D1.6a introduces a
  # privileged Maintenance Agent; CI coverage of the new module is mandatory
  # before merge.
  qa-agent:
    name: "QA · Maintenance Agent (cmd/culvert-maint)"
    # Retirement step 5 (roadmap/CI-REDESIGN.md): PR-time run superseded by the
    # Fast/Deep PR Gates; full behavior retained on main pushes and on
    # workflow_dispatch (this workflow has NO tag trigger — see the `on:` block).
    # Independent of every other job; the aggregate below treats skipped as pass
    # so the required-check name keeps reporting.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache
        with:
          cache-dependency-path: cmd/culvert-maint/go.sum

      - name: Download agent dependencies
        working-directory: cmd/culvert-maint
        run: go mod download

      - name: Verify go.mod / go.sum are tidy
        working-directory: cmd/culvert-maint
        run: |
          cp go.mod go.mod.before
          cp go.sum go.sum.before
          go mod tidy
          if ! diff -q go.mod go.mod.before >/dev/null || ! diff -q go.sum go.sum.before >/dev/null; then
            echo "::error::go.mod / go.sum drift in cmd/culvert-maint after `go mod tidy`"
            diff go.mod.before go.mod || true
            diff go.sum.before go.sum || true
            exit 1
          fi

      - name: Compile (strict)
        working-directory: cmd/culvert-maint
        run: go build -o /tmp/culvert-maint .

      - name: go vet (agent module)
        working-directory: cmd/culvert-maint
        run: go vet ./...

      - name: Tests with race detector
        working-directory: cmd/culvert-maint
        env:
          TEST_SEED: "20260421"
        run: go test -race -count=1 -timeout=10m -v ./...

      - name: Determinism — shuffled double run
        working-directory: cmd/culvert-maint
        env:
          TEST_SEED: "20260421"
        run: go test -count=2 -shuffle=on -timeout=10m ./...

      - name: Install golangci-lint
        # The reviewdog action in code-review.yml runs from the repo root
        # and does not descend into the nested module. Here we run it
        # explicitly inside cmd/culvert-maint with the same project config.
        # Checksum-verified install (sum.golang.org), not curl|sh off a tag ref.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: golangci-lint (agent module)
        working-directory: cmd/culvert-maint
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      - name: gosec (agent module)
        # G703 excluded for parity with security-release-gate.yml (taint-mode
        # variant of the already-excluded G304; see the comment there).
        working-directory: cmd/culvert-maint
        run: |
          $(go env GOPATH)/bin/gosec \
            -exclude=G104,G302,G304,G703,G704 \
            -fmt=text \
            ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1

      - name: staticcheck (agent module)
        working-directory: cmd/culvert-maint
        run: $(go env GOPATH)/bin/staticcheck ./...

      - name: shellcheck install.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck packaging/culvert-maint/install.sh

      - name: visudo -c sudoers grammar
        # The shipped sudoers file uses `{compose_path}` as a placeholder
        # in the allowed-command position (the absolute compose-file path
        # built from compose_project_dir + compose_file); the operator
        # replaces it at install time via packaging/culvert-maint/install.sh.
        # visudo -c validates sudoers grammar; the placeholder is treated
        # as a literal arg, which is grammatically valid even though it
        # would never match a real `docker compose` invocation until
        # substituted.
        run: |
          sudo visudo -c -f packaging/sudoers/culvert-maint

      - name: systemd-analyze verify
        # systemd-analyze verifies unit file syntax AND that ExecStart
        # resolves to an executable file. Stage the freshly-built binary
        # at the unit file's documented path so the verification is
        # meaningful. We gate on `command -v systemd-analyze` so the step
        # is skipped on hypothetical runner images that lack systemd-
        # analyze entirely; if it is present, failure must block the gate
        # (no continue-on-error mask).
        run: |
          if ! command -v systemd-analyze >/dev/null 2>&1; then
            echo "systemd-analyze not present on runner; skipping verify"
            exit 0
          fi
          sudo install -m 0755 /tmp/culvert-maint /usr/local/bin/culvert-maint
          systemd-analyze verify packaging/systemd/culvert-maint.service

  # ─── H. Performance-regression gate ─────────────────────────────────────────
  # Deterministic ALLOCATION-regression gate on the proxy hot paths (policy
  # Evaluate + header scrub). Keyed on allocs/op via testing.Benchmark, which is
  # hardware-independent (unlike ns/op) and identical with or without -race —
  # so this is fast (~6s) and never flaky. It exists because ordinary tests do
  # not catch a per-request allocation regression: policy Evaluate was recently
  # taken from ~2 allocs/rule (O(rules)) to O(1); without this gate that win can
  # silently regress on any PR. The benchgate-tagged tests live outside the
  # default `go test ./...`, so this is the ONLY required path that runs them.
  qa-bench:
    name: "QA · Perf-regression gate (allocs/op)"
    # Independent layer: consumes no output or artifact from qa-logic, so it is
    # scheduled in parallel with it rather than behind it (CI-REDESIGN stage 1).
    # The PR-time skip that `needs: qa-logic` used to cascade is now stated here
    # explicitly — the aggregate still treats a skipped job as a pass.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Allocation-regression gate (policy + scrub hot paths)
        run: go test -tags benchgate -run 'TestBenchGate_' -count=1 -timeout=10m -v .

  # ─── Audit: the unsharded race reference (CI-REDESIGN stage 5B) ────────────
  # QUALIFICATION mode: the weekly schedule, or a dispatch with
  # `unsharded_audit: true`. On every push, pull request and default dispatch
  # both jobs are skipped, so an ordinary run pays nothing for them. On an
  # audit execution they are part of the gate AND must be exactly `success`
  # (the aggregate's require-success): a lost test or a lost covered block
  # refuses the QA approval, and so does an audit job that was unexpectedly
  # skipped. Their artifacts carry the `qa-audit-` prefix and
  # are never release evidence (release evidence is a main-push run).
  qa-unsharded-audit:
    name: "Audit · unsharded race reference"
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.unsharded_audit)
    runs-on: ubuntu-latest
    timeout-minutes: 50  # > the 40m per-binary test budget below (compile + tee + upload)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Unsharded race + coverage run (the pre-5B qa-logic command)
        # Verbatim the single-process command qa-logic ran until stage 5B —
        # same TEST_SEED, -race, -count, per-binary -timeout and coverage scope
        # — so the comparison measures sharding, nothing else.
        # qa_race_shards_test.go pins the shards' seed and -timeout to it.
        env:
          TEST_SEED: "20260421"
        run: |
          set -o pipefail
          mkdir -p qa-audit-reference
          go test -race -count=1 -timeout=40m -coverprofile=qa-audit-reference/coverage.out -v ./... \
            2>&1 | tee qa-audit-reference/logic.log

      - name: Upload the unsharded reference
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-audit-reference
          path: qa-audit-reference/
          retention-days: 14
          if-no-files-found: warn

  qa-unsharded-audit-compare:
    name: "Audit · sharded vs unsharded"
    # The edge carries DATA: the reference's log and profile, and qa-race's
    # inventory, results and merged profile.
    needs: [qa-race, qa-unsharded-audit]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.unsharded_audit))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download the unsharded reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: qa-audit-reference
          path: reference

      - name: Download the sharded run's inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: qa-race-build
          path: race-build

      - name: Download the sharded run's verdict
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: qa-race-verdict
          path: race-verdict

      # Each download is independent (continue-on-error): a failed reference
      # still yields its log and timings below, and the compare step names
      # exactly which input is missing.
      - name: Compare inventory, results and EVERY covered block with the reference
        # A block the reference covered and the sharded run did not fails here
        # unless .github/qa-root-shard-coverage-exceptions.json justifies it —
        # that file is expected to be empty.
        run: |
          set -o pipefail
          mkdir -p audit-compare
          missing=0
          for f in reference/logic.log reference/coverage.out race-build/list.txt \
                   race-verdict/results.json race-verdict/merged.cover.out; do
            [ -s "$f" ] || { echo "::error::comparison input $f is missing (its producer failed or published nothing)"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          go run ./cmd/rootshard compare \
            -ref-log reference/logic.log -ref-profile reference/coverage.out \
            -pilot-results race-verdict/results.json -pilot-profile race-verdict/merged.cover.out \
            -list race-build/list.txt -pkg "$(go list .)" \
            -coverage-exceptions .github/qa-root-shard-coverage-exceptions.json \
            -out audit-compare/comparison.json -baseline-out audit-compare/reference-timings.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Coverage floors, reference vs sharded (same unchanged script)
        if: always()
        run: |
          # +e: both verdicts are recorded before either decides the step.
          set +e -u
          mkdir -p audit-compare
          .github/scripts/coverage-floor.sh reference/coverage.out > audit-compare/floors-reference.txt; ref=$?
          .github/scripts/coverage-floor.sh race-verdict/merged.cover.out > audit-compare/floors-sharded.txt; sharded=$?
          echo "coverage-floor.sh exit: reference=$ref sharded=$sharded"
          diff -u audit-compare/floors-reference.txt audit-compare/floors-sharded.txt | tee audit-compare/floors.diff || true
          [ "$ref" = "$sharded" ] || { echo "::error::the floors verdict differs between the reference and the sharded run"; exit 1; }

      - name: Refreshed timing file from this reference (candidate for .github/qa-root-shard-timings.json)
        if: always()
        run: |
          mkdir -p audit-compare
          go run ./cmd/rootshard timings -log reference/logic.log -pkg "$(go list .)" \
            -source "qa-gate run ${{ github.run_id }} @ ${{ github.sha }}" -out audit-compare/qa-root-shard-timings.json

      - name: Both sides must have succeeded
        if: always()
        run: |
          set -eu
          fail=0
          for pair in "qa-unsharded-audit=${{ needs.qa-unsharded-audit.result }}" "qa-race=${{ needs.qa-race.result }}"; do
            echo "$pair"
            [ "${pair#*=}" = success ] || { echo "::error::${pair%%=*} did not succeed (${pair#*=})"; fail=1; }
          done
          exit $fail

      - name: Evidence, compact (last in the log, readable without the artifact)
        # One JSON document per line at the END of the job log, so the evidence
        # survives log-tail retrieval where artifact downloads are unavailable.
        if: always()
        run: |
          for f in race-verdict/verdict.json audit-compare/comparison.json \
                   audit-compare/reference-timings.json audit-compare/qa-root-shard-timings.json; do
            [ -s "$f" ] && echo "EVIDENCE $f $(jq -c . "$f")" || echo "EVIDENCE $f MISSING"
          done

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-audit-compare
          path: audit-compare/
          retention-days: 14
          if-no-files-found: warn

  # ─── Gate summary ───────────────────────────────────────────────────────────
  qa-gate-approved:
    name: "✅ QA Gate — APPROVED"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - qa-logic
      - qa-race
      - qa-determinism
      - qa-coverage
      - qa-infra-compose
      - qa-os
      - qa-contract
      - qa-agent
      - qa-bench
      - qa-unsharded-audit
      - qa-unsharded-audit-compare
    # always() + skipped-as-pass: on PRs every QA job skips on its OWN
    # `if: github.event_name != 'pull_request'` (superseded by the Fast/Deep PR
    # Gates — retirement step 5) but this check name must keep reporting success
    # so a branch-protection rule requiring it can never wedge a PR at
    # "Expected". On main pushes and workflow_dispatch all nine substantive
    # jobs run and failure/cancellation of ANY of them fails the gate as before —
    # including a qa-race failure, which still refuses this approval. A failed
    # qa-race SKIPS qa-coverage (it publishes no profile to enforce against)
    # and this aggregate reads that skip as a pass — which is correct only
    # because qa-race's own `failure` is in the same `needs` set and refuses
    # on its own. Never drop qa-race from that set. The two audit jobs skip
    # unless the run is an audit (weekly schedule or `unsharded_audit`
    # dispatch); on an audit, skipped-as-pass would let an audit that never
    # ran approve, so require-success names them — and the jobs they consume
    # — as exactly `success`.
    #
    # A MAIN PUSH IS RELEASE EVIDENCE, so it carries its own require-success
    # naming all nine substantive jobs. Without it the skipped-as-pass rule
    # applied here too: every job skipping on a main push (a path filter, a
    # mistyped `if:`, a cancellation before any job started) left THIS job —
    # `if: always()` — the only one that ran, so it reported APPROVED and the
    # workflow concluded `success`. require-gate.sh refuses a workflow-level
    # `skipped`, but this shape never produces one, so `qa-gate.yml mandatory`
    # in .github/release-evidence.txt was satisfiable with no test having run.
    # The arms are disjoint: `push` is never an audit event, and the workflow's
    # push trigger is `branches: [main]`, which is exactly the run release
    # gating reads. Pull requests and ordinary dispatches still require
    # nothing — a PR must keep reporting success (pass-through) and a dispatch
    # is never release evidence.
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/needs-verdict
        with:
          needs-json: ${{ toJSON(needs) }}
          title: "✅ QA Gate — APPROVED"
          require-success: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.unsharded_audit)) && 'qa-race,qa-coverage,qa-unsharded-audit,qa-unsharded-audit-compare' || github.event_name == 'push' && 'qa-logic,qa-race,qa-determinism,qa-coverage,qa-infra-compose,qa-os,qa-contract,qa-agent,qa-bench' || '' }}
          extra-summary: ${{ github.event_name == 'pull_request' && 'PASS-THROUGH on PRs — QA is enforced by the Fast/Deep PR Gates (roadmap/CI-REDESIGN.md, step 5); this gate runs fully on main pushes.' || '' }}

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ QA Gate Passed

          | Layer | Job | Status |
          |-------|-----|--------|
          | Compile + vet     | qa-logic | ✅ |
          | Application logic (race + coverage, 4 root shards + lane) | qa-race | ✅ |
          | Determinism       | qa-determinism | ✅ |
          | Coverage floor    | qa-coverage (floors on qa-race's verdict-checked profile) | ✅ |
          | Infra (Docker Compose) | qa-infra-compose | ✅ |
          | OS / environment  | qa-os | ✅ |
          | On-disk contract  | qa-contract | ✅ |
          | Maintenance Agent (cmd/culvert-maint) | qa-agent | ✅ |
          | Perf-regression (allocs/op) | qa-bench | ✅ |

          **Interpretation**
          - If `qa-race` (or `qa-logic`) was the only red job, the code is wrong.
            A red `qa-race` verdict that names MISSING or INCOMPLETE evidence
            (not a failed test) is a sharding/infrastructure fault to diagnose,
            never to retry away — see roadmap/CI-REDESIGN.md §14.
          - If `qa-race` was green but `qa-infra-compose` was red, the
            Docker/compose graph is the problem — not the application.
          - If `qa-race` was green but `qa-os` was red, the runner or
            build-environment is the problem — not the application.
          - `qa-determinism` failures are flakes or order-dependent tests;
            they must be pinned, not retried away.
          - `qa-coverage` runs no tests. A red there is a real floor breach in
            the profile `qa-race` produced, not a second test run disagreeing
            with the first.
          EOF
