## ─────────────────────────────────────────────────────────────────────────────
## Culvert — root-suite sharding PILOT (CI-REDESIGN stage 5A)
## ─────────────────────────────────────────────────────────────────────────────
## A REUSABLE workflow, called only from qa-gate.yml when a manual dispatch sets
## `root_shard_pilot: true` (default false). It has no trigger of its own, so it
## is runnable from a candidate branch before it exists on the default branch,
## and it can never run on a push, a pull request, a tag or a schedule.
##
## What it proves: the root package's race+coverage suite (the ~24-minute
## single process inside qa-logic) can run as N isolated processes WITHOUT
## silently losing a test, a coverage block or a failure. It is evidence for a
## decision (stage 5B), NOT a gate: nothing here is a required check, the
## `✅ QA Gate — APPROVED` aggregate does not wait for it, and its artifacts
## (all prefixed `qa-root-shard-pilot-`) are never release evidence.
##
## Shape:
##   pilot-build   compile the root race+coverage test binary ONCE; discover
##                 the inventory from the binary itself (-test.list); partition
##                 it by measured duration into verified, anchored selections
##   pilot-shard   N jobs, each on its own runner, running its selections
##                 against THAT binary from the SAME checkout path (the binary
##                 carries absolute source paths — pkgSourceDir uses
##                 runtime.Caller, and tests read source, docs, frontend assets
##                 and fixtures and invoke Go)
##   pilot-lane    every OTHER package of `go list ./...` as whole packages,
##                 race + coverage (parallel with the build)
##   pilot-verdict reject failed/cancelled/missing shards, inventory mismatches
##                 and unusable/incompatible profiles; merge all profiles by
##                 block; enforce the UNCHANGED coverage-floor.sh
##
## Failures are never retried: a red shard stays red and its evidence is
## uploaded for diagnosis. The comparison with the unsharded qa-logic run of
## the same commit lives in qa-gate.yml (`qa-root-shard-pilot-compare`),
## because only the caller can wait for qa-logic.
## ─────────────────────────────────────────────────────────────────────────────

name: QA root-shard pilot

on:
  workflow_call:
    inputs:
      shards:
        description: "Number of isolated root-package shards"
        type: number
        default: 4

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The unsharded reference's seed (qa-logic), so both runs see the same RNG.
  TEST_SEED: "20260421"

jobs:
  pilot-build:
    name: "Pilot · compile once + partition"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Build the pilot tool
        run: go build -o pilot-build/rootshard ./cmd/rootshard

      - name: Compile the root race+coverage test binary once, list its entries
        # `go test -c -race -cover .` — the reference's flags for the root
        # package; no -trimpath (compiled-in source paths must resolve on the
        # shard runners, which check out the same commit at the same path).
        run: pilot-build/rootshard build -out-dir pilot-build -commit "$GITHUB_SHA"

      - name: Partition by measured duration
        id: plan
        run: |
          set -euo pipefail
          pilot-build/rootshard plan \
            -list pilot-build/list.txt \
            -timings .github/qa-root-shard-timings.json \
            -pkg "$(jq -r .package pilot-build/manifest.json)" \
            -shards "${{ inputs.shards }}" \
            -out pilot-build/plan.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "shards=$(jq -c '[.shards[].index]' pilot-build/plan.json)" >> "$GITHUB_OUTPUT"

      - name: Upload the binary, inventory and plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-root-shard-pilot-build
          path: pilot-build/
          retention-days: 7
          if-no-files-found: error

  pilot-shard:
    name: "Pilot · root shard ${{ matrix.shard }}"
    needs: pilot-build
    runs-on: ubuntu-latest
    # > the 40m per-process -test.timeout the reference uses, plus setup.
    timeout-minutes: 50
    strategy:
      # Every shard runs to completion even when another fails: the verdict
      # needs ALL the evidence, and a failure is never retried away.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pilot-build.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tests invoke Go (go run / go build / go list), so the shard needs the
      # same toolchain and module cache the reference had.
      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Download the prebuilt binary and plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-root-shard-pilot-build
          path: pilot-build

      - name: Run the shard against the prebuilt binary
        # run-shard refuses a different binary, commit, toolchain or checkout
        # path, proves the binary's own -test.list selects exactly the planned
        # entries, then runs them with the reference's per-binary flags
        # (-timeout is qa-logic's; qa_root_shard_pilot_test.go pins the two).
        run: |
          chmod +x pilot-build/rootshard pilot-build/root.test
          pilot-build/rootshard run-shard \
            -plan pilot-build/plan.json -manifest pilot-build/manifest.json \
            -binary pilot-build/root.test -shard "${{ matrix.shard }}" \
            -out-dir "pilot-shards/shard-${{ matrix.shard }}" -commit "$GITHUB_SHA" -timeout 40m

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-root-shard-pilot-shard-${{ matrix.shard }}
          path: |
            pilot-shards/
            !pilot-shards/**/gocoverdir-*
            !pilot-shards/**/scratch-*
          retention-days: 7
          if-no-files-found: warn

  pilot-lane:
    name: "Pilot · non-root packages"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Race + coverage over every package except the root
        # `go list ./...` minus the EXACT root import path — cmd/, internal/
        # and any future package, whole packages, the reference's flags.
        run: go run ./cmd/rootshard run-lane -out-dir pilot-lane -commit "$GITHUB_SHA" -timeout 40m

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-root-shard-pilot-lane
          path: pilot-lane/
          retention-days: 7
          if-no-files-found: warn

  pilot-verdict:
    name: "Pilot · verdict + merged coverage floors"
    needs: [pilot-build, pilot-shard, pilot-lane]
    # always(): a failed or cancelled shard must still produce a verdict that
    # names it — never a silently skipped check.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: qa-root-shard-pilot-build
          path: pilot-build

      - name: Download shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: qa-root-shard-pilot-shard-*
          path: pilot-shards
          merge-multiple: true

      - name: Download lane evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: qa-root-shard-pilot-lane
          path: pilot-lane

      - name: Verdict (every shard, the lane, identity, inventory, profiles)
        # Runs from source, not the uploaded tool binary: the verdict must not
        # depend on an artifact it is judging.
        run: |
          set -o pipefail
          go run ./cmd/rootshard verdict -build-dir pilot-build -shards-dir pilot-shards \
            -lane-dir pilot-lane -out-dir pilot-verdict | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enforce the unchanged coverage floors on the merged profile
        # The SAME script, global floor, nine per-file floors and averaging as
        # qa-coverage / the Fast PR Gate — only the profile's origin differs.
        run: |
          set -o pipefail
          .github/scripts/coverage-floor.sh pilot-verdict/merged.cover.out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Every pilot job must have succeeded
        # The verdict judges the evidence; this judges the jobs. A cancelled or
        # timed-out shard that somehow left usable-looking evidence still fails.
        if: always()
        run: |
          set -eu
          fail=0
          for pair in "pilot-build=${{ needs.pilot-build.result }}" \
                      "pilot-shard=${{ needs.pilot-shard.result }}" \
                      "pilot-lane=${{ needs.pilot-lane.result }}"; do
            echo "$pair"
            [ "${pair#*=}" = success ] || { echo "::error::${pair%%=*} did not succeed (${pair#*=})"; fail=1; }
          done
          exit $fail

      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-root-shard-pilot-verdict
          path: pilot-verdict/
          retention-days: 7
          if-no-files-found: warn
