# Proxy Traffic-Plane PR Gate (CI quality program — PR-1)
#
# Fast, deterministic, NON-BLOCKING smoke that pushes REAL traffic through a
# REAL proxy listener: HTTP forward (POST + identity-header scrubbing), a
# CONNECT byte-relay tunnel against an in-process loopback echo fixture, a
# 10-client concurrency check (default-deny holds, then allow holds), and
# policy-through-proxy allow/block/default-deny.
#
# Deliberately separate from qa-gate.yml: this does NOT modify or gate the
# existing required checks. It is wired as pull_request + workflow_dispatch and
# is intended to stay advisory until the traffic-plane suite is proven stable,
# at which point it can be promoted to a required check. See
# docs/ci/proxy-quality-architecture.md.

name: Proxy Traffic-Plane PR Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  proxy-traffic-smoke:
    name: Proxy traffic-plane smoke (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build (compile proxy + tests)
        run: go build ./...

      # Race detector ON (matches qa-logic), single count, no shuffle — the
      # combination the existing required gates actually run. The traffic-plane
      # tests are hermetic (no public internet, no Docker): an in-process TCP
      # echo upstream + the real proxy listener.
      - name: Proxy traffic-plane E2E (HTTP forward, CONNECT relay, concurrency, policy)
        id: traffic
        run: |
          set -o pipefail
          go test -race -count=1 -timeout=10m -v \
            -run 'TestProxyE2E_|TestUNAUTH_HTTP_|TestUNAUTH_CONNECT_|TestSOCKS5_' \
            . 2>&1 | tee proxy-traffic.log

      - name: Step summary
        if: always()
        run: |
          {
            echo "## Proxy Traffic-Plane Smoke"
            echo ""
            if [ "${{ steps.traffic.outcome }}" = "success" ]; then
              echo "✅ Real traffic flowed through the proxy and every assertion held."
            else
              echo "❌ A traffic-plane assertion failed. Debug order:"
              echo ""
              echo "1. **Which test** — grep \`--- FAIL\` in the artifact \`proxy-traffic.log\`."
              echo "2. **Which proxy path** — \`CONNECT_ByteRelay\` (tunnel relay), \`HTTPForward\` (forward + header scrub), \`Concurrency\` (default-deny under load), \`PolicyThroughProxy\` (allow/block/deny)."
              echo "3. **Was upstream reached** — the test prints backend/echo accept counts on failure."
              echo "4. **What policy matched** — POLICY_ALLOW / POLICY_BLOCK / POLICY_DEFAULT_DENY lines in the log."
            fi
            echo ""
            echo "Scope: HTTP forward, CONNECT byte relay, 10-client concurrency, policy allow/block/default-deny."
            echo "This gate is **advisory** (non-blocking). See \`docs/ci/proxy-quality-architecture.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traffic log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proxy-traffic-log
          path: proxy-traffic.log
          retention-days: 7
