name: Appliance Console

on:
  pull_request:
    paths:
      - 'appliance/console/**'
      - '.github/workflows/appliance-console.yml'
  push:
    branches: [feat/appliance-console]
    paths:
      - 'appliance/console/**'
      - '.github/workflows/appliance-console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Console state, display and authentication boundary tests
        run: python3 -m unittest discover -s appliance/console -p 'test_*.py' -v
      - name: Syntax and degraded-host smoke
        run: |
          bash -n appliance/console/install.sh
          bash -n appliance/console/profile.sh
          python3 -I appliance/console/launch.py --json | python3 -m json.tool
