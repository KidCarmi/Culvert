# Frontend verification (FE-1A, ADR-FE-001) — reusable implementation.
#
# The only REQUIRED CI lane that installs and verifies the new frontend
# dependency/build toolchain. (The advisory playwright-go UI-E2E lane still
# uses npm to stage its browser driver until the legacy UI retires at
# FE-8/FE-9.) The appliance runtime and every Go build path stay Node-free:
# frontend/dist and src/api/types.gen.ts are COMMITTED generated output, and
# this lane proves they are exactly what the pinned toolchain regenerates
# (drift gates), that the build is deterministic, and that the drift gates
# themselves cannot regress (tamper harness).
#
# REQUIRED-GATE WIRING: this workflow is a `workflow_call` dependency of the
# Fast PR Gate (`pr-fast-gate.yml` job `frontend`, aggregated into
# "✅ Fast PR Gate — APPROVED"). It deliberately has NO pull_request trigger
# of its own — PR enforcement flows only through the Fast Gate aggregate, so
# no second required branch-protection check exists.
#
# CANONICAL ENVIRONMENT: the build bytes are produced inside the digest-pinned
# Node 24.19.0 Linux container below (the accepted canonical deterministic
# build environment), not on the mutable host runner image. The host runner is
# only the execution substrate.
#
# The contract lives in repository scripts, not in this YAML — CI runs the
# same commands a developer runs:
#   npm run verify                        (frontend/scripts/verify.sh)
#   sh scripts/verify-determinism.sh 2    (frontend/scripts/verify-determinism.sh)
#   sh scripts/test-drift-gate.sh         (frontend/scripts/test-drift-gate.sh)
name: Frontend Verify

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      determinism_builds:
        description: "Isolated clean builds for the determinism proof (5 = qualification evidence)"
        required: false
        default: "2"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "api/openapi/openapi.json"
      - ".github/workflows/frontend-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    name: "Frontend · verify + determinism"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Canonical pinned frontend build environment (index digest covers all
      # platforms; CI resolves linux/amd64). Node 24.19.0 / npm 11.17.0 are
      # re-asserted inside by scripts/assert-toolchain.sh.
      image: node:24.19.0-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The container user differs from the workspace owner; the drift gates
      # are git-status based and must not trip gitleaks-era ownership guards.
      - name: Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The pinned toolchain identity is a contract (ADR-FE-001): fail fast
      # and loudly if the container ever drifts from Node 24.19.0/npm 11.17.0.
      - name: Toolchain identity
        run: sh scripts/assert-toolchain.sh

      # Canonical gate: clean ignore-scripts install (policy proven in BOTH
      # npm trees), OpenAPI type generation + porcelain drift gate, lint,
      # format, strict typecheck, unit tests, production build +
      # committed-dist porcelain drift gate, generated-bundle security scan,
      # license policy, vulnerability policy.
      - name: Verify (canonical contract)
        run: npm run verify

      # The drift gates themselves are regression-tested: tamper classes
      # A–D (modified byte, committed deletion + untracked regeneration,
      # rogue dist file, deleted dist asset) must FAIL and clean
      # regeneration (E) must PASS, in a synthetic repo.
      - name: Drift-gate tamper harness
        run: sh scripts/test-drift-gate.sh

      # Isolated clean builds must be byte-identical (full-tree inventory +
      # SHA-256, every file). PR runs build twice to catch nondeterminism
      # regressions; qualification evidence dispatches with 5.
      - name: Determinism (isolated clean builds)
        run: sh scripts/verify-determinism.sh "${{ inputs.determinism_builds || '2' }}"
