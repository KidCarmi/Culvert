name: Auth IdP Interop
# Least-privilege default: jobs that need write scopes (packages, checks,
# contents, security-events, pull-requests) declare them at job level.
permissions:
  contents: read


on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 2"

concurrency:
  group: auth-idp-interop-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CULVERT_KEYCLOAK_BASE_URL: http://127.0.0.1:8081
  CULVERT_KEYCLOAK_REALM: culvert
  CULVERT_KEYCLOAK_CLIENT_ID: culvert-proxy
  CULVERT_KEYCLOAK_CLIENT_SECRET: culvert-secret
  CULVERT_KEYCLOAK_USERNAME: alice
  CULVERT_KEYCLOAK_PASSWORD: alice-password

jobs:
  keycloak-oidc:
    name: Keycloak OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Start Keycloak
        run: |
          docker run -d --name culvert-keycloak \
            -p 127.0.0.1:8081:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/.github/idp/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.6.1 \
            start-dev --import-realm

      - name: Wait for Keycloak realm
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$CULVERT_KEYCLOAK_BASE_URL/realms/$CULVERT_KEYCLOAK_REALM/.well-known/openid-configuration" >/dev/null; then
              echo "Keycloak is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak did not become ready in time."
          docker logs culvert-keycloak
          exit 1

      - name: Run Keycloak OIDC interop test
        run: go test -run TestKeycloakOIDCInterop_ResolveIdentity -count=1 -timeout=5m .

      - name: Keycloak logs
        if: failure()
        run: docker logs culvert-keycloak

  simplesamlphp-saml:
    name: SimpleSAMLphp SAML
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Generate SimpleSAMLphp IdP certificate
        run: |
          mkdir -p .github/idp/simplesamlphp/cert
          openssl req -newkey rsa:3072 -new -x509 -days 2 -nodes \
            -subj "/CN=simplesamlphp.culvert.test" \
            -out .github/idp/simplesamlphp/cert/idp.crt \
            -keyout .github/idp/simplesamlphp/cert/idp.pem
          # openssl writes the key 0600 owned by the runner user; www-data in
          # the container must be able to read it to sign assertions.
          chmod 644 .github/idp/simplesamlphp/cert/idp.pem

      - name: Start SimpleSAMLphp
        run: |
          docker run -d --name culvert-simplesamlphp \
            -p 127.0.0.1:8082:80 \
            --mount type=bind,source="$PWD/.github/idp/simplesamlphp/cert",target=/var/simplesamlphp/cert,readonly \
            --mount type=bind,source="$PWD/.github/idp/simplesamlphp/authsources.php",target=/var/simplesamlphp/config/authsources.php,readonly \
            --mount type=bind,source="$PWD/.github/idp/simplesamlphp/config-override.php",target=/var/simplesamlphp/config/config-override.php,readonly \
            --mount type=bind,source="$PWD/.github/idp/simplesamlphp/saml20-idp-hosted.php",target=/var/simplesamlphp/metadata/saml20-idp-hosted.php,readonly \
            --mount type=bind,source="$PWD/.github/idp/simplesamlphp/saml20-sp-remote.php",target=/var/simplesamlphp/metadata/saml20-sp-remote.php,readonly \
            --mount type=bind,source="$PWD/.github/idp/simplesamlphp/ssp-http.conf",target=/etc/apache2/conf-enabled/ssp-http.conf,readonly \
            -e SSP_ADMIN_PASSWORD=admin-password \
            -e SSP_SECRET_SALT=culvert-interop-salt \
            -e SSP_ENABLE_IDP=true \
            -e SSP_ENABLED_MODULES="exampleauth saml" \
            -e SSP_APACHE_ALIAS=simplesaml/ \
            cirrusid/simplesamlphp:v2.5.0

      - name: Discover SimpleSAMLphp metadata URL
        run: |
          for i in $(seq 1 60); do
            for path in \
              /simplesaml/saml2/idp/metadata.php \
              /simplesaml/module.php/saml/idp/metadata \
              /simplesaml/module.php/saml/idp/metadata.php; do
              url="http://127.0.0.1:8082$path"
              if curl -fsS "$url" | grep -q 'EntityDescriptor'; then
                echo "CULVERT_SIMPLESAML_METADATA_URL=$url" >> "$GITHUB_ENV"
                echo "SimpleSAMLphp metadata is ready at $url"
                exit 0
              fi
            done
            sleep 2
          done
          echo "SimpleSAMLphp metadata did not become ready in time."
          echo "::group::Last metadata response"
          curl -isS "http://127.0.0.1:8082/simplesaml/module.php/saml/idp/metadata" || true
          echo "::endgroup::"
          docker exec culvert-simplesamlphp sh -lc 'ls -la /var/simplesamlphp/config /var/simplesamlphp/metadata /var/simplesamlphp/cert || true'
          docker logs culvert-simplesamlphp
          exit 1

      - name: Run SimpleSAMLphp SAML interop test
        run: go test -run TestSimpleSAMLphpInterop_CompilesProviderFromMetadataURL -count=1 -timeout=5m .

      - name: SimpleSAMLphp logs
        if: failure()
        run: docker logs culvert-simplesamlphp

  openldap:
    name: OpenLDAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CULVERT_OPENLDAP_URL: ldap://127.0.0.1:3389
      CULVERT_OPENLDAP_LDAPS_URL: ldaps://127.0.0.1:3636
      CULVERT_OPENLDAP_BIND_DN: cn=admin,dc=corp,dc=example
      CULVERT_OPENLDAP_BIND_PASSWORD: admin-password
      CULVERT_OPENLDAP_BASE_DN: dc=corp,dc=example

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      # Pinned OpenLDAP with the memberof overlay enabled by default; the
      # deterministic fixture directory (.github/idp/openldap/bootstrap.ldif)
      # seeds users alice/bob and the engineering group. Credentials are
      # fixture-only. The image auto-generates a self-signed TLS certificate,
      # so the ldaps/StartTLS interop paths run without extra material.
      - name: Start OpenLDAP
        run: |
          docker run -d --name culvert-openldap \
            -p 127.0.0.1:3389:389 -p 127.0.0.1:3636:636 \
            -e LDAP_ORGANISATION="Culvert Interop" \
            -e LDAP_DOMAIN=corp.example \
            -e LDAP_ADMIN_PASSWORD=admin-password \
            -v "$PWD/.github/idp/openldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro" \
            osixia/openldap:1.5.0 --copy-service

      - name: Wait for OpenLDAP fixture
        run: |
          for i in $(seq 1 60); do
            if docker exec culvert-openldap ldapsearch -x -H ldap://localhost \
                 -D "cn=admin,dc=corp,dc=example" -w admin-password \
                 -b "dc=corp,dc=example" "(uid=alice)" dn 2>/dev/null | grep -q "uid=alice"; then
              echo "OpenLDAP fixture is ready."
              exit 0
            fi
            sleep 2
          done
          echo "OpenLDAP fixture did not become ready in time."
          docker logs culvert-openldap
          exit 1

      - name: Run OpenLDAP interop tests
        run: go test -run TestOpenLDAPInterop -count=1 -timeout=5m .

      - name: OpenLDAP logs
        if: failure()
        run: docker logs culvert-openldap
