# ─────────────────────────────────────────────────────────────────────────────
# _build-image — reusable PR-ONLY image build (build once, consume many).
#
# Builds the proxy image a single time (linux/amd64, never pushed) and
# publishes it as a `docker save` artifact so downstream PR jobs — trivy
# image scan, compose validation, e2e — can `docker load` it instead of
# each rebuilding the image from scratch (previously rebuilt up to ~13×
# per PR across workflows).
#
# ▓▓ SCOPE GUARD ▓▓  This workflow is for PR validation ONLY. The main-push /
# tag `docker` job in ci.yml is release machinery — it computes the next
# version, pushes + retags multi-arch images, cosign-signs them, and exports
# `proxy_digest` that catalog-pipeline consumes. That path MUST NOT be
# migrated onto this reusable workflow.
# ─────────────────────────────────────────────────────────────────────────────
name: Build Image (PR, reusable)

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Local tag for the built image"
        type: string
        default: "culvert:ci-smoke"
      artifact-name:
        description: "Artifact name for the saved image tarball"
        type: string
        default: "culvert-image-amd64"
      retention-days:
        type: number
        default: 1
    outputs:
      image-tag:
        description: "Tag the image was built with (docker load restores it)"
        value: ${{ inputs.image-tag }}
      artifact-name:
        value: ${{ inputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: "Build proxy image (amd64, artifact-shared)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Candidate version (SemVer prerelease naming the commit built)
        # vX.Y.(Z+1)-candidate.g<sha12>, supplied to BOTH the proxy and the
        # bundled maintenance-agent builds (one VERSION build-arg). A "dev"
        # stamp made first boot refuse the bundled agent, so candidate OVAs
        # never had one (PR #1528 §3f L11). On a pull_request the checkout is
        # the merge commit: the stamp names the PR head only when the built
        # tree IS the head's tree, else the merge commit actually built — and
        # build-ova.sh then refuses it as a candidate for the head.
        id: ver
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          built="$(git rev-parse HEAD)" src="$SOURCE_SHA"
          if [ "$built" != "$src" ]; then
            git fetch -q --no-tags --depth=1 origin "$src"
            if ! git diff --quiet "$src" "$built"; then
              echo "::notice::built tree ($built) differs from $src; the version names the commit actually built"
              src="$built"
            fi
          fi
          v="$(.github/scripts/pr-candidate-version.sh "$src")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "candidate version: $v (built $built)"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (amd64 only — no QEMU/arm64 on the PR path)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ inputs.image-tag }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          # PR-written GHA caches are branch-isolated (not shared across PRs),
          # so scope=pr-image alone is a permanent cold start. Fall back to
          # the default-scope cache written by ci.yml's main-push docker job.
          cache-from: |
            type=gha,scope=pr-image
            type=gha
          cache-to: type=gha,mode=max,scope=pr-image

      - name: Save image tarball
        run: docker save "${{ inputs.image-tag }}" -o culvert-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: culvert-image.tar
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
