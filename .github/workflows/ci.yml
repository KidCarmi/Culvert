# NOTE: the workflow name "CI" is load-bearing — publish-catalog-r2.yml
# triggers on `workflow_run: workflows: ["CI"]`. Renaming this workflow
# silently stops signed-catalog publication to the R2 origin.
name: CI
# Least-privilege default: jobs that need write scopes (packages, checks,
# contents, security-events, pull-requests) declare them at job level.
permissions:
  contents: read


on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      # M1-4: dispatching ci.yml AT A TAG REF with resign=true runs ONLY the
      # catalog-resign job (no-bump freshness re-sign under the pinned
      # ci.yml@refs/tags/v* signing identity). A bare tag dispatch (resign
      # unset) is REFUSED by the resign-dispatch-guard job (OPS-F1: it must
      # never re-run the whole pipeline / overwrite release assets).
      resign:
        description: "Re-sign the tag's existing catalog bundle (freshness only; no rebuild)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # PRs: fast-cancel superseded runs. Main/tags: QUEUE instead — cancelling a
  # main run mid-flight can kill release machinery after images were pushed
  # but before auto-tag ran, orphaning ghcr tags (CI review P1-3).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip on PRs (CI review): duplicates the Fast PR Gate's hygiene job
    # (fmt/vet/build) exactly; this job remains the main/tag-path build that
    # feeds smoke/docker/auto-tag/release. Tag-ref dispatches (M1-4 resigns)
    # skip too: the reduced resign path needs no build.
    if: >-
      github.event_name != 'pull_request' &&
      !(github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/'))

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      # Repo-wide gofmt gate. Hard-fails on any unformatted file. Unlike the
      # diff-scoped reviewdog lint in code-review.yml, this checks every file
      # and runs on pushes too, so accumulated formatting drift can't slip in.
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # PR-time tests/lint/security live in the Fast/Deep PR Gates; the full
      # QA/security gates run on main pushes and tags; fuzzing is scheduled
      # (fuzz-nightly.yml). This job only verifies compilation on the
      # main/tag path.
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o culvert .

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: culvert-linux-amd64
          path: culvert
          retention-days: 7

  dependency-obituary:
    name: Dependency Obituary
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # ADVISORY (not merge-blocking). The action (KidCarmi/Dependency-Obituary)
    # exposes only `threshold` — no per-package allowlist/ignore and no
    # fail-on-regression mode. The keyless release-catalog verifier (P2b,
    # sigstore-go) transitively requires github.com/blang/semver v3.5.1 (health
    # score 0 — the v3 import path is frozen since 2019; rekor/pkg/types pins it)
    # plus several at-risk deps that are ALSO pre-existing direct deps of this
    # repo (crewjam/saml, beevik/etree, cespare/xxhash, dustin/go-humanize).
    # Since a score-0 package can't be passed by any non-zero threshold and the
    # action can't allowlist it, the job is made advisory: the bot still posts
    # its full dependency scorecard for visibility, but a low score no longer
    # blocks the PR. Revisit if the action gains an allowlist/regression mode.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: KidCarmi/Dependency-Obituary@9a35b0a193035bc746428bfdc9664f0ee0818028 # main @ 2026-07-03
        # step-level continue-on-error so the JOB (and its check run) concludes
        # success — a job-level flag would leave the check red on the PR.
        continue-on-error: true
        with:
          threshold: "60"

  smoke:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip on PRs (CI review): a full compose image build per PR; the Deep PR
    # Gate's build-image + compose-validate covers container-surface PRs.
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      !(github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/'))

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build proxy image from branch source
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build proxy

      - name: Start proxy (no deps — skips ClamAV)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-deps proxy

      - name: Wait for healthy (fail fast on container exit)
        timeout-minutes: 3   # loop budget is 120s — pad so the loop's own FAIL diagnostic wins, not a step-timeout cancel
        run: |
          for i in $(seq 1 24); do
            STATE=$(docker inspect --format='{{.State.Status}}' culvert 2>/dev/null || echo "missing")
            if [ "$STATE" != "running" ]; then
              echo "FAIL: container is not running (state=$STATE)"
              exit 1
            fi
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' culvert 2>/dev/null || echo "unknown")
            echo "Attempt $i/24: container=$STATE health=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "FAIL: container did not become healthy within 120s"
          exit 1

      - name: Health check (/health — liveness)
        run: |
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'

      - name: Readiness check (/ready — subsystems up, 3 attempts)
        run: |
          for i in 1 2 3; do
            if curl -sf http://localhost:8080/ready 2>/dev/null | grep -q '"status":"ready"'; then
              echo "Ready check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 2s..."
            sleep 2
          done
          echo "FAIL: /ready did not return ready after 3 attempts"
          exit 1

      - name: Diagnostics and teardown
        if: always()
        run: |
          echo "=== docker compose ps ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          echo "=== docker compose logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color proxy
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # OPS-F1 fail-fast (M1-4): a workflow_dispatch AT A TAG REF exists ONLY for
  # the catalog re-sign. A bare tag dispatch must fail LOUDLY instead of
  # re-running the whole pipeline (docker rebuild ⇒ new digest ⇒ softprops
  # would overwrite the release's immutable catalog bundle). The heavy jobs are
  # additionally gated structurally: `docker` skips on tag dispatches, which
  # skips its whole needs-chain (catalog-pipeline, release, provenance).
  resign-dispatch-guard:
    name: "Supply Chain · Tag-dispatch guard"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Refuse a bare tag dispatch (resign runs are the only tag dispatches)
        env:
          RESIGN: ${{ inputs.resign }}
        run: |
          set -euo pipefail
          if [ "$RESIGN" != "true" ]; then
            echo "FATAL: ci.yml was dispatched at a tag ref WITHOUT resign=true."
            echo "       Tag dispatches exist only for the catalog re-sign; a bare"
            echo "       dispatch would rebuild + overwrite release assets (OPS-F1)."
            exit 1
          fi
          echo "resign dispatch confirmed"

  docker:
    name: Docker Build & Publish
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [test, smoke]
    # Skip on PRs (retirement step, roadmap/CI-REDESIGN.md §3.9): the PR run
    # built multi-arch amd64+arm64 via QEMU with push:false — pure cost. The
    # Deep PR Gate builds + trivy-scans the amd64 image on PRs that touch the
    # container surface, and the Fast PR Gate compile-checks linux/arm64.
    # Every downstream consumer of this job (catalog-pipeline, auto-tag,
    # release) already only runs on main pushes or v* tags.
    # ALSO skip on tag-ref dispatches (M1-4 / OPS-F1): a resign dispatch must
    # not rebuild the image; skipping docker skips its whole needs-chain
    # (catalog-pipeline, release, provenance), so a dispatched tag run can
    # never overwrite release assets. The resign-dispatch-guard job is the
    # loud fail-fast for bare tag dispatches.
    if: >-
      github.event_name != 'pull_request' &&
      !(github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/'))

    # Expose the pushed manifest-list digest + computed version so the
    # catalog-pipeline job (P2a) can generate + gate the release catalog against
    # the digest the workflow actually pushed, and so the evidence-gated
    # promote-image job can move the PUBLIC channels onto that exact digest.
    outputs:
      proxy_digest: ${{ steps.build.outputs.digest }}
      version_bare: ${{ steps.chan.outputs.version_bare }}
      candidate_tag: ${{ steps.chan.outputs.candidate_tag }}
      immutable_tags: ${{ steps.chan.outputs.immutable_tags }}
      floating_tags: ${{ steps.chan.outputs.floating_tags }}
      image: ${{ steps.img-lc.outputs.image }}

    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # cosign keyless image signing
      actions: read        # require-gate.sh (tag-path guard)

    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history needed for tag-based version computation

      # Tag-path guard: on a v* tag this job builds, pushes, and cosign-signs
      # ghcr images BEFORE the release job runs — so the gate check must sit
      # here too, not only in release. Refuse unless the tagged commit was
      # green on its main push (assert mode: the main run must already exist).
      - name: Require gate approval on the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-release-evidence.sh "$GITHUB_SHA" assert

      # ── Resolve the version + the candidate/promote tag split ─────────────
      # CANDIDATE tags are pushed by THIS job, before any verdict is known, and
      # are deliberately non-channel: `sha-<short>` names one immutable build of
      # one commit and no consumer resolves it as a release. PROMOTE tags are
      # the PUBLIC release channels (`latest`, `main`, semver) — they are NOT
      # pushed here. The evidence-gated `promote-image` job moves them onto this
      # job's digest after the release predicate passes.
      #
      # Why this replaced the old shape: `latest` is a real delivery channel
      # (packaging/culvert-maint/install.sh seeds a fresh install from
      # `${PROXY_REPO}:latest`), and it was published + cosign-signed here ~29
      # minutes before QA and Security concluded for the same SHA.
      - name: Resolve version and release channels
        id: chan
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short=7 HEAD)"
          # TWO candidate tags, neither a release channel:
          #   sha-<short>          the conventional per-commit tag (unchanged);
          #   candidate-<run_id>   the PROMOTION BINDING.
          # The binding must be per-RUN, not per-commit, because the main-push
          # run and the tag run share a commit: auto-tag pushes the v* tag while
          # the main run's promote-image is still resolving, so the tag run's
          # build would overwrite a per-commit candidate and promote-image would
          # then see a digest its own run did not build. A run-scoped tag cannot
          # be clobbered by another run, and is stable across re-runs of this
          # one (run_id is constant across attempts).
          CANDIDATE="candidate-${GITHUB_RUN_ID}"
          IMMUTABLE=""
          FLOATING=""
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            # GITHUB_TOKEN tag pushes (from auto-tag) can't trigger new
            # workflows, so the main-push run computes the semver it will
            # promote to itself.
            LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
            VER="${LATEST#v}"
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            VERSION="$NEXT"
            VERSION_BARE="${NEXT#v}"
            # MAIN path: moving channels ONLY. It deliberately promotes NO
            # exact version, for two reasons. Its version is SPECULATIVE —
            # auto-tag has not created the tag yet, so a run overtaken by a
            # newer main push would be claiming a number that ends up belonging
            # to that newer commit. And the main and tag runs produce DIFFERENT
            # digests, so a main run promoting `vX.Y.Z` while the tag run
            # promotes `X.Y.Z` left the two aliases of one version pointing at
            # two different images, with `vX.Y.Z` on a digest that release's
            # catalog does not pin (Codex review, PR #1441). One version, one
            # digest, one owner: the tag run.
            FLOATING="latest main"
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION_BARE="${VERSION#v}"
            MAJOR=$(echo "$VERSION_BARE" | cut -d. -f1)
            MINOR=$(echo "$VERSION_BARE" | cut -d. -f2)
            # TAG path: BOTH exact aliases are IMMUTABLE and belong here.
            # `X.Y.Z` and `vX.Y.Z` can only ever mean this tag's release, so
            # they are promoted even when a newer tag has already landed — and
            # they are promoted TOGETHER, from the one digest this release's
            # catalog pins. Only the moving channels defer.
            IMMUTABLE="${VERSION_BARE} ${VERSION}"
            FLOATING="${MAJOR}.${MINOR} ${MAJOR}"
          else
            # Any other ref (a branch dispatch off main): build a candidate so
            # the run is still useful, promote NOTHING. Before this change a
            # workflow_dispatch on any branch republished `latest`, with no gate
            # step on that path at all.
            VERSION="0.0.0-${SHORT}"
            VERSION_BARE="$VERSION"
          fi
          {
            echo "version=$VERSION"
            echo "version_bare=$VERSION_BARE"
            echo "candidate_tag=$CANDIDATE"
            echo "immutable_tags=$IMMUTABLE"
            echo "floating_tags=$FLOATING"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION candidate=$CANDIDATE immutable=[${IMMUTABLE}] floating=[${FLOATING}]"

      # ── Lowercase repo name ───────────────────────────────────────────────
      # Container registries require lowercase image names, but
      # ${{ github.repository }} preserves the original case (e.g.
      # "KidCarmi/Culvert"). docker/metadata-action lowercases automatically;
      # the image build step below uses raw `tags:` so we lowercase ourselves.
      - name: Compute lowercase image base
        id: img-lc
        run: |
          LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$LC" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/$LC" >> $GITHUB_OUTPUT

      # ── Registry login ────────────────────────────────────────────────────
      # ghcr.io: always available, uses GITHUB_TOKEN — no secrets needed.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Image metadata ────────────────────────────────────────────────────
      # CANDIDATE TAG ONLY. This job pushes exactly one tag — `sha-<short>` —
      # which is immutable, names one build of one commit, and is not a release
      # channel any consumer resolves. Every public channel (`latest`, `main`,
      # `{{version}}`, `{{major}}.{{minor}}`, `{{major}}`) was removed from here
      # and now lives in the evidence-gated `promote-image` job, which repoints
      # them at THIS job's digest once the release predicate passes.
      #
      # Do NOT add a channel tag back to this list: the push here happens before
      # any verdict exists, so anything published here is published unverified.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.chan.outputs.candidate_tag }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Culvert
            org.opencontainers.image.description=Enterprise-grade HTTP/HTTPS/SOCKS5 forward proxy
            org.opencontainers.image.vendor=KidCarmi
            org.opencontainers.image.licenses=MIT

      # ── Multi-arch build & push ───────────────────────────────────────────
      - name: Set up QEMU (for ARM emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push only on main branch or version tags; PRs just build (no push).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.chan.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Embed provenance + SBOM attestations directly in the image manifest.
          provenance: true
          sbom: true

      # NOTE: the former "Apply version tag" step lived here. It ran
      # unconditionally on every non-PR event and published the computed semver
      # tags with no verdict in sight. Version tags are now applied by
      # `promote-image`, after the release predicate.

      # ── Sign the candidate digest with cosign (keyless) ───────────────────
      # Cosign signatures are DIGEST-scoped: `cosign sign <ref>@<digest>` stores
      # the signature at `sha256-<hex>.sig` in the same repository, so signing
      # the candidate reference here covers every public tag `promote-image`
      # later points at the same digest — no re-signing is required for the
      # signature to verify, and `catalog-pipeline`'s digest-addressed
      # `cosign verify ghcr.io/kidcarmi/culvert@<digest>` keeps working
      # unchanged. The promote job signs the promoted references as well, so the
      # signed `docker-reference` claim also names the public channel.
      # Only runs when the image was actually pushed (not PRs).
      - name: Install cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the cosign BINARY (installer default drifts across majors; the
          # 2.x→3.x jump dropped the detached cert/signature output flags on
          # sign-blob/attest-blob in favour of the Sigstore bundle).
          cosign-release: 'v3.0.6'

      - name: Sign proxy image (keyless via Sigstore)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Sign every tag that was pushed.
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            cosign sign --yes \
              --rekor-url=https://rekor.sigstore.dev \
              "${tag}@${{ steps.build.outputs.digest }}"
          done

  # ─── Release catalog gate (P2a) ─────────────────────────────────────────────
  # Generates the release catalog from the digest the docker job actually pushed,
  # then runs the in-repo gate (TestReleaseCatalogGate) which round-trips the
  # generated bundle through the REAL LoadVerifiedCatalog verifier and asserts
  # every list_digest equals the pushed manifest-list digest. The gate fails the
  # release on a tag ref, a digest mismatch, a mutated/invalid manifest, or a
  # freshness/schema violation — so an official catalog can never be published
  # out of step with the image. The ephemeral ed25519 key the gate signs with is
  # in-process and discarded; the attached bundle is UNSIGNED (P2b adds the
  # official Sigstore-identity signature and the Control-Plane verifier).
  # ─── The release candidate (one version, one digest) ───────────────────────
  # This image build is NOT reproducible over time — a floating `alpine:3.24`,
  # `apk upgrade`, and a GeoIP URL embedding `$(date +%Y-%m)` — so re-running a
  # tag builds DIFFERENT BYTES for the same version. Before this job existed the
  # pipeline had no notion of "the candidate for vX.Y.Z", only "whatever this run
  # built", so a retry after a partial publication wanted to repoint public
  # version tags at new bytes. A GHCR tag is public the instant it is written, so
  # that is a real mutation of a distributed version — and the GitHub Release's
  # Draft flag is NOT a visibility boundary for GHCR.
  #
  # So the version is bound to ONE digest, once, and every downstream job reads
  # the digest FROM HERE rather than from `docker`. A retry resolves the same
  # binding, discards its own rebuild, and RESUMES.
  #
  # It runs on the main path too, as a pass-through, so that catalog-pipeline can
  # depend on it unconditionally: a tag-only job in that position would be
  # SKIPPED on main and would skip the whole chain behind it.
  resolve-candidate:
    name: "Release · Resolve candidate digest"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [docker]
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write   # write the candidate-v<version> binding (tag path only)
    outputs:
      # THE release digest for this run. Downstream jobs must use this, never
      # needs.docker.outputs.proxy_digest, or a retry silently re-decides.
      digest: ${{ steps.candidate.outputs.digest }}
      binding: ${{ steps.candidate.outputs.binding }}
      # The candidate reference promotion must verify against: the version
      # binding on a tag, the run-scoped tag on main. Promoters read it FROM
      # HERE — see the promotion-authority note in resolve-release-candidate.sh.
      candidate_tag: ${{ steps.candidate.outputs.candidate_tag }}
    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Resolve or create the release candidate binding
        id: candidate
        env:
          RELEASE_SHA: ${{ github.sha }}
          IMAGE: ${{ needs.docker.outputs.image }}
          RUN_DIGEST: ${{ needs.docker.outputs.proxy_digest }}
          # Empty on the main path: the version is speculative until auto-tag
          # creates the tag, and the main path promotes only moving channels.
          VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          # Used only when VERSION_TAG is empty (main): with nothing bound, the
          # run's own candidate is the only reference promotion can verify.
          RUN_CANDIDATE_TAG: ${{ needs.docker.outputs.candidate_tag }}
        run: .github/scripts/resolve-release-candidate.sh "$IMAGE" "$VERSION_TAG" "$RUN_DIGEST" "$RUN_CANDIDATE_TAG"

  catalog-pipeline:
    name: "Supply Chain · Release catalog gate"
    timeout-minutes: 25
    runs-on: ubuntu-latest
    # resolve-candidate, not docker, is the source of the digest: the catalog
    # must pin the digest this version is BOUND to, or a retry would publish a
    # catalog naming bytes the public tags never point at.
    needs: [docker, resolve-candidate]
    # Run on BOTH the main-push run (early feedback before auto-tag) AND the
    # tag-release run, where the `release` job actually publishes assets — the
    # `release` job depends on this job, so a failed catalog gate blocks the
    # release (genuinely release-blocking, not just a main-push proof).
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write     # attach the signed catalog to the GitHub Release (tag path)
      id-token: write     # cosign keyless blob signing of index.json (tag path)
      actions: read       # require-gate.sh (tag-path guard)
    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history for the tagged commit's committer date (deterministic generated_at)
      # A PUBLISHED release is write-once. Every asset step below stages with
      # draft:true, which `action-gh-release` applies to an existing release
      # too — so a re-run of an already-published tag would take it offline and
      # could not put it back (the rebuild's digest is refused against the
      # write-once exact image tag, so publish-release never runs). Refuse
      # BEFORE the first mutation, leaving the public release untouched.
      - name: Refuse if this release is already published (tag path)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/assert-release-unpublished.sh "$REF_NAME"
      # Tag-path guard: this job keyless-signs the release catalog on a v*
      # tag. Refuse unless the tagged commit was green on its main push.
      - name: Require gate approval on the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-release-evidence.sh "$GITHUB_SHA" assert
      - uses: ./.github/actions/setup-go-cache
      # Gather ONLY deterministic facts here (no wall-clock, no tag-count). The
      # catalog spec — timestamps (from the tagged commit's committer date),
      # expires_at (+180d), and the semver-derived catalog_version — is built and
      # validated in tested Go (buildReleaseSpec), invoked by the gate below. This
      # makes re-running a tag byte-idempotent (M0 / release_spec.go).
      - name: Resolve deterministic catalog spec facts
        id: spec
        env:
          DIGEST: ${{ needs.resolve-candidate.outputs.digest }}
          # version_bare is set only on the main-push run; on the tag-release run
          # derive it from the tag ref (refs/tags/vX.Y.Z → X.Y.Z).
          VERSION: ${{ needs.docker.outputs.version_bare }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$DIGEST" || { echo "missing pushed digest"; exit 1; }
          if [ -z "$VERSION" ]; then VERSION="${REF_NAME#v}"; fi
          test -n "$VERSION" || { echo "missing version"; exit 1; }
          # Committer date of the tagged commit — fixed per tag, so re-runs are identical.
          COMMIT_ISO=$(git log -1 --format=%cI HEAD)
          OUT="$RUNNER_TEMP/catalog-out"
          mkdir -p "$OUT"
          {
            echo "version=$VERSION"
            echo "digest=$DIGEST"
            echo "commit_iso=$COMMIT_ISO"
            echo "out=$OUT"
            # NOW is a guard input only (rejects an old-tag re-run whose 180d window
            # is already past); it is NOT written into any catalog byte.
            echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - name: Run release catalog gate (build spec + generate + verify + digest-match)
        env:
          CULVERT_RELEASE_SPEC_VERSION: ${{ steps.spec.outputs.version }}
          CULVERT_RELEASE_SPEC_DIGEST: ${{ steps.spec.outputs.digest }}
          CULVERT_RELEASE_SPEC_REPO: ghcr.io/kidcarmi/culvert
          CULVERT_RELEASE_SPEC_COMMIT_ISO: ${{ steps.spec.outputs.commit_iso }}
          CULVERT_RELEASE_SPEC_NOW: ${{ steps.spec.outputs.now }}
          CULVERT_RELEASE_GEN_OUT: ${{ steps.spec.outputs.out }}
          CULVERT_RELEASE_EXPECT_DIGEST: ${{ needs.resolve-candidate.outputs.digest }}
        run: go test -run TestReleaseCatalogGate -count=1 -v .

      # ── Keyless catalog signing + verification (TAG path only) ────────────────
      # On a tag release, sign the deterministic index.json keyless (Fulcio +
      # Rekor, no private key), then prove the SHIPPED in-binary verifier accepts
      # it (baked root + pinned ci.yml identity), and prove the pushed image was
      # signed by the SAME identity. Signing requires a tagged-release OIDC SAN
      # (@refs/tags/v*), so these steps never run on the main-push gate.
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Sign catalog index keyless (cosign sign-blob → index.json.sigstore)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          OUT="${{ steps.spec.outputs.out }}"
          cosign sign-blob --yes \
            --bundle "$OUT/index.json.sigstore" \
            "$OUT/index.json"
          test -s "$OUT/index.json.sigstore" || { echo "empty .sigstore bundle"; exit 1; }
      - name: Keyless end-to-end verify (baked root + pinned identity)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CULVERT_RELEASE_GEN_OUT: ${{ steps.spec.outputs.out }}
          CULVERT_RELEASE_GEN_VERIFY_SIGSTORE: "1"
        run: go test -run TestReleaseCatalogKeylessVerify -count=1 -v .
      - name: Verify pushed image signature matches the pinned release identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          # Single source of truth shared with the in-binary verifier
          # (TestReleaseIdentitySSOT pins release_identity.env == Go constants).
          # Read the RAW values via cut — NOT `source` — because the SAN regex
          # contains backslashes (`github\.com`) that bash escape-processing would
          # strip, drifting the CI regex from the validated Go constant.
          ISSUER=$(grep '^CULVERT_RELEASE_SIGSTORE_ISSUER=' release_identity.env | cut -d= -f2-)
          SAN_REGEX=$(grep '^CULVERT_RELEASE_SIGSTORE_SAN_REGEX=' release_identity.env | cut -d= -f2-)
          test -n "$ISSUER" && test -n "$SAN_REGEX" || { echo "missing identity in release_identity.env"; exit 1; }
          cosign verify \
            --certificate-oidc-issuer="$ISSUER" \
            --certificate-identity-regexp="$SAN_REGEX" \
            "ghcr.io/kidcarmi/culvert@${{ needs.resolve-candidate.outputs.digest }}"

      - name: Upload generated catalog bundle (signed on tag path)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-catalog-bundle
          path: ${{ steps.spec.outputs.out }}
          if-no-files-found: error
      # Package the COMPLETE signed catalog (index.json + index.json.sigstore +
      # manifests/<ref>) as one tar.gz. A bare index.json + signature is NOT a
      # usable catalog — the verified index references manifests/<ref> that the
      # loader/HTTP provider must fetch. The archive is exactly what the air-gap
      # BundleCatalogProvider imports (gzip-sniffing tar reader staging index.json,
      # index.json.sigstore, manifests/*).
      - name: Package signed catalog bundle (tag path)
        if: startsWith(github.ref, 'refs/tags/v')
        id: pkg
        env:
          # env-indirection: ref names may contain shell metacharacters —
          # never interpolate ${{ github.ref_name }} directly into run: text.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OUT="${{ steps.spec.outputs.out }}"
          test -s "$OUT/index.json.sigstore" || { echo "missing signed bundle"; exit 1; }
          BUNDLE="$RUNNER_TEMP/culvert-release-catalog-${REF_NAME}.tar.gz"
          tar -C "$OUT" -czf "$BUNDLE" index.json index.json.sigstore manifests
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
      # STAGED, NOT PUBLISHED. Every asset-carrying step in this workflow creates
      # or updates the release as a DRAFT; the `publish-release` job flips
      # draft=false only after reproducibility, signatures, provenance and the
      # catalog checks have all succeeded. Before this change the first upload
      # created a LIVE release, so binaries and the signed catalog were publicly
      # downloadable while verify-reproducible and SLSA provenance were still
      # running — and stayed downloadable if either then failed.
      - name: Stage complete signed catalog bundle on the draft Release (tag path)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: ${{ steps.pkg.outputs.bundle }}

  # ─── Moving channels, main path (the release predicate's enforcement point) ─
  # `latest` and `main` name "the current build of the default branch". They are
  # allowed to move, so they move as soon as the evidence predicate passes for
  # this SHA — there is no release to wait for on this path.
  #
  # The exact version aliases are NOT here. They belong to the tag run, and to
  # the job below, which waits for the entire release chain first.
  #
  # Depending on catalog-pipeline means the digest a consumer pulls from
  # `:latest` is the digest the release catalog pins and whose signature
  # verified — not merely the digest that happened to build.
  #
  # SIGNING IDENTITY: cosign keyless SANs are
  # `…/.github/workflows/<file>@<ref>`, i.e. per workflow FILE and ref, not per
  # job. Both promotion jobs live in ci.yml, so their certificates carry the same
  # identity the `docker` job's did — `release_identity.env`, the baked pin in
  # release_catalog_sigstore.go and TestReleaseIdentitySSOT are all unaffected.
  # Moving either into a SEPARATE workflow file would change the SAN and break
  # that pin; do not.
  promote-image:
    name: "Release · Promote moving channels (main)"
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [docker, resolve-candidate, catalog-pipeline]
    # MAIN PUSH ONLY. A workflow_dispatch on a branch is deliberately EXCLUDED:
    # it used to republish `latest` with no gate step on that path at all, and it
    # has no release semantics worth preserving. The TAG path is served by
    # promote-release-channels below, which waits for the whole release chain.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # ONE promotion at a time, ACROSS REFS. ci.yml's workflow-level group is
    # `ci-${{ github.ref }}`, so two different v* tags run concurrently — and
    # "am I the channel tip?" is a check-then-act, so an older tag's run could
    # move `X.Y`/`X` back after a newer one had already promoted them (Codex
    # review, PR #1441). This group is deliberately ref-INDEPENDENT.
    #
    # cancel-in-progress is false: a promotion must never be cut in half. The
    # accepted cost is GitHub's queue depth of one — a THIRD concurrent
    # promotion cancels the pending one, which fails this job, skips
    # publish-release and leaves that release a draft. That is fail-closed and
    # re-runnable, and strictly better than a silently rolled-back public
    # channel.
    concurrency:
      group: release-channel-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write   # repoint tags in ghcr.io
      id-token: write   # cosign keyless signing of the promoted references
      actions: read     # require-gate.sh (list-workflow-runs)
    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # ancestry check + highest-v*-tag resolution

      # THE PREDICATE. `wait` on the main push (the gates run in parallel with
      # this run); `assert` on a tag (the main-push run must already exist —
      # qa-gate.yml does not even run on tags, so its only possible run for this
      # SHA is the main-push one).
      - name: Require release evidence for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE=assert
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then MODE=wait; fi
          .github/scripts/require-release-evidence.sh "$GITHUB_SHA" "$MODE"

      # Who owns the channel right now. An older run re-executed after the
      # channel moved on must not roll the moving channels backwards; see
      # promote-image-tags.sh's re-run-safety block.
      #
      # The tip is read from the REMOTE, inside the serialized region above,
      # never from the checkout's snapshot: a tag created after this job's
      # checkout would otherwise leave this run believing it is still the
      # highest tag, and the ancestry guard would then compare against the
      # wrong tip and wave the rollback through.
      - name: Resolve channel tip
        id: tip
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git fetch --no-tags origin main
            TIP="$(git rev-parse FETCH_HEAD)"
          else
            git fetch --force --prune --prune-tags --tags origin
            HIGHEST="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            test -n "$HIGHEST" || { echo "::error::no v* tag visible — refusing"; exit 1; }
            TIP="$(git rev-list -n1 "$HIGHEST")"
            # The tag NAME, not just its commit: two version tags can name the
            # same commit, and a SHA-only comparison then lets the lower tag
            # believe it owns the moving channels.
            echo "tip_tag=$HIGHEST" >> "$GITHUB_OUTPUT"
            echo "highest v* tag: $HIGHEST"
          fi
          echo "tip=$TIP" >> "$GITHUB_OUTPUT"
          echo "channel tip: $TIP"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Promote the verified digest onto the public channels
        id: promote
        env:
          RELEASE_SHA: ${{ github.sha }}
          CHANNEL_TIP: ${{ steps.tip.outputs.tip }}
          # Empty on the main path; the highest v* tag name on the tag path.
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          CHANNEL_TIP_TAG: ${{ steps.tip.outputs.tip_tag }}
          IMAGE: ${{ needs.docker.outputs.image }}
          DIGEST: ${{ needs.resolve-candidate.outputs.digest }}
          CANDIDATE: ${{ needs.resolve-candidate.outputs.candidate_tag }}
          IMMUTABLE_TAGS: ${{ needs.docker.outputs.immutable_tags }}
          FLOATING_TAGS: ${{ needs.docker.outputs.floating_tags }}
        run: |
          set -euo pipefail
          test -n "${IMMUTABLE_TAGS}${FLOATING_TAGS}" || { echo "::error::no promote tags resolved for ${GITHUB_REF} — refusing"; exit 1; }
          .github/scripts/promote-image-tags.sh "$IMAGE" "$DIGEST" "$CANDIDATE"
          # Sign exactly what now points at this digest. The immutable set does
          # once the script returns (it either moved it or confirmed it already
          # resolved here); the floating set only when this release owns the
          # channels — by TAG identity on the tag path, by commit on main.
          SIGNED="$IMMUTABLE_TAGS"
          if [ -n "$RELEASE_TAG" ] && [ -n "$CHANNEL_TIP_TAG" ]; then
            [ "$RELEASE_TAG" = "$CHANNEL_TIP_TAG" ] && SIGNED="$SIGNED $FLOATING_TAGS"
          elif [ "$RELEASE_SHA" = "$CHANNEL_TIP" ]; then
            SIGNED="$SIGNED $FLOATING_TAGS"
          fi
          echo "signed_tags=$(echo "$SIGNED" | tr -s ' ' | sed 's/^ //; s/ $//')" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.promote.outputs.signed_tags != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # Belt-and-braces: the digest is already signed by the `docker` job and a
      # cosign signature is digest-scoped, so verification of a promoted tag
      # already succeeds. Signing the promoted references in addition makes the
      # signed `docker-reference` claim name the public channel too, so a
      # consumer inspecting the payload for `:latest` sees `:latest`.
      - name: Sign the promoted references (keyless)
        if: steps.promote.outputs.signed_tags != ''
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE: ${{ needs.docker.outputs.image }}
          DIGEST: ${{ needs.resolve-candidate.outputs.digest }}
          PROMOTE_TAGS: ${{ steps.promote.outputs.signed_tags }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 -- PROMOTE_TAGS is a deliberate word list
          for t in $PROMOTE_TAGS; do
            cosign sign --yes \
              --rekor-url=https://rekor.sigstore.dev \
              "${IMAGE}:${t}@${DIGEST}"
          done

  # ─── Catalog re-sign (M1-4, design §4 Slice D) ────────────────────────────
  # Weekly no-bump freshness re-sign, dispatched BY resign-catalog.yml at the
  # latest v* tag ref with resign=true (so the keyless SAN is
  # ci.yml@refs/tags/v<latest> and matches the pinned identity). A REDUCED
  # path: no build, no docker, no release job — download the tag's EXISTING
  # release bundle, verify it through the baked root + pinned identity BEFORE
  # reading anything (SEC-F1, enforced inside TestReleaseResignGate), rebuild
  # the index with the SAME catalog_version/created_at and a fresh
  # generated_at/expires_at (+180d), keyless-sign, verify end-to-end, attach as
  # a VERSIONED resign asset. The original release asset is never replaced.

  # ─── Version channels, tag path — AFTER every required release check ───────
  # `vX.Y.Z` and `X.Y.Z` name ONE immutable release, and `X.Y`/`X` track the
  # newest such release. A registry tag is PUBLIC the instant it is written, so
  # writing any of them is an irreversible public act and must be the LAST thing
  # the pipeline does before the GitHub Release goes live.
  #
  # This job previously needed only [docker, catalog-pipeline], so public version
  # tags appeared while `verify-reproducible` and `provenance` were still running
  # — and stayed public if either then failed, with the Release left as a Draft.
  # A Draft is not a visibility boundary for GHCR, so "it was never published" was
  # never true of the image (Codex review + owner correction, PR #1441).
  #
  # Every need below is a required release check. Any of them failing SKIPS this
  # job, and nothing public is written.
  #
  # CROSS-SERVICE HONESTY: GHCR and the GitHub Releases API fail independently and
  # nothing here is atomic across them. What makes that survivable is that the
  # digest comes from resolve-candidate, so a retry promotes the SAME digest:
  # every alias already written is an idempotent no-op and the remaining ones are
  # completed. Partial publication is finished, never re-decided.
  promote-release-channels:
    name: "Release · Promote version channels (tag)"
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [docker, resolve-candidate, catalog-pipeline, release, aggregate-subjects, verify-reproducible, provenance]
    # TAG PATH ONLY, and LAST. Every need above is a required release check, so
    # this job is skipped the moment any of them fails and no public version
    # channel is written.
    if: startsWith(github.ref, 'refs/tags/v')
    # ONE promotion at a time, ACROSS REFS. ci.yml's workflow-level group is
    # `ci-${{ github.ref }}`, so two different v* tags run concurrently — and
    # "am I the channel tip?" is a check-then-act, so an older tag's run could
    # move `X.Y`/`X` back after a newer one had already promoted them (Codex
    # review, PR #1441). This group is deliberately ref-INDEPENDENT.
    #
    # cancel-in-progress is false: a promotion must never be cut in half. The
    # accepted cost is GitHub's queue depth of one — a THIRD concurrent
    # promotion cancels the pending one, which fails this job, skips
    # publish-release and leaves that release a draft. That is fail-closed and
    # re-runnable, and strictly better than a silently rolled-back public
    # channel.
    concurrency:
      group: release-channel-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write   # repoint tags in ghcr.io
      id-token: write   # cosign keyless signing of the promoted references
      actions: read     # require-gate.sh (list-workflow-runs)
    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # ancestry check + highest-v*-tag resolution

      # THE PREDICATE. `wait` on the main push (the gates run in parallel with
      # this run); `assert` on a tag (the main-push run must already exist —
      # qa-gate.yml does not even run on tags, so its only possible run for this
      # SHA is the main-push one).
      - name: Require release evidence for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE=assert
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then MODE=wait; fi
          .github/scripts/require-release-evidence.sh "$GITHUB_SHA" "$MODE"

      # Who owns the channel right now. An older run re-executed after the
      # channel moved on must not roll the moving channels backwards; see
      # promote-image-tags.sh's re-run-safety block.
      #
      # The tip is read from the REMOTE, inside the serialized region above,
      # never from the checkout's snapshot: a tag created after this job's
      # checkout would otherwise leave this run believing it is still the
      # highest tag, and the ancestry guard would then compare against the
      # wrong tip and wave the rollback through.
      - name: Resolve channel tip
        id: tip
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git fetch --no-tags origin main
            TIP="$(git rev-parse FETCH_HEAD)"
          else
            git fetch --force --prune --prune-tags --tags origin
            HIGHEST="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            test -n "$HIGHEST" || { echo "::error::no v* tag visible — refusing"; exit 1; }
            TIP="$(git rev-list -n1 "$HIGHEST")"
            # The tag NAME, not just its commit: two version tags can name the
            # same commit, and a SHA-only comparison then lets the lower tag
            # believe it owns the moving channels.
            echo "tip_tag=$HIGHEST" >> "$GITHUB_OUTPUT"
            echo "highest v* tag: $HIGHEST"
          fi
          echo "tip=$TIP" >> "$GITHUB_OUTPUT"
          echo "channel tip: $TIP"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Promote the verified digest onto the public channels
        id: promote
        env:
          RELEASE_SHA: ${{ github.sha }}
          CHANNEL_TIP: ${{ steps.tip.outputs.tip }}
          # Empty on the main path; the highest v* tag name on the tag path.
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          CHANNEL_TIP_TAG: ${{ steps.tip.outputs.tip_tag }}
          IMAGE: ${{ needs.docker.outputs.image }}
          DIGEST: ${{ needs.resolve-candidate.outputs.digest }}
          CANDIDATE: ${{ needs.resolve-candidate.outputs.candidate_tag }}
          IMMUTABLE_TAGS: ${{ needs.docker.outputs.immutable_tags }}
          FLOATING_TAGS: ${{ needs.docker.outputs.floating_tags }}
        run: |
          set -euo pipefail
          test -n "${IMMUTABLE_TAGS}${FLOATING_TAGS}" || { echo "::error::no promote tags resolved for ${GITHUB_REF} — refusing"; exit 1; }
          .github/scripts/promote-image-tags.sh "$IMAGE" "$DIGEST" "$CANDIDATE"
          # Sign exactly what now points at this digest. The immutable set does
          # once the script returns (it either moved it or confirmed it already
          # resolved here); the floating set only when this release owns the
          # channels — by TAG identity on the tag path, by commit on main.
          SIGNED="$IMMUTABLE_TAGS"
          if [ -n "$RELEASE_TAG" ] && [ -n "$CHANNEL_TIP_TAG" ]; then
            [ "$RELEASE_TAG" = "$CHANNEL_TIP_TAG" ] && SIGNED="$SIGNED $FLOATING_TAGS"
          elif [ "$RELEASE_SHA" = "$CHANNEL_TIP" ]; then
            SIGNED="$SIGNED $FLOATING_TAGS"
          fi
          echo "signed_tags=$(echo "$SIGNED" | tr -s ' ' | sed 's/^ //; s/ $//')" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.promote.outputs.signed_tags != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # Belt-and-braces: the digest is already signed by the `docker` job and a
      # cosign signature is digest-scoped, so verification of a promoted tag
      # already succeeds. Signing the promoted references in addition makes the
      # signed `docker-reference` claim name the public channel too, so a
      # consumer inspecting the payload for `:latest` sees `:latest`.
      - name: Sign the promoted references (keyless)
        if: steps.promote.outputs.signed_tags != ''
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE: ${{ needs.docker.outputs.image }}
          DIGEST: ${{ needs.resolve-candidate.outputs.digest }}
          PROMOTE_TAGS: ${{ steps.promote.outputs.signed_tags }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 -- PROMOTE_TAGS is a deliberate word list
          for t in $PROMOTE_TAGS; do
            cosign sign --yes \
              --rekor-url=https://rekor.sigstore.dev \
              "${IMAGE}:${t}@${DIGEST}"
          done

  # ─── Catalog re-sign (M1-4, design §4 Slice D) ────────────────────────────
  # Weekly no-bump freshness re-sign, dispatched BY resign-catalog.yml at the
  # latest v* tag ref with resign=true (so the keyless SAN is
  # ci.yml@refs/tags/v<latest> and matches the pinned identity). A REDUCED
  # path: no build, no docker, no release job — download the tag's EXISTING
  # release bundle, verify it through the baked root + pinned identity BEFORE
  # reading anything (SEC-F1, enforced inside TestReleaseResignGate), rebuild
  # the index with the SAME catalog_version/created_at and a fresh
  # generated_at/expires_at (+180d), keyless-sign, verify end-to-end, attach as
  # a VERSIONED resign asset. The original release asset is never replaced.

  catalog-resign:
    name: "Supply Chain · Catalog re-sign (freshness)"
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: [resign-dispatch-guard]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/v') &&
      inputs.resign
    permissions:
      contents: write     # attach the resign bundle + prune superseded resign assets
      id-token: write     # cosign keyless blob signing of the re-signed index.json
    steps:
      - name: Harden runner (egress audit — same baseline as catalog-pipeline)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full tag list for the latest-tag assert (SEC-F2a)
      - uses: ./.github/actions/setup-go-cache
      # SEC-F2a (BLOCKING): only the LATEST v* tag may be re-signed — an old-tag
      # dispatch would mint an unbounded freshness extension for a superseded
      # release (a live downgrade pin). Enforced HERE, inside the signing job,
      # so it holds even for a hand-crafted dispatch that bypasses the scheduler.
      - name: Assert dispatch tag is the latest v* tag (SEC-F2a)
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          LATEST="$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          test -n "$LATEST" || { echo "FATAL: no vX.Y.Z tags found"; exit 1; }
          [ "$REF_NAME" = "$LATEST" ] || {
            echo "FATAL: refusing to re-sign $REF_NAME — latest release tag is $LATEST"
            echo "       (re-signing an old tag would extend a superseded release's freshness)"; exit 1
          }
      # Resolve the resign facts once (a single UTC date avoids a midnight
      # rollover splitting the asset name across steps). RESIGN_NOW is derived
      # from the DATE ONLY (midnight UTC), not the wall clock: the asset name
      # and the R2 history prefix are date-keyed and the staged prefix is
      # create-only immutable, so a same-day retry must reproduce byte-identical
      # catalog content or the publisher's digest guard bricks the retry
      # (Codex review P2 on PR #640). Same date ⇒ same generated_at/expires_at
      # ⇒ same bytes (the generator is deterministic).
      - name: Resolve re-sign facts
        id: rfacts
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/resign-out"; mkdir -p "$OUT"
          {
            echo "now=$(date -u +%Y-%m-%d)T00:00:00Z"
            echo "rdate=$(date -u +%Y%m%d)"
            echo "out=$OUT"
          } >> "$GITHUB_OUTPUT"
      # OPS-F2: the ORIGINAL bundle by EXACT name — never a glob (a prior
      # resign asset must not be picked up as the source).
      - name: Download the tag's ORIGINAL release bundle (exact name)
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/resign-src"; mkdir -p "$SRC" dl
          gh release download "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "culvert-release-catalog-${REF_NAME}.tar.gz" --dir dl
          tar xzf "dl/culvert-release-catalog-${REF_NAME}.tar.gz" -C "$SRC"
          test -s "$SRC/index.json"          || { echo "FATAL: bundle missing index.json"; exit 1; }
          test -s "$SRC/index.json.sigstore" || { echo "FATAL: bundle missing index.json.sigstore — an unsigned source is never re-signed"; exit 1; }
          test -d "$SRC/manifests"           || { echo "FATAL: bundle missing manifests/"; exit 1; }
          echo "src=$SRC" >> "$GITHUB_ENV"
      # SEC-F1 (BLOCKING): verify-before-read + version binding + rebuild —
      # all inside the gate binary (release_resign_gate_test.go), not shell.
      - name: Run re-sign gate (verify source through baked root, rebuild, assert invariants)
        env:
          CULVERT_RELEASE_SPEC_RESIGN: "1"
          CULVERT_RELEASE_RESIGN_SRC: ${{ env.src }}
          CULVERT_RELEASE_SPEC_VERSION: ${{ github.ref_name }}
          CULVERT_RELEASE_SPEC_RESIGN_NOW: ${{ steps.rfacts.outputs.now }}
          CULVERT_RELEASE_GEN_OUT: ${{ steps.rfacts.outputs.out }}
        run: |
          set -euo pipefail
          export CULVERT_RELEASE_SPEC_VERSION="${CULVERT_RELEASE_SPEC_VERSION#v}"
          go test -run '^TestReleaseResignGate$' -count=1 -v .
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Sign re-signed index keyless (cosign sign-blob → index.json.sigstore)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          OUT="${{ steps.rfacts.outputs.out }}"
          cosign sign-blob --yes \
            --bundle "$OUT/index.json.sigstore" \
            "$OUT/index.json"
          test -s "$OUT/index.json.sigstore" || { echo "empty .sigstore bundle"; exit 1; }
      - name: Keyless end-to-end verify (baked root + pinned identity)
        env:
          CULVERT_RELEASE_GEN_OUT: ${{ steps.rfacts.outputs.out }}
          CULVERT_RELEASE_GEN_VERIFY_SIGSTORE: "1"
        run: go test -run TestReleaseCatalogKeylessVerify -count=1 -v .
      - name: Package versioned resign bundle
        id: rpkg
        env:
          REF_NAME: ${{ github.ref_name }}
          RDATE: ${{ steps.rfacts.outputs.rdate }}
        run: |
          set -euo pipefail
          OUT="${{ steps.rfacts.outputs.out }}"
          NAME="culvert-release-catalog-${REF_NAME}-r${RDATE}.tar.gz"
          tar -C "$OUT" -czf "$RUNNER_TEMP/$NAME" index.json index.json.sigstore manifests
          echo "bundle=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      # OPS-F2: the release carries exactly ORIGINAL + LATEST resign. Upload the
      # NEW bundle FIRST, prune superseded -r* assets only after the upload
      # succeeded — pruning first would strand the live origins with no matching
      # release asset if the upload then failed, turning the verify workflow RED
      # against a healthy catalog (Codex review P2 on PR #640). A same-day
      # re-run is idempotent: the deterministic bytes + --clobber replace the
      # same-named asset in place.
      - name: Attach the new resign bundle, then prune superseded ones
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          NEW_NAME: ${{ steps.rpkg.outputs.name }}
        run: |
          set -euo pipefail
          gh release upload "$REF_NAME" "${{ steps.rpkg.outputs.bundle }}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "attached $NEW_NAME"
          gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' \
            | grep -E "^culvert-release-catalog-.+-r[0-9]{8}\.tar\.gz$" > old_resigns.txt || true
          while IFS= read -r a; do
            [ -n "$a" ] && [ "$a" != "$NEW_NAME" ] || continue
            echo "pruning superseded resign asset: $a"
            gh release delete-asset "$REF_NAME" "$a" --repo "$GITHUB_REPOSITORY" --yes
          done < old_resigns.txt

  # ─── Auto-tag ───────────────────────────────────────────────────────────
  # On every push to main, fetch the latest semver tag, bump the patch
  # version, and push the new tag.  The tag push triggers a second CI run
  # that executes the release + provenance jobs below.
  auto-tag:
    name: Auto-Tag Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write
      actions: read   # list-workflow-runs endpoint (require-gate.sh)

    steps:
      # SEC-F7: the v-tag-protection ruleset (Restrict creations) blocks
      # github-actions[bot] from creating v* tags — and the repo-level ruleset
      # cannot add the Actions bot as a bypass actor. So auto-tag pushes the tag
      # authenticated as RELEASE_TAG_PAT (a fine-grained, contents:write,
      # single-repo PAT owned by a Repository-admin bypass actor). Fail LOUDLY
      # if the secret is absent rather than surfacing a confusing checkout auth
      # error. See docs/operator/catalog-resign-runbook.md.
      - name: Assert RELEASE_TAG_PAT is configured (SEC-F7)
        env:
          RELEASE_TAG_PAT: ${{ secrets.RELEASE_TAG_PAT }}
        run: |
          test -n "$RELEASE_TAG_PAT" || {
            echo "FATAL: RELEASE_TAG_PAT secret is not set."
            echo "       The v-tag-protection ruleset blocks github-actions[bot] from"
            echo "       creating v* tags; auto-tag must push as a bypass actor."
            echo "       Create the fine-grained PAT + secret per the SEC-F7 runbook."
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need full history for tags
          # Persist the PAT (not the default token) so the tag push below is
          # authenticated as the bypass actor. Also means the tag push reliably
          # triggers the tag-ref release CI (a GITHUB_TOKEN push would not).
          token: ${{ secrets.RELEASE_TAG_PAT }}

      - name: Compute next version
        id: next
        run: |
          # Get latest semver tag, default to v0.0.0 if none exist.
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "latest=$LATEST"

          # Strip 'v' prefix, split into major.minor.patch, bump patch.
          VER="${LATEST#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT"

      - name: Require Security + QA gate approval on this SHA
        # Gate the tag on the gate WORKFLOW FILES concluding success for this
        # main-push commit — bound to the workflow path, not a spoofable
        # check-run name (former hole A), and to main-push provenance so a
        # tag re-run of the same SHA can't self-approve (former hole B).
        # `wait`: the gates run in parallel with this job on the same push.
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-release-evidence.sh "$GITHUB_SHA" wait

      - name: Create and push tag
        # The push is authenticated as RELEASE_TAG_PAT (persisted by checkout
        # above) — the ruleset evaluates the PUSHER (the PAT owner, a bypass
        # actor), not this annotated-tag author identity.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.next.outputs.next }}" -m "Release ${{ steps.next.outputs.next }}"
          git push origin "${{ steps.next.outputs.next }}"

  release:
    name: Release
    timeout-minutes: 25
    runs-on: ubuntu-latest
    # Release gating chain: the auto-tag job refuses to create the v* tag
    # until "✅ Security Gate — APPROVED" concluded success for the same SHA
    # (branch protection cannot gate tag-triggered workflows — the wait step
    # in auto-tag is the mechanical enforcement point). catalog-pipeline is a
    # hard dependency so the release-blocking catalog gate (digest-match +
    # verify) must also pass before any release asset is published. The
    # "Require gate approval" step below is the in-repo backstop for
    # manually-pushed tags (assert mode); the primary control for arbitrary
    # tags is the v* tag ruleset (see roadmap/CI-REDESIGN.md).
    needs: [test, docker, catalog-pipeline]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      id-token: write   # required for cosign keyless signing and SLSA provenance
      actions: read     # require-gate.sh (tag-path guard)

    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }

    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A PUBLISHED release is write-once. Every asset step below stages with
      # draft:true, which `action-gh-release` applies to an existing release
      # too — so a re-run of an already-published tag would take it offline and
      # could not put it back (the rebuild's digest is refused against the
      # write-once exact image tag, so publish-release never runs). Refuse
      # BEFORE the first mutation, leaving the public release untouched.
      - name: Refuse if this release is already published (tag path)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/assert-release-unpublished.sh "$REF_NAME"
      # Tag-path guard (assert): refuse to build/sign release binaries unless
      # the tagged commit was green on its main push. Defense-in-depth behind
      # the docker/catalog-pipeline guards; F3 (tag ruleset) is the primary
      # control for arbitrary-tree tags.
      - name: Require gate approval on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-release-evidence.sh "$GITHUB_SHA" assert

      - uses: ./.github/actions/setup-go-cache

      # Release version-stamp fail-closed guard: an OFFICIAL signed binary MUST carry a
      # real vX.Y.Z tag stamped into main.version. Refuse to build/sign if the ref
      # name is empty or not a semver tag; never fall back to empty/dev/latest/SHA.
      # (env-indirection: never interpolate ${{ github.ref_name }} into run: text.)
      - name: Assert release version stamp
        env:
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/assert-release-ref.sh "$REF_NAME"

      # Build the release binaries via the shared composite — the SAME action the
      # verify-reproducible job calls, so an independent tag rebuild can never
      # drift from this build. Proxy on every leg; culvert-maint on linux only.
      - name: Build release binaries
        uses: ./.github/actions/build-release-binaries
        with:
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          ext: ${{ matrix.ext || '' }}
          ref-name: ${{ github.ref_name }}
          include-maint: ${{ matrix.goos == 'linux' }}

      # Runtime version-stamp GATE (native linux/amd64 leg only): start the EXACT
      # binary that will be signed/published, probe /healthz, and assert it
      # self-reports the release tag. This is the gate that would have caught the
      # v1.0.202 defect (signed binary whose /healthz reported an empty version).
      # Foreign-platform legs cannot execute here; the shared composite guarantees
      # every leg uses the identical linker value, and this native leg proves the
      # bytes-under-signature actually surface it at runtime.
      - name: Gate runtime version stamp (linux/amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/assert-runtime-version.sh "./culvert-linux-amd64" "$REF_NAME"

      # Install cosign for keyless signing via Sigstore OIDC (no secrets needed).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # Sign the proxy binary with cosign keyless signing → a single self-contained
      # Sigstore bundle (cert + signature + Rekor proof). cosign 3.x dropped the
      # detached cert/signature output flags; --bundle is the new-format output
      # (matches the catalog step above).
      # Verify with: cosign verify-blob --bundle "${BINARY}.sigstore.json" \
      #   --new-bundle-format --certificate-identity-regexp 'github.com/...ci.yml@refs/tags/v.*' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com "${BINARY}"
      - name: Sign binary with cosign (keyless)
        run: |
          BINARY="culvert-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}"
          cosign sign-blob --yes \
            --bundle "${BINARY}.sigstore.json" \
            "${BINARY}"

      - name: Sign culvert-maint with cosign (keyless, linux)
        if: matrix.goos == 'linux'
        run: |
          BINARY="culvert-maint-${{ matrix.goos }}-${{ matrix.goarch }}"
          cosign sign-blob --yes \
            --bundle "${BINARY}.sigstore.json" \
            "${BINARY}"

      # Per-MODULE CycloneDX SBOMs, generated ONCE on the linux/amd64 leg.
      # syft reads the binary's embedded Go build-info, identical across
      # GOOS/GOARCH for a given module — so 2 module SBOMs (proxy + agent) fully
      # describe all 7 released binaries (per-binary would be 7× the same 2
      # dependency sets). Each SBOM is keyless-signed STANDALONE via `cosign
      # sign-blob --bundle` (new-format Sigstore bundle). Deliberately NOT
      # `attest-blob` with a binary subject: a per-module SBOM is shared by every
      # arch binary, so binding it to one binary's digest (e.g. linux/amd64) would
      # make verify-blob-attestation FAIL the subject-digest check for the
      # arm64/darwin/windows binaries. A standalone signed SBOM verifies for
      # consumers of ANY released binary. Attached to the Release (below). NOTE:
      # SBOMs are deliberately NOT added to "Compute release subjects" — the SLSA
      # subject set must stay exactly the 7 binaries.
      # Verify with: cosign verify-blob --new-bundle-format \
      #   --bundle culvert.sbom.cdx.json.sigstore.json \
      #   --certificate-identity-regexp '^https://github\.com/KidCarmi/Culvert/\.github/workflows/ci\.yml@refs/tags/v.*$' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #   culvert.sbom.cdx.json
      - name: Install syft (pinned)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Generate + sign binary SBOMs (linux/amd64 leg)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          for pair in "culvert-linux-amd64:culvert.sbom.cdx.json" \
                      "culvert-maint-linux-amd64:culvert-maint.sbom.cdx.json"; do
            BIN="${pair%%:*}"; SBOM="${pair##*:}"
            syft "file:$BIN" -o cyclonedx-json="$SBOM"
            # Fail closed on CONTENT, not just a byte-empty file: a zero-component
            # SBOM is worthless evidence and must not ship.
            jq -e '.components | length > 0' "$SBOM" >/dev/null \
              || { echo "::error::SBOM $SBOM has no components — refusing SBOM-less release"; exit 1; }
            cosign sign-blob --yes \
              --bundle "${SBOM}.sigstore.json" \
              "$SBOM"
          done

      # SLSA subjects: one sha256sum line per released binary for THIS leg
      # (linux legs cover both the proxy and the agent). The aggregate-subjects
      # job merges every leg's file so provenance attests ALL binaries — a single
      # matrix output key would otherwise keep only the last leg to finish.
      - name: Compute release subjects
        run: |
          FILES="culvert-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            FILES="$FILES culvert-maint-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi
          sha256sum $FILES > "subjects-${{ matrix.goos }}-${{ matrix.goarch }}.txt"
          cat "subjects-${{ matrix.goos }}-${{ matrix.goarch }}.txt"

      # Staged as a DRAFT — see the note in catalog-pipeline. publish-release
      # is the only job that makes this release public.
      - name: Stage proxy release asset + signature bundle (draft)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            culvert-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}
            culvert-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}.sigstore.json

      - name: Stage culvert-maint release asset + signature bundle (draft, linux)
        if: matrix.goos == 'linux'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            culvert-maint-${{ matrix.goos }}-${{ matrix.goarch }}
            culvert-maint-${{ matrix.goos }}-${{ matrix.goarch }}.sigstore.json

      # Attach the SBOMs + their attestation bundles to the Release (Release
      # assets are a channel DISJOINT from the SLSA subjects artifact — this
      # cannot affect the ==7 subject assertion). linux/amd64 leg only (where
      # they're made). The raw SBOM feeds tooling (grype/trivy/Dependency-Track);
      # the .sigstore.json is the in-toto attestation binding it to the binary.
      - name: Stage SBOMs + attestation bundles (draft, linux/amd64 leg)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            culvert.sbom.cdx.json
            culvert.sbom.cdx.json.sigstore.json
            culvert-maint.sbom.cdx.json
            culvert-maint.sbom.cdx.json.sigstore.json

      - name: Upload per-leg subjects artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-subjects-${{ matrix.goos }}-${{ matrix.goarch }}
          path: subjects-${{ matrix.goos }}-${{ matrix.goarch }}.txt
          retention-days: 1

  # ─── SLSA subject aggregation ─────────────────────────────────────────────
  # Merge every matrix leg's subject file into one base64 blob so provenance
  # attests EVERY released binary (proxy across all 5 legs + the agent on the
  # two linux legs). The previous single matrix `outputs.hashes` key kept only
  # the last leg to finish, so provenance under-covered the release.
  aggregate-subjects:
    name: "Supply Chain · Aggregate SLSA subjects"
    timeout-minutes: 10
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.merge.outputs.hashes }}
    steps:
      - name: Download per-leg subject artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-subjects-*
          merge-multiple: true
          path: subjects

      - name: Merge into base64 subjects
        id: merge
        run: |
          cat subjects/subjects-*.txt > all-subjects.txt
          echo "Merged SLSA subjects:"; cat all-subjects.txt
          # Fail closed if any leg dropped its artifact — partial provenance
          # (fewer subjects than published binaries) is a silent supply-chain
          # gap. Expect 7: 5 proxy binaries + 2 linux agent binaries.
          n=$(grep -c . all-subjects.txt)
          if [ "$n" -ne 7 ]; then
            echo "::error::expected 7 SLSA subjects (5 proxy + 2 agent), got $n — a release leg likely failed to upload its subjects artifact"
            exit 1
          fi
          echo "hashes=$(base64 -w0 all-subjects.txt)" >> "$GITHUB_OUTPUT"

  # ─── Verifiable reproducible-build gate ───────────────────────────────────
  # Turns SLSA L3 provenance into VERIFIABLE provenance: independently rebuild
  # every released binary at the tag (fresh checkout, fresh runner) and assert
  # each rebuilt sha256 EQUALS the signed SLSA subject (the exact bytes
  # `provenance` signs, from aggregate-subjects.outputs.hashes). Any mismatch
  # fails the leg → provenance is withheld (see its needs:) → the release run is
  # red. This is same-image, same-pinned-toolchain reproduction (not an
  # independent-environment rebuild — SLSA's trusted builder covers build
  # integrity); it catches nondeterminism from deps/toolchain drift/tampering
  # between hashing and signing. The build is the SHARED composite, so the
  # rebuild cannot drift from the real release build.
  verify-reproducible:
    name: "Supply Chain · Verify reproducible build"
    timeout-minutes: 25
    needs: [aggregate-subjects]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read   # rebuild + hash only — signs nothing, needs no id-token
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one leg's mismatch must not cancel the others' diagnostics
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Needs module-proxy egress: the composite runs `go mod download` for
          # BOTH modules (cmd/culvert-maint deps are not in the root-go.sum
          # cache). If release is ever flipped to egress-policy: block, this job
          # must get the same allowlist.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache

      # SAME fail-closed release version-stamp guard as the release job: the reproducible
      # rebuild must not silently accept a non-tag version input either (else the
      # two paths could drift on the version stamp while still hash-matching an
      # equally-wrong build).
      - name: Assert release version stamp
        env:
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/assert-release-ref.sh "$REF_NAME"

      # SAME composite + SAME inputs as the release job → an independent rebuild
      # that cannot drift from the real build.
      - name: Rebuild release binaries
        uses: ./.github/actions/build-release-binaries
        with:
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          ext: ${{ matrix.ext || '' }}
          ref-name: ${{ github.ref_name }}
          include-maint: ${{ matrix.goos == 'linux' }}

      - name: Verify rebuilt binaries hash-match the signed SLSA subjects
        working-directory: ${{ github.workspace }}
        env:
          # The authoritative expectation: the exact bytes `provenance` signs.
          HASHES_B64: ${{ needs.aggregate-subjects.outputs.hashes }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext || '' }}
        run: |
          set -euo pipefail
          echo "toolchain: $(go version)"
          # `want` comes ONLY from the decoded signed subjects; `got` comes ONLY
          # from sha256sum of this job's own independent rebuild — never the
          # reverse, or the check would compare the composite to itself.
          printf '%s' "$HASHES_B64" | base64 -d > all-subjects.txt
          echo "── Signed SLSA subjects ──"; cat all-subjects.txt
          # This leg's binaries: proxy always (with ext, so windows carries .exe
          # — the subject line is 'culvert-windows-amd64.exe'); maint on linux.
          # BARE basenames, matching the subject file computed from the repo root.
          FILES="culvert-${GOOS}-${GOARCH}${EXT}"
          if [ "$GOOS" = "linux" ]; then
            FILES="$FILES culvert-maint-${GOOS}-${GOARCH}"
          fi
          matched=0
          for f in $FILES; do
            want=$(awk -v f="$f" '$2 == f { print $1 }' all-subjects.txt)
            if [ -z "$want" ]; then
              echo "::error::no signed SLSA subject found for ${f} — the release did not publish this binary (or the filename drifted)"
              exit 1
            fi
            got=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              echo "::error::REPRODUCIBILITY BREAK: ${f} rebuilt=${got} but signed subject=${want} — the released binary is NOT the deterministic output of the tagged source"
              exit 1
            fi
            echo "ok: ${f} ${got}"
            matched=$((matched + 1))
          done
          echo "reproducibility: ${matched}/${matched} binaries hash-matched the signed subjects for ${GOOS}/${GOARCH}"

  # ─── SLSA provenance ──────────────────────────────────────────────────────
  # Generates SLSA Level 3 provenance for all release binaries, providing a
  # cryptographically verifiable record of what was built, when, and how.
  # Gated on verify-reproducible: a repro break on ANY leg withholds the
  # attestation. Do NOT add always()/success()/a status function to the `if`
  # below — that would silently open the gate (a failed need would no longer
  # skip this job).
  provenance:
    name: "Supply Chain · SLSA provenance"
    needs: [aggregate-subjects, verify-reproducible]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.aggregate-subjects.outputs.hashes }}
      upload-assets: true

  # ─── Release publication (the final promotion) ────────────────────────────
  # The ONLY job that makes a release public. Every asset-carrying step above
  # writes to a DRAFT; this job flips draft=false after the full downstream
  # evidence chain has succeeded:
  #
  #   catalog-pipeline    — digest-match + keyless catalog signature + verify of
  #                         the pushed image signature against the pinned identity
  #   promote-release-channels — the version channels this release names actually point
  #                         at the verified digest (a release advertising a
  #                         version whose image tag was never promoted is a
  #                         half-published release)
  #   release             — build, cosign-sign, SBOM, stage every binary
  #   aggregate-subjects  — the complete SLSA subject set
  #   verify-reproducible — an independent rebuild hash-matches every signed subject
  #   provenance          — SLSA L3 attestation uploaded
  #
  # Before this job existed, the first `softprops/action-gh-release` upload
  # created a LIVE release, so the binaries were public roughly the whole time
  # verify-reproducible and provenance were running — and remained public if
  # either failed. A failing need now skips this job and the release simply
  # stays a draft: fail-closed, and recoverable by re-running the chain.
  #
  # Do NOT add always()/!cancelled()/a status function to the `if` below — that
  # would publish the release even when a need failed, which is precisely the
  # fail-open this job exists to close.
  publish-release:
    name: "Release · Publish (post-evidence)"
    timeout-minutes: 15
    needs: [release, catalog-pipeline, promote-release-channels, aggregate-subjects, verify-reproducible, provenance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # clears the draft flag via the releases API
      actions: read     # require-release-evidence.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Defense in depth: the needs-chain already proves the downstream checks,
      # and every job in it asserted the predicate, but the last step before a
      # release becomes public re-asserts it rather than inheriting the claim.
      - name: Require release evidence for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-release-evidence.sh "$GITHUB_SHA" assert

      # Prove the draft actually carries what the chain claims to have staged
      # before making it public. A release that is missing a binary, a signature
      # bundle, the signed catalog or the SLSA provenance must not be published
      # just because every job happened to return zero.
      - name: Assert the staged release is complete
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/assert-release-complete.sh "$TAG"

      # GitHub's "Latest" designation is load-bearing: scripts/install.sh
      # resolves its bootstrap verifier through /releases/latest, so marking a
      # SUPERSEDED tag as Latest points fresh installs at an older verifier.
      # An unconditional `gh release edit --latest` did exactly that whenever an
      # older tag's run finished after a newer release, or when an operator
      # re-ran an old tag's workflow (Codex review, PR #1441).
      #
      # `make_latest: legacy` is the RACE-FREE answer, and is why this step
      # takes no cross-tag lock. Comparing against `git tag` — even refreshed —
      # is a check-then-act: a tag created between the read and the edit still
      # wins the race, and tag workflows run concurrently because ci.yml's
      # concurrency key includes the ref. `legacy` moves the decision INTO the
      # same atomic API call that clears the draft, and GitHub arbitrates it
      # from the full set of releases by semantic version and creation date —
      # so there is no window for this run to observe stale state at all.
      #
      # Do NOT replace this with `--latest`/`--latest=false`: both assert an
      # answer this job cannot compute without a race.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_ID="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.id')"
          test -n "$RELEASE_ID" || { echo "::error::no release found for ${TAG} — refusing"; exit 1; }
          gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=legacy >/dev/null
          IS_LATEST="$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || echo '?')"
          echo "published $TAG — GitHub resolved Latest to: $IS_LATEST"
          {
            echo "### Release published"
            echo ""
            echo "\`$TAG\` was promoted from draft to public after the full evidence chain succeeded."
            echo ""
            echo "The \"Latest\" designation was left to GitHub (\`make_latest: legacy\`, decided by semantic version and creation date, atomically with the un-draft) and currently resolves to \`$IS_LATEST\`."
          } >> "$GITHUB_STEP_SUMMARY"
