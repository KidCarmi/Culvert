# NOTE: the workflow name "CI" is load-bearing — publish-catalog-pages.yml
# triggers on `workflow_run: workflows: ["CI"]`. Renaming this workflow
# silently stops signed-catalog publication to Pages.
name: CI
# Least-privilege default: jobs that need write scopes (packages, checks,
# contents, security-events, pull-requests) declare them at job level.
permissions:
  contents: read


on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # PRs: fast-cancel superseded runs. Main/tags: QUEUE instead — cancelling a
  # main run mid-flight can kill release machinery after images were pushed
  # but before auto-tag ran, orphaning ghcr tags (CI review P1-3).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip on PRs (CI review): duplicates the Fast PR Gate's hygiene job
    # (fmt/vet/build) exactly; this job remains the main/tag-path build that
    # feeds smoke/docker/auto-tag/release.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      # Repo-wide gofmt gate. Hard-fails on any unformatted file. Unlike the
      # diff-scoped reviewdog lint in code-review.yml, this checks every file
      # and runs on pushes too, so accumulated formatting drift can't slip in.
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # PR-time tests/lint/security live in the Fast/Deep PR Gates; the full
      # QA/security gates run on main pushes and tags; fuzzing is scheduled
      # (fuzz-nightly.yml). This job only verifies compilation on the
      # main/tag path.
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o culvert .

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: culvert-linux-amd64
          path: culvert
          retention-days: 7

  dependency-obituary:
    name: Dependency Obituary
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # ADVISORY (not merge-blocking). The action (KidCarmi/Dependency-Obituary)
    # exposes only `threshold` — no per-package allowlist/ignore and no
    # fail-on-regression mode. The keyless release-catalog verifier (P2b,
    # sigstore-go) transitively requires github.com/blang/semver v3.5.1 (health
    # score 0 — the v3 import path is frozen since 2019; rekor/pkg/types pins it)
    # plus several at-risk deps that are ALSO pre-existing direct deps of this
    # repo (crewjam/saml, beevik/etree, cespare/xxhash, dustin/go-humanize).
    # Since a score-0 package can't be passed by any non-zero threshold and the
    # action can't allowlist it, the job is made advisory: the bot still posts
    # its full dependency scorecard for visibility, but a low score no longer
    # blocks the PR. Revisit if the action gains an allowlist/regression mode.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: KidCarmi/Dependency-Obituary@9a35b0a193035bc746428bfdc9664f0ee0818028 # main @ 2026-07-03
        # step-level continue-on-error so the JOB (and its check run) concludes
        # success — a job-level flag would leave the check red on the PR.
        continue-on-error: true
        with:
          threshold: "60"

  smoke:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip on PRs (CI review): a full compose image build per PR; the Deep PR
    # Gate's build-image + compose-validate covers container-surface PRs.
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build proxy image from branch source
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build proxy

      - name: Start proxy (no deps — skips ClamAV and updater)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-deps proxy

      - name: Wait for healthy (fail fast on container exit)
        timeout-minutes: 3   # loop budget is 120s — pad so the loop's own FAIL diagnostic wins, not a step-timeout cancel
        run: |
          for i in $(seq 1 24); do
            STATE=$(docker inspect --format='{{.State.Status}}' culvert 2>/dev/null || echo "missing")
            if [ "$STATE" != "running" ]; then
              echo "FAIL: container is not running (state=$STATE)"
              exit 1
            fi
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' culvert 2>/dev/null || echo "unknown")
            echo "Attempt $i/24: container=$STATE health=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "FAIL: container did not become healthy within 120s"
          exit 1

      - name: Health check (/health — liveness)
        run: |
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'

      - name: Readiness check (/ready — subsystems up, 3 attempts)
        run: |
          for i in 1 2 3; do
            if curl -sf http://localhost:8080/ready 2>/dev/null | grep -q '"status":"ready"'; then
              echo "Ready check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 2s..."
            sleep 2
          done
          echo "FAIL: /ready did not return ready after 3 attempts"
          exit 1

      - name: Diagnostics and teardown
        if: always()
        run: |
          echo "=== docker compose ps ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          echo "=== docker compose logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color proxy
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  docker:
    name: Docker Build & Publish
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [test, smoke]
    # Skip on PRs (retirement step, roadmap/CI-REDESIGN.md §3.9): the PR run
    # built multi-arch amd64+arm64 via QEMU with push:false — pure cost. The
    # Deep PR Gate builds + trivy-scans the amd64 image on PRs that touch the
    # container surface, and the Fast PR Gate compile-checks linux/arm64.
    # Every downstream consumer of this job (catalog-pipeline, auto-tag,
    # release) already only runs on main pushes or v* tags.
    if: github.event_name != 'pull_request'

    # Expose the pushed manifest-list digest + computed version so the
    # catalog-pipeline job (P2a) can generate + gate the release catalog against
    # the digest the workflow actually pushed.
    outputs:
      proxy_digest: ${{ steps.build.outputs.digest }}
      version_bare: ${{ steps.next-ver.outputs.version_bare }}

    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # cosign keyless image signing
      actions: read        # require-gate.sh (tag-path guard)

    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   # full history needed for tag-based version computation

      # Tag-path guard: on a v* tag this job builds, pushes, and cosign-signs
      # ghcr images BEFORE the release job runs — so the gate check must sit
      # here too, not only in release. Refuse unless the tagged commit was
      # green on its main push (assert mode: the main run must already exist).
      - name: Require gate approval on the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/require-gate.sh security-release-gate.yml "$GITHUB_SHA" assert
          .github/scripts/require-gate.sh qa-gate.yml "$GITHUB_SHA" assert

      # ── Compute next semver on main push ──────────────────────────────────
      # GITHUB_TOKEN tag pushes (from auto-tag) can't trigger new workflows,
      # so the docker job must compute and apply semver tags in the same run.
      - name: Compute next version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: next-ver
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
          VER="${LATEST#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "version=$NEXT" >> $GITHUB_OUTPUT
          echo "version_bare=${NEXT#v}" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT"

      # ── Lowercase repo name ───────────────────────────────────────────────
      # Container registries require lowercase image names, but
      # ${{ github.repository }} preserves the original case (e.g.
      # "KidCarmi/Culvert"). docker/metadata-action lowercases automatically;
      # the updater build step uses raw `tags:` so we have to do it ourselves.
      - name: Compute lowercase image base
        id: img-lc
        run: |
          LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$LC" >> $GITHUB_OUTPUT

      # ── Registry login ────────────────────────────────────────────────────
      # ghcr.io: always available, uses GITHUB_TOKEN — no secrets needed.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Image metadata ────────────────────────────────────────────────────
      # Generates tags and labels automatically:
      #   • version tags (v1.2.3 → 1.2.3, 1.2, 1, latest)  [tag-ref events]
      #   • computed next version                            [main push]
      #   • branch tags  (main → main)
      #   • PR tags      (pr-42)
      #   • SHA tag      (sha-abc1234)
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.next-ver.outputs.version }},enable=${{ steps.next-ver.outputs.version != '' }}
            type=raw,value=${{ steps.next-ver.outputs.version_bare }},enable=${{ steps.next-ver.outputs.version_bare != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Culvert
            org.opencontainers.image.description=Enterprise-grade HTTP/HTTPS/SOCKS5 forward proxy
            org.opencontainers.image.vendor=KidCarmi
            org.opencontainers.image.licenses=MIT

      # ── Multi-arch build & push ───────────────────────────────────────────
      - name: Set up QEMU (for ARM emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push only on main branch or version tags; PRs just build (no push).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.next-ver.outputs.version || steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Embed provenance + SBOM attestations directly in the image manifest.
          provenance: true
          sbom: true

      # ── Build & push updater sidecar image ────────────────────────────────
      - name: Build and push updater image
        id: build-updater
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.updater
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.img-lc.outputs.repo }}-updater:latest
            ghcr.io/${{ steps.img-lc.outputs.repo }}-updater:${{ steps.next-ver.outputs.version || 'dev' }}
          labels: |
            org.opencontainers.image.title=Culvert Updater
            org.opencontainers.image.description=Update sidecar for Culvert proxy
            org.opencontainers.image.vendor=KidCarmi
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

      # ── Apply semver tags explicitly ──────────────────────────────────────
      # The metadata-action raw tags with enable= can silently fail to apply.
      # This step guarantees the computed semver tag (e.g. v0.0.18) is applied
      # to the image that was just pushed.
      - name: Apply version tag
        if: steps.next-ver.outputs.version != '' && github.event_name != 'pull_request'
        run: |
          VER="${{ steps.next-ver.outputs.version }}"
          VER_BARE="${{ steps.next-ver.outputs.version_bare }}"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "Tagging image with ${VER} and ${VER_BARE}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${VER}" \
            --tag "${IMAGE}:${VER_BARE}" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Apply version tag (updater)
        if: steps.next-ver.outputs.version != '' && github.event_name != 'pull_request'
        run: |
          VER="${{ steps.next-ver.outputs.version }}"
          VER_BARE="${{ steps.next-ver.outputs.version_bare }}"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-updater"
          echo "Tagging updater image with ${VER} and ${VER_BARE}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${VER}" \
            --tag "${IMAGE}:${VER_BARE}" \
            "${IMAGE}@${{ steps.build-updater.outputs.digest }}"

      # ── Sign the published image with cosign (keyless) ────────────────────
      # Only runs when the image was actually pushed (not PRs).
      - name: Install cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the cosign BINARY (installer default drifts across majors; the
          # 2.x→3.x jump dropped the detached cert/signature output flags on
          # sign-blob/attest-blob in favour of the Sigstore bundle).
          cosign-release: 'v3.0.6'

      - name: Sign proxy image (keyless via Sigstore)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Sign every tag that was pushed.
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            cosign sign --yes \
              --rekor-url=https://rekor.sigstore.dev \
              "${tag}@${{ steps.build.outputs.digest }}"
          done

      - name: Sign updater image (keyless via Sigstore)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-updater"
          for tag in "latest" "${{ steps.next-ver.outputs.version || 'dev' }}"; do
            cosign sign --yes \
              --rekor-url=https://rekor.sigstore.dev \
              "${IMAGE}:${tag}@${{ steps.build-updater.outputs.digest }}"
          done

  # ─── Release catalog gate (P2a) ─────────────────────────────────────────────
  # Generates the release catalog from the digest the docker job actually pushed,
  # then runs the in-repo gate (TestReleaseCatalogGate) which round-trips the
  # generated bundle through the REAL LoadVerifiedCatalog verifier and asserts
  # every list_digest equals the pushed manifest-list digest. The gate fails the
  # release on a tag ref, a digest mismatch, a mutated/invalid manifest, or a
  # freshness/schema violation — so an official catalog can never be published
  # out of step with the image. The ephemeral ed25519 key the gate signs with is
  # in-process and discarded; the attached bundle is UNSIGNED (P2b adds the
  # official Sigstore-identity signature and the Control-Plane verifier).
  catalog-pipeline:
    name: "Supply Chain · Release catalog gate"
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: [docker]
    # Run on BOTH the main-push run (early feedback before auto-tag) AND the
    # tag-release run, where the `release` job actually publishes assets — the
    # `release` job depends on this job, so a failed catalog gate blocks the
    # release (genuinely release-blocking, not just a main-push proof).
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write     # attach the signed catalog to the GitHub Release (tag path)
      id-token: write     # cosign keyless blob signing of index.json (tag path)
      actions: read       # require-gate.sh (tag-path guard)
    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   # tag history for catalog_version
      # Tag-path guard: this job keyless-signs the release catalog on a v*
      # tag. Refuse unless the tagged commit was green on its main push.
      - name: Require gate approval on the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/require-gate.sh security-release-gate.yml "$GITHUB_SHA" assert
          .github/scripts/require-gate.sh qa-gate.yml "$GITHUB_SHA" assert
      - uses: ./.github/actions/setup-go-cache
      - name: Build catalog spec from the pushed digest
        id: spec
        env:
          DIGEST: ${{ needs.docker.outputs.proxy_digest }}
          # version_bare is set only on the main-push run; on the tag-release run
          # derive it from the tag ref (refs/tags/vX.Y.Z → X.Y.Z).
          VERSION: ${{ needs.docker.outputs.version_bare }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$DIGEST" || { echo "missing pushed digest"; exit 1; }
          if [ -z "$VERSION" ]; then VERSION="${REF_NAME#v}"; fi
          test -n "$VERSION" || { echo "missing version"; exit 1; }
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EXP=$(date -u -d '+90 days' +%Y-%m-%dT%H:%M:%SZ)
          # Monotonic catalog_version = (count of v* tags) + 1.
          CATVER=$(( $(git tag --list 'v*' | wc -l | tr -d ' ') + 1 ))
          OUT="$RUNNER_TEMP/catalog-out"
          mkdir -p "$OUT"
          cat > "$RUNNER_TEMP/spec.json" <<EOF
          {"generated_at":"$NOW","expires_at":"$EXP","catalog_version":$CATVER,
           "entries":[{"release_id":"culvert-$VERSION","version_id":"$VERSION","severity":"normal",
             "repo":"ghcr.io/kidcarmi/culvert","list_digest":"$DIGEST",
             "platforms":["linux/amd64","linux/arm64"],"created_at":"$NOW",
             "channels":["recommended"]}]}
          EOF
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
      - name: Run release catalog gate (generate + verify + digest-match)
        env:
          CULVERT_RELEASE_GEN_SPEC: ${{ runner.temp }}/spec.json
          CULVERT_RELEASE_GEN_OUT: ${{ steps.spec.outputs.out }}
          CULVERT_RELEASE_EXPECT_DIGEST: ${{ needs.docker.outputs.proxy_digest }}
        run: go test -run TestReleaseCatalogGate -count=1 -v .

      # ── Keyless catalog signing + verification (TAG path only) ────────────────
      # On a tag release, sign the deterministic index.json keyless (Fulcio +
      # Rekor, no private key), then prove the SHIPPED in-binary verifier accepts
      # it (baked root + pinned ci.yml identity), and prove the pushed image was
      # signed by the SAME identity. Signing requires a tagged-release OIDC SAN
      # (@refs/tags/v*), so these steps never run on the main-push gate.
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Sign catalog index keyless (cosign sign-blob → index.json.sigstore)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          OUT="${{ steps.spec.outputs.out }}"
          cosign sign-blob --yes \
            --bundle "$OUT/index.json.sigstore" \
            "$OUT/index.json"
          test -s "$OUT/index.json.sigstore" || { echo "empty .sigstore bundle"; exit 1; }
      - name: Keyless end-to-end verify (baked root + pinned identity)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CULVERT_RELEASE_GEN_OUT: ${{ steps.spec.outputs.out }}
          CULVERT_RELEASE_GEN_VERIFY_SIGSTORE: "1"
        run: go test -run TestReleaseCatalogKeylessVerify -count=1 -v .
      - name: Verify pushed image signature matches the pinned release identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          # Single source of truth shared with the in-binary verifier
          # (TestReleaseIdentitySSOT pins release_identity.env == Go constants).
          # Read the RAW values via cut — NOT `source` — because the SAN regex
          # contains backslashes (`github\.com`) that bash escape-processing would
          # strip, drifting the CI regex from the validated Go constant.
          ISSUER=$(grep '^CULVERT_RELEASE_SIGSTORE_ISSUER=' release_identity.env | cut -d= -f2-)
          SAN_REGEX=$(grep '^CULVERT_RELEASE_SIGSTORE_SAN_REGEX=' release_identity.env | cut -d= -f2-)
          test -n "$ISSUER" && test -n "$SAN_REGEX" || { echo "missing identity in release_identity.env"; exit 1; }
          cosign verify \
            --certificate-oidc-issuer="$ISSUER" \
            --certificate-identity-regexp="$SAN_REGEX" \
            "ghcr.io/kidcarmi/culvert@${{ needs.docker.outputs.proxy_digest }}"

      - name: Upload generated catalog bundle (signed on tag path)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-catalog-bundle
          path: ${{ steps.spec.outputs.out }}
          if-no-files-found: error
      # Package the COMPLETE signed catalog (index.json + index.json.sigstore +
      # manifests/<ref>) as one tar.gz. A bare index.json + signature is NOT a
      # usable catalog — the verified index references manifests/<ref> that the
      # loader/HTTP provider must fetch. The archive is exactly what the air-gap
      # BundleCatalogProvider imports (gzip-sniffing tar reader staging index.json,
      # index.json.sigstore, manifests/*).
      - name: Package signed catalog bundle (tag path)
        if: startsWith(github.ref, 'refs/tags/v')
        id: pkg
        env:
          # env-indirection: ref names may contain shell metacharacters —
          # never interpolate ${{ github.ref_name }} directly into run: text.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OUT="${{ steps.spec.outputs.out }}"
          test -s "$OUT/index.json.sigstore" || { echo "missing signed bundle"; exit 1; }
          BUNDLE="$RUNNER_TEMP/culvert-release-catalog-${REF_NAME}.tar.gz"
          tar -C "$OUT" -czf "$BUNDLE" index.json index.json.sigstore manifests
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
      - name: Attach complete signed catalog bundle to the GitHub Release (tag path)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: ${{ steps.pkg.outputs.bundle }}

  # ─── Auto-tag ───────────────────────────────────────────────────────────
  # On every push to main, fetch the latest semver tag, bump the patch
  # version, and push the new tag.  The tag push triggers a second CI run
  # that executes the release + provenance jobs below.
  auto-tag:
    name: Auto-Tag Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write
      actions: read   # list-workflow-runs endpoint (require-gate.sh)

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   # need full history for tags

      - name: Compute next version
        id: next
        run: |
          # Get latest semver tag, default to v0.0.0 if none exist.
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "latest=$LATEST"

          # Strip 'v' prefix, split into major.minor.patch, bump patch.
          VER="${LATEST#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT"

      - name: Require Security + QA gate approval on this SHA
        # Gate the tag on the gate WORKFLOW FILES concluding success for this
        # main-push commit — bound to the workflow path, not a spoofable
        # check-run name (former hole A), and to main-push provenance so a
        # tag re-run of the same SHA can't self-approve (former hole B).
        # `wait`: the gates run in parallel with this job on the same push.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/require-gate.sh security-release-gate.yml "$GITHUB_SHA" wait
          .github/scripts/require-gate.sh qa-gate.yml "$GITHUB_SHA" wait

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.next.outputs.next }}" -m "Release ${{ steps.next.outputs.next }}"
          git push origin "${{ steps.next.outputs.next }}"

  release:
    name: Release
    timeout-minutes: 25
    runs-on: ubuntu-latest
    # Release gating chain: the auto-tag job refuses to create the v* tag
    # until "✅ Security Gate — APPROVED" concluded success for the same SHA
    # (branch protection cannot gate tag-triggered workflows — the wait step
    # in auto-tag is the mechanical enforcement point). catalog-pipeline is a
    # hard dependency so the release-blocking catalog gate (digest-match +
    # verify) must also pass before any release asset is published. The
    # "Require gate approval" step below is the in-repo backstop for
    # manually-pushed tags (assert mode); the primary control for arbitrary
    # tags is the v* tag ruleset (see roadmap/CI-REDESIGN.md).
    needs: [test, docker, catalog-pipeline]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      id-token: write   # required for cosign keyless signing and SLSA provenance
      actions: read     # require-gate.sh (tag-path guard)

    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }

    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Tag-path guard (assert): refuse to build/sign release binaries unless
      # the tagged commit was green on its main push. Defense-in-depth behind
      # the docker/catalog-pipeline guards; F3 (tag ruleset) is the primary
      # control for arbitrary-tree tags.
      - name: Require gate approval on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/require-gate.sh security-release-gate.yml "$GITHUB_SHA" assert
          .github/scripts/require-gate.sh qa-gate.yml "$GITHUB_SHA" assert

      - uses: ./.github/actions/setup-go-cache

      # Build the release binaries via the shared composite — the SAME action the
      # verify-reproducible job calls, so an independent tag rebuild can never
      # drift from this build. Proxy on every leg; culvert-maint on linux only.
      - name: Build release binaries
        uses: ./.github/actions/build-release-binaries
        with:
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          ext: ${{ matrix.ext || '' }}
          ref-name: ${{ github.ref_name }}
          include-maint: ${{ matrix.goos == 'linux' }}

      # Install cosign for keyless signing via Sigstore OIDC (no secrets needed).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # Sign the proxy binary with cosign keyless signing → a single self-contained
      # Sigstore bundle (cert + signature + Rekor proof). cosign 3.x dropped the
      # detached cert/signature output flags; --bundle is the new-format output
      # (matches the catalog step above).
      # Verify with: cosign verify-blob --bundle "${BINARY}.sigstore.json" \
      #   --new-bundle-format --certificate-identity-regexp 'github.com/...ci.yml@refs/tags/v.*' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com "${BINARY}"
      - name: Sign binary with cosign (keyless)
        run: |
          BINARY="culvert-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}"
          cosign sign-blob --yes \
            --bundle "${BINARY}.sigstore.json" \
            "${BINARY}"

      - name: Sign culvert-maint with cosign (keyless, linux)
        if: matrix.goos == 'linux'
        run: |
          BINARY="culvert-maint-${{ matrix.goos }}-${{ matrix.goarch }}"
          cosign sign-blob --yes \
            --bundle "${BINARY}.sigstore.json" \
            "${BINARY}"

      # Per-MODULE CycloneDX SBOMs, generated ONCE on the linux/amd64 leg.
      # syft reads the binary's embedded Go build-info, identical across
      # GOOS/GOARCH for a given module — so 2 module SBOMs (proxy + agent) fully
      # describe all 7 released binaries (per-binary would be 7× the same 2
      # dependency sets). Each SBOM is keyless-signed STANDALONE via `cosign
      # sign-blob --bundle` (new-format Sigstore bundle). Deliberately NOT
      # `attest-blob` with a binary subject: a per-module SBOM is shared by every
      # arch binary, so binding it to one binary's digest (e.g. linux/amd64) would
      # make verify-blob-attestation FAIL the subject-digest check for the
      # arm64/darwin/windows binaries. A standalone signed SBOM verifies for
      # consumers of ANY released binary. Attached to the Release (below). NOTE:
      # SBOMs are deliberately NOT added to "Compute release subjects" — the SLSA
      # subject set must stay exactly the 7 binaries.
      # Verify with: cosign verify-blob --new-bundle-format \
      #   --bundle culvert.sbom.cdx.json.sigstore.json \
      #   --certificate-identity-regexp '^https://github\.com/KidCarmi/Culvert/\.github/workflows/ci\.yml@refs/tags/v.*$' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #   culvert.sbom.cdx.json
      - name: Install syft (pinned)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Generate + sign binary SBOMs (linux/amd64 leg)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          for pair in "culvert-linux-amd64:culvert.sbom.cdx.json" \
                      "culvert-maint-linux-amd64:culvert-maint.sbom.cdx.json"; do
            BIN="${pair%%:*}"; SBOM="${pair##*:}"
            syft "file:$BIN" -o cyclonedx-json="$SBOM"
            # Fail closed on CONTENT, not just a byte-empty file: a zero-component
            # SBOM is worthless evidence and must not ship.
            jq -e '.components | length > 0' "$SBOM" >/dev/null \
              || { echo "::error::SBOM $SBOM has no components — refusing SBOM-less release"; exit 1; }
            cosign sign-blob --yes \
              --bundle "${SBOM}.sigstore.json" \
              "$SBOM"
          done

      # SLSA subjects: one sha256sum line per released binary for THIS leg
      # (linux legs cover both the proxy and the agent). The aggregate-subjects
      # job merges every leg's file so provenance attests ALL binaries — a single
      # matrix output key would otherwise keep only the last leg to finish.
      - name: Compute release subjects
        run: |
          FILES="culvert-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            FILES="$FILES culvert-maint-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi
          sha256sum $FILES > "subjects-${{ matrix.goos }}-${{ matrix.goarch }}.txt"
          cat "subjects-${{ matrix.goos }}-${{ matrix.goarch }}.txt"

      - name: Upload proxy release asset + signature bundle
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            culvert-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}
            culvert-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}.sigstore.json

      - name: Upload culvert-maint release asset + signature bundle (linux)
        if: matrix.goos == 'linux'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            culvert-maint-${{ matrix.goos }}-${{ matrix.goarch }}
            culvert-maint-${{ matrix.goos }}-${{ matrix.goarch }}.sigstore.json

      # Attach the SBOMs + their attestation bundles to the Release (Release
      # assets are a channel DISJOINT from the SLSA subjects artifact — this
      # cannot affect the ==7 subject assertion). linux/amd64 leg only (where
      # they're made). The raw SBOM feeds tooling (grype/trivy/Dependency-Track);
      # the .sigstore.json is the in-toto attestation binding it to the binary.
      - name: Upload SBOMs + attestation bundles (linux/amd64 leg)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            culvert.sbom.cdx.json
            culvert.sbom.cdx.json.sigstore.json
            culvert-maint.sbom.cdx.json
            culvert-maint.sbom.cdx.json.sigstore.json

      - name: Upload per-leg subjects artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-subjects-${{ matrix.goos }}-${{ matrix.goarch }}
          path: subjects-${{ matrix.goos }}-${{ matrix.goarch }}.txt
          retention-days: 1

  # ─── SLSA subject aggregation ─────────────────────────────────────────────
  # Merge every matrix leg's subject file into one base64 blob so provenance
  # attests EVERY released binary (proxy across all 5 legs + the agent on the
  # two linux legs). The previous single matrix `outputs.hashes` key kept only
  # the last leg to finish, so provenance under-covered the release.
  aggregate-subjects:
    name: "Supply Chain · Aggregate SLSA subjects"
    timeout-minutes: 10
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.merge.outputs.hashes }}
    steps:
      - name: Download per-leg subject artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-subjects-*
          merge-multiple: true
          path: subjects

      - name: Merge into base64 subjects
        id: merge
        run: |
          cat subjects/subjects-*.txt > all-subjects.txt
          echo "Merged SLSA subjects:"; cat all-subjects.txt
          # Fail closed if any leg dropped its artifact — partial provenance
          # (fewer subjects than published binaries) is a silent supply-chain
          # gap. Expect 7: 5 proxy binaries + 2 linux agent binaries.
          n=$(grep -c . all-subjects.txt)
          if [ "$n" -ne 7 ]; then
            echo "::error::expected 7 SLSA subjects (5 proxy + 2 agent), got $n — a release leg likely failed to upload its subjects artifact"
            exit 1
          fi
          echo "hashes=$(base64 -w0 all-subjects.txt)" >> "$GITHUB_OUTPUT"

  # ─── Verifiable reproducible-build gate ───────────────────────────────────
  # Turns SLSA L3 provenance into VERIFIABLE provenance: independently rebuild
  # every released binary at the tag (fresh checkout, fresh runner) and assert
  # each rebuilt sha256 EQUALS the signed SLSA subject (the exact bytes
  # `provenance` signs, from aggregate-subjects.outputs.hashes). Any mismatch
  # fails the leg → provenance is withheld (see its needs:) → the release run is
  # red. This is same-image, same-pinned-toolchain reproduction (not an
  # independent-environment rebuild — SLSA's trusted builder covers build
  # integrity); it catches nondeterminism from deps/toolchain drift/tampering
  # between hashing and signing. The build is the SHARED composite, so the
  # rebuild cannot drift from the real release build.
  verify-reproducible:
    name: "Supply Chain · Verify reproducible build"
    timeout-minutes: 25
    needs: [aggregate-subjects]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read   # rebuild + hash only — signs nothing, needs no id-token
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one leg's mismatch must not cancel the others' diagnostics
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          # Needs module-proxy egress: the composite runs `go mod download` for
          # BOTH modules (cmd/culvert-maint deps are not in the root-go.sum
          # cache). If release is ever flipped to egress-policy: block, this job
          # must get the same allowlist.
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup-go-cache

      # SAME composite + SAME inputs as the release job → an independent rebuild
      # that cannot drift from the real build.
      - name: Rebuild release binaries
        uses: ./.github/actions/build-release-binaries
        with:
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          ext: ${{ matrix.ext || '' }}
          ref-name: ${{ github.ref_name }}
          include-maint: ${{ matrix.goos == 'linux' }}

      - name: Verify rebuilt binaries hash-match the signed SLSA subjects
        working-directory: ${{ github.workspace }}
        env:
          # The authoritative expectation: the exact bytes `provenance` signs.
          HASHES_B64: ${{ needs.aggregate-subjects.outputs.hashes }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext || '' }}
        run: |
          set -euo pipefail
          echo "toolchain: $(go version)"
          # `want` comes ONLY from the decoded signed subjects; `got` comes ONLY
          # from sha256sum of this job's own independent rebuild — never the
          # reverse, or the check would compare the composite to itself.
          printf '%s' "$HASHES_B64" | base64 -d > all-subjects.txt
          echo "── Signed SLSA subjects ──"; cat all-subjects.txt
          # This leg's binaries: proxy always (with ext, so windows carries .exe
          # — the subject line is 'culvert-windows-amd64.exe'); maint on linux.
          # BARE basenames, matching the subject file computed from the repo root.
          FILES="culvert-${GOOS}-${GOARCH}${EXT}"
          if [ "$GOOS" = "linux" ]; then
            FILES="$FILES culvert-maint-${GOOS}-${GOARCH}"
          fi
          matched=0
          for f in $FILES; do
            want=$(awk -v f="$f" '$2 == f { print $1 }' all-subjects.txt)
            if [ -z "$want" ]; then
              echo "::error::no signed SLSA subject found for ${f} — the release did not publish this binary (or the filename drifted)"
              exit 1
            fi
            got=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              echo "::error::REPRODUCIBILITY BREAK: ${f} rebuilt=${got} but signed subject=${want} — the released binary is NOT the deterministic output of the tagged source"
              exit 1
            fi
            echo "ok: ${f} ${got}"
            matched=$((matched + 1))
          done
          echo "reproducibility: ${matched}/${matched} binaries hash-matched the signed subjects for ${GOOS}/${GOARCH}"

  # ─── SLSA provenance ──────────────────────────────────────────────────────
  # Generates SLSA Level 3 provenance for all release binaries, providing a
  # cryptographically verifiable record of what was built, when, and how.
  # Gated on verify-reproducible: a repro break on ANY leg withholds the
  # attestation. Do NOT add always()/success()/a status function to the `if`
  # below — that would silently open the gate (a failed need would no longer
  # skip this job).
  provenance:
    name: "Supply Chain · SLSA provenance"
    needs: [aggregate-subjects, verify-reproducible]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.aggregate-subjects.outputs.hashes }}
      upload-assets: true
