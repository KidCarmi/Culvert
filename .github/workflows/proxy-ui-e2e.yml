# Admin-UI Browser E2E (CI quality program — advisory tier)
#
# Real-browser end-to-end coverage of the admin UI SPA via playwright-go,
# driving headless Chromium against the REAL admin-UI handler chain mounted
# in-process (httptest.NewServer(newAdminUIHandler)). Hermetic: no external
# services, no public target sites.
#
# ADVISORY / NON-BLOCKING by design — never added to qa-gate-approved. Browser
# E2E is inherently flakier than the socket-level Go suites, so it runs nightly
# + on-demand and reports, but does not gate merges. The suite lives behind the
# `uie2e` build tag so playwright-go and a browser are NEVER pulled into the
# required `go test ./...` gate or the shipped single binary.
#
# See docs/ci/ui-e2e-playwright-plan.md.

name: Proxy UI E2E (advisory)

on:
  schedule:
    - cron: "37 4 * * *" # 04:37 UTC daily (off the top-of-hour)
  workflow_dispatch:
  pull_request:
    paths:
      - "ui*.go"
      - "static/index.html"
      - "session.go"
      - "store.go"
      - "events.go"
      - "configversion.go"
      - "ui_rbac_e2e_test.go"
      - "ui_login_e2e_test.go"
      - "ui_policy_e2e_test.go"
      - "ui_events_e2e_test.go"
      - "ui_audit_e2e_test.go"
      - "ui_policytester_e2e_test.go"
      - "ui_governance_e2e_test.go"
      - "ui_blocklist_e2e_test.go"
      - "ui_rewrite_e2e_test.go"
      - "ui_fileblock_e2e_test.go"
      - "ui_pac_e2e_test.go"
      - "ui_diagnostics_e2e_test.go"
      - "ui_security_e2e_test.go"
      - "ui_ca_e2e_test.go"
      - "ui_updates_e2e_test.go"
      - "ui_configversion_e2e_test.go"
      - "ui_e2e_helpers_test.go"
      - ".github/workflows/proxy-ui-e2e.yml"

permissions:
  contents: read


jobs:
  ui-e2e:
    name: Admin-UI RBAC (playwright-go, headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory: a failure here annotates the run but must not block the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-go-cache

      # Install the playwright-go driver + Chromium at the version pinned in
      # go.mod (so driver and library never skew). Downloads to the default
      # cache; the test then finds them without any env override.
      - name: Cache Playwright browsers
        # Chromium (~150 MB) was re-downloaded on every run (daily + ui-path
        # PRs). Keyed on go.mod so a playwright-go version bump refreshes it.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('go.mod') }}

      - name: Install playwright driver + chromium
        # playwright-go v0.6000.0's driver installer is dead end-to-end: its
        # baked *.azureedge.net mirrors were decommissioned (Edgio shutdown)
        # AND upstream stopped publishing driver zips around 1.60 entirely
        # (playwright.download.prss.microsoft.com 404s too — verified) —
        # driver distribution moved to npm, which is what playwright-go
        # v0.6100.x does, but that release tag declares the old mxschmitt
        # module path and cannot be imported. Until upstream ships a fixed
        # tag, build the node+package driver layout playwright-go expects
        # from the npm tarballs directly and point the tests at it via
        # CULVERT_PW_DRIVER_DIR (uiE2EBrowser honors it and then skips its
        # own download fallback). DRIVER_VERSION must match
        # playwrightCliVersion in the pinned playwright-go (v0.6000.0 → 1.60.0).
        run: |
          set -euo pipefail
          DRIVER_VERSION=1.60.0
          DRV="$HOME/.cache/ms-playwright-go/driver"
          mkdir -p "$DRV/package/node_modules/playwright-core"
          npm pack "playwright@${DRIVER_VERSION}" --silent
          tar xzf "playwright-${DRIVER_VERSION}.tgz" -C "$DRV/package" --strip-components=1
          npm pack "playwright-core@${DRIVER_VERSION}" --silent
          tar xzf "playwright-core-${DRIVER_VERSION}.tgz" -C "$DRV/package/node_modules/playwright-core" --strip-components=1
          ln -sf "$(command -v node)" "$DRV/node"
          "$DRV/node" "$DRV/package/cli.js" install --with-deps chromium
          echo "CULVERT_PW_DRIVER_DIR=$DRV" >> "$GITHUB_ENV"

      - name: UI RBAC E2E
        id: uie2e
        run: |
          set -o pipefail
          go test -tags uie2e -run 'TestUIE2E_' -v -timeout 15m . 2>&1 | tee uie2e.log

      - name: Step summary
        if: always()
        run: |
          {
            echo "## Admin-UI RBAC Browser E2E (advisory)"
            echo ""
            case "${{ steps.uie2e.outcome }}" in
              success) echo "✅ RBAC nav gating + server-side enforcement verified in a real browser." ;;
              *)       echo "⚠️ Advisory failure — see \`uie2e.log\` artifact. Does NOT block the PR." ;;
            esac
            echo ""
            echo '```'
            grep -E 'PASS|FAIL|SKIP|RBAC|DENIED' uie2e.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-ui-e2e
          path: uie2e.log
          retention-days: 14
