# ─────────────────────────────────────────────────────────────────────────────
# Lane B — Deep PR Gate
#
# Supplementary depth that runs only when the diff touches the proxy core,
# the security surface, the container/deps stack, tests, or packaging.
# Lane A already runs the FULL -race suite on every code PR — this lane
# adds the containerized/behavioral surface on top: image scan, compose
# validation, staticcheck, the determinism rerun, license blocking on
# dependency changes, and installer packaging validation.
#
# "Required-if-run" mechanics (GitHub has no native semantics for this):
# the workflow triggers on ALL PRs with no paths filter; the `changes` job
# classifies the diff; each job self-gates with `if:`; and the
# always-running `deep-gate-approved` aggregate is the required check —
# it passes when everything was skipped, so unrelated PRs are never
# blocked, but a red deep check DOES block merge.
#
# Filter philosophy for a flat `package main`: these filters gate only the
# SUPPLEMENTARY checks. Correctness of any .go change is already covered by
# Lane A's full race suite, so a filter miss here degrades depth, not safety.
# Filters err toward over-triggering.
# ─────────────────────────────────────────────────────────────────────────────
name: Deep PR Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deep-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── 0. Classify the diff ──────────────────────────────────────────────────
  changes:
    name: "Deep · classify diff"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proxy_core: ${{ steps.classify.outputs.proxy_core }}
      security: ${{ steps.classify.outputs.security }}
      docker: ${{ steps.classify.outputs.docker }}
      deps: ${{ steps.classify.outputs.deps }}
      tests: ${{ steps.classify.outputs.tests }}
      packaging: ${{ steps.classify.outputs.packaging }}
      release: ${{ steps.classify.outputs.release }}
      maint: ${{ steps.classify.outputs.maint }}
      terraform: ${{ steps.classify.outputs.terraform }}
      appliance: ${{ steps.classify.outputs.appliance }}
      image_needed: ${{ steps.classify.outputs.image_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for k in proxy_core security docker deps tests packaging release maint terraform appliance image_needed; do
              echo "$k=true" >> "$GITHUB_OUTPUT"
            done
            echo "Manual run — all deep jobs enabled."
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > changed.txt
          echo "── Changed files ──"; cat changed.txt

          proxy_core=false; security=false; docker=false; deps=false
          tests=false; packaging=false; release=false; maint=false
          terraform=false; appliance=false
          self=false
          while IFS= read -r f; do
            case "$f" in
              # upstream*.go includes upstream_transport.go — the S6 shared
              # *http.Transport race contract (CI review P1-4).
              proxy.go|socks5.go|policy.go|store.go|upstream*.go|connlimit.go|main.go)
                proxy_core=true ;;
            esac
            case "$f" in
              # KEEP IN SYNC with codeql.yml's PR paths: — that workflow
              # mirrors this security set (plus proxy_core) as GH path globs.
              # Auth/TLS/session/scanning surface — including the internal/
              # packages (ssrf, secscan, ocsp, uitls, …) that the top-level
              # shims delegate to, the ENTIRE admin-plane enforcement surface
              # (ui_*.go: middleware/CSRF, C2 metadata enforcement, RBAC,
              # routes SSOT — CI review P1-1), and the self-update/backup/
              # restore + fail-closed GeoIP policy input.
              auth*.go|ca.go|tls.go|session.go|ocsp.go|security*.go|admission.go|cluster_ratelimit*.go|scanner.go|\
              clam.go|yara_scan.go|fileblock.go|fileprofile.go|threatfeed.go|\
              lockout.go|totp.go|identity.go|enrollment.go|controlplane.go|\
              ui_*.go|update*.go|backup*.go|restore.go|geoip.go|events.go|\
              internal/*)
                security=true ;;
            esac
            case "$f" in
              # .trivyignore: a suppression edit must re-run the scan that
              # consumes it (CI review P1-5).
              Dockerfile*|docker-compose*.yml|.dockerignore|.trivyignore) docker=true ;;
            esac
            case "$f" in
              go.mod|go.sum) deps=true ;;
            esac
            case "$f" in
              *_test.go) tests=true ;;
            esac
            case "$f" in
              # culvert-maint is a SEPARATE module (own go.sum) and a released
              # binary, but none of the outputs above match its production
              # paths — so a maint-only change would skip the `determinism` job
              # and the maint build-determinism guard would never run on the
              # very module it protects (Codex P2). Classify maint production
              # code + its module manifests here; `maint` gates `determinism`.
              # Test-only maint changes already set tests=true (also gates it).
              # (`*` in a bash case matches `/`, so this catches internal/… too.)
              cmd/culvert-maint/*_test.go) ;;
              cmd/culvert-maint/*.go|cmd/culvert-maint/go.mod|cmd/culvert-maint/go.sum)
                maint=true ;;
            esac
            case "$f" in
              # The appliance's provisioning/maintenance scripts are packaging
              # too: shellchecked by the same job as the agent installer.
              packaging/*|scripts/*|appliance/provision/*|appliance/os-maintenance/*|appliance/build/*.sh) packaging=true ;;
            esac
            case "$f" in
              # On-prem appliance qualification (owner review, PR #1528): the
              # real-image lifecycle + agent harnesses run against the
              # deep-gate-image artifact whenever the appliance, the
              # backup/restore/cleanup path, the deploy bundle or the
              # harnesses themselves change. `*` matches `/`, so
              # appliance/* covers build/, provision/, os-maintenance/, sbom/.
              appliance/*|test/e2e/appliance/*|restore*.go|backup*.go|cleanup*.go|scripts/install.sh|docker-compose.yml|packaging/*)
                appliance=true ;;
              # The appliance console (#1540) is host software the OVA
              # installs: its regression suite (appliance-console) and the
              # lifecycle harnesses must run when it changes.
              cmd/culvert-console/*|internal/applianceconsole/*|internal/appliancehost/*|appliance_*test.go|.github/workflows/appliance-console.yml)
                appliance=true ;;
            esac
            case "$f" in
              # Declarations-only IaC skeleton (M0-PR5). Gates the terraform
              # fmt/validate lane; must be a REQUIRED (aggregate-listed) job so a
              # broken skeleton can't merge (TEST-M6 anti-rot).
              deploy/terraform/*) terraform=true ;;
            esac
            case "$f" in
              # Release-catalog trust chain — Go code AND the non-Go trust
              # material (baked Sigstore root, CI↔binary identity SSOT).
              # NOTE: catalog-e2e.yml's paths: filter must stay in sync with
              # these globs (see roadmap/CI-REDESIGN.md).
              release_*.go|test/e2e/*|trusted_root.json|trusted_root.provenance.txt|release_identity.env)
                release=true ;;
            esac
            case "$f" in
              # Self-validation: edits to this workflow, its reusable build,
              # or the shared composite action must exercise EVERY deep job —
              # otherwise a broken gate lands silently and degrades all
              # future PRs (CI review P1-2). The candidate version script
              # shapes the image build (its VERSION build-arg).
              .github/workflows/pr-deep-gate.yml|.github/workflows/_build-image.yml|.github/scripts/pr-candidate-version.sh|.github/actions/*)
                self=true ;;
            esac
          done < changed.txt

          if $self; then
            echo "Gate self-change detected — enabling all deep jobs."
            proxy_core=true; security=true; docker=true; deps=true
            tests=true; packaging=true; release=true; maint=true
            terraform=true; appliance=true
          fi

          # Every job that `needs: build-image` must be covered here, or a
          # change that selects that job without selecting the build skips
          # the job — and the aggregate reads a skipped job as a pass. `maint`
          # selects `appliance-agent` (Codex P1, PR #1528: a maint-only change
          # got a green gate with the agent qualification never run).
          # Pinned by appliance_ci_lane_test.go.
          image_needed=false
          if $proxy_core || $security || $docker || $deps || $release || $appliance || $maint; then
            image_needed=true
          fi
          for k in proxy_core security docker deps tests packaging release maint terraform appliance image_needed; do
            eval "echo \"$k=\$$k\"" >> "$GITHUB_OUTPUT"
          done
          echo "proxy_core=$proxy_core security=$security docker=$docker deps=$deps tests=$tests packaging=$packaging release=$release maint=$maint terraform=$terraform appliance=$appliance image_needed=$image_needed"

  # ─── 1. Build the proxy image ONCE (amd64) — consumed by the jobs below ───
  build-image:
    name: "Deep · build image (once)"
    needs: changes
    if: needs.changes.outputs.image_needed == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      image-tag: "culvert:ci-smoke"
      artifact-name: "deep-gate-image"

  # ─── 2. Trivy image scan (reuses the artifact — no rebuild) ────────────────
  trivy-image:
    name: "Deep · trivy image scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, build-image]
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deep-gate-image

      - name: Load image
        run: docker load -i culvert-image.tar

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.2.0
        with:
          version: v0.69.3
          cache: true

      - name: Update Trivy DB (mirror — ghcr default rate-limits, TOOMANYREQUESTS)
        run: trivy image --download-db-only --db-repository mirror.gcr.io/aquasec/trivy-db:2

      - name: Scan image (CRITICAL/HIGH, gate)
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            culvert:ci-smoke

  # ─── 3. Dockerfile lint ────────────────────────────────────────────────────
  hadolint:
    name: "Deep · hadolint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          ignore: DL3018,DL3047,DL4006
          failure-threshold: warning

  # ─── 4. Compose environment validation (reuses the built image) ───────────
  compose-validate:
    name: "Deep · compose validation"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, build-image]
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.proxy_core == 'true' || needs.changes.outputs.security == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deep-gate-image

      - name: Load image
        run: docker load -i culvert-image.tar

      - name: Validate compose graph
        run: docker compose -f docker-compose.yml config --quiet

      - name: Bring up proxy (pre-built image — no rebuild)
        # docker-compose.ci.yml tags the service image culvert:ci-smoke;
        # the image is already loaded, and `up` without --build reuses it.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --no-deps --no-build proxy

      - name: Wait for healthy + probe endpoints
        timeout-minutes: 3
        run: |
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
              "$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -q proxy)" 2>/dev/null || echo starting)
            [ "$STATUS" = "healthy" ] && break
            sleep 5
          done
          [ "$STATUS" = "healthy" ] || { echo "::error::proxy never became healthy"; exit 1; }
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'
          # Readiness must actually gate (same semantics as the ci.yml smoke):
          # a loop ending in `sleep` would exit 0 and mask a broken /ready.
          for i in 1 2 3; do
            if curl -sf http://localhost:8080/ready 2>/dev/null | grep -q '"status":"ready"'; then
              echo "Ready check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 2s..."
            sleep 2
          done
          echo "::error::/ready did not return ready after 3 attempts"
          exit 1

      - name: Diagnostics & teardown
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs proxy || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true

  # ─── 5. staticcheck (root module) ──────────────────────────────────────────
  staticcheck:
    name: "Deep · staticcheck"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.proxy_core == 'true' || needs.changes.outputs.security == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.release == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
      - run: go mod download
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: "2025.1"
          install-go: false

  # ─── 6. Determinism (shuffle + count=2) ────────────────────────────────────
  # Any *_test.go change triggers this: CLAUDE.md's test-authoring rules
  # (audit-ring saturation etc.) rely on this gate to flush order-dependent
  # tests BEFORE they land and start breaking unrelated PRs.
  determinism:
    name: "Deep · determinism (shuffle, count=2)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.tests == 'true' || needs.changes.outputs.proxy_core == 'true' || needs.changes.outputs.security == 'true' || needs.changes.outputs.release == 'true' || needs.changes.outputs.maint == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
      - name: Shuffled double run (no -race, matches qa-determinism contract)
        env:
          TEST_SEED: "20260421"
        run: |
          set -o pipefail
          go test -count=2 -shuffle=on -timeout=20m ./... 2>&1 | tee determinism.log \
            || { grep -m1 -- "-test.shuffle " determinism.log || true; \
                 echo "::error::determinism failure — reproduce with the printed -test.shuffle seed (log artifact: deep-determinism-log)"; exit 1; }

      - name: Annotate determinism failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("determinism.log")
          if path.exists():
              lines = path.read_text(errors="replace").splitlines()
              selected = set()
              for i, line in enumerate(lines):
                  if line.startswith("-test.shuffle ") or line.startswith("FAIL"):
                      selected.add(i)
                  if "--- FAIL:" in line or line.startswith("panic:"):
                      selected.update(range(i, min(i + 8, len(lines))))
              detail = "\n".join(lines[i] for i in sorted(selected))
              if not detail:
                  detail = "\n".join(lines[-40:])
              detail = detail[:12000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Determinism failure details::" + detail)
          PY

      - name: Build determinism (release binaries are byte-reproducible)
        # The release builds' reproducibility underpins verifiable SLSA provenance
        # (an independent rebuild must hash-match the signed subjects). Two builds
        # with the exact release flags must be byte-identical. -buildvcs=false
        # mirrors the release build (ci.yml) and makes the hash independent of
        # tree state; outputs go to RUNNER_TEMP so neither build dirties the tree.
        # Catches a non-determinism regression (e.g. an embedded build timestamp)
        # on the PR that introduces it, BEFORE it reaches a tagged release.
        # Both release modules are guarded: the proxy AND culvert-maint — the
        # latter is the separate module whose missing -buildvcs=false was the
        # order-dependent bug this phase fixed, so it must stay covered.
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          check() {
            # $1 = label, $2 = module dir, $3 = ldflags
            local label="$1" dir="$2" flags="$3"
            ( cd "$dir" && for o in b1 b2; do
                go build -trimpath -buildvcs=false -ldflags="$flags" \
                  -o "$RUNNER_TEMP/${label}-$o" .
              done )
            if cmp -s "$RUNNER_TEMP/${label}-b1" "$RUNNER_TEMP/${label}-b2"; then
              echo "build determinism OK ($label): sha256 $(sha256sum "$RUNNER_TEMP/${label}-b1" | cut -d' ' -f1)"
            else
              echo "::error::$label build is NON-DETERMINISTIC — two identical-flag builds produced different binaries"
              exit 1
            fi
          }
          check proxy "$GITHUB_WORKSPACE" "-s -w -X main.version=determinism-check"
          check maint "$GITHUB_WORKSPACE/cmd/culvert-maint" "-s -w -X culvert-maint/internal/server.Version=determinism-check"

      - name: Upload determinism log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-determinism-log
          path: determinism.log
          retention-days: 14

  # ─── 7. License blocking on dependency changes ─────────────────────────────
  # Keeps per-PR license enforcement (was security-release-gate on every PR):
  # a dep bump cannot merge with a forbidden/restricted license.
  licenses:
    name: "Deep · go-licenses"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
      - run: go mod download
      - name: Check for disallowed licenses
        # pipefail is required: GitHub's default shell does not set it, so
        # without it the pipeline would return tee's (always-zero) status
        # and a forbidden license could sail through the gate.
        run: |
          set -o pipefail
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./... \
            --disallowed_types=forbidden,restricted \
            --ignore=proxy 2>&1 | tee license-report.txt
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-gate-license-report
          path: license-report.txt
          retention-days: 30

  # ─── 8. Installer packaging validation (was qa-agent, now path-gated) ─────
  packaging:
    name: "Deep · packaging (shellcheck/sudoers/systemd)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-dependency-path: cmd/culvert-maint/go.sum

      - name: shellcheck installer
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck packaging/culvert-maint/install.sh

      - name: shellcheck appliance scripts (first boot, status, sudo policy, OS maintenance, OVA build, harnesses)
        run: |
          shellcheck -S warning \
            appliance/provision/culvert-firstboot.sh appliance/provision/culvert-status \
            appliance/provision/culvert-sudo-policy appliance/provision/culvert-net \
            appliance/provision/culvert-issue-update appliance/provision/culvert-appliance-reset-identity \
            appliance/os-maintenance/culvert-os-update \
            appliance/build/build-ova.sh appliance/build/prepare-guest.sh appliance/build/archive-identity.sh appliance/build/cold-load-check.sh \
            test/e2e/appliance/lifecycle-qualify.sh test/e2e/appliance/agent-qualify.sh \
            test/e2e/appliance/clamav-image-qualify.sh test/e2e/appliance/upgrade-enospc-qualify.sh

      - name: Validate appliance sudoers + first-boot unit shapes
        run: |
          # The key-only drop-in first boot writes (95-culvert-keyonly) and the
          # console rule prepare-guest.sh installs must be valid sudoers.
          printf 'culvert ALL=(ALL:ALL) NOPASSWD: ALL\n' > /tmp/95-culvert-keyonly
          printf 'culvert ALL=(ALL:ALL) ALL\n' > /tmp/50-culvert-console
          sudo visudo -c -f /tmp/95-culvert-keyonly && sudo visudo -c -f /tmp/50-culvert-console
          bash -n appliance/provision/culvert-firstboot.sh

      - name: Validate sudoers drop-in
        # The P1.4 pin-binding security boundary — a syntax error here would
        # brick the maintenance agent's privilege model on install.
        run: sudo visudo -c -f packaging/sudoers/culvert-maint

      - name: Validate systemd unit
        # systemd-analyze verify checks that ExecStart resolves to an
        # executable, so the freshly-built agent binary must be staged at
        # the unit's documented path first (same as the legacy qa-agent job)
        # or the verify fails on every packaging PR.
        run: |
          if ! command -v systemd-analyze >/dev/null 2>&1; then
            echo "systemd-analyze unavailable — skipping unit verification"
            exit 0
          fi
          (cd cmd/culvert-maint && go build -o /tmp/culvert-maint .)
          sudo install -m 0755 /tmp/culvert-maint /usr/local/bin/culvert-maint
          systemd-analyze verify packaging/systemd/culvert-maint.service

  # ─── 9. On-prem appliance qualification (owner review, PR #1528) ───────────
  #
  # The real-image lifecycle and agent harnesses (test/e2e/appliance/) run
  # against the SAME deep-gate-image artifact the other jobs consume, so the
  # evidence names the exact PR-head image. Three blocking jobs, each on its
  # own runner because both harnesses bind host ports 8080/9090:
  #   appliance-lifecycle  A/B/D/E/G: fresh install → setup → posture → actual
  #                        allow/block → restart; two real predecessors
  #                        (v1.0.258, v1.0.259) upgraded with seeded state;
  #                        backup → mutate → refused-while-running → offline
  #                        restore → verified; interrupted restore → refused
  #                        boot → explicit recovery; restore onto a FULL
  #                        loop-backed ext4 volume → refused before any move.
  #   appliance-clamav     scenario A with the deploy bundle's REAL ClamAV
  #                        sidecar (signature download, scanner rows on
  #                        /ready strict) — needs the runner's direct egress.
  #   appliance-agent      F1–F5: maintenance-agent apply/duplicate/kill +
  #                        reconcile/offline rollback/restart idempotency
  #                        against a throwaway TLS registry.
  # Runner limits (why this is what it is): ubuntu-latest is 4 vCPU/16 GB
  # with Docker + compose v2, sudo root and loop devices; it runs the
  # CONTAINER topology, not the OVA (no OVA boot here — that is the
  # appliance-boot gap the readiness report records), and the predecessor
  # images come from the public ghcr.io registry (no secrets needed).
  appliance-lifecycle:
    name: "Deep · appliance lifecycle (real images)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, build-image]
    if: needs.changes.outputs.appliance == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deep-gate-image
      - name: Load the PR-head image
        run: docker load -i culvert-image.tar && docker image inspect culvert:ci-smoke --format 'id={{.Id}}'
      - name: Pre-pull predecessors + fixtures (retry)
        run: |
          set -euo pipefail
          pull_retry() { for i in 1 2 3 4; do docker pull -q "$1" && return 0; echo "pull $1 failed (attempt $i)"; sleep $((i*3)); done; return 1; }
          for img in ghcr.io/kidcarmi/culvert:v1.0.258 ghcr.io/kidcarmi/culvert:v1.0.259 busybox:stable alpine:3.20; do pull_retry "$img"; done
      - name: Lifecycle qualification
        env:
          CUR_IMAGE: culvert:ci-smoke
          PRED_IMAGES: "ghcr.io/kidcarmi/culvert:v1.0.258 ghcr.io/kidcarmi/culvert:v1.0.259"
          SCENARIOS: "A B D E G"
        run: EVID="$RUNNER_TEMP/appliance-lifecycle" ./test/e2e/appliance/lifecycle-qualify.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appliance-lifecycle-evidence
          path: |
            ${{ runner.temp }}/appliance-lifecycle/REPORT.md
            ${{ runner.temp }}/appliance-lifecycle/checks.jsonl
          retention-days: 14

  appliance-clamav:
    name: "Deep · appliance scenario A with real ClamAV"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [changes, build-image]
    if: needs.changes.outputs.appliance == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deep-gate-image
      - name: Load the PR-head image
        run: docker load -i culvert-image.tar
      - name: Pre-pull the real sidecar + fixtures (retry)
        run: |
          set -euo pipefail
          pull_retry() { for i in 1 2 3 4; do docker pull -q "$1" && return 0; echo "pull $1 failed (attempt $i)"; sleep $((i*3)); done; return 1; }
          for img in clamav/clamav:1.4 busybox:stable alpine:3.20; do pull_retry "$img"; done
      - name: Scenario A against the real ClamAV sidecar
        env:
          CUR_IMAGE: culvert:ci-smoke
          SCENARIOS: "A"
          CULVERT_QUALIFY_REAL_CLAMAV: "1"
          QUAL_HEALTH_WAIT_S: "900"
        run: EVID="$RUNNER_TEMP/appliance-clamav" ./test/e2e/appliance/lifecycle-qualify.sh
      # Real clamd behind the real proxy: EICAR, a custom PCRE logical
      # signature (the libpcre2 path of CVE-2026-103111), a regex-miss control
      # and the clamd-down posture. Run against the PINNED official image and
      # against the unpublished pcre2 derivative built here (never pushed), so
      # the owner's decision rests on CI-executed evidence for both.
      - name: Real-ClamAV scan check — pinned official image
        run: |
          set -euo pipefail
          . appliance/build/manifest.env
          docker pull -q "${CLAMAV_IMAGE_REPO}@${CLAMAV_IMAGE_INDEX_DIGEST}"
          CLAMAV_IMAGE="${CLAMAV_IMAGE_REPO}@${CLAMAV_IMAGE_INDEX_DIGEST}" PROXY_IMAGE=culvert:ci-smoke \
            EVID="$RUNNER_TEMP/clamav-image-official" ./test/e2e/appliance/clamav-image-qualify.sh
      - name: Real-ClamAV scan check — pcre2 derivative candidate (built, not pushed)
        run: |
          set -euo pipefail
          docker build -q -t culvert-candidate/clamav:pcre2-fix appliance/clamav-candidate
          CLAMAV_IMAGE=culvert-candidate/clamav:pcre2-fix PROXY_IMAGE=culvert:ci-smoke \
            EVID="$RUNNER_TEMP/clamav-image-candidate" ./test/e2e/appliance/clamav-image-qualify.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appliance-clamav-evidence
          path: |
            ${{ runner.temp }}/appliance-clamav/REPORT.md
            ${{ runner.temp }}/appliance-clamav/checks.jsonl
            ${{ runner.temp }}/clamav-image-official/clamav-image-qualify.jsonl
            ${{ runner.temp }}/clamav-image-candidate/clamav-image-qualify.jsonl
          retention-days: 14

  appliance-agent:
    name: "Deep · appliance maintenance-agent flow"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [changes, build-image]
    if: needs.changes.outputs.appliance == 'true' || needs.changes.outputs.maint == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-dependency-path: cmd/culvert-maint/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deep-gate-image
      - name: Load the PR-head image
        run: docker load -i culvert-image.tar
      - name: Pre-pull predecessor + registry (retry)
        run: |
          set -euo pipefail
          pull_retry() { for i in 1 2 3 4; do docker pull -q "$1" && return 0; echo "pull $1 failed (attempt $i)"; sleep $((i*3)); done; return 1; }
          for img in ghcr.io/kidcarmi/culvert:v1.0.259 registry:2 busybox:stable \
                     docker:29-dind@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1; do pull_retry "$img"; done
      - name: "Build the agent from this PR head (warms the module cache; the harness rebuilds as root)"
        run: (cd cmd/culvert-maint && go build -o /dev/null .)
      - name: "Agent update-flow qualification (root — writes /etc/docker/certs.d for the TLS registry)"
        # The harness runs the agent in docker_group_lab mode as root — the
        # same lab shape the install-lifecycle e2e uses; the sudoers-bound
        # production mode is covered by install-lifecycle-e2e.yml.
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" "GOFLAGS=-mod=mod" \
            CUR_IMAGE=culvert:ci-smoke PRED_IMAGE=ghcr.io/kidcarmi/culvert:v1.0.259 \
            EVID="$RUNNER_TEMP/appliance-agent" ./test/e2e/appliance/agent-qualify.sh
      - name: "Upgrade under a full disk on a size-bounded nested Docker host (root — loop mount, privileged dind)"
        # Image store (dockerd + its managed containerd), stack directory and
        # agent state live in ONE 2 GiB loop-mounted ext4 file; the fill is a
        # file inside it, so the runner's own disk never fills.
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" "GOFLAGS=-mod=mod" \
            CUR_IMAGE=culvert:ci-smoke PRED_IMAGE=ghcr.io/kidcarmi/culvert:v1.0.259 \
            EVID="$RUNNER_TEMP/appliance-enospc" ./test/e2e/appliance/upgrade-enospc-qualify.sh
      - name: "F-DISK-1 (ADVISORY, known open finding): disk exhausted during the boot-time category write, then recovery + integrity"
        # Not a merge gate: F-DISK-1 is an OPEN finding (a disk that fills
        # during a BadgerDB write SIGBUSes the proxy). This step keeps it
        # reproducible on every appliance change and retains the evidence: it
        # records whether the crash reproduces, then runs the documented
        # recovery and the integrity checks that must pass to close it. Exit 2
        # = inconclusive (no write observed), never a pass.
        if: always()
        continue-on-error: true
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" "GOFLAGS=-mod=mod" \
            QUAL_ENOSPC_SCENARIO=midwrite CUR_IMAGE=culvert:ci-smoke PRED_IMAGE=culvert:ci-smoke \
            EVID="$RUNNER_TEMP/appliance-fdisk1" ./test/e2e/appliance/upgrade-enospc-qualify.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appliance-agent-evidence
          path: |
            ${{ runner.temp }}/appliance-agent/REPORT.md
            ${{ runner.temp }}/appliance-agent/checks.jsonl
            ${{ runner.temp }}/appliance-enospc/REPORT.md
            ${{ runner.temp }}/appliance-enospc/checks.jsonl
            ${{ runner.temp }}/appliance-enospc/op-full-disk.log
            ${{ runner.temp }}/appliance-enospc/op-retry.log
            ${{ runner.temp }}/appliance-enospc/diagnose.log
            ${{ runner.temp }}/appliance-fdisk1/REPORT.md
            ${{ runner.temp }}/appliance-fdisk1/checks.jsonl
            ${{ runner.temp }}/appliance-fdisk1/diagnose.log
          retention-days: 14

  # ─── Terraform guardrails skeleton — fmt + validate (declarations-only) ──────
  terraform:
    name: "Deep · terraform (fmt/validate)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    permissions:
      contents: read
    steps:
      # New lane: `init` pulls providers from registry.terraform.io (+ redirect to
      # releases.hashicorp.com / GitHub release assets). Audit-first per the repo's
      # egress baseline for new lanes; no cloud credentials, no id-token — validate
      # constructs no API client.
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          # The default wrapper rewrites stdout/exit codes and can mask a
          # fmt -check / validate failure — disable it so red stays red.
          terraform_wrapper: false
      - name: terraform fmt (check, recursive)
        run: terraform fmt -check -recursive
        working-directory: deploy/terraform
      - name: terraform init (no backend) + validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: deploy/terraform

  # ─── Appliance console + host power/lifecycle regressions (#1540) ─────────
  # The same suite .github/workflows/appliance-console.yml defines (console
  # state/display/auth boundary, root-owned recovery storage faults, the
  # agent's shutdown-fence admission, culvert-os-update power/resume, staged
  # console install), called here so a red result blocks the REQUIRED
  # aggregate instead of landing as an advisory check (V1 integration, #1528).
  appliance-console:
    name: "Deep · appliance console + power/lifecycle regressions"
    needs: changes
    if: needs.changes.outputs.appliance == 'true' || needs.changes.outputs.maint == 'true' || needs.changes.outputs.deps == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/appliance-console.yml

  # ─── ✅ Aggregate — required check, passes when all-skipped ─────────────────
  deep-gate-approved:
    name: "✅ Deep PR Gate — APPROVED"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - build-image
      - trivy-image
      - hadolint
      - compose-validate
      - staticcheck
      - determinism
      - licenses
      - packaging
      - terraform
      - appliance-lifecycle
      - appliance-clamav
      - appliance-agent
      - appliance-console
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/needs-verdict
        with:
          needs-json: ${{ toJSON(needs) }}
          title: "✅ Deep PR Gate — APPROVED"
          require-success: changes
