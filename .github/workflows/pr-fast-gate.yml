# ─────────────────────────────────────────────────────────────────────────────
# Lane A — Fast PR Gate
#
# The single REQUIRED merge check for pull requests. Lean, deterministic,
# fast: hygiene, lint, ONE full `-race` run with the coverage floors,
# the alloc-regression benchgate, and the fast security trio
# (govulncheck + gosec + gitleaks). Target wall time ≤ ~15 min warm-cache
# (bounded by the -race suite).
#
# Docs-only handling (required-check safe): this workflow deliberately has
# NO `paths:`/`paths-ignore:` filter. A required check whose workflow never
# runs sits at "Expected" and blocks merge forever — so instead the
# `changes` job classifies the diff and heavy jobs skip themselves via
# `if:`. The `fast-gate-approved` aggregate always runs and treats
# skipped jobs as passing.
#
# Rollout: runs in PARALLEL with qa-gate / security-release-gate /
# code-review until one green cycle, then supersedes the duplicated jobs
# there (see roadmap/CI-REDESIGN.md for the retirement checklist).
# ─────────────────────────────────────────────────────────────────────────────
name: Fast PR Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fast-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── 0. Classify the diff ──────────────────────────────────────────────────
  # Dependency-free path filter: on pull_request the checked-out ref is the
  # merge commit, so `git diff HEAD^1 HEAD` with fetch-depth:2 is exactly the
  # PR's changed files. No third-party filter action to trust or pin.
  changes:
    name: "Gate · classify diff"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      agent: ${{ steps.classify.outputs.agent }}
      mcp_docs: ${{ steps.classify.outputs.mcp_docs }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # workflow_dispatch: no diff to classify — run everything.
            echo "code=true"     >> "$GITHUB_OUTPUT"
            echo "agent=true"    >> "$GITHUB_OUTPUT"
            echo "mcp_docs=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — all jobs enabled."
            exit 0
          fi
          # --no-renames is load-bearing, not stylistic. With rename detection
          # on (the default), `--name-only` emits ONLY the destination of a
          # rename — so moving a file OUT of a classified directory hides the
          # source path from every `case` below. Concretely: moving
          # docs/design/mcp/DATA-FLOW-DIAGRAMS.md to an archive dir would list
          # only the archive path, leave mcp_docs=false, skip the predicate job,
          # and the aggregate would count that skip as passing — while the
          # predicates themselves would have failed outright on the missing
          # input. A gate that does not run is a green tick, which is the exact
          # failure class this job exists to close. --no-renames reports the
          # move as delete+add, so BOTH paths are classified. It can only ever
          # add paths, never remove them, so it stays consistent with this
          # classifier's fail-toward-running-the-gate posture.
          git diff --no-renames --name-only HEAD^1 HEAD > changed.txt
          echo "── Changed files ──"; cat changed.txt

          # Docs-only = every file matches a documentation pattern.
          # Anything else counts as code (fail toward running the gate).
          code=false
          agent=false
          mcp_docs=false
          frontend=false
          while IFS= read -r f; do
            case "$f" in
              # Load-bearing docs: docs_saml_test.go reads this file at test
              # time, so a change to it MUST run the suite (P0, CI review).
              # First-match-wins — keep carve-outs above the docs patterns.
              docs/saml-idp-configuration-reference.md) code=true ;;
              *.md|docs/*|roadmap/*|LICENSE|.github/CODEOWNERS) ;;
              *) code=true ;;
            esac
            case "$f" in
              cmd/culvert-maint/*) agent=true ;;
            esac
            # MCP design surface. Its OWN `case` on purpose: the docs/code
            # classifier above is first-match-wins, so folding these patterns
            # into it would silently change `code` for MCP paths. This one is
            # narrow by design — an ordinary unrelated Markdown change must
            # NOT drag the predicate job in.
            case "$f" in
              docs/design/mcp/*) mcp_docs=true ;;
              docs/adr/0024-mcp-agent-security-gateway-trust-boundary.md) mcp_docs=true ;;
              .github/scripts/mcp-doc-predicates.sh) mcp_docs=true ;;
              .github/workflows/pr-fast-gate.yml) mcp_docs=true ;;
            esac
            # Frontend verification surface (FE-1A, ADR-FE-001). Its OWN
            # `case`, same rationale as mcp_docs. Fail-toward-running: the
            # committed-generated-output contract can be altered by the
            # OpenAPI document, the hygiene files (.gitattributes marks the
            # generated paths; the ignore files gate what reaches git/docker),
            # this workflow, and the reusable frontend workflow itself — a
            # change to ANY of them exercises the frontend gate.
            case "$f" in
              frontend/*) frontend=true ;;
              ui_frontend_v2*) frontend=true ;;
              api/openapi/openapi.json) frontend=true ;;
              .github/workflows/frontend-verify.yml) frontend=true ;;
              .github/workflows/pr-fast-gate.yml) frontend=true ;;
              .gitattributes|.gitignore|.dockerignore) frontend=true ;;
            esac
          done < changed.txt
          echo "code=$code"         >> "$GITHUB_OUTPUT"
          echo "agent=$agent"       >> "$GITHUB_OUTPUT"
          echo "mcp_docs=$mcp_docs" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "code=$code agent=$agent mcp_docs=$mcp_docs frontend=$frontend"

  # ─── 1. Hygiene: fmt + vet + build (incl. arm64 compile + static assert) ──
  hygiene:
    name: "Gate · fmt + vet + build"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache

      - name: gofmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::gofmt violations:"; echo "$UNFORMATTED"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check (root module)
        # Check-only by contract (never auto-push to contributor branches).
        # Moved here from code-review.yml's retired build job (step 7).
        run: |
          if go mod tidy -diff; then
            echo "go.mod and go.sum are tidy ✓"
          else
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' locally and commit the result"
            exit 1
          fi

      - name: Build static binary + assert no dynamic linkage
        # Guards the CGO_ENABLED=0 single-binary contract (was qa-os).
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o culvert .
          file culvert
          if ldd culvert 2>/dev/null; then
            echo "::error::binary is dynamically linked — CGO_ENABLED=0 contract broken"
            exit 1
          fi

      - name: Cross-compile check (linux/arm64, no QEMU)
        # PR image builds are amd64-only; this keeps arm64 compile breakage
        # visible pre-merge without paying for an emulated image build.
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null .

  # ─── 2. Lint ───────────────────────────────────────────────────────────────
  lint:
    name: "Gate · golangci-lint"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # --new-from-rev needs the merge base in history
      - uses: ./.github/actions/setup-go-cache

      - name: Install golangci-lint
        # Checksum-verified via the Go module proxy + sum.golang.org (v2 dropped
        # its replace directives so `go install` works) — replaces `curl … |
        # sh` off a mutable tag ref, whose fetched script was the trust root.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Run golangci-lint (new issues only)
        # Diff-scoped by design: the tree is not lint-clean under a full run
        # (~137 legacy findings), and the protection contract this replaces
        # (reviewdog filter_mode: diff_context in code-review.yml) only
        # fails on issues in the PR's changed lines. --new-from-rev is the
        # native equivalent: fail only on issues introduced vs the merge base.
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "$BASE_REF"
          golangci-lint run --timeout=5m --new-from-rev "origin/$BASE_REF"

  # ─── 3. THE race + coverage run (single source of truth) ──────────────────
  # Replaces the 3× full -race runs previously spread across qa-gate and
  # security-release-gate, and unifies BOTH coverage contracts: the global
  # 55% floor (was security-release-gate) and the per-file floors on the
  # security-sensitive surface (was qa-gate).
  test-race:
    name: "Gate · go test -race + coverage floors"
    runs-on: ubuntu-latest
    # 35, against a 25m go-test budget below: the job also pays checkout, cache
    # restore, ~4m of -race compilation and the coverage-floor step, so the job
    # ceiling has to sit well above the test budget or it becomes the real limit
    # and truncates the panic dump that says WHICH test overran.
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Harden runner (egress audit — baseline for the block flip, Phase 2b)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache

      - name: Run full suite (-race, coverage)
        env:
          TEST_SEED: "20260421"
        # -timeout is PER TEST BINARY, and the root package alone consumes
        # essentially the whole budget: measured 897.9s on origin/main against a
        # 900s limit -- 2.1s, or 0.23%, of headroom. Every other package in the
        # module finishes in seconds (the largest, internal/ssrf, takes 37s).
        #
        # 0.23% is far below this suite's own run-to-run variance; it makes real
        # network calls while it runs (urlhaus.abuse.ch, openphish.com and
        # raw.githubusercontent.com all appear in the job log), so the gate was
        # not passing so much as winning a coin flip, and any PR adding a few
        # seconds of root-package tests tipped it into a 15m timeout that reads
        # like a hang rather than a budget overrun.
        #
        # 25m restores a real margin without weakening what is checked: the
        # timeout exists to stop a genuinely hung test, and a hang still fails,
        # ~10 minutes later. It does NOT make the underlying problem acceptable
        # -- one test binary holding 900s while 65 others finish in seconds is
        # the thing to fix, by splitting the root package. Recorded as CI-01 in
        # docs/engineering/security-reviews/2026-08-25-mcp-overnight-hardening-run.md
        run: go test -race -count=1 -timeout=25m -coverprofile=coverage.out ./...

      - name: Enforce coverage floors (global + per-file)
        # Single source of truth for BOTH coverage contracts — floors live in
        # .github/scripts/coverage-floor.sh (shared with qa-gate's main-push
        # run so the two event paths can never drift).
        run: .github/scripts/coverage-floor.sh coverage.out

      - name: Mount-point regression (privileged)
        # TestRestoreCommit_DataDirIsMountPoint_FailsInsteadOfCommitting
        # (restore_mountpoint_test.go) needs CAP_SYS_ADMIN to bind-mount a
        # directory — it reproduces docker-compose.yml's `cli` service
        # topology, where the named volume proxy-data is mounted at /data.
        # The main "Run full suite" step above runs as the unprivileged
        # runner user, so this test only ever hits its t.Skip branch there
        # and the regression is never actually exercised. ubuntu-latest
        # grants the runner user passwordless sudo, so run just this test
        # again, as root. sudo resets PATH (secure_path) and HOME (→ /root),
        # which would hide the setup-go-cache toolchain and the module/build
        # caches the step above just populated, forcing a cold re-download
        # under root — forward PATH/GOCACHE/GOMODCACHE explicitly instead of
        # `sudo -E`, so the toolchain resolves and the warm caches are reused.
        run: |
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            go test -run TestRestoreCommit_DataDirIsMountPoint_FailsInsteadOfCommitting -count=1 -v .

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-gate-coverage
          path: coverage.out
          retention-days: 30

  # ─── 4. Alloc-regression benchgate ─────────────────────────────────────────
  # `benchgate`-tagged tests are OUTSIDE the default `go test ./...` build —
  # this job is the required path that runs them (weekly-stress also runs
  # them, but only weekly). Hard pass/fail on allocs/op on the hot path.
  benchgate:
    name: "Gate · perf-regression (allocs/op)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
      - name: Run benchgate
        run: go test -tags benchgate -run 'TestBenchGate_' -count=1 -timeout=10m -v .

  # ─── 5. Fast security: govulncheck + gosec (pinned) ────────────────────────
  security-fast:
    name: "Gate · govulncheck + gosec"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache

      - name: govulncheck (known CVEs in the dependency graph)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

      # govulncheck does not traverse module boundaries — `./...` from the
      # repo root analyzes the root module only, so the nested modules get
      # explicit runs (RISK-014). cmd/culvert-maint is blocking like the root.
      - name: govulncheck (cmd/culvert-maint)
        working-directory: cmd/culvert-maint
        run: govulncheck ./...

      - name: gosec (root module)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          gosec -exclude=G104,G302,G304,G703,G704 ./...

      - name: gosec (cmd/culvert-maint)
        working-directory: cmd/culvert-maint
        run: gosec -exclude=G104,G302,G304,G703,G704 ./...

  # ─── 6. Secrets: gitleaks (runs on EVERY PR, docs included) ────────────────
  # Deliberately not gated on the code filter — secrets leak into docs too.
  gitleaks:
    name: "Gate · gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # full history so gitleaks can scan all commits
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 7. Maintenance agent (nested module) — gated on agent paths ──────────
  agent:
    name: "Gate · maint-agent (cmd/culvert-maint)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    defaults:
      run:
        working-directory: cmd/culvert-maint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-dependency-path: cmd/culvert-maint/go.sum

      - name: go mod tidy drift check
        run: |
          cp go.mod go.mod.orig && cp go.sum go.sum.orig
          go mod tidy
          diff -u go.mod.orig go.mod && diff -u go.sum.orig go.sum || {
            echo "::error::cmd/culvert-maint go.mod/go.sum not tidy"; exit 1
          }
          mv go.mod.orig go.mod && mv go.sum.orig go.sum

      - name: Build + vet
        run: |
          go build ./...
          go vet ./...

      - name: Tests (-race)
        env:
          TEST_SEED: "20260421"
        run: go test -race -count=1 -timeout=10m -v ./...

      - name: golangci-lint
        # Checksum-verified install (sum.golang.org), not curl|sh off a tag ref.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          golangci-lint run --timeout=5m

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1
          staticcheck ./...

  # ─── 8. MCP design-document predicates — gated on the MCP doc surface ─────
  # Board blocker #927 took three PRs and four verification rounds, and EVERY
  # intermediate head passed this pipeline while still carrying a real defect
  # — including one where the config-surface matrix did not parse as a table
  # at all, so every assertion over it passed vacuously. CI carried no signal
  # because nothing here parsed those documents. This job closes that gap.
  #
  # Explicit allowlist (19, 21, 22, 23, 24, 26) lives in the runner script,
  # NOT a `predicate-*.py` glob: a future predicate must not become blocking
  # without review. predicate-25 is excluded by design — it is provenance-
  # specific and diffs against a fixed historical base commit, so as a general
  # gate it would fail unrelated valid PRs. It stays manual.
  #
  # Stdlib Python only: no installs, no network, no document mutation.
  mcp-predicates:
    name: "Gate · MCP design predicates"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.mcp_docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python version
        run: python3 --version

      - name: Run MCP design-document predicates
        run: .github/scripts/mcp-doc-predicates.sh

  # ─── 9. Proxy traffic smoke — ADVISORY (promotion criteria in doc) ────────
  # Hermetic in-process traffic-plane e2e (HTTP forward, CONNECT relay,
  # SOCKS5, policy allow/block/default-deny). Advisory until it shows a
  # stable flake-free record on the nightly lane (see roadmap/CI-REDESIGN.md);
  # then it joins the aggregate below.
  traffic-smoke:
    name: "Gate · proxy traffic smoke (advisory)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
      - name: Traffic-plane E2E
        env:
          TEST_SEED: "20260421"   # reproducible flake triage for the promotion record
        run: |
          set -o pipefail   # default shell lacks it; tee must not mask a failure
          go test -race -count=1 -timeout=10m -v \
            -run 'TestProxyE2E_|TestUNAUTH_HTTP_|TestUNAUTH_CONNECT_|TestSOCKS5_' . \
            | tee proxy-traffic.log
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-traffic-log
          path: proxy-traffic.log
          retention-days: 7

  # ─── F. Frontend verification (FE-1A, ADR-FE-001) ──────────────────────────
  # Reusable implementation lives in frontend-verify.yml (workflow_call):
  # digest-pinned canonical Node container, ignore-scripts installs proven in
  # both npm trees, type-generation + committed-dist porcelain drift gates,
  # drift-gate tamper harness, and the 2-build determinism check. Runs only
  # when the classifier saw the frontend surface; the aggregate counts the
  # skip as passing on unrelated PRs (needs-verdict), so the ONE required
  # branch-protection check stays "✅ Fast PR Gate — APPROVED".
  frontend:
    name: "Gate · frontend"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-verify.yml

  # ─── ✅ Aggregate — the ONE required branch-protection check ────────────────
  # Always runs. Skipped jobs (docs-only PRs, unchanged agent module) count
  # as passing; failure or cancellation of any needed job fails the gate.
  # traffic-smoke is intentionally NOT in `needs` while advisory.
  fast-gate-approved:
    name: "✅ Fast PR Gate — APPROVED"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - hygiene
      - lint
      - test-race
      - benchgate
      - security-fast
      - gitleaks
      - agent
      - mcp-predicates
      - frontend
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/needs-verdict
        with:
          needs-json: ${{ toJSON(needs) }}
          title: "✅ Fast PR Gate — APPROVED"
          require-success: changes
