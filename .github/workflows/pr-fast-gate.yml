# ─────────────────────────────────────────────────────────────────────────────
# Lane A — Fast PR Gate
#
# The single REQUIRED merge check for pull requests. Lean, deterministic,
# fast: hygiene, lint, the full `-race` + coverage suite with the coverage
# floors, the alloc-regression benchgate, and the fast security trio
# (govulncheck + gosec + gitleaks). The race suite is bounded by its slowest
# process, not by a target: see roadmap/CI-REDESIGN.md §15 for measured runs.
#
# Race + coverage (stage 5C): the SAME sharded engine the QA gate runs
# (.github/workflows/qa-race-shards.yml, via cmd/rootshard) — the root package
# as 4 isolated shards of one prebuilt binary, every other package whole, an
# independent coverage-universe job, and a verdict that proves the evidence
# complete on its own. It replaced the single-process
# `go test -race -coverprofile ./...` this gate ran until 5C; that command
# survives only as the dispatch-only qualification audit below.
#
# Docs-only handling (required-check safe): this workflow deliberately has
# NO `paths:`/`paths-ignore:` filter. A required check whose workflow never
# runs sits at "Expected" and blocks merge forever — so instead the
# `changes` job classifies the diff and heavy jobs skip themselves via
# `if:`. The `fast-gate-approved` aggregate always runs and treats
# skipped jobs as passing.
#
# Rollout: runs in PARALLEL with qa-gate / security-release-gate /
# code-review until one green cycle, then supersedes the duplicated jobs
# there (see roadmap/CI-REDESIGN.md for the retirement checklist).
# ─────────────────────────────────────────────────────────────────────────────
name: Fast PR Gate
# Dispatches name their inputs in the title so a reporter reading run metadata
# can separate audit and fault-injection qualification runs from ordinary ones
# (the runs API does not return inputs; CI-REDESIGN §17). '' keeps GitHub's
# default title for pull requests.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Fast PR Gate · dispatch · audit={0} · fault={1}', inputs.unsharded_audit, inputs.fault) || '' }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      unsharded_audit:
        # Stage 5C qualification, the Fast-gate twin of qa-gate.yml's input.
        # Default false: an ordinary dispatch runs exactly the PR graph. true
        # ADDS the pre-5C single-process race run (verbatim) and compares the
        # sharded evidence with it on the same SHA — inventory, results and
        # every covered block. Never part of an ordinary run.
        description: "Also run the unsharded race reference and compare the sharded evidence with it (qualification)"
        type: boolean
        default: false
      fault:
        # Stage 5C qualification: exercise the gate's failure paths on the real
        # workflow. Every value can only make the run FAIL, and the aggregate
        # refuses ANY run that sets one (including docs-only, which simulates a
        # docs-only diff through the real classifier to show which jobs skip).
        description: "Qualification-only failure injection (any value but none makes the aggregate refuse)"
        type: choice
        default: none
        options:
          - none
          - classifier-fails
          - docs-only
          - shard-evidence-missing
          - shard-profile-truncated
          - producer-fails
          - coverage-floor-fails
      lane_layout:
        # EXPERIMENT (CI-REDESIGN §18.5): the non-root lane's layout, read by
        # qa-race-shards.yml. whole = the current lane (control).
        description: "Experiment: non-root lane layout"
        type: choice
        default: whole
        options:
          - whole
          - split-execution
          - execution-first

concurrency:
  group: fast-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── 0. Classify the diff ──────────────────────────────────────────────────
  # Dependency-free path filter: on pull_request the checked-out ref is the
  # merge commit, so `git diff HEAD^1 HEAD` with fetch-depth:2 is exactly the
  # PR's changed files. No third-party filter action to trust or pin.
  changes:
    name: "Gate · classify diff"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      agent: ${{ steps.classify.outputs.agent }}
      mcp_docs: ${{ steps.classify.outputs.mcp_docs }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        env:
          # Empty on pull_request (no inputs) — only a dispatch can set it.
          FAULT: ${{ inputs.fault || 'none' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            case "$FAULT" in
              classifier-fails)
                echo "::error::qualification fault classifier-fails injected: the diff is left unclassified"
                exit 1 ;;
              docs-only)
                # SIMULATION (stage 5C qualification): a docs-only file list
                # through the SAME case statements a pull_request uses. The
                # aggregate refuses this run whatever it computes.
                echo "::warning::qualification simulation: classifying a docs-only diff"
                printf '%s\n' README.md docs/operator/graceful-shutdown.md roadmap/CI-REDESIGN.md > changed.txt ;;
              *)
                # workflow_dispatch: no diff to classify — run everything.
                echo "code=true"     >> "$GITHUB_OUTPUT"
                echo "agent=true"    >> "$GITHUB_OUTPUT"
                echo "mcp_docs=true" >> "$GITHUB_OUTPUT"
                echo "frontend=true" >> "$GITHUB_OUTPUT"
                echo "Manual run — all jobs enabled."
                exit 0 ;;
            esac
          else
          # --no-renames is load-bearing, not stylistic. With rename detection
          # on (the default), `--name-only` emits ONLY the destination of a
          # rename — so moving a file OUT of a classified directory hides the
          # source path from every `case` below. Concretely: moving
          # docs/design/mcp/DATA-FLOW-DIAGRAMS.md to an archive dir would list
          # only the archive path, leave mcp_docs=false, skip the predicate job,
          # and the aggregate would count that skip as passing — while the
          # predicates themselves would have failed outright on the missing
          # input. A gate that does not run is a green tick, which is the exact
          # failure class this job exists to close. --no-renames reports the
          # move as delete+add, so BOTH paths are classified. It can only ever
          # add paths, never remove them, so it stays consistent with this
          # classifier's fail-toward-running-the-gate posture.
          git diff --no-renames --name-only HEAD^1 HEAD > changed.txt
          fi
          echo "── Changed files ──"; cat changed.txt

          # Docs-only = every file matches a documentation pattern.
          # Anything else counts as code (fail toward running the gate).
          code=false
          agent=false
          mcp_docs=false
          frontend=false
          while IFS= read -r f; do
            case "$f" in
              # Load-bearing docs: docs_saml_test.go reads this file at test
              # time, so a change to it MUST run the suite (P0, CI review).
              # First-match-wins — keep carve-outs above the docs patterns.
              docs/saml-idp-configuration-reference.md) code=true ;;
              *.md|docs/*|roadmap/*|LICENSE|.github/CODEOWNERS) ;;
              *) code=true ;;
            esac
            case "$f" in
              cmd/culvert-maint/*) agent=true ;;
            esac
            # MCP design surface. Its OWN `case` on purpose: the docs/code
            # classifier above is first-match-wins, so folding these patterns
            # into it would silently change `code` for MCP paths. This one is
            # narrow by design — an ordinary unrelated Markdown change must
            # NOT drag the predicate job in.
            case "$f" in
              docs/design/mcp/*) mcp_docs=true ;;
              docs/adr/0024-mcp-agent-security-gateway-trust-boundary.md) mcp_docs=true ;;
              .github/scripts/mcp-doc-predicates.sh) mcp_docs=true ;;
              .github/workflows/pr-fast-gate.yml) mcp_docs=true ;;
            esac
            # Frontend verification surface (FE-1A, ADR-FE-001). Its OWN
            # `case`, same rationale as mcp_docs. Fail-toward-running: the
            # committed-generated-output contract can be altered by the
            # OpenAPI document, the hygiene files (.gitattributes marks the
            # generated paths; the ignore files gate what reaches git/docker),
            # this workflow, and the reusable frontend workflow itself — a
            # change to ANY of them exercises the frontend gate.
            case "$f" in
              frontend/*) frontend=true ;;
              ui_frontend_v2*) frontend=true ;;
              api/openapi/openapi.json) frontend=true ;;
              .github/workflows/frontend-verify.yml) frontend=true ;;
              .github/workflows/pr-fast-gate.yml) frontend=true ;;
              .gitattributes|.gitignore|.dockerignore) frontend=true ;;
            esac
          done < changed.txt
          echo "code=$code"         >> "$GITHUB_OUTPUT"
          echo "agent=$agent"       >> "$GITHUB_OUTPUT"
          echo "mcp_docs=$mcp_docs" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "code=$code agent=$agent mcp_docs=$mcp_docs frontend=$frontend"

  # ─── 1. Hygiene: fmt + vet + build (incl. arm64 compile + static assert) ──
  hygiene:
    name: "Gate · fmt + vet + build"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache

      - name: gofmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::gofmt violations:"; echo "$UNFORMATTED"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check (root module)
        # Check-only by contract (never auto-push to contributor branches).
        # Moved here from code-review.yml's retired build job (step 7).
        run: |
          if go mod tidy -diff; then
            echo "go.mod and go.sum are tidy ✓"
          else
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' locally and commit the result"
            exit 1
          fi

      - name: Build static binary + assert no dynamic linkage
        # Guards the CGO_ENABLED=0 single-binary contract (was qa-os).
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o culvert .
          file culvert
          if ldd culvert 2>/dev/null; then
            echo "::error::binary is dynamically linked — CGO_ENABLED=0 contract broken"
            exit 1
          fi

      - name: Cross-compile check (linux/arm64, no QEMU)
        # PR image builds are amd64-only; this keeps arm64 compile breakage
        # visible pre-merge without paying for an emulated image build.
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null .

  # ─── 2. Lint ───────────────────────────────────────────────────────────────
  lint:
    name: "Gate · golangci-lint"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # --new-from-rev needs the merge base in history
      - uses: ./.github/actions/setup-go-cache

      - name: Install golangci-lint
        # Checksum-verified via the Go module proxy + sum.golang.org (v2 dropped
        # its replace directives so `go install` works) — replaces `curl … |
        # sh` off a mutable tag ref, whose fetched script was the trust root.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Run golangci-lint (new issues only)
        # Diff-scoped by design: the tree is not lint-clean under a full run
        # (~137 legacy findings), and the protection contract this replaces
        # (reviewdog filter_mode: diff_context in code-review.yml) only
        # fails on issues in the PR's changed lines. --new-from-rev is the
        # native equivalent: fail only on issues introduced vs the merge base.
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "$BASE_REF"
          golangci-lint run --timeout=5m --new-from-rev "origin/$BASE_REF"

  # ─── 3. Race + coverage (sharded, stage 5C) ────────────────────────────────
  # THE race + coverage execution for PRs, on the shared engine the QA gate
  # runs (.github/workflows/qa-race-shards.yml): the root package as 4
  # isolated shards of ONE prebuilt `go test -c -race -cover` binary, every
  # other package whole, an independent coverage-universe job, and a verdict
  # that refuses missing tests, omitted packages, truncated/foreign profiles
  # and any producer that did not succeed. It publishes the complete merged
  # profile as `fast-gate-coverage` (path coverage.out, 30-day retention —
  # the pre-5C contract), and coverage-floors below enforces BOTH floors on it.
  #
  # Everything that runs is this run's PR merge checkout ($GITHUB_SHA, which
  # every engine job checks out and the verdict pins): no evidence from main
  # or another run is ever read. The only caller-specific settings are these
  # inputs; see the engine's header.
  test-race:
    name: "Gate · go test -race (sharded)"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/qa-race-shards.yml
    with:
      shards: 4
      coverage-artifact: fast-gate-coverage
      # The pre-5C test-race job carried step-security/harden-runner in audit
      # mode; every engine job that replaces it carries the same step.
      harden-runner: true
      # restore_mountpoint_test.go needs CAP_SYS_ADMIN to bind-mount a
      # directory (docker-compose.yml's `cli` topology: the proxy-data volume
      # mounted at /data). The unprivileged shards only ever reach its t.Skip,
      # so the engine re-runs it as root against the same binary and requires
      # PASS — the pre-5C "Mount-point regression (privileged)" step.
      privileged-test: TestRestoreCommit_DataDirIsMountPoint_FailsInsteadOfCommitting
      fault: ${{ inputs.fault || 'none' }}

  # ─── 3b. Coverage floors (global + per-file) on the merged profile ─────────
  # Single source of truth for BOTH coverage contracts — floors live in
  # .github/scripts/coverage-floor.sh (shared with qa-gate's qa-coverage, so
  # the two gates can never drift). The profile is THIS run's
  # `fast-gate-coverage`, published by the verdict only after it proved the
  # evidence complete; no run-id, so nothing from another run can be read.
  coverage-floors:
    name: "Gate · coverage floors (global + per-file)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, test-race]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the merged coverage profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fast-gate-coverage
          path: .

      - name: Assert the coverage profile is usable
        run: |
          set -euo pipefail
          test -s coverage.out || { echo "::error::no coverage profile from test-race (missing or empty after download)"; exit 1; }
          head -n1 coverage.out | grep -q '^mode:' || { echo "::error::coverage.out has no mode line"; exit 1; }
          lines=$(($(wc -l < coverage.out) - 1))
          [ "$lines" -gt 0 ] || { echo "::error::coverage.out carries a mode line and no statements"; exit 1; }
          echo "coverage profile: $lines statement blocks, $(head -n1 coverage.out)"

      - name: "Qualification fault: zero every count before the floors"
        if: github.event_name == 'workflow_dispatch' && inputs.fault == 'coverage-floor-fails'
        run: |
          echo "::warning::qualification fault coverage-floor-fails injected: every block count set to 0"
          sed -i -E '2,$ s/ [0-9]+$/ 0/' coverage.out

      - name: Enforce coverage floors (global + per-file)
        run: .github/scripts/coverage-floor.sh coverage.out

  # ─── 4. Alloc-regression benchgate ─────────────────────────────────────────
  # `benchgate`-tagged tests are OUTSIDE the default `go test ./...` build —
  # this job is the required path that runs them (weekly-stress also runs
  # them, but only weekly). Hard pass/fail on allocs/op on the hot path.
  benchgate:
    name: "Gate · perf-regression (allocs/op)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
      - name: Run benchgate
        run: go test -tags benchgate -run 'TestBenchGate_' -count=1 -timeout=10m -v .

  # ─── 5. Fast security: govulncheck + gosec (pinned) ────────────────────────
  security-fast:
    name: "Gate · govulncheck + gosec"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache

      - name: govulncheck (known CVEs in the dependency graph)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

      # govulncheck does not traverse module boundaries — `./...` from the
      # repo root analyzes the root module only, so the nested modules get
      # explicit runs (RISK-014). cmd/culvert-maint is blocking like the root.
      - name: govulncheck (cmd/culvert-maint)
        working-directory: cmd/culvert-maint
        run: govulncheck ./...

      - name: gosec (root module)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          gosec -exclude=G104,G302,G304,G703,G704 ./...

      - name: gosec (cmd/culvert-maint)
        working-directory: cmd/culvert-maint
        run: gosec -exclude=G104,G302,G304,G703,G704 ./...

  # ─── 6. Secrets: gitleaks (runs on EVERY PR, docs included) ────────────────
  # Deliberately not gated on the code filter — secrets leak into docs too.
  gitleaks:
    name: "Gate · gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # full history so gitleaks can scan all commits
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 7. Maintenance agent (nested module) — gated on agent paths ──────────
  agent:
    name: "Gate · maint-agent (cmd/culvert-maint)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    defaults:
      run:
        working-directory: cmd/culvert-maint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-dependency-path: cmd/culvert-maint/go.sum

      - name: go mod tidy drift check
        run: |
          cp go.mod go.mod.orig && cp go.sum go.sum.orig
          go mod tidy
          diff -u go.mod.orig go.mod && diff -u go.sum.orig go.sum || {
            echo "::error::cmd/culvert-maint go.mod/go.sum not tidy"; exit 1
          }
          mv go.mod.orig go.mod && mv go.sum.orig go.sum

      - name: Build + vet
        run: |
          go build ./...
          go vet ./...

      - name: Tests (-race)
        env:
          TEST_SEED: "20260421"
        run: go test -race -count=1 -timeout=10m -v ./...

      - name: golangci-lint
        # Checksum-verified install (sum.golang.org), not curl|sh off a tag ref.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          golangci-lint run --timeout=5m

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1
          staticcheck ./...

  # ─── 8. MCP design-document predicates — gated on the MCP doc surface ─────
  # Board blocker #927 took three PRs and four verification rounds, and EVERY
  # intermediate head passed this pipeline while still carrying a real defect
  # — including one where the config-surface matrix did not parse as a table
  # at all, so every assertion over it passed vacuously. CI carried no signal
  # because nothing here parsed those documents. This job closes that gap.
  #
  # Explicit allowlist (19, 21, 22, 23, 24, 26) lives in the runner script,
  # NOT a `predicate-*.py` glob: a future predicate must not become blocking
  # without review. predicate-25 is excluded by design — it is provenance-
  # specific and diffs against a fixed historical base commit, so as a general
  # gate it would fail unrelated valid PRs. It stays manual.
  #
  # Stdlib Python only: no installs, no network, no document mutation.
  mcp-predicates:
    name: "Gate · MCP design predicates"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.mcp_docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python version
        run: python3 --version

      - name: Run MCP design-document predicates
        run: .github/scripts/mcp-doc-predicates.sh

  # ─── 9. Proxy traffic smoke — ADVISORY (promotion criteria in doc) ────────
  # Hermetic in-process traffic-plane e2e (HTTP forward, CONNECT relay,
  # SOCKS5, policy allow/block/default-deny). Advisory until it shows a
  # stable flake-free record on the nightly lane (see roadmap/CI-REDESIGN.md);
  # then it joins the aggregate below.
  traffic-smoke:
    name: "Gate · proxy traffic smoke (advisory)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
      - name: Traffic-plane E2E
        env:
          TEST_SEED: "20260421"   # reproducible flake triage for the promotion record
        run: |
          set -o pipefail   # default shell lacks it; tee must not mask a failure
          go test -race -count=1 -timeout=10m -v \
            -run 'TestProxyE2E_|TestUNAUTH_HTTP_|TestUNAUTH_CONNECT_|TestSOCKS5_' . \
            | tee proxy-traffic.log
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-traffic-log
          path: proxy-traffic.log
          retention-days: 7

  # ─── F. Frontend verification (FE-1A, ADR-FE-001) ──────────────────────────
  # Reusable implementation lives in frontend-verify.yml (workflow_call):
  # digest-pinned canonical Node container, ignore-scripts installs proven in
  # both npm trees, type-generation + committed-dist porcelain drift gates,
  # drift-gate tamper harness, and the 2-build determinism check. Runs only
  # when the classifier saw the frontend surface; the aggregate counts the
  # skip as passing on unrelated PRs (needs-verdict), so the ONE required
  # branch-protection check stays "✅ Fast PR Gate — APPROVED".
  frontend:
    name: "Gate · frontend"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-verify.yml

  # ─── Audit: the unsharded race reference (stage 5C qualification) ─────────
  # Dispatch-only (`unsharded_audit: true`), the Fast-gate twin of qa-gate.yml's
  # audit. On every pull request and default dispatch both jobs are skipped,
  # so an ordinary run pays nothing for them. When requested they are part of
  # the gate: the aggregate requires both, so a lost test or a lost covered
  # block refuses that run. The reference is the pre-5C test-race command,
  # verbatim; fast_gate_race_shards_test.go pins it and the comparison to
  # qa-gate.yml's so the two audits cannot drift apart.
  race-unsharded-audit:
    name: "Audit · unsharded race reference"
    if: github.event_name == 'workflow_dispatch' && inputs.unsharded_audit
    runs-on: ubuntu-latest
    timeout-minutes: 50  # > the 40m per-binary test budget below (compile + tee + upload)
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Unsharded race + coverage run (the pre-5C test-race command)
        env:
          TEST_SEED: "20260421"
        run: |
          set -o pipefail
          mkdir -p fast-audit-reference
          go test -race -count=1 -timeout=40m -coverprofile=fast-audit-reference/coverage.out -v ./... \
            2>&1 | tee fast-audit-reference/logic.log

      - name: Upload the unsharded reference
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-audit-reference
          path: fast-audit-reference/
          retention-days: 14
          if-no-files-found: warn

  race-unsharded-audit-compare:
    name: "Audit · sharded vs unsharded"
    # The edge carries DATA: the reference's log and profile, and test-race's
    # inventory, results and merged profile — all from THIS run.
    needs: [test-race, race-unsharded-audit]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.unsharded_audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download the unsharded reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: fast-audit-reference
          path: reference

      - name: Download the sharded run's inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: qa-race-build
          path: race-build

      - name: Download the sharded run's verdict
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: qa-race-verdict
          path: race-verdict

      - name: Compare inventory, results and EVERY covered block with the reference
        # A block the reference covered and the sharded run did not fails here
        # unless .github/qa-root-shard-coverage-exceptions.json justifies it —
        # that file is expected to be empty.
        run: |
          set -o pipefail
          mkdir -p audit-compare
          missing=0
          for f in reference/logic.log reference/coverage.out race-build/list.txt \
                   race-verdict/results.json race-verdict/merged.cover.out; do
            [ -s "$f" ] || { echo "::error::comparison input $f is missing (its producer failed or published nothing)"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          go run ./cmd/rootshard compare \
            -ref-log reference/logic.log -ref-profile reference/coverage.out \
            -pilot-results race-verdict/results.json -pilot-profile race-verdict/merged.cover.out \
            -list race-build/list.txt -pkg "$(go list .)" \
            -coverage-exceptions .github/qa-root-shard-coverage-exceptions.json \
            -out audit-compare/comparison.json -baseline-out audit-compare/reference-timings.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Coverage floors, reference vs sharded (same unchanged script)
        if: always()
        run: |
          # +e: both verdicts are recorded before either decides the step.
          set +e -u
          mkdir -p audit-compare
          .github/scripts/coverage-floor.sh reference/coverage.out > audit-compare/floors-reference.txt; ref=$?
          .github/scripts/coverage-floor.sh race-verdict/merged.cover.out > audit-compare/floors-sharded.txt; sharded=$?
          echo "coverage-floor.sh exit: reference=$ref sharded=$sharded"
          diff -u audit-compare/floors-reference.txt audit-compare/floors-sharded.txt | tee audit-compare/floors.diff || true
          [ "$ref" = "$sharded" ] || { echo "::error::the floors verdict differs between the reference and the sharded run"; exit 1; }

      - name: Both sides must have succeeded
        if: always()
        run: |
          set -eu
          fail=0
          for pair in "race-unsharded-audit=${{ needs.race-unsharded-audit.result }}" "test-race=${{ needs.test-race.result }}"; do
            echo "$pair"
            [ "${pair#*=}" = success ] || { echo "::error::${pair%%=*} did not succeed (${pair#*=})"; fail=1; }
          done
          exit $fail

      - name: Evidence, compact (last in the log, readable without the artifact)
        if: always()
        run: |
          for f in race-verdict/verdict.json audit-compare/comparison.json; do
            [ -s "$f" ] && echo "EVIDENCE $f $(jq -c . "$f")" || echo "EVIDENCE $f MISSING"
          done

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-audit-compare
          path: audit-compare/
          retention-days: 14
          if-no-files-found: warn

  # ─── ✅ Aggregate — the ONE required branch-protection check ────────────────
  # Always runs. Skipped jobs (docs-only PRs, unchanged agent module) count
  # as passing; failure or cancellation of any needed job fails the gate.
  # traffic-smoke is intentionally NOT in `needs` while advisory.
  #
  # Stage 5C: skipped = pass is safe only for a job the classifier legitimately
  # switched off. When the diff classified as code, the migrated race path
  # (test-race — the whole sharded engine, whose verdict judges every producer
  # — and coverage-floors) must be exactly `success`: a race path that was
  # skipped for any other reason must not read as green. A requested audit is
  # required the same way. A qualification dispatch (`fault` set) never
  # approves.
  fast-gate-approved:
    name: "✅ Fast PR Gate — APPROVED"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - hygiene
      - lint
      - test-race
      - coverage-floors
      - benchgate
      - security-fast
      - gitleaks
      - agent
      - mcp-predicates
      - frontend
      - race-unsharded-audit
      - race-unsharded-audit-compare
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/needs-verdict
        with:
          needs-json: ${{ toJSON(needs) }}
          title: "✅ Fast PR Gate — APPROVED"
          require-success: >-
            ${{ format('changes{0}{1}',
                needs.changes.outputs.code == 'true' && ',test-race,coverage-floors' || '',
                inputs.unsharded_audit && ',race-unsharded-audit,race-unsharded-audit-compare' || '') }}

      - name: Qualification runs never approve
        if: github.event_name == 'workflow_dispatch' && inputs.fault != 'none'
        env:
          FAULT: ${{ inputs.fault }}
        run: |
          echo "::error::qualification dispatch (fault=$FAULT): the aggregate above computed its verdict, but a run with injected faults or a simulated classification never approves"
          exit 1
