## ─────────────────────────────────────────────────────────────────────────────
## Culvert — Security Release Gate
## ─────────────────────────────────────────────────────────────────────────────
## This workflow is the mandatory security gate that must pass before any
## release is published.  It runs automatically on:
##   • Push of a version tag (v*)   → blocks release if any check fails
##   • Push to main + weekly cron   → continuous scanning cadence
##     (on a main push the race + coverage suite is owned by qa-gate.yml —
##      see the ownership matrix below)
##   • Pull requests to main        → PASS-THROUGH ONLY (retirement step 6):
##     the scan jobs skip and the aggregate reports success — PR-time
##     scanning lives in the Fast/Deep PR Gates (roadmap/CI-REDESIGN.md)
##   • Manual trigger               → allows ad-hoc scanning
##
## How the gate fits into the release flow:
##   1. A main push runs this gate AND ci.yml in parallel.
##   2. ci.yml's auto-tag job POLLS the "✅ Security Gate — APPROVED"
##      check-run for the same SHA and refuses to create the release tag
##      until it concludes success — that wait step is the mechanical
##      enforcement point (branch protection cannot gate tag-triggered
##      workflows). Manually-pushed tags bypass it: only tag commits that
##      are already green on main.
##
## WHAT A GREEN VERDICT HERE MEANS (CI-REDESIGN stage 2B):
##   THIS workflow's required security scans passed for this SHA. It is NOT a
##   statement about qa-gate.yml. On a main push the race + coverage suite is
##   OWNED BY QA and is neither run nor evaluated here.
##
##   Customer release eligibility is the CONJUNCTION of a successful main-push
##   run of this workflow AND of qa-gate.yml for the exact release SHA, which
##   .github/scripts/require-release-evidence.sh resolves against
##   .github/release-evidence.txt (both rows `mandatory`). Nothing in this file
##   authorises a publication on its own.
##
## RACE + COVERAGE OWNERSHIP MATRIX (`tests-race`):
##   pull_request           → skip  (pass-through, unchanged)
##   push → refs/heads/main → SKIP  — owned by qa-gate.yml's `qa-logic`
##   push → refs/tags/v*    → RUN   — qa-gate.yml has no tag trigger
##   schedule (weekly)      → RUN   — ref is main, but QA has no schedule
##   workflow_dispatch      → RUN   — including on main
##
##   The condition tests the EVENT and the REF together: keying on the branch
##   alone would also suppress the scheduled and manual runs, whose ref is main
##   too, and those are the events on which nothing else runs this suite. On
##   every event where the suite IS owned here the aggregate additionally
##   demands it via `require-success`, so an unexpected skip refuses instead of
##   passing through needs-verdict's skipped-as-pass door.
## ─────────────────────────────────────────────────────────────────────────────

name: Security Release Gate
# Least-privilege default: jobs that need write scopes (packages, checks,
# contents, security-events, pull-requests) declare them at job level.
permissions:
  contents: read


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    tags: ["v*"]
  # PR trigger retained ONLY so the "✅ Security Gate — APPROVED" check name
  # keeps reporting (pass-through; see header). Do not remove until branch
  # protection no longer requires it.
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"   # weekly full scan, Mondays 05:30 UTC
  workflow_dispatch:

# Prevent two concurrent scans on the same ref — cancel the older one.
concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. SAST — gosec ───────────────────────────────────────────────────────
  sast-gosec:
    name: "SAST · gosec"
    timeout-minutes: 15
    # Retirement step 6 (roadmap/CI-REDESIGN.md): PR-time run superseded by the Fast/Deep PR Gates (gosec/govulncheck/gitleaks in Lane A; trivy-image/hadolint/go-licenses in Lane B); full behavior retained on main pushes, tags, and the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      # G703 (taint-analysis path traversal) is the taint-mode variant of the
      # already-excluded G304 (CWE-22 file access via variable): a new gosec
      # release enabled it and it flags pre-existing operator-config paths
      # (logger file, cert files, data dirs) that are not request-tainted.
      # Excluded for consistency with the long-standing G304/G704 policy.
      - name: Run gosec (SARIF for upload)
        # Generate SARIF for GitHub Security tab; continue even if findings exist.
        run: |
          gosec -exclude=G104,G302,G304,G703,G704 \
            -fmt=sarif -out=gosec-results.sarif \
            ./... || true

      - name: Run gosec (text for log visibility)
        # Re-run with text output so findings are visible in CI logs.
        run: |
          gosec -exclude=G104,G302,G304,G703,G704 \
            -fmt=text \
            ./...

      - name: Run gosec on cmd/culvert-maint (nested module)
        # gosec walks Go-module boundaries — `./...` from the repo root
        # does not descend into the nested cmd/culvert-maint module, so
        # the privileged Maintenance Agent's code requires its own pass.
        # qa-gate.yml's qa-agent job runs the same scan; this is the
        # belt-and-suspenders run that surfaces findings in the Security
        # gate's logs as well.
        working-directory: cmd/culvert-maint
        run: |
          gosec -exclude=G104,G302,G304,G703,G704 \
            -fmt=text \
            ./...

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true   # requires GitHub Advanced Security; skip gracefully if unavailable
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  # ─── 2. Known CVEs — govulncheck ───────────────────────────────────────────
  vuln-govulncheck:
    name: "CVE · govulncheck"
    timeout-minutes: 15
    # Retirement step 6 (roadmap/CI-REDESIGN.md): PR-time run superseded by the Fast/Deep PR Gates (gosec/govulncheck/gitleaks in Lane A; trivy-image/hadolint/go-licenses in Lane B); full behavior retained on main pushes, tags, and the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Check for known Go vulnerabilities
        # govulncheck exits non-zero if any reachable code has a known CVE.
        run: govulncheck ./...

      # govulncheck does not traverse module boundaries — `./...` from the
      # repo root analyzes the root module only, so the nested modules get
      # explicit runs (RISK-014). cmd/culvert-maint is blocking like the root.
      - name: Check nested module cmd/culvert-maint
        working-directory: cmd/culvert-maint
        run: govulncheck ./...

  # ─── 3. Dependency audit — trivy filesystem ────────────────────────────────
  vuln-trivy-fs:
    name: "CVE · trivy (source)"
    timeout-minutes: 15
    # Retirement step 6 (roadmap/CI-REDESIGN.md): PR-time run superseded by the Fast/Deep PR Gates (gosec/govulncheck/gitleaks in Lane A; trivy-image/hadolint/go-licenses in Lane B); full behavior retained on main pushes, tags, and the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.2.0
        with:
          version: v0.69.3
          cache: true

      - name: Update Trivy DB
        run: trivy fs --download-db-only --db-repository mirror.gcr.io/aquasec/trivy-db:2

      - name: Scan source (table — THE GATE — output visible in CI log)
        run: |
          trivy fs \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format table \
            .

      # RISK-006: the blocking gate above structurally CANNOT fail on a vuln
      # that is (a) unfixed upstream, (b) MEDIUM or lower, or (c) listed in
      # .trivyignore — all three masks are active there. This advisory pass
      # drops the severity/unfixed filters and adds --show-suppressed so the
      # .trivyignore'd findings appear WITH their suppression status (trivy
      # auto-loads .trivyignore from the cwd, so merely omitting --ignorefile
      # would NOT unmask them — PR #557 Codex review). "Green gate" can never
      # silently mean "vulns exist but are filtered". Never fails.
      - name: Full-severity unmasked report (advisory — what the gate cannot see)
        if: always()
        run: |
          trivy fs \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --show-suppressed \
            --exit-code 0 \
            --format table \
            . | tee trivy-fs-unmasked.txt
          {
            echo "### Trivy full-severity report (advisory)"
            echo "Everything Trivy knows about, INCLUDING vulns masked from the blocking gate by --ignore-unfixed, the CRITICAL,HIGH filter, or .trivyignore."
            echo '```'
            cat trivy-fs-unmasked.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SARIF report (optional — for GitHub Security tab)
        if: always()
        run: |
          trivy fs \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 0 \
            --format sarif \
            --output trivy-fs.sarif \
            .

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true   # requires GitHub Advanced Security; skip gracefully if unavailable
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ─── 4. Docker image scan — trivy ──────────────────────────────────────────
  vuln-trivy-image:
    name: "CVE · trivy (Docker image)"
    timeout-minutes: 30
    # Retirement step 6 (roadmap/CI-REDESIGN.md): PR-time run superseded by the Fast/Deep PR Gates (gosec/govulncheck/gitleaks in Lane A; trivy-image/hadolint/go-licenses in Lane B); full behavior retained on main pushes, tags, and the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.2.0
        with:
          version: v0.69.3
          cache: true

      - name: Update Trivy DB
        run: trivy image --download-db-only --db-repository mirror.gcr.io/aquasec/trivy-db:2

      - name: Build image for scanning (no push)
        run: docker build -t culvert:scan .

      - name: Scan image (table — THE GATE — output visible in CI log)
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format table \
            culvert:scan

      - name: Generate SARIF report (optional — for GitHub Security tab)
        if: always()
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 0 \
            --format sarif \
            --output trivy-image.sarif \
            culvert:scan

      - name: Upload Trivy image SARIF
        if: always()
        continue-on-error: true   # requires GitHub Advanced Security; skip gracefully if unavailable
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ─── 5. Secret scanning — gitleaks ─────────────────────────────────────────
  secrets-gitleaks:
    name: "Secrets · gitleaks"
    timeout-minutes: 10
    # Retirement step 6 (roadmap/CI-REDESIGN.md): PR-time run superseded by the Fast/Deep PR Gates (gosec/govulncheck/gitleaks in Lane A; trivy-image/hadolint/go-licenses in Lane B); full behavior retained on main pushes, tags, and the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # full history so gitleaks can scan all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set GITLEAKS_LICENSE in repo secrets for team/org plans.

  # ─── 6. Dependency license check ───────────────────────────────────────────
  license-check:
    name: "Licenses · go-licenses"
    timeout-minutes: 10
    # Retirement step 6 (roadmap/CI-REDESIGN.md): PR-time run superseded by the Fast/Deep PR Gates (gosec/govulncheck/gitleaks in Lane A; trivy-image/hadolint/go-licenses in Lane B); full behavior retained on main pushes, tags, and the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0

      - name: Check for disallowed licenses
        # Fail if any dependency uses GPL, AGPL, LGPL, or CPAL.
        # pipefail is required: the default shell does not set it, so without
        # it the pipeline returns tee's (always-zero) status and a forbidden
        # license would NOT fail this job.
        run: |
          set -o pipefail
          go-licenses check ./... \
            --disallowed_types=forbidden,restricted \
            --ignore=proxy 2>&1 | tee license-report.txt

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-report
          path: license-report.txt
          retention-days: 30

  # ─── 7. Generate SBOM ──────────────────────────────────────────────────────
  sbom:
    name: "SBOM · syft"
    timeout-minutes: 10
    # Retirement step 6 (roadmap/CI-REDESIGN.md): PR-time run superseded by the Fast/Deep PR Gates (gosec/govulncheck/gitleaks in Lane A; trivy-image/hadolint/go-licenses in Lane B); full behavior retained on main pushes, tags, and the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Informational SOURCE-TREE SBOM (whole repo), 90-day artifact — NOT a
    # release asset. It runs on main/weekly to catch dependency drift BETWEEN
    # releases. The authoritative per-release evidence is the signed per-MODULE
    # binary SBOMs attached to each GitHub Release by ci.yml's `release` job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: "."
          format: "cyclonedx-json"
          artifact-name: "culvert-sbom.json"
          output-file: "culvert-sbom.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: culvert-sbom.json
          retention-days: 90

  # ─── 8. Static analysis — staticcheck ──────────────────────────────────────
  sast-staticcheck:
    name: "SAST · staticcheck"
    timeout-minutes: 20
    # Retirement step 6 (roadmap/CI-REDESIGN.md): PR-time run superseded by the Fast/Deep PR Gates (gosec/govulncheck/gitleaks in Lane A; trivy-image/hadolint/go-licenses in Lane B); full behavior retained on main pushes, tags, and the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Run staticcheck (proxy module — root)
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: "2025.1"
          install-go: false

      - name: Run staticcheck (cmd/culvert-maint nested module)
        # The action above runs from the repo root; it does NOT descend
        # into nested modules. The agent module is scanned by its own
        # qa-agent job in qa-gate.yml; this is the parallel run inside
        # the Security gate so coverage is visible here as well.
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: "2025.1"
          install-go: false
          working-directory: cmd/culvert-maint

  # ─── 9. Race-condition & coverage tests ────────────────────────────────────
  #
  # OWNERSHIP BY EVENT (CI-REDESIGN stage 2B). On a main push this suite is
  # owned by qa-gate.yml's `qa-logic`, which since stage 2A runs the identical
  # command — `-race -count=1 -timeout=40m -coverprofile=… -v ./...` with the
  # same TEST_SEED — and publishes the authoritative `qa-coverage` profile that
  # `qa-coverage` enforces the floors on. Running it here as well executed the
  # whole suite twice per main push for one verdict.
  #
  # It is NOT removed, because the two workflows do not run on the same events:
  #
  #   pull_request          → skip (pass-through; unchanged)
  #   push → refs/heads/main → SKIP — owned by QA (the stage 2B change)
  #   push → refs/tags/v*    → RUN — qa-gate.yml has NO tag trigger at all
  #   schedule (weekly)      → RUN — its ref is main, but QA has no schedule
  #   workflow_dispatch      → RUN — including on main; QA's dispatch is separate
  #
  # The condition therefore tests the EVENT and the REF together. Keying on the
  # branch alone would suppress the scheduled and manual runs, whose ref is also
  # main — and those are the events on which nothing else runs this suite.
  #
  # Release qualification is unaffected: .github/release-evidence.txt requires a
  # successful main-push run of BOTH this workflow and qa-gate.yml for the exact
  # release SHA, and that conjunction is what authorises publication. Skipping
  # this job does not make this workflow's run anything other than a full,
  # required security verdict.
  #
  # KEEP THIS PREDICATE AND THE AGGREGATE'S `require-success` IN SYNC — they are
  # two copies of one decision (job-level `if:` cannot read `env`, so it cannot
  # be written once). TestSecurityRace_OwnershipPredicateIsSingleSourced pins
  # them equal; if they drift, either the suite runs unrequired or the gate
  # wedges demanding a job that never starts.
  tests-race:
    name: "Tests · race detector + coverage"
    # Budget mirrors the Fast PR Gate's identical `-race` + coverage run
    # (timeout-minutes 50 / go test -timeout=40m): the suite outgrew the
    # previous 25m / 15m pair on 2026-08-28 and every main push since then
    # died at the per-binary 15m timeout, which require-gate.sh then turned
    # into a refused Auto-Tag Release.
    timeout-minutes: 50
    # Retirement step 6 (roadmap/CI-REDESIGN.md): PR-time run superseded by the
    # Fast/Deep PR Gates. Stage 2B additionally delegates the MAIN-PUSH run to
    # qa-gate.yml; tags, the weekly schedule and manual dispatch still run here.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-cache

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector
        env:
          TEST_SEED: "20260421"   # same seed as the other gates — reproducible reruns
        run: go test -v -race -count=1 -timeout=40m -coverprofile=coverage.out ./...

      - name: Check coverage threshold (≥ 55%)
        run: |
          total=$(go tool cover -func=coverage.out | grep ^total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${total}%"
          if (( $(echo "$total < 55" | bc -l) )); then
            echo "::error::Coverage ${total}% is below the 55% threshold"
            exit 1
          fi

      - name: Upload coverage report
        # ARTIFACT OWNERSHIP (stage 2B). `qa-coverage`, published by
        # qa-gate.yml's qa-logic, is the AUTHORITATIVE coverage profile for a
        # main push and the one the floors are enforced against. This
        # `coverage-report` artifact belongs to THIS workflow's standalone runs
        # — version tags, the weekly schedule and manual dispatch — where QA
        # does not run at all. It is therefore absent on main pushes from stage
        # 2B onward, which is safe because nothing consumes it: it has no reader
        # in any workflow, script or test (audited). Do not synthesise a
        # stand-in for it on main; read `qa-coverage` instead.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

  # ─── 10. Dockerfile linting — hadolint ──────────────────────────────────────
  lint-dockerfile:
    name: "Lint · Hadolint (Dockerfile)"
    timeout-minutes: 10
    # Retirement step 6 (roadmap/CI-REDESIGN.md): PR-time run superseded by the Fast/Deep PR Gates (gosec/govulncheck/gitleaks in Lane A; trivy-image/hadolint/go-licenses in Lane B); full behavior retained on main pushes, tags, and the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          # DL3018: pin apk versions — acceptable in build stage; GeoIP download is version-pinned via URL
          # DL3047: wget in HEALTHCHECK — curl not available in alpine minimal
          # DL4006: pipe failures — acceptable for geoip download (wget | gzip)
          ignore: DL3018,DL3047,DL4006
          failure-threshold: warning

      - name: Upload Hadolint SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  # ─── GATE: all checks must pass ─────────────────────────────────────────────
  release-approved:
    name: "✅ Security Gate — APPROVED"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - sast-gosec
      - vuln-govulncheck
      - vuln-trivy-fs
      - vuln-trivy-image
      - secrets-gitleaks
      - license-check
      - sast-staticcheck
      - tests-race
      - lint-dockerfile
    # sbom is informational — not in needs (non-blocking)
    # always() + skipped-as-pass: on PRs the scan jobs are skipped
    # (superseded by the Fast/Deep PR Gates — retirement step 6) but this
    # check name must keep reporting success so a branch-protection rule
    # requiring it can never wedge a PR at "Expected". On main pushes, tags,
    # and the weekly schedule the scans run and any failure/cancellation
    # fails the gate as before.
    #
    # STAGE 2B — one skip is intentional, every other one is not. `tests-race`
    # is deliberately absent on a main push (owned by qa-gate.yml), and
    # needs-verdict reads a skip as a pass, so on that event alone the skip is
    # accepted. On every event where this workflow still OWNS the suite — tags,
    # schedule, dispatch — `require-success` demands it be exactly `success`,
    # so a job that silently fails to start refuses the gate instead of
    # passing through the skipped-as-pass door. The predicate is the same one
    # on the job's `if:`; see the note there before editing either.
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/needs-verdict
        with:
          needs-json: ${{ toJSON(needs) }}
          title: "✅ Security Gate — APPROVED"
          require-success: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && 'tests-race' || '' }}
          extra-summary: ${{ github.event_name == 'pull_request' && 'PASS-THROUGH on PRs — scanning is enforced by the Fast PR Gate (govulncheck/gosec/gitleaks) and Deep PR Gate (trivy/hadolint/go-licenses) — roadmap/CI-REDESIGN.md, step 6; this gate runs fully on main pushes, tags, and weekly.' || '' }}

      - name: Security-checks-passed banner
        if: github.event_name != 'pull_request'
        env:
          RACE_OWNED_HERE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && 'yes' || 'no' }}
        run: |
          echo "=================================================="
          echo "  This workflow's required security scans passed"
          echo "  Ref:    ${{ github.ref }}"
          echo "  SHA:    ${{ github.sha }}"
          echo "  Actor:  ${{ github.actor }}"
          echo "  Time:   $(date -u)"
          if [ "$RACE_OWNED_HERE" = "yes" ]; then
            echo "  Race + coverage: RUN HERE for this event"
          else
            echo "  Race + coverage: owned by qa-gate.yml on a main push."
            echo "                   This gate does NOT evaluate it and makes"
            echo "                   no claim about whether QA passed."
          fi
          echo "  Customer release eligibility is NOT decided here: it"
          echo "  requires a successful main-push run of BOTH this workflow"
          echo "  and qa-gate.yml for this exact SHA, resolved by"
          echo "  .github/scripts/require-release-evidence.sh."
          echo "=================================================="

      - name: Create gate summary
        if: github.event_name != 'pull_request'
        env:
          RACE_ROW: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && '| Tests (race detector + coverage) | ✅ |' || '| Tests (race detector + coverage) | ➖ owned by `qa-gate.yml` on a main push — not evaluated here |' }}
        run: |
          {
            echo "## ✅ Security checks passed"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| SAST (gosec) | ✅ |"
            echo "| CVE scan (govulncheck) | ✅ |"
            echo "| CVE scan (trivy source) | ✅ |"
            echo "| CVE scan (trivy image) | ✅ |"
            echo "| Secret scan (gitleaks) | ✅ |"
            echo "| License audit | ✅ |"
            echo "| Static analysis (staticcheck) | ✅ |"
            echo "$RACE_ROW"
            echo "| Dockerfile lint (hadolint) | ✅ |"
            echo ""
            echo "**Scope of this verdict.** A green result here means THIS"
            echo "workflow's required scans passed for this SHA. On a main push"
            echo "the race + coverage suite is owned by \`qa-gate.yml\` (CI-REDESIGN"
            echo "stage 2B) and is neither run nor evaluated here — this gate makes"
            echo "NO claim about whether QA passed."
            echo ""
            echo "**Customer release eligibility is decided elsewhere.** It requires a"
            echo "successful main-push run of BOTH this workflow and \`qa-gate.yml\`"
            echo "for this exact SHA, resolved by"
            echo "\`.github/scripts/require-release-evidence.sh\` against"
            echo "\`.github/release-evidence.txt\`, where both are \`mandatory\`."
            echo ""
            echo "**SBOM** (source-tree) uploaded as a 90-day workflow artifact"
            echo "(\`culvert-sbom.json\`). Per-release binary SBOMs are signed + attached"
            echo "to each GitHub Release by the \`release\` job."
            echo ""
            echo "**Coverage artifact.** \`coverage-report\` is published only on the"
            echo "events this workflow owns the suite for (tags, schedule, dispatch)."
            echo "The authoritative main-push profile is \`qa-coverage\`, published by"
            echo "\`qa-gate.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
