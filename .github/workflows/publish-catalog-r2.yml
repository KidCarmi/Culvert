name: Publish Release Catalog (R2)

# DORMANT Cloudflare-R2 catalog publisher (M0-PR3).
#
# Publishes the SAME signed release-catalog bundle that ci.yml's `catalog-pipeline`
# attaches to the GitHub Release, to Cloudflare R2, as a fail-closed
# stage -> verify-staged-bytes-through-the-real-baked-root -> promote-by-server-side-copy
# pipeline. GitHub Pages remains the authoritative host for all of M0 (Pages
# retirement is M3); this workflow is inert until an owner sets
# `vars.R2_PUBLISH_ENABLED=true` AND provisions the R2/Cloudflare secrets.
#
# SECURITY MODEL (identical to Pages): R2 (staging and live) is UNTRUSTED transport.
# Integrity comes from the catalog's keyless Sigstore signature, verified IN-BINARY
# against the baked trusted root + pinned ci.yml identity (offline Rekor timestamp).
# The trust boundary is step "verify": the STAGED bytes are fetched over HTTPS and
# run through the real autoSeedCatalog path; promotion to the live pointer happens
# ONLY on a proven-PASS verification, by server-side-copying the exact staged object
# that was verified (ETag-pinned). A tampered/MITM'd/edge-poisoned catalog cannot
# pass verification, so it can never be promoted.
#
# INVARIANTS (pinned by TestWorkflowInvariants, release_workflow_invariants_test.go):
#   - NO `id-token: write` at any level (verify-only; this job never signs).
#   - `contents: read` only; the dormant gate keys on `vars.R2_PUBLISH_ENABLED`,
#     never `secrets.*` (unavailable in `if:` anyway).
#   - verify precedes promote; the verify step proves a non-skip PASS and has no
#     `continue-on-error`; the promote step has no `if: always()` bypass.
#
# Triggers (mirrors publish-catalog-pages.yml): workflow_run after "CI" completes on
# a tag push (the run that ATTACHES the signed bundle), or manual workflow_dispatch.
#
# OWNER ACTIVATION (full runbook: docs/operator/catalog-hosting-r2-activation.md, M0-PR5):
#   vars: R2_PUBLISH_ENABLED=true, R2_PUBLIC_BASE=https://catalog.<domain>
#   secrets: R2_S3_ENDPOINT, R2_S3_ACCESS_KEY_ID, R2_S3_SECRET_ACCESS_KEY,
#            R2_BUCKET, CF_ZONE_ID, CF_CACHE_PURGE_TOKEN
#   The custom domain must publicly serve BOTH history/stable/** (staging, for verify)
#   and release-catalog/** (live). Add the R2 endpoint host + public-base host to the
#   harden-runner allow-list below at activation.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0). Default: latest release."
        required: false
        type: string
      # M1-4: EXACT filename of a versioned re-sign bundle attached by the
      # catalog-resign job (culvert-release-catalog-<tag>-rYYYYMMDD.tar.gz).
      # When set, the run stages to a NEW history prefix (<tag>-rYYYYMMDD — the
      # create-only digest guard for real releases stays intact) and the
      # promote is additionally bound monotonically to the LIVE catalog
      # (SEC-F2b). Exact name by design (OPS-F2): globs must never pick assets.
      resign_asset:
        description: "Re-sign bundle asset name (resign publishes only; exact filename)"
        required: false
        type: string

# Verify-only publisher: read the release bundle, verify, copy within R2. NO id-token.
permissions:
  contents: read

# Serialize R2 publishes; never cancel an in-flight promote.
concurrency:
  group: r2-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish signed catalog to R2 (dormant)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Dormant gate: keyed on a repository VARIABLE (secrets.* is unavailable in `if:`).
    # Absent/!= 'true' => the job is skipped => the workflow is green + neutral, no
    # secret is ever read. When active, only a SUCCESSFUL CI run on a tag push (or a
    # manual dispatch) proceeds; branch/PR CI completions are filtered by the
    # head_branch `v`-prefix guard, and the tag is re-confirmed to be a real tag ref
    # in the "Resolve release tag" step (closes the "branch named v-evil" gap).
    if: >-
      ${{ vars.R2_PUBLISH_ENABLED == 'true' && (
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.event == 'push' &&
             startsWith(github.event.workflow_run.head_branch, 'v'))) }}
    # contents: read only — download release assets via gh + copy within R2. NO id-token.
    permissions:
      contents: read
    steps:
      # Egress lock-down: this job holds R2 write + a CF cache-purge token, so a
      # compromised transitive dependency must not be able to exfiltrate them.
      # egress-policy: block with an allow-list of the static hosts; at activation the
      # owner appends their R2 S3 endpoint host and public-base host (see header).
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            api.cloudflare.com:443
            *.r2.cloudflarestorage.com:443
            catalog.culvertlabs.com:443

      # Check out the DEFAULT BRANCH (the checkout action's default) — NEVER the
      # workflow_run head_sha of an arbitrary push. The verify step compiles and runs
      # package main; checking out an attacker-controlled ref here would be code
      # execution with R2/CF secrets in scope (pwn-request). workflow_run already runs
      # the default-branch copy of this file; we keep the checked-out code in lock-step.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-cache

      # Resolve + STRICTLY validate the target tag. Unlike the Pages publisher (where
      # TAG only feeds `gh release download` and a bad value 404s harmlessly), here TAG
      # is interpolated into an R2 object key and a URL segment, so a loose `v[0-9]*`
      # glob would allow `v1/../../live` path traversal. Anchor to an exact vX.Y.Z
      # shape (no slashes, no `..`), then CONFIRM it is a real tag ref (not a branch
      # named `v…`) before any secret-bearing step runs.
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          IN_TAG: ${{ github.event.inputs.tag }}
          IN_RESIGN_ASSET: ${{ github.event.inputs.resign_asset }}
          WR_TAG: ${{ github.event.workflow_run.head_branch }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="${IN_TAG:-$WR_TAG}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FATAL: refusing tag '$TAG' — not a strict vX.Y.Z release tag"; exit 1
          fi
          # Resolve the tag's TARGET COMMIT (fails for a branch named 'v…'; deref an
          # annotated tag to its commit).
          REF_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG")" \
            || { echo "FATAL: '$TAG' is not a tag ref"; exit 1; }
          OBJ_TYPE="$(printf '%s' "$REF_JSON" | jq -r .object.type)"
          TAG_SHA="$(printf '%s' "$REF_JSON" | jq -r .object.sha)"
          if [ "$OBJ_TYPE" = "tag" ]; then
            TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA" --jq .object.sha)"
          fi
          # For a workflow_run trigger, PROVE the triggering CI run was the tag build,
          # not a push to a branch that merely shares the tag's name (which would
          # re-promote / DOWNGRADE the live catalog). The head_branch `v`-prefix +
          # tag-exists checks alone don't establish this.
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_run" ]; then
            test -n "$WR_SHA" || { echo "FATAL: workflow_run head_sha missing"; exit 1; }
            [ "$TAG_SHA" = "$WR_SHA" ] || {
              echo "FATAL: triggering run sha $WR_SHA != tag $TAG target $TAG_SHA"
              echo "       (a push to a branch named like a tag cannot promote it)"; exit 1
            }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # M1-4 resign publish: validate the EXACT asset name (it becomes an R2
          # key segment — same traversal rules as TAG) and bind it to THIS tag.
          ASSET="culvert-release-catalog-${TAG}.tar.gz"
          SUB="$TAG"
          if [ -n "${IN_RESIGN_ASSET:-}" ]; then
            printf '%s' "$IN_RESIGN_ASSET" | grep -Eq "^culvert-release-catalog-${TAG}-r[0-9]{8}\.tar\.gz$" || {
              echo "FATAL: resign_asset '$IN_RESIGN_ASSET' is not a valid resign bundle name for $TAG"; exit 1
            }
            ASSET="$IN_RESIGN_ASSET"
            SUB="${ASSET#culvert-release-catalog-}"; SUB="${SUB%.tar.gz}"
          fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sub=$SUB"     >> "$GITHUB_OUTPUT"
          echo "Publishing catalog from release $TAG (target $TAG_SHA, asset $ASSET)"

      # Pull the signed bundle attached to the Release and unpack it. Refuse an
      # unsigned bundle (structural precheck only — the TRUST decision is the verify
      # step against the STAGED URL, not this local check).
      # OPS-F2 (M1-4): EXACT-name selection — once resign assets exist, a glob
      # + head -n1 picks the wrong bundle (lexically, `-rYYYYMMDD` sorts BEFORE
      # `.tar.gz`, so a glob would silently publish a resign on the push path
      # and the OLDEST resign on re-sign republish).
      - name: Download + precheck the signed catalog bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET: ${{ steps.tag.outputs.asset }}
        run: |
          set -euo pipefail
          mkdir -p dl stage
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --dir dl
          BUNDLE="dl/$ASSET"
          [ -s "$BUNDLE" ] || { echo "FATAL: asset $ASSET not attached to release $TAG"; exit 1; }
          tar xzf "$BUNDLE" -C stage
          test -s stage/index.json          || { echo "FATAL: bundle missing index.json"; exit 1; }
          test -s stage/index.json.sigstore || { echo "FATAL: bundle missing index.json.sigstore — refusing unsigned"; exit 1; }
          test -d stage/manifests           || { echo "FATAL: bundle missing manifests/"; exit 1; }
          sha256sum stage/index.json | awk '{print $1}' > stage/.index.sha256
          echo "Staged bundle contents:"; ls -R stage

      # Stage to R2 create-only under an immutable per-release prefix. `--if-none-match
      # '*'` makes a re-publish of an existing tag a no-clobber no-op: a same-tag 412
      # (PreconditionFailed) is treated as "already staged, immutable" and we CONTINUE
      # to re-verify + (idempotently) re-promote — so a flaked run can be driven green
      # by a re-run, while a genuinely different upload can never overwrite history.
      - name: Stage bundle to R2 (create-only)
        id: stage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SUB: ${{ steps.tag.outputs.sub }}
        run: |
          set -euo pipefail
          aws --version
          # SUB is <tag> for a release publish, <tag>-rYYYYMMDD for a resign —
          # a NEW immutable prefix per resign, so the create-only digest guard
          # for real releases stays intact (M1-4, design §4).
          PREFIX="history/stable/$SUB"
          put_create_only() { # <local> <key>
            local src="$1" key="$2"
            if aws s3api put-object --bucket "$R2_BUCKET" --key "$key" --body "$src" \
                 --if-none-match '*' --endpoint-url "$R2_S3_ENDPOINT" >/dev/null 2>put_err.txt; then
              return 0
            fi
            if grep -Eqi 'PreconditionFailed|status code: 412' put_err.txt; then
              echo "note: $key already staged (immutable) — continuing"; return 0
            fi
            echo "FATAL: staging $key failed:"; cat put_err.txt; return 1
          }
          put_create_only stage/index.json          "$PREFIX/index.json"
          put_create_only stage/index.json.sigstore "$PREFIX/index.json.sigstore"
          while IFS= read -r m; do
            put_create_only "$m" "$PREFIX/manifests/$(basename "$m")"
          done < <(find stage/manifests -type f)
          # CRITICAL substitution/brick guard: the 412 "already staged" path above
          # trusts a PRE-EXISTING origin object. An actor with R2 write could have
          # pre-placed a DIFFERENT but validly-signed (e.g. stale) catalog at this
          # key; it would verify (real signature) and get promoted — a downgrade/pin
          # attack — and a divergent first upload would brick re-publish forever.
          # Fetch the origin index and assert it byte-matches the bundle THIS run
          # downloaded from the Release, BEFORE verify/promote. Mismatch ⇒ loud abort.
          aws s3api get-object --bucket "$R2_BUCKET" --key "$PREFIX/index.json" \
            --endpoint-url "$R2_S3_ENDPOINT" origin_index.json >/dev/null
          GOT="$(sha256sum origin_index.json | awk '{print $1}')"
          WANT="$(cat stage/.index.sha256)"
          [ "$GOT" = "$WANT" ] || {
            echo "FATAL: staged origin index ($GOT) != release bundle ($WANT) for $SUB"
            echo "       possible substitution or a divergent prior stage — refusing to promote"
            exit 1
          }
          # Bind promote to the exact (now digest-verified) staged object: capture the
          # origin ETag (works whether we just created it or it pre-existed via 412).
          ETAG="$(aws s3api head-object --bucket "$R2_BUCKET" --key "$PREFIX/index.json" \
                    --endpoint-url "$R2_S3_ENDPOINT" --query ETag --output text)"
          test -n "$ETAG" || { echo "FATAL: could not read staged index ETag"; exit 1; }
          echo "etag=$ETAG" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      # THE TRUST BOUNDARY. Fetch the STAGED bytes over HTTPS and drive the real
      # baked-root verifier via TestServedVerify_BakedRootGate. That test t.Skips when
      # the URL is empty and `go test` exits 0 on a skip — a fail-OPEN hazard — so we
      # (1) hard-require the URL in THIS step, and (2) assert the exact test emitted an
      # "Action":"pass" record (fail on skip/no-run). No `continue-on-error`: a verify
      # failure here HARD-STOPS the job before the promote step.
      - name: Verify STAGED catalog through the real baked-root path (must PASS, not skip)
        env:
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          PREFIX: ${{ steps.stage.outputs.prefix }}
        run: |
          set -euo pipefail
          test -n "$R2_PUBLIC_BASE" || { echo "FATAL: R2_PUBLIC_BASE unset"; exit 1; }
          export CULVERT_RELEASE_SERVED_URL="$R2_PUBLIC_BASE/$PREFIX"
          test -n "$CULVERT_RELEASE_SERVED_URL" || { echo "FATAL: served URL unset"; exit 1; }
          echo "Verifying staged catalog at $CULVERT_RELEASE_SERVED_URL"
          go test -json -run '^TestServedVerify_BakedRootGate$' -count=1 . | tee verify.jsonl
          jq -e 'select(.Test=="TestServedVerify_BakedRootGate" and .Action=="pass")' verify.jsonl >/dev/null \
            || { echo "FATAL: baked-root served verify did not PASS (skipped or failed) — refusing to promote"; exit 1; }

      # SEC-F2b (M1-4, BLOCKING): a RESIGN promote must be monotonically bound to
      # the LIVE catalog — a fresh history prefix self-satisfies the create-only
      # digest guard, so without this an old (validly-signed) resign bundle could
      # roll the live pointer BACKWARD (the SEC-F4 appliance ratchet refuses the
      # same-version/older-generated_at replay per appliance, but the public
      # origin would still be pinned stale for NEW installs, whose floor starts
      # empty). Require: staged catalog_version ≥ live; on equality, identical
      # release entries AND a strictly newer generated_at. A missing live index
      # (first publish) passes. Runs AFTER the staged-bytes verify and BEFORE
      # promote; resign runs only.
      #
      # The live index is read from the R2 ORIGIN via authenticated s3api — NOT
      # through the public CDN: Cloudflare ignores a request Cache-Control for
      # edge bypass (this file's own purge step exists because of that), and a
      # BLOCKING control's freshness must not rest on cache semantics (impl
      # review MED). Only a genuine NoSuchKey/404 counts as "first publish";
      # any other read failure fails CLOSED.
      - name: Bind resign promote monotonically to the live catalog (SEC-F2b)
        if: github.event.inputs.resign_asset != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if ! aws s3api get-object --bucket "$R2_BUCKET" --key "release-catalog/index.json" \
                 --endpoint-url "$R2_S3_ENDPOINT" live_index.json >/dev/null 2>get_err.txt; then
            if grep -Eqi 'NoSuchKey|status code: 404|Not Found' get_err.txt; then
              echo "no live catalog at the origin (first publish) — monotonic binding trivially satisfied"; exit 0
            fi
            echo "FATAL: could not read the live origin index (fail-closed):"; cat get_err.txt; exit 1
          fi
          # Idempotent no-op: re-publishing the EXACT live bytes (a same-day
          # retry after a fully successful promote — resign bytes are
          # date-deterministic) is harmless and must stay green; the
          # strictly-newer rule below applies only to DIFFERING content.
          if [ "$(sha256sum live_index.json | awk '{print $1}')" = "$(cat stage/.index.sha256)" ]; then
            echo "staged index is byte-identical to the live index — idempotent re-publish, binding satisfied"; exit 0
          fi
          LIVE_V="$(jq -r '.catalog_version // 0' live_index.json)"
          LIVE_G="$(jq -r '.generated_at // ""' live_index.json)"
          LIVE_R="$(jq -cS '.releases' live_index.json)"
          ST_V="$(jq -r '.catalog_version // 0' stage/index.json)"
          ST_G="$(jq -r '.generated_at // ""' stage/index.json)"
          ST_R="$(jq -cS '.releases' stage/index.json)"
          if [ "$ST_V" -lt "$LIVE_V" ]; then
            echo "FATAL: staged catalog_version $ST_V < live $LIVE_V — a resign must never roll the live catalog back"; exit 1
          fi
          if [ "$ST_V" -eq "$LIVE_V" ]; then
            [ "$ST_R" = "$LIVE_R" ] || {
              echo "FATAL: staged release entries differ from live at the same catalog_version — refusing (not a pure re-sign)"; exit 1
            }
            if ! [ "$(printf '%s\n%s\n' "$LIVE_G" "$ST_G" | sort | tail -n1)" = "$ST_G" ] || [ "$ST_G" = "$LIVE_G" ]; then
              echo "FATAL: staged generated_at ($ST_G) is not strictly newer than live ($LIVE_G) — stale/replayed resign refused"; exit 1
            fi
          fi
          echo "monotonic binding OK: staged v$ST_V/$ST_G vs live v$LIVE_V/$LIVE_G"

      # Promote ONLY on a proven-PASS verify, by server-side-copying the exact staged
      # object that was verified. `--copy-source-if-match <staged ETag>` aborts the
      # copy if the origin diverged from what verify saw (CDN/origin TOCTOU guard); we
      # never re-upload the local artifact. copy-object is per-object (not recursive),
      # and overwriting the live pointer is idempotent across re-runs.
      - name: Promote verified staged bytes to the live pointer (server-side copy)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PREFIX: ${{ steps.stage.outputs.prefix }}
          INDEX_ETAG: ${{ steps.stage.outputs.etag }}
        run: |
          set -euo pipefail
          copy_obj() { # <src-key> <dst-key> [extra-args...]
            local src="$1" dst="$2"; shift 2
            aws s3api copy-object --bucket "$R2_BUCKET" \
              --copy-source "$R2_BUCKET/$src" --key "$dst" \
              --endpoint-url "$R2_S3_ENDPOINT" "$@" >/dev/null
          }
          # Promote sidecars + manifests FIRST; the live index.json (the pointer the
          # CP reads) is the FINAL write, so a client polling mid-promote never sees a
          # new index referencing an old/absent signature or manifest.
          # Manifest set from THIS run's local stage/manifests/ (not a live
          # list-objects-v2, which prints the literal 'None' on empty + caps at 1000).
          while IFS= read -r m; do
            name="$(basename "$m")"
            copy_obj "$PREFIX/manifests/$name" "release-catalog/manifests/$name"
          done < <(find stage/manifests -type f)
          copy_obj "$PREFIX/index.json.sigstore" "release-catalog/index.json.sigstore"
          # Index LAST, ETag-pinned to the verified staged object.
          copy_obj "$PREFIX/index.json" "release-catalog/index.json" --copy-source-if-match "$INDEX_ETAG"

      # Cache-bust the live pointer and confirm the promoted digest is served. Cloudflare
      # purge + re-fetch is eventually consistent and query-string busts are ignored by
      # default, so confirm with an explicit no-cache request + bounded retry.
      - name: Purge CDN cache + confirm live digest
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_CACHE_PURGE_TOKEN: ${{ secrets.CF_CACHE_PURGE_TOKEN }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          WANT="$(cat stage/.index.sha256)"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_CACHE_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[\"$R2_PUBLIC_BASE/release-catalog/index.json\",\"$R2_PUBLIC_BASE/release-catalog/index.json.sigstore\"]}" >/dev/null
          for i in 1 2 3 4 5; do
            GOT="$(curl -fsS -H 'Cache-Control: no-cache' "$R2_PUBLIC_BASE/release-catalog/index.json" | sha256sum | awk '{print $1}')" || GOT=""
            if [ "$GOT" = "$WANT" ]; then echo "live index confirmed ($WANT)"; exit 0; fi
            echo "confirm attempt $i: got '$GOT' want '$WANT' — retrying"; sleep $((i*i))
          done
          echo "FATAL: live index digest did not converge to the promoted digest"; exit 1
