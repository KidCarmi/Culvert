## ─────────────────────────────────────────────────────────────────────────────
## Culvert — Automated Code Review Checks
## ─────────────────────────────────────────────────────────────────────────────
## Runs on every Pull Request.  Provides inline review comments via reviewdog
## so developers see findings directly in the PR diff — not just in CI logs.
##
## ADVISORY ONLY (retirement step 7): blocking lint lives in the Fast PR
## Gate (--new-from-rev). This workflow exists for the inline-comment DX;
## reviewdog also cannot post comments on fork PRs (read-only token), so it
## must not be a hard gate.
## ─────────────────────────────────────────────────────────────────────────────

name: Code Review
# Least-privilege default: jobs that need write scopes (packages, checks,
# contents, security-events, pull-requests) declare them at job level.
permissions:
  contents: read


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: code-review-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. golangci-lint (comprehensive linter with inline PR comments) ────────
  lint:
    name: "Lint · golangci-lint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed for reviewdog inline comments
      checks: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint + reviewdog
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2 # v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review          # inline comments on the diff
          golangci_lint_flags: >-
            --config=.golangci.yml
            --timeout=5m
          filter_mode: diff_context
          # Advisory: the blocking lint verdict is the Fast PR Gate's
          # --new-from-rev run. fail_on_error:true here would also hard-fail
          # fork PRs, where the read-only token can't post review comments.
          fail_on_error: false

  # ─── 2. PR size gate ───────────────────────────────────────────────────────
  pr-size:
    name: "Review · PR size"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Count changed lines
        id: diff
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          ADDED=$(git diff --numstat $BASE..$HEAD -- '*.go' | awk '{s+=$1} END {print s+0}')
          DELETED=$(git diff --numstat $BASE..$HEAD -- '*.go' | awk '{s+=$2} END {print s+0}')
          TOTAL=$((ADDED + DELETED))
          echo "added=$ADDED"    >> $GITHUB_OUTPUT
          echo "deleted=$DELETED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL"     >> $GITHUB_OUTPUT
          echo "### PR Size" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Lines |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Added  | +$ADDED |" >> $GITHUB_STEP_SUMMARY
          echo "| Deleted| -$DELETED |" >> $GITHUB_STEP_SUMMARY
          echo "| Total  | $TOTAL |" >> $GITHUB_STEP_SUMMARY

      - name: Warn on large PR
        if: ${{ fromJson(steps.diff.outputs.total) > 800 }}
        run: |
          echo "::warning::This PR changes ${{ steps.diff.outputs.total }} lines of Go code."
          echo "Consider splitting it into smaller, focused PRs for easier review."

  # ─── 3. Coverage delta — RETIRED (roadmap/CI-REDESIGN.md step 7) ───────────
  # Superseded by the Fast PR Gate's single -race run, which enforces both the
  # global 55% floor and the per-file security floors. The delta job ran the
  # -short suite twice (PR + base) per PR for an advisory signal.

  # ─── 4. Conventional commits check ────────────────────────────────────────
  commits:
    name: "Review · commit messages"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check commit message format
        run: |
          FAIL=0
          while IFS= read -r msg; do
            # Allow: type(scope): description  OR  type: description
            # Types: feat fix chore docs refactor test perf ci build revert security
            if ! echo "$msg" | grep -qP '^(feat|fix|chore|docs|refactor|test|perf|ci|build|revert|security)(\(.+\))?: .{1,100}$'; then
              echo "::warning::Bad commit message: \"$msg\""
              echo "  Expected format: type(scope): description"
              echo "  Types: feat fix chore docs refactor test perf ci build revert security"
              FAIL=1
            fi
          done < <(git log --format=%s ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          # Advisory only — warn but don't block
          exit 0

  # Secrets scanning is handled by the Security Release Gate (gitleaks full
  # history scan). A PR-diff-only scan is strictly a subset — removed to
  # avoid duplicate CI minutes.

  # ─── 5. Build verification — RETIRED (roadmap/CI-REDESIGN.md step 7) ───────
  # Superseded by the Fast PR Gate's hygiene job, which builds the static
  # binary (with ldd assert + arm64 compile check) and runs the same
  # check-only `go mod tidy -diff`.

  # ─── Summary ───────────────────────────────────────────────────────────────
  review-summary:
    name: "✅ Code Review — Complete"
    runs-on: ubuntu-latest
    needs: [lint, pr-size]
    if: always()
    steps:
      - name: Summarise results
        run: |
          echo "## Code Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| golangci-lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR size       | ${{ needs.pr-size.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage delta and build verification moved to the Fast PR Gate" >> $GITHUB_STEP_SUMMARY
          echo "(roadmap/CI-REDESIGN.md, retirement step 7)." >> $GITHUB_STEP_SUMMARY
