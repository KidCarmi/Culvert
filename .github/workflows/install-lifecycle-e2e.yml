name: Install Lifecycle E2E

# Proves the WHOLE system lifecycle driven by the REAL quick-start installer
# (scripts/install.sh) on a real ubuntu-latest VM — high level (does the stack
# install, run, migrate, and upgrade while staying healthy?) AND low level (do
# the installer's own contracts hold: pinned-tag seeding, .env idempotency,
# fresh-vs-existing detection, non-destructive re-run, host-agent install?).
#
# Two independent jobs so a flake in one cannot fail the other:
#   stack-lifecycle  — install.sh brings up the proxy stack, then a second run
#                      migrates idempotently (state preserved), then a pinned
#                      image bump upgrades it (v1 -> v2) preserving /data.
#   agent-installer  — install.sh installs the Maintenance Agent
#                      (packaging/culvert-maint/install.sh); assert the systemd
#                      unit, sudoers grammar, config seeding/migration, and that
#                      the installed unit actually runs and answers /v1/health.
#
# Hermetic w.r.t. Culvert artifacts: a local TLS registry (trusted by the daemon
# via /etc/docker/certs.d) serves two genuinely-distinct proxy image digests;
# clamav is stubbed via an auto-merged docker-compose.override.yml so the run
# needs NO ghcr pulls and NO 250 MB ClamAV signature download. The proxy is the
# REAL culvert/proxy:pinned image, started by the REAL compose file via the REAL
# installer — only the orthogonal sidecar is stubbed. (It does still pull stock Docker Hub base images —
# registry:2, busybox, alpine, golang — which are pre-pulled with retry below.)

on:
  push:
    branches: [main]
    # tags trigger removed (CI review P0-3): auto-tag only tags SHAs that
    # already passed this workflow on the main push — the tag re-run was a
    # full duplicate of the identical commit. Release evidence for tags
    # remains via security-release-gate (tags) + ci.yml catalog gate.
  # Retirement step 2 (roadmap/CI-REDESIGN.md): two 35-minute jobs no longer
  # run on every PR — nightly + main-push carry the continuous
  # signal, and PRs that actually touch the installer surface still trigger it.
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC nightly
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "packaging/**"
      - "cmd/culvert-maint/**"
      - "docker-compose*.yml"
      - "Dockerfile*"
      - "test/e2e/**"
      - ".github/workflows/install-lifecycle-e2e.yml"
  workflow_dispatch:

concurrency:
  # Scheduled runs get their own group: nightlies execute at github.ref =
  # refs/heads/main, so sharing the push group meant a main push and the
  # nightly could cancel each other (CI review P1-6).
  group: install-lifecycle-e2e-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  REGISTRY: 127.0.0.1:5000
  REPO: 127.0.0.1:5000/culvert
  PINNED_TAG: culvert/proxy:pinned
  PROXY_DOCKERFILE: test/e2e/maint-agent/Dockerfile.e2e
  OVERRIDE_SRC: test/e2e/install-lifecycle/docker-compose.override.yml
  # The stack lives under a system path so the unprivileged culvert-maint
  # service can traverse it (install.sh's agent_ancestors_traversable gate) —
  # exactly the appliance layout the installer recommends.
  STACK_DIR: /srv/culvert

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Proxy stack: fresh install -> idempotent migrate -> version upgrade.
  # ───────────────────────────────────────────────────────────────────────────
  stack-lifecycle:
    name: Stack install + migrate + upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Preflight — guard Docker baseline + pre-pull base images
        run: |
          set -euxo pipefail
          docker --version; docker compose version
          dpkg -l 2>/dev/null | grep -E '^ii.*(docker|moby|containerd)' || true
          # install.sh's "cleanup" step would `apt-get remove` moby-engine if
          # present, tearing out the running daemon (and this job's registry)
          # mid-run. Current ubuntu-24.04 ships docker-ce, so the cleanup is
          # inert — but fail LOUDLY if a future runner image regresses to moby.
          if dpkg -l moby-engine 2>/dev/null | grep -q '^ii'; then
            echo "FATAL: runner ships moby-engine; install.sh's cleanup would remove the running Docker. Pin the runner image."; exit 1
          fi
          pull_retry() {
            for i in 1 2 3 4; do
              if docker pull "$1" 1>&2; then return 0; fi
              echo "pull $1 failed (attempt $i) — retrying" 1>&2; sleep $((i * 3))
            done
            echo "FATAL: could not pull $1 after retries"; return 1
          }
          # registry:2 backs the local registry; busybox backs the stubbed
          # sidecars (pulled by `docker compose up` inside install.sh).
          pull_retry registry:2
          pull_retry busybox:stable

      # TLS registry trusted by BOTH the daemon (/etc/docker/certs.d) and the
      # CLI (system CA store) — install.sh's seed step does `docker pull
      # <repo@sha256>` with no --insecure, so the daemon must trust it natively.
      - name: Start TLS local registry (trusted by daemon + CLI)
        run: |
          set -euxo pipefail
          CERT_DIR="$RUNNER_TEMP/registry-certs"
          mkdir -p "$CERT_DIR"
          openssl req -x509 -newkey rsa:4096 -nodes \
            -keyout "$CERT_DIR/registry.key" \
            -out "$CERT_DIR/registry.crt" \
            -days 2 \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1"
          chmod 0644 "$CERT_DIR/registry.crt" "$CERT_DIR/registry.key"
          sudo mkdir -p "/etc/docker/certs.d/127.0.0.1:5000"
          sudo cp "$CERT_DIR/registry.crt" "/etc/docker/certs.d/127.0.0.1:5000/ca.crt"
          sudo cp "$CERT_DIR/registry.crt" /usr/local/share/ca-certificates/registry-e2e.crt
          sudo update-ca-certificates
          docker run -d --restart=always --name registry \
            -p 127.0.0.1:5000:5000 \
            -v "$CERT_DIR:/certs:ro" \
            -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/registry.crt \
            -e REGISTRY_HTTP_TLS_KEY=/certs/registry.key \
            registry:2
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS https://127.0.0.1:5000/v2/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "FATAL: TLS registry did not come up"; docker logs registry 2>&1 | tail -n 50 || true; exit 1; }

      # Two genuinely-distinct proxy images (distinct BUILD_VARIANT -> distinct
      # binary -> distinct registry digest), so the upgrade phase is observable.
      - name: Build, push, capture v1 + v2 proxy digests
        id: images
        run: |
          set -euxo pipefail
          build_push_digest() {
            variant="$1"; tag="$REPO:$variant"
            docker build -f "$PROXY_DOCKERFILE" --build-arg "BUILD_VARIANT=$variant" -t "$tag" . 1>&2
            docker push "$tag" 1>&2
            docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | grep "^${REPO}@sha256:" | head -n1
          }
          D1_REF="$(build_push_digest v1)"
          D2_REF="$(build_push_digest v2)"
          D1="${D1_REF#${REPO}@}"; D2="${D2_REF#${REPO}@}"
          [ -n "$D1" ] && [ -n "$D2" ] || { echo "FATAL: empty digest (D1=$D1 D2=$D2)"; exit 1; }
          [ "$D1" != "$D2" ] || { echo "FATAL: v1 and v2 share a digest ($D1); upgrade would be unobservable"; exit 1; }
          { echo "d1_ref=$D1_REF"; echo "d2_ref=$D2_REF"; } >> "$GITHUB_OUTPUT"

      # Stage the repo at the system path and drop the CI override beside the
      # base compose file (docker compose auto-merges docker-compose.override.yml).
      - name: Stage stack at $STACK_DIR
        run: |
          set -euxo pipefail
          sudo mkdir -p "$STACK_DIR"
          sudo cp -a "$GITHUB_WORKSPACE/." "$STACK_DIR/"
          sudo cp "$STACK_DIR/$OVERRIDE_SRC" "$STACK_DIR/docker-compose.override.yml"
          sudo test -f "$STACK_DIR/docker-compose.yml"
          sudo test -f "$STACK_DIR/scripts/install.sh"

      # ── PHASE 1 — FRESH INSTALL ────────────────────────────────────────────
      # Run the REAL installer as root (the appliance/first-boot path). Seed the
      # pinned tag from the v1 registry digest; skip only the Release-Management
      # auto-wiring (it re-ups compose with explicit -f flags that would bypass
      # our override and pull the heavy sidecars — its runtime is covered by the
      # maint-agent-update E2E). The maintenance-agent INSTALL still runs.
      - name: "Phase 1 — fresh install (scripts/install.sh)"
        run: |
          set -euxo pipefail
          cd "$STACK_DIR"
          # The maintenance-agent install is exercised by the agent-installer job;
          # skip it here to keep the stack lifecycle fast + hermetic (no Go build).
          sudo env "PATH=$PATH" \
            CULVERT_PROXY_SEED_REF="${{ steps.images.outputs.d1_ref }}" \
            CULVERT_SKIP_MAINT_AGENT=1 \
            bash scripts/install.sh </dev/null

      - name: "Phase 1 — assert fresh install (high + low level)"
        run: |
          set -euxo pipefail
          D1_REF="${{ steps.images.outputs.d1_ref }}"

          # High level: proxy serves /health and /ready, admin UI port answers.
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "FATAL: proxy /health did not come up after install"; exit 1; }
          # /ready is EXPECTED to be 503 here: the override stubs ClamAV, so the
          # proxy reports the scanner unreachable and /ready degrades by design.
          # We only assert the endpoint ANSWERS (200 or 503) — a 000 means the
          # server isn't serving at all. (/health is the always-200 liveness gate.)
          rcode="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8080/ready || true)"
          echo "/ready -> HTTP $rcode (503 expected under the ClamAV stub)"
          case "$rcode" in 200|503) : ;; *) echo "FATAL: /ready did not answer (HTTP $rcode)"; exit 1 ;; esac
          code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 https://127.0.0.1:9090/ || true)"
          echo "admin UI :9090 -> HTTP $code"; [ "$code" != "000" ] || { echo "FATAL: admin UI port 9090 did not answer"; exit 1; }

          # Low level: install.sh seeded the FIXED local tag to our v1 digest.
          PINNED_IMG="$(sudo docker image inspect "$PINNED_TAG" --format '{{.Id}}')"
          SEED_IMG="$(sudo docker image inspect "$D1_REF" --format '{{.Id}}')"
          [ "$PINNED_IMG" = "$SEED_IMG" ] || { echo "FATAL: $PINNED_TAG ($PINNED_IMG) != seeded v1 ($SEED_IMG)"; exit 1; }

          # Low level: the running proxy IS the seeded v1 image.
          running_digest() {
            local img; img="$(sudo docker inspect --format '{{.Image}}' culvert 2>/dev/null)"
            sudo docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$img" 2>/dev/null | grep "^${REPO}@sha256:" | head -n1 || true
          }
          RUN="$(running_digest)"; echo "running proxy: $RUN"
          [ "$RUN" = "$D1_REF" ] || { echo "FATAL: proxy not on v1 ($RUN != $D1_REF)"; exit 1; }

          # Low level: .env created mode 600 with BOTH passphrases (fresh path).
          sudo test -f "$STACK_DIR/.env" || { echo "FATAL: .env was not created"; exit 1; }
          PERM="$(sudo stat -c '%a' "$STACK_DIR/.env")"; [ "$PERM" = "600" ] || { echo "FATAL: .env mode is $PERM, want 600"; exit 1; }
          sudo grep -Eq '^CULVERT_CA_PASSPHRASE=.+'  "$STACK_DIR/.env" || { echo "FATAL: CULVERT_CA_PASSPHRASE missing on fresh install"; exit 1; }
          sudo grep -Eq '^CULVERT_LOG_PASSPHRASE=.+' "$STACK_DIR/.env" || { echo "FATAL: CULVERT_LOG_PASSPHRASE missing on fresh install"; exit 1; }

          # Low level: the proxy-data named volume exists.
          sudo docker volume ls --format '{{.Name}}' | grep -Eq '(^|_)proxy-data$' || { echo "FATAL: proxy-data volume not created"; exit 1; }

          # Low level (security invariant): the proxy must NOT mount a Docker socket.
          if sudo docker inspect culvert --format '{{range .Mounts}}{{println .Source}}{{end}}' | grep -Eq '/(var/)?run/docker\.sock'; then
            echo "FATAL: proxy mounts the Docker socket — install must never do this"; exit 1
          fi
          echo "PHASE 1 OK: fresh install healthy; pinned=v1; .env(600,both); no docker.sock."

      # ── PHASE 2 — record migrate invariants + write a /data sentinel ────────
      - name: "Phase 2 — capture invariants + seed sentinel"
        id: capture
        run: |
          set -euxo pipefail
          ENV_SHA="$(sudo sha256sum "$STACK_DIR/.env" | awk '{print $1}')"
          echo "env_sha=$ENV_SHA" >> "$GITHUB_OUTPUT"
          # Persistent marker inside the proxy-data volume — must survive a
          # migrate (idempotent re-run) and the version upgrade.
          SENTINEL="lifecycle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo docker exec culvert sh -c "printf '%s' '$SENTINEL' > /data/e2e_sentinel.txt"
          echo "sentinel=$SENTINEL" >> "$GITHUB_OUTPUT"
          echo "captured env sha=$ENV_SHA sentinel=$SENTINEL"

      # ── PHASE 3 — MIGRATE (idempotent re-run; existing deployment) ──────────
      - name: "Phase 3 — migrate (re-run scripts/install.sh)"
        run: |
          set -euxo pipefail
          cd "$STACK_DIR"
          # Same invocation; the installer must detect the existing deployment
          # and be non-destructive (no reseed, no passphrase rewrite).
          sudo env "PATH=$PATH" \
            CULVERT_PROXY_SEED_REF="${{ steps.images.outputs.d1_ref }}" \
            CULVERT_SKIP_MAINT_AGENT=1 \
            bash scripts/install.sh </dev/null 2>&1 | tee "$RUNNER_TEMP/migrate.log"

      - name: "Phase 3 — assert migrate is non-destructive + idempotent"
        run: |
          set -euxo pipefail
          LOG="$RUNNER_TEMP/migrate.log"

          # The installer recognized the EXISTING deployment (not fresh) and the
          # already-present pinned tag (no reseed).
          grep -q "already present; not reseeding" "$LOG" || { echo "FATAL: re-run reseeded the pinned tag (expected 'not reseeding')"; sed -n '1,200p' "$LOG"; exit 1; }
          # Assert specifically the "already configured" short-circuit — proving
          # NO passphrase was rewritten. (Not the weaker "Existing deployment"
          # line, which prints on a first-time write to an existing volume.)
          grep -q "Encryption passphrase already configured" "$LOG" || { echo "FATAL: re-run did not short-circuit the encryption setup (passphrase may have been rewritten)"; sed -n '1,200p' "$LOG"; exit 1; }

          # .env is byte-for-byte unchanged (passphrase preserved).
          NOW_SHA="$(sudo sha256sum "$STACK_DIR/.env" | awk '{print $1}')"
          [ "$NOW_SHA" = "${{ steps.capture.outputs.env_sha }}" ] || { echo "FATAL: .env changed across migrate ($NOW_SHA != ${{ steps.capture.outputs.env_sha }})"; exit 1; }

          # The /data sentinel survived (volume not recreated/wiped).
          GOT="$(sudo docker exec culvert cat /data/e2e_sentinel.txt 2>/dev/null || true)"
          [ "$GOT" = "${{ steps.capture.outputs.sentinel }}" ] || { echo "FATAL: /data sentinel lost across migrate (got '$GOT')"; exit 1; }

          # Still healthy and still on v1.
          curl -fsS http://127.0.0.1:8080/health >/dev/null || { echo "FATAL: proxy unhealthy after migrate"; exit 1; }
          running_digest() {
            local img; img="$(sudo docker inspect --format '{{.Image}}' culvert 2>/dev/null)"
            sudo docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$img" 2>/dev/null | grep "^${REPO}@sha256:" | head -n1 || true
          }
          [ "$(running_digest)" = "${{ steps.images.outputs.d1_ref }}" ] || { echo "FATAL: proxy digest drifted on idempotent re-run"; exit 1; }
          echo "PHASE 3 OK: migrate preserved .env + /data + version; idempotent."

      # ── PHASE 4 — VERSION UPGRADE (pinned bump v1 -> v2, state preserved) ───
      # The documented operator upgrade: retag the pinned tag to the new digest
      # and `docker compose up -d` (auto-merging the override). /data must carry
      # over unchanged.
      - name: "Phase 4 — upgrade pinned v1 -> v2 and re-up"
        run: |
          set -euxo pipefail
          cd "$STACK_DIR"
          sudo docker tag "${{ steps.images.outputs.d2_ref }}" "$PINNED_TAG"
          sudo docker compose up -d --wait --wait-timeout 180 || sudo docker compose up -d

      - name: "Phase 4 — assert the upgrade flipped + state preserved"
        run: |
          set -euxo pipefail
          D1_REF="${{ steps.images.outputs.d1_ref }}"; D2_REF="${{ steps.images.outputs.d2_ref }}"
          running_digest() {
            local img; img="$(sudo docker inspect --format '{{.Image}}' culvert 2>/dev/null)"
            sudo docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$img" 2>/dev/null | grep "^${REPO}@sha256:" | head -n1 || true
          }
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "FATAL: proxy /health failed after upgrade"; exit 1; }
          RUN="$(running_digest)"; echo "running after upgrade: $RUN"
          [ "$RUN" != "$D1_REF" ] || { echo "FATAL: still on v1 — upgrade did not flip the image"; exit 1; }
          [ "$RUN" = "$D2_REF" ] || { echo "FATAL: running digest is neither v2 nor v1 (got $RUN, want $D2_REF)"; exit 1; }

          # The /data sentinel and .env survived the version upgrade.
          GOT="$(sudo docker exec culvert cat /data/e2e_sentinel.txt 2>/dev/null || true)"
          [ "$GOT" = "${{ steps.capture.outputs.sentinel }}" ] || { echo "FATAL: /data sentinel lost across upgrade (got '$GOT')"; exit 1; }
          NOW_SHA="$(sudo sha256sum "$STACK_DIR/.env" | awk '{print $1}')"
          [ "$NOW_SHA" = "${{ steps.capture.outputs.env_sha }}" ] || { echo "FATAL: .env changed across upgrade"; exit 1; }
          echo "PROOF: install -> migrate -> upgrade (v1->v2) all healthy, /data + .env preserved."

      - name: Diagnostics (always)
        if: always()
        run: |
          set +e
          echo "===== compose ps ====="; ( cd "$STACK_DIR" && sudo docker compose ps -a )
          echo "===== proxy logs (tail) ====="; sudo docker logs culvert 2>&1 | tail -n 150
          echo "===== .env (keys only) ====="; sudo sed -E 's/=.*/=<redacted>/' "$STACK_DIR/.env" 2>/dev/null
          echo "===== volumes ====="; sudo docker volume ls | grep -E 'proxy-data|culvert' 2>/dev/null
          echo "===== images ====="; sudo docker image ls | grep -E 'culvert|registry|busybox' 2>/dev/null

      - name: Teardown (always)
        if: always()
        run: |
          set +e
          ( cd "$STACK_DIR" && sudo docker compose down -v )
          sudo docker rm -f registry culvert 2>/dev/null
          exit 0

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Host-side maintenance-agent installer (the agent half of install.sh).
  # ───────────────────────────────────────────────────────────────────────────
  agent-installer:
    name: Maintenance-agent installer lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-go-cache

      - name: Preflight — guard Docker baseline + pre-pull base images
        run: |
          set -euxo pipefail
          docker --version; docker compose version
          if dpkg -l moby-engine 2>/dev/null | grep -q '^ii'; then
            echo "FATAL: runner ships moby-engine; install.sh's cleanup would remove the running Docker. Pin the runner image."; exit 1
          fi
          for i in 1 2 3 4; do
            if docker pull busybox:stable; then break; fi
            echo "pull busybox failed (attempt $i) — retrying"; sleep $((i * 3))
            [ "$i" = 4 ] && { echo "FATAL: could not pull busybox"; exit 1; }
          done

      # No registry needed here: pre-seed the pinned tag locally so neither
      # install.sh nor the agent installer reaches out to ghcr. The agent build
      # falls back to source (resolve_maint_version is empty for a dev image),
      # which is exactly the air-gapped path we want to exercise.
      - name: Build + locally seed culvert/proxy:pinned
        run: |
          set -euxo pipefail
          docker build -f "$PROXY_DOCKERFILE" --build-arg BUILD_VARIANT=v1 -t "$PINNED_TAG" .
          docker image inspect "$PINNED_TAG" --format 'seeded {{.Id}}'

      - name: Stage stack at $STACK_DIR
        run: |
          set -euxo pipefail
          sudo mkdir -p "$STACK_DIR"
          sudo cp -a "$GITHUB_WORKSPACE/." "$STACK_DIR/"
          sudo cp "$STACK_DIR/$OVERRIDE_SRC" "$STACK_DIR/docker-compose.override.yml"

      # Run the REAL installer. The pinned tag is pre-seeded (no pull); the
      # maintenance agent builds from source and installs via the REAL
      # packaging/culvert-maint/install.sh. Skip only the compose auto-wiring.
      - name: "Install via scripts/install.sh (agent included)"
        run: |
          set -euxo pipefail
          cd "$STACK_DIR"
          # Force the source-build path deterministically: the E2E proxy image
          # carries no release-semver label, so resolve_maint_version is empty
          # and the installer builds from source anyway — pinning it here keeps
          # the agent path stable even if the image later gains a version label
          # (which would otherwise divert to the signed-release download path).
          sudo env "PATH=$PATH" \
            CULVERT_SKIP_RELEASE_AGENT_WIRING=1 \
            CULVERT_MAINT_FORCE_BUILD=1 \
            bash scripts/install.sh </dev/null

      - name: "Assert the agent installer artifacts"
        run: |
          set -euxo pipefail
          # Binary + version.
          command -v culvert-maint >/dev/null || { echo "FATAL: culvert-maint not on PATH"; exit 1; }
          VER="$(culvert-maint --version 2>/dev/null || true)"; echo "agent version: $VER"
          [ -n "$VER" ] || { echo "FATAL: culvert-maint --version produced no output"; exit 1; }

          # Service account.
          getent passwd culvert-maint >/dev/null || { echo "FATAL: culvert-maint user missing"; exit 1; }
          getent group  culvert-maint >/dev/null || { echo "FATAL: culvert-maint group missing"; exit 1; }

          # systemd unit + sudoers grammar.
          sudo test -f /etc/systemd/system/culvert-maint.service || { echo "FATAL: systemd unit missing"; exit 1; }
          sudo test -f /etc/sudoers.d/culvert-maint || { echo "FATAL: sudoers drop-in missing"; exit 1; }
          sudo visudo -c -f /etc/sudoers.d/culvert-maint || { echo "FATAL: sudoers drop-in fails visudo -c"; exit 1; }

          # Config seeded + migrated: compose_project_dir points at THIS stack,
          # socket_path is the managed runtime-dir path (not the old default).
          CFG=/etc/culvert-maint/config.toml
          sudo test -f "$CFG" || { echo "FATAL: $CFG missing"; exit 1; }
          sudo grep -Eq "^compose_project_dir = \"$STACK_DIR\"" "$CFG" || { echo "FATAL: compose_project_dir not pointed at $STACK_DIR"; sudo grep -n compose_project_dir "$CFG"; exit 1; }
          sudo grep -Eq '^socket_path = "/run/culvert-maint/culvert-maint\.sock"' "$CFG" || { echo "FATAL: socket_path not migrated to the managed runtime dir"; sudo grep -n socket_path "$CFG"; exit 1; }
          echo "AGENT INSTALL OK: binary+unit+sudoers+config all present and bound to $STACK_DIR."

      # Prove the INSTALLED unit actually runs and serves /v1. The agent's
      # socket is mode 0660 owned by the culvert-maint service user, so we
      # connect as ROOT (which bypasses the socket's DAC perms) and authorize
      # root's UID (0) in allow_peers — SO_PEERCRED then sees UID 0 and admits
      # it. (install.sh leaves the service stopped when wiring is skipped; the
      # real wiring path authorizes the proxy container's UID + group instead.
      # The SO_PEERCRED matrix has its own unit tests; this is a liveness smoke.)
      - name: "Start the installed unit + assert /v1 health"
        run: |
          set -euxo pipefail
          CFG=/etc/culvert-maint/config.toml
          SOCK=/run/culvert-maint/culvert-maint.sock
          sudo sed -i 's|^allow_peers = .*|allow_peers = ["0"]|' "$CFG"
          sudo grep -n '^allow_peers' "$CFG"
          sudo systemctl enable --now culvert-maint
          ok=""
          for i in $(seq 1 30); do
            if sudo test -S "$SOCK" && sudo curl -fsS --unix-socket "$SOCK" http://localhost/v1/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "FATAL: installed unit did not answer /v1/health"
            sudo systemctl status culvert-maint --no-pager -l 2>&1 | tail -n 40 || true
            sudo journalctl -u culvert-maint --no-pager -n 60 2>&1 || true
            exit 1
          fi
          echo "----- /v1/health -----"; sudo curl -fsS --unix-socket "$SOCK" http://localhost/v1/health; echo
          echo "----- /v1/status -----"; sudo curl -fsS --unix-socket "$SOCK" http://localhost/v1/status; echo
          sudo systemctl is-active --quiet culvert-maint || { echo "FATAL: culvert-maint not active"; exit 1; }
          echo "AGENT RUNTIME OK: installed unit is active and serves /v1 over the UDS."

      # Sandbox-vs-sudo regression guard. privilege_mode=sudoers runs every
      # Docker op via `sudo -n`, which FAILS under NoNewPrivileges. A hardening
      # option that implies NoNewPrivileges for a User= service (any seccomp-
      # backed option) — or an empty CapabilityBoundingSet inherited across exec
      # — silently breaks EVERY privileged op while /v1/health + unit-active keep
      # passing (the exact blind spot that shipped the original field failure).
      # Assert the RUNNING unit's process has neither condition, so a future
      # sandbox tightening that re-breaks sudo fails HERE instead of in the field.
      - name: "Assert the sandboxed unit can still escalate via sudo"
        run: |
          set -euxo pipefail
          PID="$(sudo systemctl show -p MainPID --value culvert-maint)"
          [ -n "$PID" ] && [ "$PID" != "0" ] || { echo "FATAL: no MainPID for culvert-maint"; exit 1; }
          NNP="$(sudo awk '/^NoNewPrivs:/{print $2}' "/proc/$PID/status")"
          CAPBND="$(sudo awk '/^CapBnd:/{print $2}' "/proc/$PID/status")"
          echo "culvert-maint pid=$PID NoNewPrivs=$NNP CapBnd=$CAPBND"
          if [ "$NNP" != "0" ]; then
            echo "FATAL: culvert-maint runs with NoNewPrivs=$NNP — 'sudo -n docker' cannot escalate,"
            echo "so every privileged agent op (apply/rollback/backup/ps) would fail. A sandbox option"
            echo "in packaging/systemd/culvert-maint.service is implying NoNewPrivileges; remove it."
            exit 1
          fi
          if [ "$CAPBND" = "0000000000000000" ]; then
            echo "FATAL: culvert-maint has an EMPTY capability bounding set — inherited across exec,"
            echo "this leaves setuid sudo with no capabilities and breaks privileged ops. Do not clamp"
            echo "CapabilityBoundingSet in packaging/systemd/culvert-maint.service."
            exit 1
          fi
          echo "SANDBOX OK: NoNewPrivs=0 and CapBnd is non-empty — sudo-based privileged ops can escalate."

      # END-TO-END privileged op through the SANDBOXED unit. The NoNewPrivs guard
      # above proves sudo *can* escalate; this proves a real `sudo -n docker
      # compose --profile cli run` op driven through the agent's /v1 API actually
      # SUCCEEDS under the full sandbox (ProtectSystem=strict, ProtectHome,
      # PrivateTmp, ReadWritePaths). An unencrypted backup is the lightest
      # privileged op: read-only w.r.t. the stack, no image pull, no passphrase,
      # and it's the NOPASSWD-allowlisted `--backup /backup/*` sudoers entry.
      # This is the coverage the original NoNewPrivileges failure slipped through
      # (unit-active + /v1/health both passed while every privileged op broke).
      - name: "E2E: real privileged backup op through the sandboxed agent"
        run: |
          set -euxo pipefail
          SOCK=/run/culvert-maint/culvert-maint.sock
          FN="e2e-sandbox-${{ github.run_id }}.tar.gz"
          RESP="$(sudo curl -fsS --unix-socket "$SOCK" -H 'Content-Type: application/json' -X POST \
            -d "{\"filename\":\"$FN\",\"encrypt\":false}" \
            http://localhost/v1/backups)"
          echo "backup response: $RESP"
          OP_ID="$(printf '%s' "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin)["op_id"])')"
          [ -n "$OP_ID" ] || { echo "FATAL: no op_id from /v1/backups"; exit 1; }
          STATE=""
          for i in $(seq 1 90); do
            OP_JSON="$(sudo curl -fsS --unix-socket "$SOCK" "http://localhost/v1/operations/$OP_ID" || true)"
            STATE="$(printf '%s' "$OP_JSON" | python3 -c 'import sys,json;d=sys.stdin.read();print(json.loads(d).get("state","") if d.strip() else "")' 2>/dev/null || true)"
            echo "poll $i: state=$STATE"
            case "$STATE" in succeeded|failed|cancelled) break;; esac
            sleep 2
          done
          echo "----- op log -----"; sudo curl -fsS --unix-socket "$SOCK" "http://localhost/v1/operations/$OP_ID/logs" || true
          if [ "$STATE" != "succeeded" ]; then
            echo "FATAL: privileged backup op did not succeed under the sandboxed unit (state=$STATE)."
            echo "If the op log shows a sudo/NoNewPrivileges error, the systemd sandbox is blocking"
            echo "sudo escalation; if it shows a compose/cli error, the stack/profile setup is off."
            sudo journalctl -u culvert-maint --no-pager -n 60 2>&1 || true
            exit 1
          fi
          BACKUPS="$(sudo curl -fsS --unix-socket "$SOCK" http://localhost/v1/backups)"
          echo "backups: $BACKUPS"
          echo "$BACKUPS" | jq -e --arg fn "$FN" \
            '[.[] | select(.filename==$fn and (.size_bytes//0)>0)] | length>0' >/dev/null \
            || { echo "FATAL: backup $FN not listed as non-empty by the agent"; exit 1; }
          echo "E2E PRIVILEGED OP OK: sudo docker compose backup succeeded through the sandboxed unit."

      # Verify-stage sudoers grammar guard. The upgrade's capture/verify stage
      # runs `docker inspect --format {{json .Image}} <cid>` via `sudo -n` AS the
      # unprivileged culvert-maint user. `{{json .Image}}` is ONE argv token that
      # contains a space; the sudoers rule MUST backslash-escape that space
      # (`{{json\ .Image}}`). A double-quoted form silently misses, `sudo -n`
      # demands a password, and EVERY upgrade dies at verify with "a password is
      # required" — the exact field failure. The backup op above cannot catch it
      # (different sudoers rule), so reproduce the verify call EXACTLY here,
      # repo-independently (the inspect rule is a container-id wildcard, not
      # repo-bound), and assert it escalates and returns the image config digest.
      - name: "Assert the verify-stage docker-inspect escalates through sudoers"
        run: |
          set -euxo pipefail
          # The proxy container `culvert` is up (install.sh ran `compose up`, with
          # clamav stubbed by the override). Inspect the SAME identifier shape the
          # agent uses: the full 64-hex container id (the sudoers rule covers 12–64).
          CID="$(sudo docker inspect --format '{{.Id}}' culvert)"
          echo "culvert container id: $CID"
          case "$CID" in [0-9a-f]*) : ;; *) echo "FATAL: unexpected container id '$CID'"; exit 1 ;; esac
          # EXACT verify-stage call, as culvert-maint, non-interactive sudo. On a
          # correct sudoers grammar this escalates NOPASSWD and prints the image
          # config digest as a JSON string ("sha256:<64hex>"). On the broken
          # double-quote grammar, `sudo -n` fails with a non-zero exit.
          if ! OUT="$(sudo -u culvert-maint sudo -n /usr/bin/docker inspect --format '{{json .Image}}' "$CID" 2>&1)"; then
            echo "FATAL: 'sudo -n docker inspect --format {{json .Image}}' did NOT escalate for culvert-maint."
            echo "sudo output: $OUT"
            echo "The sudoers container-inspect rule is not matching — it must backslash-escape the"
            echo "space in {{json\\ .Image}} (containerInspectSudoersLines). This is the verify-stage"
            echo "failure that breaks every upgrade with 'a password is required'."
            echo "----- rendered sudoers drop-in -----"; sudo cat /etc/sudoers.d/culvert-maint 2>/dev/null || true
            exit 1
          fi
          echo "inspect output: $OUT"
          printf '%s\n' "$OUT" | grep -qE '^"sha256:[0-9a-f]{64}"$' \
            || { echo "FATAL: verify inspect escalated but did not return an image config digest: $OUT"; exit 1; }
          echo "VERIFY SUDOERS OK: culvert-maint runs the verify-stage docker inspect NOPASSWD and gets the image digest."

      # Passwd-less health-probe guard. The Release-Management wiring verifies the
      # agent is reachable by impersonating the PROXY container's UID, which on
      # the host usually has NO /etc/passwd entry (e.g. UID 100). The field bug:
      # `sudo -u "#100"` failed with "unknown user" and was misread as the agent
      # denying the UID, so wiring aborted ("Agent unreachable"). The fix probes
      # with `true` first, then falls back to setpriv (util-linux), which switches
      # to arbitrary numeric IDs with no passwd entry. Run the REAL install.sh
      # probe function against the live socket as a UID that genuinely has no
      # passwd entry, and assert it reaches /v1/health via the setpriv path.
      - name: "Assert the health probe reaches a passwd-less proxy UID"
        run: |
          set -euxo pipefail
          SOCK=/run/culvert-maint/culvert-maint.sock
          CFG=/etc/culvert-maint/config.toml
          PLUID=61234   # high UID with no /etc/passwd entry — like an in-container proxy UID
          if getent passwd "$PLUID" >/dev/null; then echo "FATAL: precondition — UID $PLUID unexpectedly has a passwd entry"; exit 1; fi
          command -v setpriv >/dev/null || { echo "FATAL: setpriv (util-linux) missing — the passwd-less fallback cannot work"; exit 1; }
          # The probe's 2nd arg is the GID used for socket access (the real caller
          # passes the culvert-maint group GID, not a second UID). The agent socket
          # is 0660 culvert-maint:culvert-maint, so the probe must run with THAT gid
          # or connect() is denied by DAC before SO_PEERCRED is ever consulted.
          MAINT_GID="$(getent group culvert-maint | awk -F: '{print $3}')"
          [ -n "$MAINT_GID" ] || { echo "FATAL: culvert-maint group not found"; exit 1; }
          # Authorize that UID so SO_PEERCRED admits the peer, then restart so the
          # agent reloads allow_peers (config is read once at startup).
          sudo sed -i "s|^allow_peers = .*|allow_peers = [\"$PLUID\"]|" "$CFG"
          sudo systemctl restart culvert-maint
          for i in $(seq 1 30); do if sudo test -S "$SOCK"; then break; fi; sleep 1; done
          # Extract the REAL probe function and run it as root (exactly how
          # install.sh calls it) against the live socket for the passwd-less UID.
          # The function calls the install.sh `warn` helper in its failure path;
          # stub it so the extracted function is self-contained.
          printf 'warn() { echo "$*" >&2; }\n' > "$RUNNER_TEMP/probe_fn.sh"
          awk '/^verify_maint_agent_health_as_proxy_uid\(\) \{/{f=1} f{print} f&&/^\}/{exit}' scripts/install.sh >> "$RUNNER_TEMP/probe_fn.sh"
          echo 'verify_maint_agent_health_as_proxy_uid "$1" "$2" "$3" && echo PROBE_OK || echo PROBE_FAIL' >> "$RUNNER_TEMP/probe_fn.sh"
          OUT="$(sudo bash "$RUNNER_TEMP/probe_fn.sh" "$PLUID" "$MAINT_GID" "$SOCK" || true)"
          echo "probe result: $OUT"
          case "$OUT" in
            *PROBE_OK*) : ;;
            *) echo "FATAL: verify_maint_agent_health_as_proxy_uid failed for the passwd-less UID $PLUID —"
               echo "the setpriv fallback for a UID with no /etc/passwd entry regressed (the 'unknown user'"
               echo "field bug that surfaced as 'Agent unreachable')."
               sudo journalctl -u culvert-maint --no-pager -n 40 2>&1 || true
               exit 1 ;;
          esac
          # Restore the root peer so the remaining steps (idempotency re-run) work.
          sudo sed -i 's|^allow_peers = .*|allow_peers = ["0"]|' "$CFG"
          sudo systemctl restart culvert-maint
          for i in $(seq 1 30); do if sudo test -S "$SOCK" && sudo curl -fsS --unix-socket "$SOCK" http://localhost/v1/health >/dev/null 2>&1; then break; fi; sleep 1; done
          echo "PASSWD-LESS PROBE OK: the health probe reached the socket as a UID with no passwd entry (setpriv path)."

      # Idempotent re-run: the installer must leave the already-installed agent
      # unchanged (no rebuild/reinstall churn).
      - name: "Re-run installer — assert agent idempotency"
        run: |
          set -euxo pipefail
          cd "$STACK_DIR"
          sudo env "PATH=$PATH" CULVERT_SKIP_RELEASE_AGENT_WIRING=1 CULVERT_MAINT_FORCE_BUILD=1 \
            bash scripts/install.sh </dev/null 2>&1 | tee "$RUNNER_TEMP/agent-rerun.log"
          # ASCII-only match (the installer's full line ends with an em-dash tail
          # we deliberately do not depend on): either "already at <ver>" or the
          # "cannot resolve a target version" branch proves it left things alone.
          grep -Eq "Maintenance agent already at|cannot resolve a target version" "$RUNNER_TEMP/agent-rerun.log" \
            || { echo "FATAL: re-run did not report the agent as already-installed/unchanged"; sed -n '1,200p' "$RUNNER_TEMP/agent-rerun.log"; exit 1; }
          sudo systemctl is-active --quiet culvert-maint || { echo "FATAL: agent not active after re-run"; exit 1; }
          echo "AGENT IDEMPOTENT OK: re-run left the installed agent unchanged + active."

      - name: Diagnostics (always)
        if: always()
        run: |
          set +e
          echo "===== agent --version ====="; culvert-maint --version
          echo "===== config.toml ====="; sudo cat /etc/culvert-maint/config.toml 2>/dev/null
          echo "===== sudoers drop-in ====="; sudo cat /etc/sudoers.d/culvert-maint 2>/dev/null
          echo "===== systemctl status ====="; sudo systemctl status culvert-maint --no-pager -l 2>&1 | tail -n 40
          echo "===== journal (tail) ====="; sudo journalctl -u culvert-maint --no-pager -n 80 2>&1

      - name: Teardown (always)
        if: always()
        run: |
          set +e
          # Hosted runners are ephemeral, so this is belt-and-suspenders — but
          # clean the installed host state fully so a (hypothetical) self-hosted
          # runner is not poisoned for the next run's idempotency assertions.
          sudo systemctl disable --now culvert-maint 2>/dev/null
          ( cd "$STACK_DIR" && sudo docker compose down -v )
          sudo docker rm -f culvert 2>/dev/null
          sudo rm -f /etc/sudoers.d/culvert-maint /etc/systemd/system/culvert-maint.service /usr/local/bin/culvert-maint
          sudo rm -rf /etc/culvert-maint /var/lib/culvert-maint
          sudo systemctl daemon-reload 2>/dev/null
          sudo userdel culvert-maint 2>/dev/null
          sudo groupdel culvert-maint 2>/dev/null
          exit 0

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Day-2 agent upgrade through the REAL production privilege boundary.
  # Installs the maintenance agent with the REAL scripts/install.sh (systemd
  # unit + sandbox + unprivileged culvert-maint user + REAL rendered sudoers),
  # then drives a REAL /v1/upgrades/apply v1->v2. Because the agent runs as the
  # culvert-maint service user in privilege_mode=sudoers, EVERY docker op in the
  # apply flow — including the VERIFY stage's
  #   sudo -n docker inspect --format {{json .Image}} <cid>
  # — actually traverses the on-disk /etc/sudoers.d/culvert-maint. This is the
  # coverage gap the bare-as-root maint-agent-update-e2e.yml cannot exercise
  # (sudoers quoting / NoNewPrivileges bugs shipped through it). The agent is
  # bound to the local TLS registry so its sudoers pull/tag rules match, and the
  # compose override is wired via compose_override_file so the agent's own
  # `restart` recreate keeps the ClamAV stub (an explicit `-f` suppresses the
  # docker-compose.override.yml auto-merge).
  # ───────────────────────────────────────────────────────────────────────────
  agent-day2-update:
    name: Agent day-2 upgrade through real sudoers
    runs-on: ubuntu-latest
    # ADVISORY while this brand-new job is stabilized: binding the agent to a
    # LOCAL registry (proxy_repo=127.0.0.1:5000/culvert) exposed a wrinkle in the
    # packaging installer's sudoers render/validate that the default ghcr.io repo
    # does not hit (first run left the systemd unit + sudoers uninstalled). The
    # deterministic real-boundary guards that carry the coverage weight live in
    # the agent-installer job (verify-stage inspect + passwd-less probe) and the
    # Go traversability tests, which stay hard gates. Flip this off once the
    # local-registry install path is fixed.
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-go-cache

      - name: Preflight — guard Docker baseline + pre-pull base images
        run: |
          set -euxo pipefail
          docker --version; docker compose version
          if dpkg -l moby-engine 2>/dev/null | grep -q '^ii'; then
            echo "FATAL: runner ships moby-engine; install.sh's cleanup would remove the running Docker. Pin the runner image."; exit 1
          fi
          pull_retry() {
            for i in 1 2 3 4; do
              if docker pull "$1" 1>&2; then return 0; fi
              echo "pull $1 failed (attempt $i) — retrying" 1>&2; sleep $((i * 3))
            done
            echo "FATAL: could not pull $1 after retries"; return 1
          }
          pull_retry registry:2
          pull_retry busybox:stable

      # TLS registry trusted by BOTH the daemon (/etc/docker/certs.d) and the
      # CLI/system CA store. The agent's resolve_target runs
      # `docker manifest inspect --verbose` (a CLI TLS call, no --insecure), and
      # the sudo'd docker runs AS ROOT, so root's CLI must trust the registry via
      # the system CA store — hence update-ca-certificates, not just certs.d.
      - name: Start TLS local registry (trusted by daemon + CLI)
        run: |
          set -euxo pipefail
          CERT_DIR="$RUNNER_TEMP/registry-certs"
          mkdir -p "$CERT_DIR"
          openssl req -x509 -newkey rsa:4096 -nodes \
            -keyout "$CERT_DIR/registry.key" \
            -out "$CERT_DIR/registry.crt" \
            -days 2 \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1"
          chmod 0644 "$CERT_DIR/registry.crt" "$CERT_DIR/registry.key"
          sudo mkdir -p "/etc/docker/certs.d/127.0.0.1:5000"
          sudo cp "$CERT_DIR/registry.crt" "/etc/docker/certs.d/127.0.0.1:5000/ca.crt"
          sudo cp "$CERT_DIR/registry.crt" /usr/local/share/ca-certificates/registry-e2e.crt
          sudo update-ca-certificates
          docker run -d --restart=always --name registry \
            -p 127.0.0.1:5000:5000 \
            -v "$CERT_DIR:/certs:ro" \
            -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/registry.crt \
            -e REGISTRY_HTTP_TLS_KEY=/certs/registry.key \
            registry:2
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS https://127.0.0.1:5000/v2/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "FATAL: TLS registry did not come up"; docker logs registry 2>&1 | tail -n 50 || true; exit 1; }

      # Two genuinely-distinct proxy images (distinct BUILD_VARIANT -> distinct
      # binary -> distinct registry digest), so the upgrade is observable.
      - name: Build, push, capture v1 + v2 proxy digests
        id: images
        run: |
          set -euxo pipefail
          build_push_digest() {
            variant="$1"; tag="$REPO:$variant"
            docker build -f "$PROXY_DOCKERFILE" --build-arg "BUILD_VARIANT=$variant" -t "$tag" . 1>&2
            docker push "$tag" 1>&2
            docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | grep "^${REPO}@sha256:" | head -n1
          }
          D1_REF="$(build_push_digest v1)"
          D2_REF="$(build_push_digest v2)"
          D1="${D1_REF#${REPO}@}"; D2="${D2_REF#${REPO}@}"
          [ -n "$D1" ] && [ -n "$D2" ] || { echo "FATAL: empty digest (D1=$D1 D2=$D2)"; exit 1; }
          [ "$D1" != "$D2" ] || { echo "FATAL: v1 and v2 share a digest ($D1); upgrade would be unobservable"; exit 1; }
          { echo "d1_ref=$D1_REF"; echo "d2_ref=$D2_REF"; } >> "$GITHUB_OUTPUT"

      # Seed the FIXED local tag to v1 so install.sh's `docker compose up` starts
      # the proxy on v1. install.sh sees the tag present -> "not reseeding".
      - name: Seed culvert/proxy:pinned = v1
        run: |
          set -euxo pipefail
          docker tag "${{ steps.images.outputs.d1_ref }}" "$PINNED_TAG"
          docker image inspect "$PINNED_TAG" --format 'seeded {{.Id}}'

      - name: Stage stack at $STACK_DIR
        run: |
          set -euxo pipefail
          sudo mkdir -p "$STACK_DIR"
          sudo cp -a "$GITHUB_WORKSPACE/." "$STACK_DIR/"
          sudo cp "$STACK_DIR/$OVERRIDE_SRC" "$STACK_DIR/docker-compose.override.yml"
          sudo test -f "$STACK_DIR/docker-compose.yml"
          sudo test -f "$STACK_DIR/scripts/install.sh"

      # Bind the agent to the local registry BEFORE install: the packaging
      # installer seeds /etc/culvert-maint/config.toml from this example and
      # renders sudoers from proxy_repo, so the sudoers pull/tag rules match the
      # registry the apply pulls from. Also:
      #  - compose_override_file: the agent's `restart` recreates with an
      #    EXPLICIT `-f`, which suppresses the docker-compose.override.yml
      #    auto-merge; wiring it as the second `-f` keeps the ClamAV stub so the
      #    recreate doesn't pull the real 250 MB clamav image.
      #  - ready_path=/health: the ClamAV stub makes /ready 503 by design, and
      #    the agent's health gate gates on /ready 2xx; point readiness at the
      #    always-200 /health so the op reaches the verify stage (the coverage
      #    target). The sudoers-gated verify inspect is unaffected by this knob.
      - name: Bind agent config to the local registry + override
        run: |
          set -euxo pipefail
          CFGX="$STACK_DIR/packaging/culvert-maint/config.example.toml"
          sudo test -f "$CFGX"
          # Remove the active keys we are about to redefine (avoid TOML dup keys).
          sudo sed -i -e '/^proxy_repo = /d' -e '/^image_allowlist = /d' -e '/^ready_path = /d' "$CFGX"
          # Append E2E-bound values. Quoted heredoc: no shell expansion, so the
          # backslashes and the single-quoted TOML literal survive verbatim.
          sudo tee -a "$CFGX" >/dev/null <<'EOF'

          # install-lifecycle E2E: bind to the local TLS registry + keep the CI stubs
          proxy_repo = "127.0.0.1:5000/culvert"
          image_allowlist = '^127\.0\.0\.1:5000/culvert(:[A-Za-z0-9._-]+|@sha256:[a-f0-9]{64})$'
          compose_override_file = "docker-compose.override.yml"
          ready_path = "/health"
          EOF
          echo "----- appended agent config -----"
          sudo tail -n 8 "$CFGX"

      # Run the REAL installer: agent INCLUDED (build from source, deterministic),
      # only the Release-Management compose auto-wiring skipped (it re-ups with
      # explicit -f flags that bypass our override and pull heavy sidecars).
      - name: Install via scripts/install.sh (agent included)
        run: |
          set -euxo pipefail
          cd "$STACK_DIR"
          sudo env "PATH=$PATH" \
            CULVERT_SKIP_RELEASE_AGENT_WIRING=1 \
            CULVERT_MAINT_FORCE_BUILD=1 \
            bash scripts/install.sh </dev/null

      - name: Assert proxy on v1 + agent installed and bound
        run: |
          set -euxo pipefail
          D1_REF="${{ steps.images.outputs.d1_ref }}"
          running_digest() {
            local img; img="$(sudo docker inspect --format '{{.Image}}' culvert 2>/dev/null)"
            sudo docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$img" 2>/dev/null | grep "^${REPO}@sha256:" | head -n1 || true
          }
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "FATAL: proxy /health did not come up after install"; exit 1; }
          RUN="$(running_digest)"; echo "running proxy (expect v1): $RUN"
          [ "$RUN" = "$D1_REF" ] || { echo "FATAL: proxy not on v1 ($RUN != $D1_REF)"; exit 1; }

          # Agent artifacts + registry binding rendered into the REAL sudoers.
          command -v culvert-maint >/dev/null || { echo "FATAL: culvert-maint not on PATH"; exit 1; }
          sudo test -f /etc/systemd/system/culvert-maint.service || { echo "FATAL: systemd unit missing"; exit 1; }
          sudo test -f /etc/sudoers.d/culvert-maint || { echo "FATAL: sudoers drop-in missing"; exit 1; }
          sudo visudo -c -f /etc/sudoers.d/culvert-maint || { echo "FATAL: sudoers drop-in fails visudo -c"; exit 1; }
          sudo grep -Eq '^proxy_repo = "127\.0\.0\.1:5000/culvert"' /etc/culvert-maint/config.toml \
            || { echo "FATAL: agent proxy_repo not bound to the local registry"; sudo grep -n proxy_repo /etc/culvert-maint/config.toml; exit 1; }
          # The registry repo must be the sudoers pull/tag boundary literal.
          sudo grep -q '127.0.0.1:5000/culvert@sha256' /etc/sudoers.d/culvert-maint \
            || { echo "FATAL: sudoers pull/tag rule not bound to the local registry repo"; exit 1; }
          echo "PRECONDITION OK: proxy on v1; agent installed; sudoers bound to the local registry."

      # Start the INSTALLED unit (install.sh leaves it stopped when wiring is
      # skipped). The socket is 0660 owned by the service user; connect as ROOT
      # (DAC-bypass) and authorize UID 0 in allow_peers so SO_PEERCRED admits it.
      # The agent still RUNS as culvert-maint, so its docker ops still go through
      # `sudo -n` + the rendered sudoers — that is the boundary under test.
      - name: Start the installed unit + assert /v1 health
        run: |
          set -euxo pipefail
          CFG=/etc/culvert-maint/config.toml
          SOCK=/run/culvert-maint/culvert-maint.sock
          sudo sed -i 's|^allow_peers = .*|allow_peers = ["0"]|' "$CFG"
          sudo grep -n '^allow_peers' "$CFG"
          sudo systemctl enable --now culvert-maint
          ok=""
          for i in $(seq 1 30); do
            if sudo test -S "$SOCK" && sudo curl -fsS --unix-socket "$SOCK" http://localhost/v1/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "FATAL: installed unit did not answer /v1/health"
            sudo systemctl status culvert-maint --no-pager -l 2>&1 | tail -n 40 || true
            sudo journalctl -u culvert-maint --no-pager -n 60 2>&1 || true
            exit 1
          fi
          echo "----- /v1/status -----"; sudo curl -fsS --unix-socket "$SOCK" http://localhost/v1/status; echo
          sudo systemctl is-active --quiet culvert-maint || { echo "FATAL: culvert-maint not active"; exit 1; }

      # THE COVERAGE: drive a REAL upgrade v1->v2 through the sandboxed unit +
      # real sudoers. capture_before / resolve_target / pull / restart /
      # health_gate / verify each run `sudo -n docker …` as culvert-maint.
      - name: Drive the update (apply v2) through sudoers + poll to terminal
        id: apply
        run: |
          set -euxo pipefail
          SOCK=/run/culvert-maint/culvert-maint.sock
          TARGET_REF="${{ steps.images.outputs.d2_ref }}"
          APPLY_RESP="$(sudo curl -fsS --unix-socket "$SOCK" \
            -H 'Content-Type: application/json' -X POST \
            -d "{\"image_ref\":\"$TARGET_REF\"}" \
            http://localhost/v1/upgrades/apply)"
          echo "apply response: $APPLY_RESP"
          OP_ID="$(printf '%s' "$APPLY_RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin)["op_id"])')"
          [ -n "$OP_ID" ] || { echo "FATAL: no op_id in apply response"; exit 1; }
          echo "op_id=$OP_ID"
          STATE=""; OP_JSON=""
          for i in $(seq 1 120); do
            OP_JSON="$(sudo curl -fsS --unix-socket "$SOCK" "http://localhost/v1/operations/$OP_ID" || true)"
            STATE="$(printf '%s' "$OP_JSON" | python3 -c 'import sys,json; d=sys.stdin.read(); print((json.loads(d).get("state","") if d.strip() else ""))' 2>/dev/null || true)"
            echo "poll $i: state=$STATE"
            case "$STATE" in succeeded|failed|cancelled) break ;; esac
            sleep 2
          done
          echo "----- final op record -----"
          printf '%s\n' "$OP_JSON" | python3 -m json.tool || printf '%s\n' "$OP_JSON"
          echo "----- op log -----"
          sudo curl -fsS --unix-socket "$SOCK" "http://localhost/v1/operations/$OP_ID/logs" || true
          if [ "$STATE" != "succeeded" ]; then
            echo "FATAL: apply op did not succeed through the sandboxed+sudoers unit (state=$STATE)."
            echo "A sudo/NoNewPrivileges error in the op log means the sandbox blocks escalation;"
            echo "a compose/docker error means the sudoers grammar or registry binding is off."
            sudo journalctl -u culvert-maint --no-pager -n 80 2>&1 || true
            exit 1
          fi
          echo "op_id=$OP_ID" >> "$GITHUB_OUTPUT"

      - name: Assert the flip (v1 -> v2) + verify ran through sudoers
        run: |
          set -euxo pipefail
          SOCK=/run/culvert-maint/culvert-maint.sock
          D1_REF="${{ steps.images.outputs.d1_ref }}"; D2_REF="${{ steps.images.outputs.d2_ref }}"
          OP_ID="${{ steps.apply.outputs.op_id }}"
          running_digest() {
            local img; img="$(sudo docker inspect --format '{{.Image}}' culvert 2>/dev/null)"
            sudo docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$img" 2>/dev/null | grep "^${REPO}@sha256:" | head -n1 || true
          }
          RUN="$(running_digest)"; echo "running after apply (expect v2): $RUN"
          [ "$RUN" != "$D1_REF" ] || { echo "FATAL: still on v1 — the agent did not flip the image"; exit 1; }
          [ "$RUN" = "$D2_REF" ] || { echo "FATAL: running digest is neither v2 nor v1 (got $RUN, want $D2_REF)"; exit 1; }
          curl -fsS http://127.0.0.1:8080/health >/dev/null || { echo "FATAL: proxy /health failed after the flip"; exit 1; }

          # PROOF the sudoers-gated VERIFY inspect actually ran: the verify stage
          # emits `verify: running_image_id=sha256:<64hex> running_digests=…` ONLY
          # on a successful, non-skipped re-capture. That line is written by
          # verifyRunningImage (handlers_upgrade_apply.go), which calls
          # CaptureRunningProxyImage -> ComposeContainerInspect, i.e.
          #   sudo -n docker inspect --format {{json .Image}} <cid>
          # through /etc/sudoers.d/culvert-maint. Its presence proves the sudoers
          # quoting for that entry is correct AND the sandbox allowed escalation.
          OP_LOG="$(sudo curl -fsS --unix-socket "$SOCK" "http://localhost/v1/operations/$OP_ID/logs")"
          printf '%s\n' "$OP_LOG" | grep -Eq 'verify: running_image_id=sha256:[0-9a-f]{64}' \
            || { echo "FATAL: op log has no successful verify-stage inspect marker — the sudoers-gated verify did not run"; printf '%s\n' "$OP_LOG"; exit 1; }
          echo "PROOF: agent flipped v1 -> v2 and the sudoers-gated verify inspect ran successfully."

      - name: Diagnostics (always)
        if: always()
        run: |
          set +e
          SOCK=/run/culvert-maint/culvert-maint.sock
          OP_ID="${{ steps.apply.outputs.op_id }}"
          echo "===== systemctl status ====="; sudo systemctl status culvert-maint --no-pager -l 2>&1 | tail -n 40
          echo "===== agent journal (tail) ====="; sudo journalctl -u culvert-maint --no-pager -n 120 2>&1
          echo "===== agent /v1/status ====="; sudo curl -fsS --unix-socket "$SOCK" http://localhost/v1/status 2>/dev/null; echo
          echo "===== op log ====="; [ -n "$OP_ID" ] && sudo curl -fsS --unix-socket "$SOCK" "http://localhost/v1/operations/$OP_ID/logs" 2>/dev/null
          echo "===== sudoers drop-in ====="; sudo cat /etc/sudoers.d/culvert-maint 2>/dev/null
          echo "===== agent config.toml ====="; sudo cat /etc/culvert-maint/config.toml 2>/dev/null
          echo "===== compose ps ====="; ( cd "$STACK_DIR" && sudo docker compose ps -a )
          echo "===== culvert container logs (tail) ====="; sudo docker logs culvert 2>&1 | tail -n 150

      - name: Teardown (always)
        if: always()
        run: |
          set +e
          ( cd "$STACK_DIR" && sudo docker compose down -v )
          sudo docker rm -f registry culvert 2>/dev/null
          sudo systemctl disable --now culvert-maint 2>/dev/null
          sudo rm -rf /etc/culvert-maint /etc/sudoers.d/culvert-maint
          exit 0
