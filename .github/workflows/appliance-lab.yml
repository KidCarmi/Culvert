# appliance-lab.yml — DISPOSABLE appliance test lab (branch test/appliance-lab only).
#
# Boots the appliance OVA's own disk under QEMU/KVM on a standard GitHub-hosted
# runner and qualifies the guest OS end to end (test/e2e/appliance/lab/), and
# keeps the F-DISK-1 reproduction on its bounded nested-Docker host. Unpublished
# test path: no tags, releases, catalog or registry pushes; nothing here is a
# merge gate. The push trigger is restricted to the lab branch so the workflow
# can bootstrap without existing on main; workflow_dispatch re-runs it.
#
# Artifact identity: the runner cannot receive the OVA built on the qualification
# host (sha256 e24eb542…). It rebuilds a SEPARATELY IDENTIFIED candidate from the
# same pinned inputs — the same CI image tar (verified by sha256), the same
# appliance source commit, the same manifest pins — and records its own checksum.
# Its guest content is compared with the original's committed fingerprint; a
# pass here qualifies the rebuilt OVA, never the original one by name.
name: Appliance Lab

on:
  push:
    branches: [test/appliance-lab]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Per commit: a fix-proof variant runs beside a candidate already in progress.
  group: appliance-lab-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  # focused: build (closure + offline cold-load inside it), the disposable-store
  # replay and the ClamAV readiness check — no QEMU qualification. full: also
  # boot and qualify the OVA.
  LAB_STAGE: full
  # Superseded candidate (historical; does not boot under BIOS, #1528 §3f).
  # Its guest-content fingerprint stays the comparison reference.
  ORIGINAL_OVA_SHA256: e24eb542f973fb70360bad5124ef81fdab8b6f8d67af601720613cbcca3700a4
  # F-DISK-1 job input: the f8b6326e candidate's image (Deep gate run
  # 37624989266), which carries every badger/ristretto F-DISK-1 fix incl.
  # the in-place memtable emptying (5b389f38). Run 37397680555 still
  # reproduced the SIGBUS on the ORIGINAL image (37124197333, sha
  # bb8a2c75…) — that was the pre-fix control; d698's image survived in
  # 37601275706. This is the replacement, expected to report `survived`.
  SOURCE_IMAGE_RUN_ID: "37624989266"
  SOURCE_IMAGE_TAR_SHA256: d894b90a5e3ac16f99f5fa6fd2ffa4233483503723494d2a45ba2021a8501b70
  # The source those image bytes were built from; the F-DISK job builds its
  # maintenance agent from here so no lab-branch binary stands in for it.
  SOURCE_IMAGE_SHA: f8b6326ec6307e143e3fb2cd6d8b19c59ba90e28

jobs:
  guest-boot:
    name: "Lab · ${{ matrix.variant }} OVA: build + QEMU guest boot + qualify"
    # A push whose head commit says [fdisk-only] reruns F-DISK-1 alone.
    if: ${{ !contains(github.event.head_commit.message, '[fdisk-only]') && !contains(github.event.head_commit.message, '[sidecar-scan]') && !contains(github.event.head_commit.message, '[boot-console]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # Production-readiness candidate — #1528 head f8b6326e: 2e3bcc2a (ESXi
        # 69.4/73.5/68.5 s) plus the ClamAV sidecar upgrade (zlib 1.3.2-r1,
        # nghttp2-libs 1.70.0-r0) under the new local tag
        # culvert/clamav:1.4.6-culvert.2. Image = that head's own Deep PR Gate
        # tar (run 37604379502 → 37624989266); app, agent, console, access
        # binary and provisioning from a clean checkout of the SAME commit.
        # Image ID is the tar's OCI manifest digest, config sha256:5498aaff….
        include:
          - variant: candidate-f8b6326ec630
            provisioning: source
            source_sha: "f8b6326ec6307e143e3fb2cd6d8b19c59ba90e28"
            image_run: "37624989266"
            image_tar_sha256: "d894b90a5e3ac16f99f5fa6fd2ffa4233483503723494d2a45ba2021a8501b70"
            expect_image_id: "sha256:8568a94e2c2d62b24c901ab020426d6d39fe5ea084d21a82de66e4af6742b4fd"
            retained_run: ""
            retained_sha256: ""
            # The calibrated ESXi proxy (12 ms read / 3 ms write).
            disk: dm
            recovery_reboots: "3"
            recovery_profiles: "esxi12:12:3:120"
            recovery_variants: "base"
          # ASTRA (#1528): does an appliance that already has the OLD sidecar
          # tag cached adopt the new one? The RETAINED 2e3bcc2a OVA (old tag
          # culvert/clamav:1.4.6-pcre2-10.49 baked in) is qualified as before,
          # then cmd_adoption upgrades it to the f8b6326e image and refreshes
          # host components (appliance-lab.sh "adoption").
          - variant: candidate-2e3bcc2a1095
            provisioning: source
            source_sha: "2e3bcc2a1095f3e26e4f0b73a6a5515bdd069ee2"
            image_run: "37604379502"
            image_tar_sha256: "db4f5ce8784e2a8e5145fdf59126a8e675a27f6628ac3b70e0d2ac16daf5ffff"
            expect_image_id: "sha256:536403fc9ba8a4bc15d229a12a7586ce6ccc35ba99148b71869a81596e0ea940"
            retained_run: "37606237892"
            retained_sha256: "55e98116ba2c020789b3f5de4eabab7e29af611c83b9c972b82a6319a19f145e"
            recovery_reboots: "0"
            adopt_image_run: "37624989266"
            adopt_image_tar_sha256: "d894b90a5e3ac16f99f5fa6fd2ffa4233483503723494d2a45ba2021a8501b70"
            adopt_image_id: "sha256:8568a94e2c2d62b24c901ab020426d6d39fe5ea084d21a82de66e4af6742b4fd"
            adopt_old_ref: "culvert/clamav:1.4.6-pcre2-10.49"
            adopt_new_ref: "culvert/clamav:1.4.6-culvert.2"
            adopt_pkgs: "nghttp2-libs-1.70.0-r0 pcre2-10.49-r0 zlib-1.3.2-r1"
    env:
      APPLIANCE_SOURCE_SHA: ${{ matrix.source_sha }}
      SOURCE_IMAGE_RUN_ID: ${{ matrix.image_run }}
      SOURCE_IMAGE_TAR_SHA256: ${{ matrix.image_tar_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Harness self-test (a known-unavailable agent response must FAIL the agent oracle)
        run: test/e2e/appliance/lab/appliance-lab.sh selftest
      - name: Host preflight (KVM, RAM, disk) and lab directory
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm"
          nproc; free -m; df -h / /mnt 2>/dev/null || df -h /
          # Put the lab on the filesystem with the most free space.
          best=/; [ -d /mnt ] && [ "$(df -Pk /mnt | awk 'NR==2{print $4}')" -gt "$(df -Pk / | awk 'NR==2{print $4}')" ] && best=/mnt
          sudo mkdir -p "$best/culvert-lab" && sudo chown "$(id -u):$(id -g)" "$best/culvert-lab"
          echo "LAB_ROOT=$best/culvert-lab" >> "$GITHUB_ENV"
      - name: Install build + lab tools
        run: |
          set -euo pipefail
          for i in 1 2; do
            sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              libguestfs-tools qemu-utils qemu-system-x86 genisoimage ubuntu-cloudimage-keyring \
              isc-dhcp-client && break  # isc-dhcp-client: the libguestfs appliance brings its network up with it (as on the qualification host)
            sleep 15
          done
          # supermin (libguestfs) reads the host kernel; Ubuntu ships it 0600.
          sudo chmod 0644 /boot/vmlinuz-*
          # The runner image ships passt (podman); libguestfs prefers it, and as
          # root it exits ("passt exited with status 1", run 37138404641). The
          # recorded build host has no passt, so libguestfs uses QEMU's own
          # user-mode network there — match it.
          if dpkg -s passt >/dev/null 2>&1; then sudo apt-get remove -y -q passt; fi
          ! command -v passt
          # The libguestfs build guest inherits the host's resolv.conf; the
          # runner's is systemd-resolved's stub (127.0.0.53), unreachable from
          # inside that guest ("Could not resolve host", run 37138601142). Point
          # it at the real upstream resolvers. Host environment only.
          # Mirror the qualification host: a plain resolv.conf with public
          # resolvers (the Azure platform resolver did not answer the build
          # guest either, run 37138969586).
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\noptions timeout:2 attempts:3\n' | sudo tee /etc/resolv.conf >/dev/null
          getent hosts download.docker.com
      - name: Probe libguestfs appliance networking (fails fast, before a long build)
        if: matrix.retained_run == ''
        run: |
          set -euo pipefail
          sudo env LIBGUESTFS_BACKEND=direct timeout 300 guestfish --network -a /dev/null run : \
            debug sh "cat /etc/resolv.conf; ip -4 route; getent hosts download.docker.com || echo DNS-FAILED" | tee /tmp/lg-net.txt
          ! grep -q DNS-FAILED /tmp/lg-net.txt
      - name: Match the recorded build host's Docker engine (29.6.2)
        if: matrix.retained_run == ''
        # The original OVA's build-info.json records Docker 29.6.2 on the
        # containerd image store. The runner ships Docker 28, whose containerd
        # store reports an empty platform for an index-digest reference, so
        # build-ova.sh's amd64 assertion refuses the pinned ClamAV image (run
        # 37138298441). Match the build host instead of changing the build.
        run: |
          set -euo pipefail
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/docker-lab.list >/dev/null
          sudo apt-get update -q
          v="$(apt-cache madison docker-ce | awk '$3 ~ /^5:29\.6\.2-/{print $3; exit}')"
          [ -n "$v" ] || { echo "::error::docker-ce 29.6.2 not available"; exit 1; }
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --allow-downgrades "docker-ce=$v" "docker-ce-cli=$v" containerd.io
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
      - name: Use the containerd image store (the build's archive-identity guard requires it)
        if: matrix.retained_run == ''
        # Under Docker's classic store a loaded image's ID is its CONFIG digest,
        # so the saved archive cannot carry the manifest digest first boot pins
        # (build-ova.sh refuses it — PR #1528 K16). Same requirement as the
        # qualification host; the guard is not relaxed.
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo python3 -c 'import json; p="/etc/docker/daemon.json"; d=json.load(open(p)); d.setdefault("features",{})["containerd-snapshotter"]=True; json.dump(d,open(p,"w"))'
          sudo systemctl restart docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info --format 'server={{.ServerVersion}} driver={{.Driver}} {{.DriverStatus}}' | tee /dev/stderr | grep -q 'server=29.6.2 .*io.containerd.snapshotter.v1'
      - name: Obtain the source image tar (verified sha256)
        if: matrix.retained_run == ''
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "from=$(test/e2e/appliance/lab/obtain-image.sh "$LAB_ROOT/in")" >> "$GITHUB_OUTPUT"
      - name: Preserve the source image beyond the original artifact's expiry
        if: steps.image.outputs.from == 'source-run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-source-image-${{ env.SOURCE_IMAGE_RUN_ID }}
          path: ${{ env.LAB_ROOT }}/in/culvert-image.tar
          retention-days: 30
          compression-level: 0
      - name: "Diagnostic: replay the builder's ClamAV save in a FRESH disposable store (F-OVA-CLAMAV-1)"
        # build-ova.sh pulls by the pinned digest, tags, and saves BY TAG. The
        # replay runs exactly that in its own docker:dind data root — never in
        # the daemon the build uses, so it cannot pre-populate or repair it.
        # Observes only; the build's closure and cold-load checks decide.
        # Not run for a source-provisioned (final) candidate.
        if: matrix.provisioning == 'lab'
        continue-on-error: true
        run: |
          set -uo pipefail
          . appliance/build/manifest.env
          # Bisect: each variant in its OWN fresh disposable store.
          for v in baseline load-first save-first; do
            echo "=== replay variant: $v"
            pre=""; order=""
            [[ "$v" != baseline ]] && pre="$LAB_ROOT/in/culvert-image.tar"
            [[ "$v" == save-first ]] && order=save-first
            REPLAY_PRELOAD_TAR="$pre" REPLAY_ORDER="$order" test/e2e/appliance/lab/save-replay.sh "$CLAMAV_IMAGE_REPO" "$CLAMAV_IMAGE_TAG" \
              "$CLAMAV_IMAGE_INDEX_DIGEST" "$CLAMAV_IMAGE_AMD64_DIGEST" "$COLDLOAD_DIND_IMAGE" "$LAB_ROOT/replay"
          done 2>&1 | tee "$LAB_ROOT/save-replay.txt"
          echo "builder daemon has no ClamAV image before the build: $(docker image ls -q --filter reference='*clamav*' | wc -l) found"
      - name: Check out the appliance source the candidate is built from
        if: matrix.retained_run == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APPLIANCE_SOURCE_SHA }}
          path: appliance-src
          persist-credentials: false
      # build-ova.sh compiles the appliance console (#1540) and refuses any
      # compiler other than the source commit's go.mod toolchain line.
      - name: Go toolchain pinned by the appliance source
        if: matrix.retained_run == ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: appliance-src/go.mod
          cache: false
      - name: Build the candidate OVA (image + provisioning from one commit)
        if: matrix.retained_run == ''
        run: |
          set -euo pipefail
          # The build runs as root over a runner-owned checkout; without this,
          # git refuses the repo and the candidate-source == HEAD check fails.
          src="$GITHUB_WORKSPACE/appliance-src"; drift=()
          if [ "${{ matrix.provisioning }}" = lab ]; then
            # Provisioning from this lab commit: prove its appliance/ tree is
            # the image commit's plus the unit fix and nothing else.
            # Every difference is recorded; only the approved files may differ.
            (cd "$GITHUB_WORKSPACE" && diff -ruN appliance-src/appliance appliance) > "$LAB_ROOT/provisioning-drift.diff" || true
            changed="$(cd "$GITHUB_WORKSPACE" && diff -rqN appliance-src/appliance appliance | sed -E 's#^(Files|Only in) appliance-src/##; s# and .*##' | sort || true)"
            echo "appliance/ drift vs $APPLIANCE_SOURCE_SHA:"; echo "$changed"
            want="$(printf '%s\n' appliance/build/prepare-guest.sh appliance/os-maintenance/culvert-os-update \
              appliance/os-maintenance/culvert-stack-resume.service | sort)"
            [ "$changed" = "$want" ] || { echo "::error::provisioning drift differs from the approved set: $changed"; exit 1; }
            src="$GITHUB_WORKSPACE"; drift=(--candidate-allow-provisioning-drift)
          fi
          sudo git config --global --add safe.directory "$src"
          # sudo resets PATH (secure_path): pass setup-go's compiler through;
          # GOTOOLCHAIN=local so a mismatch fails instead of downloading another.
          sudo -E env PATH="$PATH" GOTOOLCHAIN=local LIBGUESTFS_BACKEND=direct BASE_IMAGE_KEYRING=/usr/share/keyrings/ubuntu-cloudimage-keyring.gpg \
            "$src/appliance/build/build-ova.sh" \
              --candidate-image-tar "$LAB_ROOT/in/culvert-image.tar" \
              --candidate-source "$APPLIANCE_SOURCE_SHA" --candidate-run-id "$SOURCE_IMAGE_RUN_ID" "${drift[@]}" \
              --out "$LAB_ROOT/ova" --work "$LAB_ROOT/build" --keep-work 2>&1 | tee "$LAB_ROOT/build-ova.log"
          sudo chown -R "$(id -u):$(id -g)" "$LAB_ROOT/ova"
          cat "$LAB_ROOT/ova/"*.ova.sha256
          rm -f "$LAB_ROOT/in/culvert-image.tar"
      - name: "Diagnostic (after a failed build): what the builder's own daemon holds"
        # Runs only AFTER the build failed, so it cannot influence it.
        if: failure()
        run: |
          set -uo pipefail
          . appliance/build/manifest.env
          docker image ls --tree 2>&1 | head -40
          sudo ctr -n moby images ls 2>/dev/null | grep -i clamav || true
          cfg=sha256:5ca07785ce6993ebdac0dc329b1866e09ca28a6336223879f839b7c530d39bd9
          sudo ctr -n moby content ls -q | grep -qx "$cfg" && echo "amd64 config IN the builder's content store" || echo "amd64 config NOT in the builder's content store"
          ls -l "$LAB_ROOT/build/overlay/var/lib/culvert-appliance/images/" 2>/dev/null || true
          echo "--- builder daemon: save BY DIGEST now"
          . appliance/build/archive-identity.sh
          docker save "${CLAMAV_IMAGE_REPO}@${CLAMAV_IMAGE_INDEX_DIGEST}" | gzip -n -1 > /tmp/b-digest.tgz
          echo "by-digest: $(stat -c %s /tmp/b-digest.tgz) bytes"; archive_platform_closure /tmp/b-digest.tgz linux/amd64 "$CLAMAV_IMAGE_INDEX_DIGEST" "$CLAMAV_IMAGE_AMD64_DIGEST" || true
          sudo docker save "${CLAMAV_IMAGE_REPO}:${CLAMAV_IMAGE_TAG}" | gzip -n -1 > /tmp/b-tag.tgz
          echo "by-tag (root CLI): $(stat -c %s /tmp/b-tag.tgz) bytes"; archive_platform_closure /tmp/b-tag.tgz linux/amd64 "$CLAMAV_IMAGE_INDEX_DIGEST" "$CLAMAV_IMAGE_AMD64_DIGEST" || true
          echo "--- builder daemon state"
          docker info 2>&1 | sed -n '1,60p'
          sudo ls -la /var/lib/docker /var/lib/docker/image 2>&1 | head -30
          sudo du -sh /var/lib/docker/* /var/lib/containerd 2>/dev/null | head -20
          sudo ctr namespaces ls
      - name: "Focused check: ClamAV READY from the baked archive alone (empty store, no registry)"
        if: matrix.retained_run == ''
        # The build already proved create + execute offline; this adds a real
        # clamd reaching `clamdscan --ping` (signatures via freshclam; the
        # disposable daemon's registry access goes to a dead proxy).
        run: |
          set -euo pipefail
          # The manifest the build wrote into the image overlay: it carries the
          # pinned inputs AND the ClamAV sidecar the build produced
          # (CLAMAV_SIDECAR_REF, CLAMAV_SIDECAR_ID). Since the pcre2 fix the
          # appliance ships that derivative, not the upstream clamav/clamav
          # tag, so the archive holds the sidecar (run 37397680555 failed here
          # looking for the upstream ref).
          # The build ran as root; read the file through sudo.
          . <(sudo cat "$LAB_ROOT/build/overlay/var/lib/culvert-appliance/manifest.env")
          [ -n "${CLAMAV_SIDECAR_REF:-}" ] && [ -n "${CLAMAV_SIDECAR_ID:-}" ] \
            || { echo "::error::the built manifest lacks CLAMAV_SIDECAR_REF/ID"; exit 1; }
          appliance-src/appliance/build/cold-load-check.sh --dind "$COLDLOAD_DIND_IMAGE" \
            --archive "$LAB_ROOT/build/overlay/var/lib/culvert-appliance/images/clamav.tar.gz" \
            --ref "$CLAMAV_SIDECAR_REF" --id "$CLAMAV_SIDECAR_ID" \
            --run "clamd --version" --ready-clamav 900 2>&1 | tee "$LAB_ROOT/coldload-clamav-ready.txt"
      - name: Retain the built OVA (unpublished test artifact, before any boot)
        if: matrix.retained_run == ''
        # For the ESXi qualification (test/esxi-qualification), which imports
        # the bytes on a LAN host: kept BEFORE the QEMU boot so a boot failure
        # cannot discard the only importable file. Unpublished: a workflow
        # artifact with short retention, not a release, tag or registry push.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appliance-lab-ova-${{ matrix.variant }}
          path: |
            ${{ env.LAB_ROOT }}/ova/*.ova
            ${{ env.LAB_ROOT }}/ova/*.ova.sha256
            ${{ env.LAB_ROOT }}/ova/build-info.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: "TEST-ONLY signed-update lab: disposable TLS registry (as ghcr.io) + fixture release evidence"
        # Outside the OVA: a registry the guest reaches as ghcr.io (its cert names
        # ghcr.io; the guest is told to trust its CA at qualification time), the
        # OVA's OWN application archive pushed byte-for-byte as the baseline (the
        # same index digest the guest runs), a relabelled target, and evidence
        # from the source revision's release-proof fixture (ephemeral ed25519
        # key, never written; only the PUBLIC keyring reaches the guest). Any
        # failure leaves step 6c BLOCKED with the reason, never a fake pass.
        if: env.LAB_STAGE == 'full' && matrix.retained_run == ''
        continue-on-error: true
        run: |
          set -euo pipefail
          U="$LAB_ROOT/update"; rm -rf "$U"; mkdir -p "$U/certs"; cd "$U/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 3 -subj "/CN=culvert-lab-registry-ca (TEST-ONLY)" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign" -keyout ca.key -out "$U/ca.crt" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj "/CN=ghcr.io" -keyout reg.key -out reg.csr 2>/dev/null
          printf 'subjectAltName=DNS:ghcr.io,IP:127.0.0.1,IP:10.0.2.2\nextendedKeyUsage=serverAuth\n' > ext.cnf
          openssl x509 -req -in reg.csr -CA "$U/ca.crt" -CAkey ca.key -CAcreateserial -days 3 -extfile ext.cnf -out reg.crt 2>/dev/null
          rm -f ca.key reg.csr   # the CA signs exactly one certificate
          for i in 1 2 3; do docker pull -q registry:2 && break; sleep 5; done
          docker run -d --name lab-registry -p 127.0.0.1:443:443 -v "$U/certs:/certs:ro" \
            -e REGISTRY_HTTP_ADDR=0.0.0.0:443 -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/reg.crt -e REGISTRY_HTTP_TLS_KEY=/certs/reg.key registry:2
          sudo install -D -m 0644 "$U/ca.crt" /etc/docker/certs.d/127.0.0.1:443/ca.crt
          for i in $(seq 1 30); do curl -fsS --cacert "$U/ca.crt" https://127.0.0.1/v2/ >/dev/null && break; sleep 1; done
          command -v skopeo >/dev/null || sudo apt-get install -y -q skopeo
          ME="$LAB_ROOT/build/overlay/var/lib/culvert-appliance/manifest.env"
          B="$(sed -n 's/^APP_IMAGE_INDEX_DIGEST=//p' "$ME" | tail -1 | tr -d '"')"; REPO="$(sed -n 's/^APP_IMAGE_REPO=//p' "$ME" | tail -1 | tr -d '"')"; TAG="$(sed -n 's/^APP_IMAGE_TAG=//p' "$ME" | tail -1 | tr -d '"')"
          [[ "$B" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no APP_IMAGE_INDEX_DIGEST in the OVA manifest"; exit 1; }
          # Baseline: the archive baked into the OVA, copied with every digest preserved.
          gunzip -c "$LAB_ROOT/build/overlay/var/lib/culvert-appliance/images/culvert.tar.gz" > "$U/baseline-oci.tar"
          skopeo copy --all --preserve-digests --dest-cert-dir /etc/docker/certs.d/127.0.0.1:443 \
            "oci-archive:$U/baseline-oci.tar" docker://127.0.0.1:443/kidcarmi/culvert:lab-baseline
          rm -f "$U/baseline-oci.tar"
          got="sha256:$(skopeo inspect --raw --cert-dir /etc/docker/certs.d/127.0.0.1:443 docker://127.0.0.1:443/kidcarmi/culvert:lab-baseline | sha256sum | cut -d' ' -f1)"
          [ "$got" = "$B" ] || { echo "::error::registry baseline $got != the OVA's index digest $B"; exit 1; }
          # Target: the same image plus one label (a real, different digest).
          printf 'FROM %s:%s\nLABEL org.culvert.lab-target="1"\n' "$REPO" "$TAG" | docker build --provenance=false --sbom=false -t 127.0.0.1:443/kidcarmi/culvert:lab-target -
          docker push -q 127.0.0.1:443/kidcarmi/culvert:lab-target
          T="sha256:$(skopeo inspect --raw --cert-dir /etc/docker/certs.d/127.0.0.1:443 docker://127.0.0.1:443/kidcarmi/culvert:lab-target | sha256sum | cut -d' ' -f1)"
          BREF="ghcr.io/kidcarmi/culvert@$B"; TREF="ghcr.io/kidcarmi/culvert@$T"
          # Evidence from the SOURCE revision's fixture (ephemeral key, never saved).
          (cd "$GITHUB_WORKSPACE/appliance-src" && GOTOOLCHAIN=local go run ./test/e2e/release-proof-fixture --output "$U/fixture" --ref "baseline=$BREF" --ref "target=$TREF")
          REQ="$GITHUB_WORKSPACE/appliance-src/test/e2e/release-proof-fixture/request.py"
          printf '{"image_ref":"%s","pre_backup":false,"rollback_on_failure":true,"idempotency_key":"lab-unsigned-%s"}' "$TREF" "$GITHUB_RUN_ID" > "$U/apply-unsigned.json"
          printf '{"image_ref":"%s","pre_backup":false,"rollback_on_failure":true,"idempotency_key":"lab-apply-%s"}' "$TREF" "$GITHUB_RUN_ID" | python3 "$REQ" --proofs "$U/fixture/proofs.json" --prior "$BREF" > "$U/apply-signed.json"
          printf '{"mode":"image","image_ref":"%s","idempotency_key":"lab-rollback-%s"}' "$BREF" "$GITHUB_RUN_ID" | python3 "$REQ" --proofs "$U/fixture/proofs.json" > "$U/rollback-signed.json"
          cp "$U/fixture/keyring.json" "$U/keyring.json"
          printf 'BASELINE_REF=%s\nTARGET_REF=%s\nREGISTRY_ADDR=10.0.2.2\n' "$BREF" "$TREF" > "$U/refs.env"
          {
            echo "TEST-ONLY trust configuration for step 6c (never part of the OVA)"
            echo "fixture: test/e2e/release-proof-fixture @ $APPLIANCE_SOURCE_SHA (ephemeral ed25519 key id lab-ephemeral; private key never written)"
            echo "public keyring sha256: $(sha256sum "$U/keyring.json" | cut -d' ' -f1)"
            echo "registry: disposable registry:2 on the runner (127.0.0.1:443), reached by the guest as ghcr.io via 10.0.2.2"
            echo "registry CA sha256: $(sha256sum "$U/ca.crt" | cut -d' ' -f1) (CA private key deleted after signing one certificate)"
            echo "baseline: $BREF (= the OVA's own index digest, pushed with digests preserved)"
            echo "target:   $TREF (baseline + LABEL org.culvert.lab-target=1)"
            echo "guest changes made by the harness: /etc/hosts ghcr.io entry, /etc/docker/certs.d/ghcr.io/ca.crt, /etc/culvert-maint/lab-fixture-keyring.json, release_trust_keys in /etc/culvert-maint/config.toml"
          } > "$U/fixture.txt"
          cat "$U/fixture.txt"; touch "$U/READY"
      - name: Fetch the RETAINED OVA (re-qualification of an existing artifact; verified sha256)
        # Re-qualifies the exact bytes a previous run built and retained, with
        # the current harness. Nothing is rebuilt: a rebuild would be a
        # different artifact.
        if: matrix.retained_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$LAB_ROOT/ova"
          gh run download "${{ matrix.retained_run }}" -R "$GITHUB_REPOSITORY" -n "appliance-lab-ova-${{ matrix.variant }}" -D "$LAB_ROOT/ova"
          got="$(sha256sum "$LAB_ROOT/ova/"*.ova | cut -d' ' -f1)"
          [ "$got" = "${{ matrix.retained_sha256 }}" ] || { echo "::error::retained OVA sha256 $got != ${{ matrix.retained_sha256 }}"; exit 1; }
          grep -q "$got" "$LAB_ROOT/ova/"*.ova.sha256
          echo "retained OVA $got from run ${{ matrix.retained_run }}"
      - name: Fetch the adoption target image (verified sha256)
        if: matrix.adopt_image_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_IMAGE_RUN_ID: ${{ matrix.adopt_image_run }}
          SOURCE_IMAGE_TAR_SHA256: ${{ matrix.adopt_image_tar_sha256 }}
        run: |
          set -euo pipefail
          test/e2e/appliance/lab/obtain-image.sh "$LAB_ROOT/adopt"
          echo "$SOURCE_IMAGE_TAR_SHA256  $LAB_ROOT/adopt/culvert-image.tar" | sha256sum -c -
      - name: "Diagnostic: guest content vs the superseded candidate's fingerprint"
        if: env.LAB_STAGE == 'full'
        # Informational only (its own LAB_DIR, so it never counts as a lab
        # failure): the new image legitimately changes manifest.env and the
        # baked image tar; everything else should be identical.
        run: |
          set -euo pipefail
          export LAB_DIR="$LAB_ROOT/fpcmp"
          ova="$(ls "$LAB_ROOT/ova/"*.ova)"
          sudo -E env LIBGUESTFS_BACKEND=direct LAB_DIR="$LAB_DIR" test/e2e/appliance/lab/appliance-lab.sh fingerprint "$ova" "$LAB_ROOT/rebuilt.fingerprint.tsv"
          sudo chown -R "$(id -u):$(id -g)" "$LAB_DIR" "$LAB_ROOT/rebuilt.fingerprint.tsv"
          test/e2e/appliance/lab/appliance-lab.sh compare \
            test/e2e/appliance/lab/reference/candidate-4c4b772-e24eb542.fingerprint.tsv "$LAB_ROOT/rebuilt.fingerprint.tsv" || echo "::warning::rebuilt guest content differs from the original OVA (recorded)"
      - name: "Recovery lab: device-mapper delay target available"
        if: env.LAB_STAGE == 'full' && matrix.disk == 'dm'
        run: |
          set -euo pipefail
          sudo modprobe dm_delay 2>/dev/null || { sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe dm_delay; }
          lsmod | grep -E '^dm_delay' && sudo dmsetup targets | grep -E '^(delay|linear) '
      - name: "Lab: preflight → up → qualify → recovery (collect + down always run)"
        if: env.LAB_STAGE == 'full'
        run: |
          set -euo pipefail
          export LAB_DIR="$LAB_ROOT/lab"
          export LAB_DISK="${{ matrix.disk || 'overlay' }}" LAB_RECOVERY_REBOOTS="${{ matrix.recovery_reboots || '0' }}"
          [ -z "${{ matrix.recovery_profiles }}" ] || export LAB_RECOVERY_PROFILES="${{ matrix.recovery_profiles }}"
          [ -z "${{ matrix.recovery_variants }}" ] || export LAB_RECOVERY_VARIANTS="${{ matrix.recovery_variants }}"
          export LAB_OVA="$(ls "$LAB_ROOT/ova/"*.ova)"
          export LAB_OVA_SHA256="$(cut -d' ' -f1 "$LAB_ROOT/ova/"*.ova.sha256)"
          export LAB_EXPECT_IMAGE_ID="${{ matrix.expect_image_id }}" LAB_MIN_FREE_GB=20 LAB_ACCEL=kvm
          [ -f "$LAB_ROOT/update/READY" ] && export LAB_UPDATE_DIR="$LAB_ROOT/update" || echo "::warning::signed-update lab not prepared — step 6c will report BLOCKED"
          if [ -n "${{ matrix.adopt_image_run }}" ]; then
            export LAB_ADOPT_IMAGE_TAR="$LAB_ROOT/adopt/culvert-image.tar" LAB_ADOPT_IMAGE_ID="${{ matrix.adopt_image_id }}" \
              LAB_ADOPT_OLD_REF="${{ matrix.adopt_old_ref }}" LAB_ADOPT_NEW_REF="${{ matrix.adopt_new_ref }}" LAB_ADOPT_PKGS="${{ matrix.adopt_pkgs }}"
          fi
          test/e2e/appliance/lab/appliance-lab.sh all
      - name: Report
        if: always()
        run: |
          [ -f "$LAB_ROOT/lab/evidence/REPORT.md" ] && cat "$LAB_ROOT/lab/evidence/REPORT.md" >> "$GITHUB_STEP_SUMMARY" || echo "no REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$LAB_ROOT/lab/evidence/build"
          cp "$LAB_ROOT/ova/"{build-info.json,build-upgrades.txt,dpkg-list.txt,host-components.txt,prepare-guest.log} "$LAB_ROOT/ova/"*.ova.sha256 "$LAB_ROOT/lab/evidence/build/" 2>/dev/null || true
          cp "$LAB_ROOT/rebuilt.fingerprint.tsv" "$LAB_ROOT/build-ova.log" "$LAB_ROOT/fpcmp/evidence/fingerprint-diff.txt" "$LAB_ROOT/lab/evidence/build/" 2>/dev/null || true
          cp "$LAB_ROOT/provisioning-drift.diff" "$LAB_ROOT/save-replay.txt" "$LAB_ROOT/coldload-clamav-ready.txt" "$LAB_ROOT/lab/evidence/build/" 2>/dev/null || true
          printf 'variant=%s\nlab_commit=%s\nimage_source=%s\nprovisioning_source=%s\nsource_image_run=%s tar_sha256=%s from=%s\nexpected_image_id=%s\nsuperseded_ova_sha256=%s (NOT the artifact booted here)\n' \
            "${{ matrix.variant }}" "$GITHUB_SHA" "$APPLIANCE_SOURCE_SHA" "$([ "${{ matrix.provisioning }}" = lab ] && echo "$GITHUB_SHA (lab: $APPLIANCE_SOURCE_SHA + approved provisioning drift, see provisioning-drift.diff)" || echo "$APPLIANCE_SOURCE_SHA")" \
            "$SOURCE_IMAGE_RUN_ID" "$SOURCE_IMAGE_TAR_SHA256" "${{ steps.image.outputs.from }}" \
            "${{ matrix.expect_image_id }}" "$ORIGINAL_OVA_SHA256" > "$LAB_ROOT/lab/evidence/identities.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appliance-lab-evidence-${{ matrix.variant }}
          path: ${{ env.LAB_ROOT }}/lab/evidence
          retention-days: 30
          if-no-files-found: warn

  f-disk-1:
    name: "Lab · F-DISK-1 on the bounded nested-Docker host"
    if: ${{ !contains(github.event.head_commit.message, '[sidecar-scan]') && !contains(github.event.head_commit.message, '[boot-console]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-dependency-path: cmd/culvert-maint/go.sum
      - name: Obtain + load the source image (verified sha256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test/e2e/appliance/lab/obtain-image.sh "$RUNNER_TEMP/in"
          tar="$RUNNER_TEMP/in/culvert-image.tar"
          # The tar's own identity chain, each link re-hashed: the OCI index names
          # the manifest (the ID containerd — the OVA's store — reports), and that
          # manifest names the config. The harness then requires the pushed
          # image to carry this same config.
          python3 -I - "$tar" > "$RUNNER_TEMP/in/identity.env" <<'PY'
          import hashlib, json, sys, tarfile
          t = tarfile.open(sys.argv[1])
          blob = lambda d: t.extractfile("blobs/sha256/" + d.split(":")[1]).read()
          def ok(d):
              b = blob(d)
              assert "sha256:" + hashlib.sha256(b).hexdigest() == d, d
              return b
          idx = json.load(t.extractfile("index.json"))
          (m,) = idx["manifests"]
          cfg = json.loads(ok(m["digest"]))["config"]["digest"]
          ok(cfg)
          assert json.load(t.extractfile("manifest.json"))[0]["Config"].endswith(cfg.split(":")[1])
          print(f"EXPECT_MANIFEST_DIGEST={m['digest']}")
          print(f"EXPECT_CONFIG_DIGEST={cfg}")
          PY
          cat "$RUNNER_TEMP/in/identity.env" | tee -a "$GITHUB_ENV"
          docker load -i "$tar" && docker image inspect culvert:ci-smoke --format 'id={{.Id}}'
      - name: Check out the image's source (agent build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_IMAGE_SHA }}
          path: image-src
      - name: Pre-pull harness images (retry)
        run: |
          set -euo pipefail
          pull_retry() { for i in 1 2 3 4; do docker pull -q "$1" && return 0; sleep $((i*3)); done; return 1; }
          for img in registry:2 busybox:stable docker:29-dind@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1; do pull_retry "$img"; done
      - name: "F-DISK-1 midwrite: fill during the active category write, record, recover, verify integrity"
        # Fill is a file inside a 2 GiB loop-mounted ext4 owned by a nested dockerd;
        # the runner's filesystem never fills. Reproducing the crash is a KNOWN
        # FAILURE, never a survival pass; exit 1 = a recovery/integrity check failed,
        # exit 2 = inconclusive (no write observed).
        # The write can finish before the fill lands on a fast runner; the
        # harness then exits 2 (inconclusive, nothing tested). Up to 3 attempts,
        # each kept in its own directory; the last one is the result.
        run: |
          set +e   # GitHub runs steps under bash -e; the retry needs each exit code
          set -uo pipefail
          rc=2
          for attempt in 1 2 3; do
            sudo -E env "PATH=$PATH" "HOME=$HOME" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" "GOFLAGS=-mod=mod" \
              QUAL_ENOSPC_SCENARIO=midwrite CUR_IMAGE=culvert:ci-smoke PRED_IMAGE=culvert:ci-smoke \
              QUAL_AGENT_SRC="$GITHUB_WORKSPACE/image-src" EXPECT_CONFIG_DIGEST="$EXPECT_CONFIG_DIGEST" \
              EXPECT_SOURCE_NOTE="tar sha256 $SOURCE_IMAGE_TAR_SHA256, OCI manifest $EXPECT_MANIFEST_DIGEST (the OVA image ID), source $SOURCE_IMAGE_SHA" \
              EVID="$RUNNER_TEMP/fdisk1/attempt-$attempt" ./test/e2e/appliance/upgrade-enospc-qualify.sh
            rc=$?
            echo "attempt $attempt: exit $rc"
            [ "$rc" = 2 ] || break
          done
          sudo cp "$RUNNER_TEMP/fdisk1/attempt-$attempt/"{REPORT.md,checks.jsonl,diagnose.log} "$RUNNER_TEMP/fdisk1/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/fdisk1"
          exit "$rc"
      - name: Report
        if: always()
        run: cat "$RUNNER_TEMP/fdisk1/REPORT.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appliance-lab-fdisk1-evidence
          # Named files only: the evidence dir also holds the 2 GiB loop image.
          path: |
            ${{ runner.temp }}/fdisk1/**/REPORT.md
            ${{ runner.temp }}/fdisk1/**/checks.jsonl
            ${{ runner.temp }}/fdisk1/**/diagnose.log
          retention-days: 30
          if-no-files-found: warn

  # The boot screen as an operator sees it on ESXi (owner report on #1528:
  # kernel text and a wrapped title left on the console). Boots a RETAINED OVA
  # with VMware SVGA and no serial port and records every distinct VGA frame
  # through cold first boot, a maintenance reboot with a slow and a failed
  # unit, Esc, the kernel-log VT and a clean reboot, plus a serial-only boot
  # (appliance-lab.sh "console"). A push whose head commit says
  # [boot-console] runs this job alone.
  boot-console:
    name: "Lab · boot console (VMware SVGA, no serial) · ${{ matrix.variant }}"
    if: ${{ contains(github.event.head_commit.message, '[boot-console]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: candidate-2e3bcc2a1095
            retained_run: "37606237892"
            retained_sha256: "55e98116ba2c020789b3f5de4eabab7e29af611c83b9c972b82a6319a19f145e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: KVM, lab directory, tools
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          best=/; [ -d /mnt ] && [ "$(df -Pk /mnt | awk 'NR==2{print $4}')" -gt "$(df -Pk / | awk 'NR==2{print $4}')" ] && best=/mnt
          sudo mkdir -p "$best/culvert-lab" && sudo chown "$(id -u):$(id -g)" "$best/culvert-lab"
          echo "LAB_ROOT=$best/culvert-lab" >> "$GITHUB_ENV"
          for i in 1 2; do
            sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              qemu-utils qemu-system-x86 genisoimage imagemagick && break
            sleep 15
          done
      - name: Fetch the RETAINED OVA (verified sha256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$LAB_ROOT/ova"
          gh run download "${{ matrix.retained_run }}" -R "$GITHUB_REPOSITORY" -n "appliance-lab-ova-${{ matrix.variant }}" -D "$LAB_ROOT/ova"
          got="$(sha256sum "$LAB_ROOT/ova/"*.ova | cut -d' ' -f1)"
          [ "$got" = "${{ matrix.retained_sha256 }}" ] || { echo "::error::retained OVA sha256 $got != ${{ matrix.retained_sha256 }}"; exit 1; }
      - name: "Console: cold first boot, maintenance reboots, Esc, kernel-log VT, serial-only"
        run: |
          set -euo pipefail
          export LAB_DIR="$LAB_ROOT/console" LAB_ACCEL=kvm LAB_MIN_FREE_GB=15
          export LAB_OVA="$(ls "$LAB_ROOT/ova/"*.ova)" LAB_OVA_SHA256="${{ matrix.retained_sha256 }}"
          test/e2e/appliance/lab/appliance-lab.sh preflight
          test/e2e/appliance/lab/appliance-lab.sh console
      - name: Report
        if: always()
        run: |
          [ -f "$LAB_ROOT/console/evidence/REPORT.md" ] && cat "$LAB_ROOT/console/evidence/REPORT.md" >> "$GITHUB_STEP_SUMMARY" || true
          grep -h '"check"' "$LAB_ROOT/console/evidence/"*.jsonl 2>/dev/null | tail -20 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appliance-lab-console-${{ matrix.variant }}
          path: ${{ env.LAB_ROOT }}/console/evidence
          retention-days: 30
          if-no-files-found: warn

  # ASTRA (#1528): the Deep gate scans a sidecar it builds itself
  # (config 3f6a669b…); the OVA ships the archive baked at OVA build time
  # (config 098ca807…). Same tag, different bytes: a coverage gap. This job
  # scans the EXACT archive inside the retained candidate OVA, never a
  # rebuild: OVA sha → archive sha → OCI index → amd64 manifest → config,
  # every link re-hashed, then the Deep gate's own Trivy gate plus a full
  # all-severity record and an SBOM, bound to that config by Trivy's ImageID.
  # Runs only when the head commit says [sidecar-scan].
  ova-sidecar-scan:
    name: "Lab · retained OVA's baked ClamAV sidecar: exact-byte scan + SBOM"
    if: ${{ contains(github.event.head_commit.message, '[sidecar-scan]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OVA_ARTIFACT_ID: "11475581263"   # appliance-lab-ova-candidate-2e3bcc2a1095, run 37606237892
      OVA_SHA256: 55e98116ba2c020789b3f5de4eabab7e29af611c83b9c972b82a6319a19f145e
      SIDECAR_ARCHIVE_SHA256: 603c165c35141aed67667dffbc09132664feadd74dfcabbfc7e109b4dbecffa6
      SIDECAR_INDEX: sha256:f3fcbf45d0a50da7e1880e498a030e38b1cd31d792a2737a881ebe8391b13ec3
      SIDECAR_MANIFEST: sha256:be3827e2327c5e51c695c7fe934133f0433c8baa9a7b3ea03e2cdb9ea5d1331c
      SIDECAR_CONFIG: sha256:098ca807895db86476681c9ad1aba7856261c787b87fe7c13aadc7f68c483302
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Workspace + libguestfs (read-only disk access)
        run: |
          set -euo pipefail
          best=/; [ -d /mnt ] && [ "$(df -Pk /mnt | awk 'NR==2{print $4}')" -gt "$(df -Pk / | awk 'NR==2{print $4}')" ] && best=/mnt
          sudo mkdir -p "$best/sidecar-scan" && sudo chown "$(id -u):$(id -g)" "$best/sidecar-scan"
          echo "W=$best/sidecar-scan" >> "$GITHUB_ENV"
          mkdir -p "$best/sidecar-scan/evidence"
          for _ in 1 2; do
            sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends libguestfs-tools qemu-utils && break
            sleep 15
          done
          sudo chmod 0644 /boot/vmlinuz-*
          if dpkg -s passt >/dev/null 2>&1; then sudo apt-get remove -y -q passt; fi
      - name: Retained OVA → the baked sidecar archive (hash-checked at each step)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$W"; E="$W/evidence"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$OVA_ARTIFACT_ID/zip" > ova.zip
          unzip -q ova.zip -d ova && rm -f ova.zip
          ova="$(ls ova/*.ova)"; got="$(sha256sum "$ova" | cut -d' ' -f1)"
          echo "$got  $(basename "$ova")" | tee "$E/ova.sha256"
          [ "$got" = "$OVA_SHA256" ] || { echo "::error::OVA sha256 $got, expected $OVA_SHA256"; exit 1; }
          mkdir x && tar -xf "$ova" -C x && rm -rf ova
          (cd x && python3 -I - "$(ls *.mf)" <<'PY'
          import hashlib, re, sys
          bad = []
          for line in open(sys.argv[1]):
              m = re.match(r'SHA256\((.+)\)= ([0-9a-f]{64})', line.strip())
              if m and hashlib.sha256(open(m.group(1), 'rb').read()).hexdigest() != m.group(2):
                  bad.append(m.group(1))
          sys.exit("OVA manifest mismatch: " + ",".join(bad) if bad else 0)
          PY
          )
          cp x/*.mf "$E/"
          disk="$(ls "$W"/x/*.vmdk)"
          sudo env LIBGUESTFS_BACKEND=direct virt-copy-out -a "$disk" /var/lib/culvert-appliance/images/clamav.tar.gz "$W/"
          sudo env LIBGUESTFS_BACKEND=direct virt-cat -a "$disk" /var/lib/culvert-appliance/manifest.env \
            | grep -E '^CLAMAV_' | tee "$E/guest-manifest-clamav.env"
          sudo chown "$(id -u):$(id -g)" "$W/clamav.tar.gz"; rm -rf x
          got="$(sha256sum clamav.tar.gz | cut -d' ' -f1)"
          echo "$got  /var/lib/culvert-appliance/images/clamav.tar.gz" | tee "$E/archive.sha256"
          [ "$got" = "$SIDECAR_ARCHIVE_SHA256" ] || { echo "::error::archive sha256 $got, expected $SIDECAR_ARCHIVE_SHA256"; exit 1; }
          gunzip -c clamav.tar.gz > clamav.tar
      - name: Bind archive → index → amd64 manifest → config (every blob re-hashed)
        run: |
          set -euo pipefail
          python3 -I - "$W/clamav.tar" "$W/evidence/binding.json" <<'PY'
          import hashlib, json, os, sys, tarfile
          t = tarfile.open(sys.argv[1])
          names = set(t.getnames())
          def blob(d):
              b = t.extractfile("blobs/sha256/" + d.split(":")[1]).read()
              assert "sha256:" + hashlib.sha256(b).hexdigest() == d, f"blob {d} does not hash to its name"
              return b
          exp = {k: os.environ[k] for k in ("SIDECAR_INDEX", "SIDECAR_MANIFEST", "SIDECAR_CONFIG")}
          top = json.load(t.extractfile("index.json"))
          (entry,) = top["manifests"]
          assert entry["digest"] == exp["SIDECAR_INDEX"], f"index.json names {entry['digest']}"
          idx = json.loads(blob(entry["digest"]))
          amd = [m for m in idx["manifests"] if m.get("platform", {}).get("os") == "linux" and m["platform"].get("architecture") == "amd64"]
          assert len(amd) == 1, f"{len(amd)} linux/amd64 manifests"
          assert amd[0]["digest"] == exp["SIDECAR_MANIFEST"], f"amd64 manifest {amd[0]['digest']}"
          man = json.loads(blob(amd[0]["digest"]))
          assert man["config"]["digest"] == exp["SIDECAR_CONFIG"], f"config {man['config']['digest']}"
          cfg = json.loads(blob(man["config"]["digest"]))
          for l in man["layers"]:
              blob(l["digest"])
          legacy = json.load(t.extractfile("manifest.json"))
          assert len(legacy) == 1 and legacy[0]["Config"].endswith(exp["SIDECAR_CONFIG"].split(":")[1]), "manifest.json names another config"
          out = {"index": entry["digest"], "amd64_manifest": amd[0]["digest"], "config": man["config"]["digest"],
                 "layers": [l["digest"] for l in man["layers"]], "diff_ids": cfg["rootfs"]["diff_ids"],
                 "repo_tags": legacy[0].get("RepoTags"), "other_platform_entries": len(idx["manifests"]) - 1}
          json.dump(out, open(sys.argv[2], "w"), indent=2)
          print(json.dumps(out, indent=2))
          PY
      - name: Reachability of the MEDIUM findings in these exact bytes
        # CVE-2026-85091 (zlib): overflow in gz_vacate() reached only through
        # gzprintf()/gzvprintf() after a non-blocking gzwrite() stall.
        # CVE-2026-58055 (nghttp2): in the nghttpx PROXY program, not libnghttp2.
        # Unpack the amd64 rootfs from the verified layers and record every
        # ELF that imports a gz write-path symbol, and whether nghttpx exists.
        run: |
          set -euo pipefail
          cd "$W"; E="$W/evidence"; mkdir -p rootfs
          python3 -I - "$W/clamav.tar" "$W/evidence/binding.json" "$W/rootfs" <<'PY'
          import json, sys, tarfile, io
          t = tarfile.open(sys.argv[1]); b = json.load(open(sys.argv[2])); root = sys.argv[3]
          for d in b["layers"]:
              raw = t.extractfile("blobs/sha256/" + d.split(":")[1]).read()
              with tarfile.open(fileobj=io.BytesIO(raw)) as lt:   # gzip/plain auto-detected
                  members = [m for m in lt.getmembers() if not m.isdev() and ".wh." not in m.name]
                  lt.extractall(root, members=members, filter="tar")
          PY
          : > "$E/reachability.txt"
          n=0; hits=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q '^ELF' || continue
            n=$((n+1))
            s="$(readelf --dyn-syms -W "$f" 2>/dev/null | awk '$7=="UND"{print $8}' | sed 's/@.*//' | grep -E '^(gzprintf|gzvprintf|gzwrite|gzputs|gzputc|gzdopen|gzbuffer)$' | sort -u | tr '\n' ' ' || true)"
            if [ -n "$s" ]; then hits=$((hits+1)); echo "IMPORTS ${f#"$W"/rootfs}: $s" | tee -a "$E/reachability.txt"; fi
          done < <(find rootfs -type f -print0)
          echo "elf_files_scanned=$n gz_write_importers=$hits" | tee -a "$E/reachability.txt"
          nx="$(find rootfs -name nghttpx -o -name 'nghttp2*' | sed "s#^rootfs##" | sort | tr '\n' ' ')"
          echo "nghttp2 files: ${nx:-none}" | tee -a "$E/reachability.txt"
          if find rootfs -name nghttpx | grep -q .; then echo "nghttpx_present=yes" | tee -a "$E/reachability.txt"; else echo "nghttpx_present=no" | tee -a "$E/reachability.txt"; fi
          [ "$n" -gt 10 ] || { echo "::error::only $n ELF files found — rootfs extraction failed"; exit 1; }
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.2.0
        with:
          version: v0.69.3
          cache: true
      - name: Scan the exact archive (Deep gate policy) + full record + SBOM
        run: |
          set -uo pipefail
          cd "$W" || exit 1; E="$W/evidence"
          trivy image --download-db-only --db-repository mirror.gcr.io/aquasec/trivy-db:2 || exit 1
          trivy --version > "$E/trivy-version.txt"
          trivy image --skip-db-update --input clamav.tar --scanners vuln --format json --output "$E/trivy-all.json" || exit 1
          img="$(jq -r '.Metadata.ImageID' "$E/trivy-all.json")"
          [ "$img" = "$SIDECAR_CONFIG" ] || { echo "::error::Trivy scanned ImageID $img, expected $SIDECAR_CONFIG"; exit 1; }
          trivy image --skip-db-update --input clamav.tar --format cyclonedx --output "$E/sbom.cdx.json" || exit 1
          jq -r '[.Results[]?.Vulnerabilities[]? | {s: .Severity, f: ((.FixedVersion // "") != "")}]
                 | group_by(.s) | map({severity: .[0].s, total: length, fixable: map(select(.f)) | length})' \
            "$E/trivy-all.json" | tee "$E/severity-summary.json"
          echo "components: $(jq '.components | length' "$E/sbom.cdx.json")" | tee "$E/sbom-summary.txt"
          # The Deep gate's sidecar policy, unchanged: no fixable HIGH/CRITICAL.
          trivy image --skip-db-update --input clamav.tar --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --format table --exit-code 1 | tee "$E/trivy-gate.txt"
          gate="${PIPESTATUS[0]}"
          echo "gate_exit=$gate" | tee -a "$E/trivy-gate.txt"
          {
            echo "### Baked ClamAV sidecar — exact-byte scan"
            echo "OVA \`$OVA_SHA256\` → archive \`$SIDECAR_ARCHIVE_SHA256\` → index \`$SIDECAR_INDEX\` → amd64 manifest \`$SIDECAR_MANIFEST\` → config \`$SIDECAR_CONFIG\` (Trivy ImageID matches)"
            echo; echo '```'; cat "$E/severity-summary.json"; cat "$E/sbom-summary.txt"; echo '```'
            echo "Deep-gate policy (no fixable HIGH/CRITICAL): exit $gate"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$gate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appliance-lab-sidecar-scan-2e3bcc2a1095
          path: ${{ env.W }}/evidence/
          if-no-files-found: warn
