# ─────────────────────────────────────────────────────────────────────────────
# setup-go-cache — single source of truth for the Go toolchain in CI.
#
# Every job that needs Go uses this composite instead of calling
# actions/setup-go directly. That gives one place to:
#   • pin the setup-go action SHA (kills the v6.4.0/v6.5.0 skew that was
#     fragmenting the module/build cache across workflows), and
#   • install the compiler named by the root go.mod `toolchain` line — the
#     same one the release binaries and both Docker builder stages use
#     (CI-REDESIGN §20). setup-go reads the `toolchain` line ONLY while
#     GOTOOLCHAIN is not yet "local"; it exports GOTOOLCHAIN=local itself
#     afterwards, so no workflow may set GOTOOLCHAIN before this action runs
#     (toolchain_consistency_test.go enforces it). The verify step below
#     records the actual compiler in the job log and fails on any mismatch.
#
# NOTE: checkout must happen in the calling job BEFORE this action runs —
# a local composite action can only be resolved from an already-checked-out
# tree, and go-version-file needs go.mod on disk.
# ─────────────────────────────────────────────────────────────────────────────
name: "Setup Go (cached)"
description: "Pinned setup-go with module/build caching, version from go.mod"

inputs:
  cache-dependency-path:
    description: "go.sum path(s) for the cache key (set for nested modules)"
    required: false
    default: "go.sum"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    # The compiler that will run this job, recorded and checked. GOTOOLCHAIN
    # is "local" here (exported by setup-go), so the go command cannot switch
    # to another toolchain behind this check.
    - name: Verify the Go compiler matches go.mod
      shell: bash
      run: |
        want="$(sed -n 's/^toolchain //p' go.mod)"
        have="$(go env GOVERSION)"
        echo "Go compiler: ${have} (go.mod toolchain: ${want:-none}, GOTOOLCHAIN=$(go env GOTOOLCHAIN))"
        if [ -z "${want}" ] || [ "${have}" != "${want}" ] || [ "$(go env GOTOOLCHAIN)" != "local" ]; then
          echo "::error::Go compiler ${have} does not match the go.mod toolchain line (${want:-missing}) with GOTOOLCHAIN=local"
          exit 1
        fi
