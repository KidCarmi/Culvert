# Serve SimpleSAMLphp over plain HTTP on port 80 for CI interop.
#
# The cirrusid/simplesamlphp image ships ONLY a *:443 (HTTPS) vhost for the
# SSP alias. The interop workflow maps host 8082 -> container :80 and fetches
# IdP metadata over http://127.0.0.1:8082, so without a *:80 vhost every
# request lands on Debian's default site and returns a plain Apache 404 before
# PHP/SSP ever runs. This mirrors the image's :443 vhost (Alias + Directory
# grant + RewriteEngine) minus the SSL directives. Mounted into conf-enabled/
# so it loads ahead of sites-enabled/* and becomes the default *:80 vhost.
<VirtualHost *:80>
    PassEnv SSP_APACHE_ALIAS
    DocumentRoot /var/www/
    Alias /${SSP_APACHE_ALIAS} /var/simplesamlphp/public/

    RewriteEngine On

    <Directory /var/simplesamlphp/public>
        Require all granted
    </Directory>
</VirtualHost>
