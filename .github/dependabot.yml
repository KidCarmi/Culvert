version: 2
updates:
  # Go modules — keep direct dependencies up to date
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      google:
        patterns:
          - "google.golang.org/*"

  # Nested module: the PRIVILEGED host-side maintenance agent (sudo boundary).
  # Dependabot does not descend into nested modules — without this entry the
  # agent never receives dependency-update PRs (CI review finding).
  - package-ecosystem: gomod
    directory: "/cmd/culvert-maint"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Docker base images (Dockerfile, Dockerfile.updater) — trivy image scans
  # gate on their CVEs; this makes the fix PRs arrive automatically instead
  # of only the failures (CI review finding).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # GitHub Actions — keep workflow actions pinned to latest
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
