# CI smoke stack — overlay for docker-compose.yml.
#
# Builds the proxy image from the current branch source instead of pulling
# from the registry. Starts only the proxy (--no-deps skips ClamAV/updater).
# Tightens the healthcheck for faster CI feedback.
#
# Usage (CI):
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml build proxy
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-deps proxy

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    # Overrides the registry image tag so compose uses the locally-built image.
    image: culvert:ci-smoke
    # Minimal flags: no CA, no ClamAV, no persistent paths.
    # -ui-no-tls avoids self-signed cert generation overhead.
    command: [
      "-port",    "8080",
      "-ui-port", "9090",
      "-ui-no-tls",
    ]
    # Tightened intervals for fast CI failure detection.
    # Max time to healthy: start_period(5s) + 1 check(5s) = ~10s
    # Max time to unhealthy: start_period(5s) + retries(12) * interval(5s) = 65s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
