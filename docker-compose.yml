# Culvert — full stack with ClamAV antivirus sidecar
#
# Quick start:
#   docker compose up -d
#
# ClamAV downloads its virus definition database on first boot (~250 MB).
# The proxy waits for ClamAV's health check before starting (ports 8080/9090
# are not reachable until then), so first boot takes ~2–5 min; subsequent
# starts are instant because the definitions are persisted in the
# clamav-db volume.
# Watch progress: docker compose logs -f clamav
#
# Persistent data (volume "proxy-data"):
#   /data/ca.bundle         Root CA for SSL inspection
#   /data/blocklist.txt     Domain blocklist (persisted across restarts)
#   /data/policy.json       PBAC policy rules
#   /data/proxy.log         Rotating request log
#   /data/audit.jsonl       Persistent audit trail
#   /data/threatfeeds.json  Local threat intelligence database (auto-synced)
#   /data/ui_users.json     Admin UI users (persisted across restarts)
#   /data/idp_profiles.json IdP profiles — OIDC/SAML SSO providers (persisted across restarts)
#   /data/logstore/         Saved request-log history (enable from the admin UI →
#                           Live Feed → "Save logs to disk"). AES-256 encrypted at
#                           rest when CULVERT_LOG_PASSPHRASE (or CULVERT_CA_PASSPHRASE)
#                           is set; /data/logstore.salt holds the per-store KDF salt.
#
# YARA rules (/app/yara in the proxy container):
#   Starter rules are bundled in the image (yara/sample_rules.yar).
#   Override: mount a host directory over /app/yara, then reload at runtime via
#   POST /api/security-scan/yara/reload

services:

  # ── ClamAV antivirus daemon ─────────────────────────────────────────────────
  # Official image from the ClamAV project (Cisco Talos).
  # clamd listens on TCP 3310 inside the compose network (not exposed to host).
  clamav:
    image: clamav/clamav:1.4
    container_name: culvert-clamav
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav   # persist virus signatures across restarts
    environment:
      - CLAMAV_NO_FRESHCLAMD=false  # run freshclam to keep definitions current
      - CLAMAV_NO_MILTERD=true      # disable milter daemon (not needed here)
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # first run downloads ~250 MB of signatures

  # ── Culvert proxy + admin UI ────────────────────────────────────────────
  proxy:
    # FIXED local image tag (P1.4 / roadmap/D1.6c-pin-value-binding-plan.md).
    # The maintenance agent selects the proxy image by pulling a repo-bound
    # pinned digest and retagging it to culvert/proxy:pinned AT THE SUDO
    # BOUNDARY — not via an env var. There is deliberately no
    # ${CULVERT_PROXY_IMAGE} interpolation here. The tag is LOCAL-ONLY and
    # must be SEEDED before the first `up` — both installers do this
    # (scripts/install.sh for quick-start hosts, packaging/culvert-maint/
    # install.sh for maintenance-agent hosts; see the migration plan §8).
    # Seeding it by hand (e.g. plain `git clone` + `docker compose up`):
    #   docker build -t culvert/proxy:pinned .
    image: culvert/proxy:pinned
    # Uncomment to build locally:
    # build: .
    container_name: culvert
    restart: unless-stopped
    # Graceful-shutdown envelope (PR3d). On `docker compose down`/`stop` and on the
    # maintenance-agent upgrade restart, the proxy needs time to run its shutdown
    # sequence — including the inspected-HTTP/2 GOAWAY drain (up to a 15s tunnel-drain
    # window inside the ~30s late-phase budget). Docker's DEFAULT grace is only 10s,
    # which would SIGKILL the proxy mid-drain and turn the client GOAWAY cosmetic. Set
    # it to cover the full envelope so in-flight decrypted flows drain cleanly. Must
    # stay >= the drain envelope; the maintenance-agent restart path honors it.
    stop_grace_period: 60s
    # Wait for ClamAV to pass its health check before starting the proxy.
    # The proxy still handles transient ClamAV unavailability gracefully
    # (per-request retry), so this just avoids "unreachable" log noise on startup.
    # Long-form `condition: service_healthy` is required here — the short-form
    # list (`- clamav`) only waits for the clamav container to START, not for
    # its healthcheck to pass, which would silently break this comment's
    # promise during the ~2-5 min first-boot signature-download window.
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "8080:8080"   # Proxy (configure browsers / PAC file to point here)
      - "9090:9090"   # Admin Web UI (HTTPS — accept the self-signed cert on first visit)
    volumes:
      - proxy-data:/data
      # Uncomment to use your own YARA rules without rebuilding the image:
      # - ./yara:/app/yara:ro
      # Uncomment to use a custom config file:
      # - ./config.yaml:/app/config.yaml:ro
      # To let the admin UI's Release Management reach the host maintenance
      # agent, do NOT add /var/run/docker.sock here — use the opt-in override
      # docker-compose.maint-agent.yml (mounts only the agent's /v1 UDS).
      # See docs/operator/release-management-agent.md.
    environment:
      - TZ=UTC
      # Optional: manually set the server's public IP/domain for TLS cert SANs.
      # Usually not needed — auto-detected in Docker containers.
      # - CULVERT_PUBLIC_IP=203.0.113.50
      # Encryption-at-rest passphrases — read from the host env / .env file
      # (leave unset to disable; secrets stay out of this file). CA passphrase
      # encrypts the SSL-inspection CA key; LOG passphrase encrypts saved request
      # logs (/data/logstore) and falls back to the CA passphrase when unset.
      - CULVERT_CA_PASSPHRASE=${CULVERT_CA_PASSPHRASE:-}
      - CULVERT_LOG_PASSPHRASE=${CULVERT_LOG_PASSPHRASE:-}
      # Session-cookie HMAC signing key (64 hex chars, >=32 bytes). Required
      # on every node in a multi-node/HA deployment so admin sessions stay
      # valid cluster-wide (docs/OPERATIONS.md §3); leave unset for a single
      # node to let the proxy generate one automatically at startup.
      - CULVERT_SESSION_SECRET=${CULVERT_SESSION_SECRET:-}
      # Release Management catalog/dispatch config. The maint-agent URL is
      # intentionally supplied only by docker-compose.maint-agent.yml, because
      # it is valid only when the Maintenance Agent socket is mounted.
      - CULVERT_RELEASE_PROXY_REPO=${CULVERT_RELEASE_PROXY_REPO:-}
      - CULVERT_RELEASE_CATALOG_TRUST_KEYS=${CULVERT_RELEASE_CATALOG_TRUST_KEYS:-}
      # Break-glass ONLY. Catalog signature verification is enforce-by-default
      # whenever a trust root is present; set this to permissive/disabled to
      # deliberately relax it (e.g. local dev / unsigned catalog). Leave unset
      # in production. PUBLIC keys only above — never private signing material.
      - CULVERT_RELEASE_CATALOG_VERIFY=${CULVERT_RELEASE_CATALOG_VERIFY:-}
      # OPTIONAL signed-catalog auto-seed origin (P1.7). When set AND trust roots
      # are present, the Control Plane fetches + verifies the signed catalog from
      # this URL at startup. Verification happens in the binary; unset ⇒ no fetch.
      # The installer never bakes a default URL.
      - CULVERT_RELEASE_CATALOG_URL=${CULVERT_RELEASE_CATALOG_URL:-}
      # OPTIONAL keyless (Sigstore-identity) trust overrides (P2b). Break-glass /
      # fork-mirror use only — the official identity + trusted root are baked at
      # build time. IDENTITY is JSON {"issuer","san_regex"}; TRUSTED_ROOT is a path
      # to a custom Sigstore TUF trusted_root.json. PUBLIC trust material only —
      # never private signing keys. Unset ⇒ baked defaults (scheme dormant in OSS).
      - CULVERT_RELEASE_SIGSTORE_IDENTITY=${CULVERT_RELEASE_SIGSTORE_IDENTITY:-}
      - CULVERT_RELEASE_SIGSTORE_TRUSTED_ROOT=${CULVERT_RELEASE_SIGSTORE_TRUSTED_ROOT:-}
    command: [
      "-port",           "8080",
      "-ui-port",        "9090",
      "-ca-path",        "/data/ca.bundle",
      "-blocklist",      "/data/blocklist.txt",
      "-policy",         "/data/policy.json",
      "-logfile",        "/data/proxy.log",
      "-audit-log",      "/data/audit.jsonl",
      "-request-log",    "/data/requests.jsonl",
      "-geoip-db",       "/app/GeoLite2-Country.mmdb",
      "-clamav-addr",    "tcp:clamav:3310",
      "-yara-rules-dir", "/data/yara",
      "-threat-feed-db", "/data/threatfeeds.json",
      "-cat-feed-db",   "/data/catfeeddb",
      "-ui-users-file",  "/data/ui_users.json",
      "-fileprofiles-file", "/data/fileprofiles.json",
      "-idp-profiles-file", "/data/idp_profiles.json"
      # Optional extras — uncomment as needed:
      # "-ha-etcd-endpoints", "http://etcd:2379",  # ADR-0005 fencing lease (needs --profile ha)
      # "-syslog",          "udp://10.0.0.1:514",
      # "-ui-allow-ip",     "10.0.0.0/8,192.168.0.0/16",
      # "-session-timeout", "8",
      # "-rate-limit",      "200"
    ]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── etcd fencing-lease witness (ADR-0005) ──────────────────────────────
  # OPTIONAL, profile-gated: enables SAFE automatic HA failover by arbitrating
  # leadership through a fencing lease. Start with:
  #
  #   docker compose --profile ha up -d
  #
  # then add to the proxy command on BOTH Control Planes:
  #   "-ha-etcd-endpoints", "http://etcd:2379",
  #
  # LAB/SINGLE-HOST ONLY as configured here (plaintext client port, never
  # published to the host, single member). A witness on the same host as a
  # CP cannot arbitrate that host's failure — production runs etcd on a
  # THIRD machine (or a 3-node cluster) with TLS (-ha-etcd-ca/-cert/-key).
  # See docs/operator/ha-lease-failover.md.
  etcd:
    image: quay.io/coreos/etcd:v3.6.13   # matches the etcd client pinned in go.mod
    container_name: culvert-etcd
    profiles: ["ha"]
    restart: unless-stopped
    command:
      - etcd
      - --name=culvert-witness
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Culvert CLI (D1.5 operator contract) ────────────────────────────────
  # One-shot operator container for backup, restore, and cleanup commands.
  # Profile-gated, so `docker compose up -d` does NOT start it. Invoke as:
  #
  #   docker compose --profile cli run --rm cli <flags>
  #
  # Examples:
  #
  #   # Encrypted backup (production default)
  #   docker compose --profile cli run --rm \
  #     -e CULVERT_BACKUP_PASSPHRASE \
  #     cli --encrypt \
  #         --backup /backup/culvert-$(date -u +%Y%m%dT%H%M%SZ).tar.gz.enc
  #
  #   # Restore dry-run (safe while proxy is up)
  #   docker compose --profile cli run --rm \
  #     -e CULVERT_BACKUP_PASSPHRASE \
  #     cli --restore /backup/culvert-20260501T030000Z.tar.gz.enc
  #
  #   # List restore leftovers
  #   docker compose --profile cli run --rm cli --list-restore-leftovers
  #
  # See docs/operator/docker-compose-backup-restore.md for the full surface.
  #
  # Same image as `proxy` so the CLI and the daemon never version-skew.
  # It therefore shares the SAME fixed culvert/proxy:pinned tag as proxy
  # (P1.4): a pinned-digest upgrade retags this one local tag, keeping the
  # cli (backup/restore) in lockstep with the running daemon. Mounts /data
  # rw and /backup rw. Does NOT mount /var/run/docker.sock and does NOT
  # expose any ports. Restore commit is offline-only — stop the daemon first
  # (`docker compose down`) before running --confirm.
  cli:
    image: culvert/proxy:pinned
    # Uncomment to build locally (mirrors the proxy service):
    # build: .
    profiles: ["cli"]
    environment:
      # Forwarded from the host/.env so --restore can decrypt an encrypted
      # data/ca.bundle without an extra manual `-e` flag on every invocation.
      # Any backup taken from an SSL-inspecting deployment (which requires
      # this same var for the proxy service) has an encrypted ca.bundle, and
      # restore validation — dry-run and commit alike — hard-fails without
      # it (docs/operator/docker-compose-backup-restore.md §4-6).
      - CULVERT_CA_PASSPHRASE=${CULVERT_CA_PASSPHRASE:-}
    volumes:
      - proxy-data:/data
      - culvert-backups:/backup
    # Operator supplies one-shot flags via `run --rm cli <flags>` — `run`
    # REPLACES this command entirely, so it never reaches the binary above.
    # An empty command here does NOT stop an accidental `docker compose
    # --profile cli up -d`: main.go's one-shot dispatch (backup/restore/
    # list/cleanup/reset-password) only exits early when one of those flags
    # is set, so `./culvert` with no arguments at all falls straight through
    # into normal startup — a full second proxy + admin UI against the same
    # shared proxy-data volume the running `proxy` service owns. `-h` makes
    # Go's flag package print usage and exit immediately instead, so the
    # accidental invocation does nothing rather than running a second daemon.
    command: ["-h"]

volumes:
  proxy-data:
  clamav-db:        # ClamAV signature database — persisted to skip re-download on restart
  culvert-backups: # backup archives produced by the cli service (D1.5; mounted at /backup, only in cli)
  etcd-data:       # fencing-lease witness state (ADR-0005; only with --profile ha)
