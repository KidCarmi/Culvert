# Local development environment for the tac-platform deterministic spine.
# Brings up PostgreSQL and runs the full test suite against it — no cloud, no
# production credentials, synthetic data only.
#
#   docker compose up --build --abort-on-container-exit tests
#
# (In the qualification sandbox the Docker daemon was unavailable, so the suite
# was run against a locally-installed PostgreSQL 16 cluster via scripts/local-pg.sh;
# this compose file is the canonical, portable local environment.)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tac
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tac"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: apply the migration + seed a synthetic worker (tacctl init).
  migrate:
    build: { context: ., dockerfile: Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      TAC_DSN: "postgres://postgres@postgres:5432/tac?sslmode=disable"
    entrypoint: ["/app/tacctl", "init"]

  # Full test suite (unit + PG integration + E2E + failure-injection incl. real
  # cross-process crash semantics). Serialized across packages (-p 1) since they
  # share one database.
  tests:
    image: golang:1.25
    working_dir: /src
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      TAC_DSN: "postgres://postgres@postgres:5432/tac?sslmode=disable"
    volumes:
      - .:/src
    command: ["go", "test", "-count=1", "-p", "1", "./..."]
