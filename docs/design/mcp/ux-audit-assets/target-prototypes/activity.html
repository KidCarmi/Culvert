         ['Client','app-desktop ↳'],['Server','srv-github ↳'],['Tool fingerprint','fp-9a1b2c ↳'],
         ['Environment','prod'],['Destination','approved']],

function chip(t,k){return `<span class="chip ${k}">${t}</span>`;}

function tableHTML(selId){
  return `<table class="act"><thead><tr>
    <th>Time</th><th>Result</th><th>Evaluated → Effective</th><th>Principal / Agent</th>
    <th>Server / Tool</th><th>Reason</th><th>Dur</th></tr></thead><tbody>
    ${ROWS.map(r=>`<tr class="${r.id===selId?'sel':''}">
      <td class="mono nw">${r.t}</td>
      <td>${chip(r.res[0],r.res[1])}</td>
      <td><span class="evaleff">${chip(r.eval,r.eval.startsWith('ALLOW')?(r.eval.includes('REDACTION')?'info':'ok'):'crit')}
        <span class="arw">→</span>${chip(r.eff[0],r.eff[1])}${r.shadow?' <span class="chip warn" title="shadow override">⚠ override</span>':''}</span></td>
      <td>${r.who}</td><td>${r.st}</td><td class="mono">${r.reason}</td><td class="mono nw">${r.dur}</td></tr>`).join('')}
  </tbody></table>`;
}

function drawerHTML(d){
  const sec=(title,rows)=>`<div class="dsec"><div class="dsec-h">${title}</div>
    ${rows.map(r=>`<div class="row"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('')}</div>`;
  const h=d.header;
  return `<div class="drawer">
    <div class="drawer-top"><div class="dt-h"><div>${chip('Decision','muted')} <span class="mono">${d.sel}</span></div><button class="btn ghost sm">×</button></div>
      <div class="dt-title">${chip('Evaluated: '+h.eval[0],h.eval[1])} &nbsp;→&nbsp; ${chip(h.result[0],h.result[1])}</div>
      <div class="dt-meta">${h.st} · ${h.time} · mode ${h.mode}</div></div>
    <div class="drawer-secs">
      ${sec('Why',d.why)}
      ${sec('Context',d.ctx)}
      ${sec('Execution',d.exec)}
      ${sec('Evidence',d.evid)}
      <div class="dsec"><div class="dsec-h">Related activity</div>
        ${d.related.map(x=>`<div class="row"><span class="k" style="text-align:left">• ${x}</span></div>`).join('')}</div>
      <div class="dsec"><div class="dsec-h">Safe actions</div>
        <div class="actions">${d.actions.map((a,i)=>`<button class="btn sm ${i===0?'primary':(a.includes('Quarantine')||a.includes('Revoke')||a.includes('Rollback')?'danger':'')}">${a}</button>`).join('')}</div></div>
    </div></div>`;
}

function render(){
  const st=qp('state','shadow');
  renderShell({active:'activity', title:'MCP Investigations',
    sub:'Activity as a story — what happened, why, and what related context matters', asof:'13:52:45'});
  const filter=`<div class="filterbar">
    <span class="fld">tenant: acme-prod</span><span class="fld">principal: any</span>
    <span class="fld">server: any</span><span class="fld">tool: any</span>
    <span class="fld">action: all</span><span class="fld">reason: all</span>
    <span class="toggle">☑ shadow-override only is off</span>
    <span style="margin-left:auto" class="trunc">as-of 13:52:45</span></div>`;

  let body;
  if(st==='table'){
    body=`<div style="border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
      ${filter}${tableHTML('')}</div>`;
  } else {
    const d=DRAWERS[st]||DRAWERS.shadow;
    body=`<div class="workbench" style="grid-column:1 / -1">
      <div>${filter}${tableHTML(d.sel)}</div>
      ${drawerHTML(d)}</div>`;
  }
  document.getElementById('content').innerHTML=
    `<h1 class="page">MCP Investigations</h1>
     <p class="lede">${st==='shadow'?'A Shadow-executed policy DENY is shown as <b>DENY → exec (shadow) ⚠</b> — it can never read as a plain ALLOW.':'Select a call to follow the full evidence chain in the drawer; every entity is a pivot.'}</p>
     ${body}`;
  shellReady();
}
render();
</script>
