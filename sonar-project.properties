# SonarCloud configuration (read by Automatic Analysis).
#
# Classify Go test files as TEST sources, not main sources. Without this, table
# tests' fixture passphrases/tokens (e.g. `token := "shared-ha-token..."`,
# `testPassphrase = "..."`) are scanned as main code and raise S2068
# "hard-coded credentials" against the "Security Rating on New Code" gate — false
# positives on test fixtures. A large refactor makes this acute because MOVED
# test lines count as "new code". Production code is still fully scanned.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
