# Culvert Maintenance Agent — sample configuration
#
# Install path: /etc/culvert-maint/config.toml
# Mode: 0640, owner root:culvert-maint
#
# All keys are documented in roadmap/D1.6-maintenance-agent-
# implementation-plan.md § 1.3. The agent fails closed on any missing
# required key, unknown enum value, malformed duration / URL / regex,
# or non-absolute path. There is no silent fallback on invalid values;
# documented defaults apply only when optional keys are omitted.

# ── Required ───────────────────────────────────────────────────────────────

# Directory containing the operator's docker-compose.yml. The agent's
# cwd for every `docker compose` invocation. Required; no default.
compose_project_dir = "/srv/culvert"

# UID-or-username allowlist for UDS peer authentication. The agent
# refuses to start with an empty list. Each entry is either a numeric
# UID or a username that exists on the host. Required; no default.
# Single config surface — there is no equivalent CLI flag.
#
# PREFER NUMERIC UIDs. The shipped release binary is statically linked
# (CGO_ENABLED=0), so username resolution uses pure-Go /etc/passwd parsing
# and CANNOT see NSS-backed directories (LDAP/SSSD/systemd-userdb). A
# username that lives only in a directory will fail to resolve and the
# agent will refuse to start. Numeric UIDs always work and are the
# authorization key the agent actually enforces — e.g. allow_peers = ["1000"].
allow_peers = ["culvert-cp"]

# ── Optional — defaults shown ──────────────────────────────────────────────

# Filename within compose_project_dir. Must be a bare filename
# (no path separator).
compose_file = "docker-compose.yml"

# OPTIONAL — a second compose file merged as `-f` onto the proxy-recreate ONLY,
# so an opt-in override survives an agent-driven recreate. Its intended use is
# the maintenance-agent socket wiring (docker-compose.maint-agent.yml): without
# it, the agent recreates the proxy with a single `-f` and DROPS the socket
# mount, so after the first update the Control Plane can no longer reach this
# agent. Bare filename within compose_project_dir; must differ from compose_file.
# NOTE: the agent runs compose with a scrubbed env, so any ${VAR} the override
# interpolates (e.g. ${CULVERT_MAINT_GID}) must be present in
# <compose_project_dir>/.env — compose auto-loads that file. Empty ⇒ disabled.
# compose_override_file = "docker-compose.maint-agent.yml"

# UDS path for the agent's API. Mode is fixed at 0660 regardless. Lives under
# /run/culvert-maint/ — the systemd unit's RuntimeDirectory, owned by the
# unprivileged culvert-maint user (it cannot bind a socket directly in /run).
socket_path = "/run/culvert-maint/culvert-maint.sock"

# State directory root: audit log, per-op logs, optional state.json.
state_dir = "/var/lib/culvert-maint"

# Privilege mode:
#   "sudoers"          — production default. Agent prepends `sudo -n` to
#                        every docker compose invocation; the sudoers
#                        allowlist (/etc/sudoers.d/culvert-maint) bounds
#                        privilege.
#   "docker_group_lab" — dev/lab opt-in. The culvert-maint user is in
#                        the `docker` group, which is effectively
#                        root-equivalent. NOT for production. The agent
#                        emits a WARN log line on startup and a
#                        privilege_warning field in /v1/status.
privilege_mode = "sudoers"

# Host-published proxy endpoint for health checks. Change when the
# proxy port has been remapped or fronted by a TLS terminator.
health_base_url = "http://127.0.0.1:8080"
health_path = "/health"
ready_path = "/ready"

# Hard ceiling on a single operation. Exceeding triggers cancel +
# `failed` with reason `timeout`.
operation_timeout = "30m"

# Default per-stage timeout. Per-stage overrides allowed in code.
stage_timeout = "5m"

# How long after the agent starts (or after a compose up/down of its own ended
# in an error) an upgrade or rollback waits before it moves the tag and
# recreates the proxy. If the previous agent process died in the
# middle of an operation, dockerd is still finishing the last request it sent;
# for a container stop that takes as long as the proxy takes to exit. The wait
# applies only when the previous process may have left a compose up/down
# unfinished (it leaves a marker under state_dir/mutation) or an interrupted
# operation is on record; after installing or upgrading to an agent that keeps
# these markers, it applies at every start until an upgrade, rollback or
# restore has completed once. After an unfinished `compose up` it ends early
# once Docker shows no proxy container running. Must be LONGER than the proxy's stop_grace_period in the
# compose file (60s as shipped) and shorter than operation_timeout. "0s" turns
# the wait off (lab only: a rollback can then report success against a proxy
# that is about to exit). Startup-only; there is no API or GUI for it.
#interrupted_settle = "75s"

# Retention for operations/<op_id>.log and audit.jsonl.
log_retention_days = 30

# Backup-path policy. Every --backup / --restore argument the agent
# forwards to the cli service must, after filepath.Clean, have this
# prefix.
#
# IMPORTANT: this is the path AS SEEN BY THE CLI CONTAINER, not the
# host filesystem. The agent never reads or writes that path directly.
# The cli container mounts the culvert-backups volume at /backup per
# D1.5; the default below matches the supplied compose. Operators who
# remap cli's /backup mount must update this key to keep the prefix
# check meaningful.
allowed_backup_dir = "/backup"

# D1.6c upgrade target allowlist (regex). The default accepts only
# ghcr.io/kidcarmi/culvert with a tag or @sha256: digest. Operators
# may broaden this regex to add other registries, but the per-request
# allowlist cannot be bypassed. Use a TOML literal string (single
# quotes) so backslashes are NOT interpreted as escapes.
image_allowlist = '^ghcr\.io/kidcarmi/culvert(:[A-Za-z0-9._-]+|@sha256:[a-f0-9]{64})$'

# P1.4 — the repository the maintenance agent binds image selection to at
# the sudo boundary. The agent pulls `<proxy_repo>@sha256:<digest>` and
# retags it to the fixed local `culvert/proxy:pinned` tag the compose file
# resolves; CULVERT_PROXY_IMAGE no longer exists. This MUST describe the
# same repository as image_allowlist (install.sh refuses a mismatch).
# Default: ghcr.io/kidcarmi/culvert.
proxy_repo = "ghcr.io/kidcarmi/culvert"

# What startup does with an image change a previous agent process left
# unfinished (contract AGT-900). Startup-only; there is no API to change it.
#   "off"      (default) report it in GET /v1/status and change nothing.
#   "converge" also, while holding the maintenance lock: move the fixed tag
#              back to the recorded previous image when the container still
#              runs it; finish a rollback the journal proves was armed; or
#              accept an upgrade the journal proves passed its health gate and
#              digest check and that answers /ready now; or, when no proxy
#              container is running because the previous agent process died
#              inside that upgrade's own `compose up` (and Docker still lists
#              the never-started container that death leaves, read with
#              `compose ps -a`), put the tag back on the image that was
#              serving before, start it, and require it to answer /ready. Anything else is reported as recovery_required;
#              so is an action that fails its check, with what it changed left
#              in place. It never pulls, never runs `down`, and never starts an
#              image that has not passed the health gate (the target is never
#              started here). If Docker cannot be read it defers.
#              A `compose down` run by hand after that crash removes the
#              never-started container, so it is not undone. Left as the crash
#              left it, the stack is restored. The restore needs the sudoers
#              rule for `compose ps -a` shipped with this version; without it
#              nothing is restored and the entry is reported.
# An agent older than this setting refuses to start with it present: remove
# it before downgrading.
#reconcile_on_startup = "off"

# Resume an upgrade's interrupted health gate (contract AGT-900, ADR-0062
# slice 7). Startup-only; there is no API to change it. Accepted only with
# reconcile_on_startup = "converge"; with any other mode the agent refuses to
# start.
#   false (default) an upgrade whose agent died while health-checking the new
#         image, or after starting it and before checking it, is reported
#         (recovery_required, target_live_ungated) and the new image keeps
#         serving unchecked until you act.
#   true  the next start runs that health check itself, once: only when
#         container, tag and the pinned upgrade reference are on one image
#         that carries the pinned digest (and, if the restart recorded the
#         new image's id, it is that one), no rollback was armed, and no
#         other start has seen the entry since the check began. If the agent
#         died inside that upgrade's `compose up`, also only when the proxy
#         runs and `docker compose ps -a` shows Compose finished (no
#         never-started proxy container; needs that command's sudoers rule). It first records
#         that it is checking (if it cannot, nothing runs), then checks
#         /ready, then container, tag and the running digest. Passed: the new
#         image is accepted with nothing changed in Docker (audit
#         upgrades.apply:resumed). Failed: the rollback is recorded and run
#         in the same start, as for an armed rollback. The upgrade itself
#         stays failed (agent_restart_interrupted); it is not replayed.
# An agent older than this setting refuses to start with it present: remove
# it before downgrading.
#resume_interrupted_gate = false

# Watch the running proxy and record its health (ADR-0062 slice 5, contract
# AGT-007). Startup-only; there is no API to change it. "0s" or absent (the
# default) is off; otherwise between "1m" and "24h".
# Every interval, unless an operation holds the maintenance lock or the
# interrupted_settle window is open, the agent reads the proxy container and
# culvert/proxy:pinned (the same read-only commands status uses), runs the
# health check (/ready, as every upgrade does), and reads both again. If
# anything changed in between, the reading is dropped. It never starts an
# operation, never changes Docker, and writes only <state_dir>/health:
#   latest.json     the last reading: gated, unhealthy or unknown;
#   last_good.json  the last image that passed the check with nothing changing
#                   around it, and that has a <proxy_repo>@sha256 reference
#                   the image_allowlist admits. A failed or unreadable check
#                   never removes it.
# GET /v1/status then reports runtime_health: gated, ungated (the running
# image has not passed the check yet), unhealthy, unknown, or stale (no
# reading for 3 intervals), plus last_good.
# An agent older than this setting refuses to start with it present: remove
# it before downgrading.
#runtime_health_interval = "0s"

# Runtime recovery (ADR-0062 slice 6). "off" (the default) or
# "restore_last_gated"; needs runtime_health_interval on. When the image an
# upgrade of this agent installed fails the health check 3 readings in a row
# (same container, same image), the agent puts back the image that upgrade
# replaced, as its own operation (runtime.recover, holding the maintenance
# lock: other operations get 409 meanwhile). It acts only when all of these
# hold, read fresh: the fixed tag is on the running image; this agent
# installed that image (installed.json, or a kept upgrade record of its own);
# the image it replaced passed the check before (gated.json), is local, has a
# <proxy_repo>@sha256 reference the image_allowlist admits, and declares a
# data-epoch range that includes the data's (an unlabelled image is never
# restored); and fewer than 2 recoveries were begun for that install. It then
# retags, recreates, health-checks and verifies by image id, exactly as the
# startup reconcile finishes an interrupted rollback, and a crash in between
# is finished by the next start with reconcile_on_startup = "converge".
# Anything else is reported in GET /v1/status runtime_recovery and changes
# nothing. A hand retag or a hand `compose up` is never acted on.
# An agent older than this setting refuses to start with it present: remove
# it before downgrading.
#runtime_recovery = "off"
