  - id: TLS-001
    area: tls-inspection
    status: enforced
    owner_approved: false
    invariant: "The upstream leg of an inspected tunnel verifies the origin certificate against the trust roots with a TLS 1.2 floor unless a rule explicitly opts out."
    authority: "Inspection upstream config (proxy_tunnel.go)."
    code:
      - "proxy_tunnel.go"
    configs:
      - "tlsSkipVerify per rule"
      - "decryption profile verify mode"
    transitions:
      permitted:
        - "per-rule skip-verify chosen by an admin, logged per tunnel"
      forbidden:
        - "skipping origin verification by default"
        - "lowering the TLS floor"
    tests:
      - {file: "proxy_tlsconfig_test.go", name: TestUpstreamInspectTLSConfig_VerifyDefaults}
    validation: unit
    compatibility: "Loosening this silently removes origin authentication for all inspected traffic."

  - id: TLS-002
    area: tls-inspection
    status: enforced
    owner_approved: false
    invariant: "With an expired or not-yet-valid inspection CA, an inspect-matched CONNECT is refused; it is never bypassed uninspected."
    authority: "Tunnel dispatch (proxy_tunnel.go); CA validity in internal/ca."
    code:
      - "proxy_tunnel.go"
      - "internal/ca/validity.go"
      - "ca_health.go"
    configs: []
    transitions:
      permitted:
        - "inspection resumes when a valid CA is installed"
      forbidden:
        - "forwarding inspect-matched traffic uninspected because the CA is unusable"
    tests:
