  - id: BKP-004
    area: backup-restore
    status: enforced
    owner_approved: false
    invariant: "A restore commit on a data directory that cannot be renamed (a volume mount point, or an unwritable parent) is all or nothing: it is reported as committed only after every file taken from the archive was read back and matched the backup manifest, and after a failure or a kill at any point the data directory holds its complete previous content by the next start, or Culvert refuses to start. The previous content is kept after a commit."
    authority: "Restore commit (restore.go, restore_inplace.go)."
    code:
      - "restore_inplace.go"
      - "restore_layout_linux.go"
    configs: []
    transitions:
      permitted:
        - "undoing an interrupted in-place restore at the next start, or at the start of the next restore, while holding the single-writer lock"
        - "refusing to start when the intent record is unusable, when a name exists both in the data directory and in the backup directory, or when the single-writer lock cannot be established"
        - "refusing the commit, with nothing changed, while a running process holds the single-writer lock"
      forbidden:
        - "starting on a data directory that mixes previous and restored content"
        - "completing (rolling forward) an interrupted restore"
        - "reporting a commit whose restored files were not verified against the manifest"
        - "deleting previous content during recovery"
        - "offering the backup directory of an unfinished restore for cleanup"
        - "evaluating a restore guard against a half-swapped data directory"
        - "swapping, or undoing another restore's swap, while a live process holds the single-writer lock, whatever CULVERT_ALLOW_MULTIPLE_WRITERS says"
        - "running the whole-directory swap, a backup or a support bundle over an unfinished in-place restore"
    tests:
      - {file: "restore_inplace_test.go", name: TestRestoreInPlace_CrashAtEveryStep_NextStartHoldsThePreviousContent}
      - {file: "restore_inplace_test.go", name: TestRestoreInPlace_RollbackKilledPartWayIsFinishedByTheNextStart}
      - {file: "restore_inplace_test.go", name: TestRestoreInPlace_GuardsAreEvaluatedAfterAnUnfinishedRestoreIsUndone}
      - {file: "restore_inplace_test.go", name: TestRestoreInPlace_OverrideDoesNotSwapUnderALiveHolder}
      - {file: "restore_inplace_test.go", name: TestRestoreInPlace_VerificationFailureRollsBack}
      - {file: "restore_inplace_test.go", name: TestRestoreInPlace_StartupWithoutTheLockRefusesAndChangesNothing}
      - {file: "restore_inplace_test.go", name: TestRestoreInPlace_UnusableIntentRecordStopsEverything}
      - {file: "restore_inplace_test.go", name: TestRestoreInPlace_LiveWriterRefusesBeforeAnyChange}
      - {file: "restore_inplace_test.go", name: TestCleanupLeftovers_NeverOffersTheBackupOfAnUnfinishedRestore}
    validation: integration
    compatibility: "New on-disk state under <data dir>/.restore/ (intent.json version 1). A build that predates it ignores the directory: started on a volume holding an unfinished in-place restore it would run on the half-swapped content, so finish or undo a restore before downgrading. Backups never include the directory."

  - id: AGT-001
    area: agent-lifecycle
    status: enforced
    owner_approved: false
    invariant: "The maintenance agent runs one state-changing operation at a time; a second is refused with a conflict naming the holder."
    authority: "Maintenance agent (cmd/culvert-maint, separate module)."
    code:
      - "cmd/culvert-maint/internal/ops/*.go"
    configs: []
    transitions:
      permitted:
        - "read-only operations concurrently"
        - "the opt-in startup reconcile (reconcile.startup) holding the lock while it runs, with reads served"
        - "the opt-in runtime recovery (runtime.recover) holding the lock while it runs, with reads served"
      forbidden:
        - "two state-changing operations running together"
        - "an operator's state-changing request admitted while the startup reconcile runs"
        - "an operator's state-changing request admitted while a runtime recovery runs, or a runtime recovery begun while any operation holds the lock"
    tests:
      - {file: "cmd/culvert-maint/internal/ops/ops_test.go", name: TestManager_SecondStateChangingOpReturnsConflict}
      - {file: "cmd/culvert-maint/startup_reconcile_converge_test.go", name: TestConvergeRecovery_KillDuringReconcile}
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_RefusesWithoutEveryCondition}
    validation: unit
    compatibility: "Upgrade and backup must not interleave on an appliance. reconcile.startup is a state-changing kind no API admits; it exists only with reconcile_on_startup = \"converge\"."

  - id: AGT-002
    area: agent-lifecycle
    status: enforced
    owner_approved: false
    invariant: "A finished upgrade does not leave the fixed proxy image tag on the new image while the proxy container provably still runs the previous one, when the previous image has an allow-listed registry reference."
    authority: "Maintenance agent upgrade apply (cmd/culvert-maint, separate module)."
    code:
      - "cmd/culvert-maint/internal/server/journal_phases.go"
      - "cmd/culvert-maint/internal/server/rollback_stages.go"
    configs: []
    transitions:
      permitted:
        - "tag and container both on the new image after a restart, healthy or not"
        - "tag on the previous image while a failed rollback leaves the new container running"
        - "tag left on the new image, with an operation-log warning, when the previous image has no allow-listed registry reference"
      forbidden:
        - "ending an upgrade with the tag on the new image after the restart failed before replacing the container"
        - "moving the tag back when the container was replaced or its state could not be read"
        - "moving the tag outside the write-ahead journal window"
    tests:
      - {file: "cmd/culvert-maint/internal/server/pinned_tag_consistency_test.go", name: TestApply_PinnedTag_UpFailsBeforeRecreate_RollbackDisabled_TagRestored}
      - {file: "cmd/culvert-maint/internal/server/pinned_tag_consistency_test.go", name: TestApply_PinnedTag_UpFailsBeforeRecreate_RollbackPullFails_TagRestored}
      - {file: "cmd/culvert-maint/internal/server/pinned_tag_consistency_test.go", name: TestApply_PinnedTag_UpFailsAfterRecreate_RollbackDisabled_TagNotMoved}
      - {file: "cmd/culvert-maint/internal/server/pinned_tag_consistency_test.go", name: TestApply_PinnedTag_RestoreHappensInsideJournalWindow}
    validation: integration
    compatibility: "The backup/restore cli service and every later compose up resolve this tag; a tag ahead of the container is an upgrade nobody health-checked. An agent killed mid-restart is AGT-900, not this entry."

  - id: AGT-003
    area: agent-lifecycle
    status: enforced
    owner_approved: false
    invariant: "Automatic rollback targets the running image's allow-listed registry reference even when Docker also reports a local-only reference for the same image."
    authority: "Maintenance agent upgrade apply (cmd/culvert-maint, separate module)."
    code:
      - "cmd/culvert-maint/internal/server/inline_rollback.go"
    configs: []
    transitions:
      permitted:
        - "skipping rollback when no reported reference passes the digest-form and allowlist gate"
        - "skipping rollback when the running image reports more than one distinct digest"
      forbidden:
        - "skipping rollback because a local-only reference sorts before the registry reference"
        - "rolling back to a reference that fails the allowlist"
    tests:
      - {file: "cmd/culvert-maint/internal/server/pinned_tag_consistency_test.go", name: TestApply_RollbackTarget_IgnoresLocalTagRepoDigest}
      - {file: "cmd/culvert-maint/internal/server/rollback_target_select_test.go", name: TestDeriveRollbackTarget_SelectsFirstRefPassingTheGate}
    validation: integration
    compatibility: "Docker's containerd image store (observed on Docker 29.10) reports the local culvert/proxy name beside the registry name; the classic store does not."

  - id: AGT-006
    area: agent-lifecycle
    status: enforced
    owner_approved: false
    invariant: "An upgrade's reported final running image is one the agent captured after its last container recreate attempt; otherwise the result says it is unverified and names no image. The reported digest is an allow-listed registry digest, never an image id or a local-only reference."
    authority: "Maintenance agent upgrade apply (cmd/culvert-maint, separate module). Design: roadmap/FINAL-RUNNING-DIGEST-PROPOSAL.md (owner decision 2, option C)."
    code:
      - "cmd/culvert-maint/internal/server/running_evidence.go"
      - "cmd/culvert-maint/internal/server/inline_rollback.go"
      - "cmd/culvert-maint/internal/server/handlers_upgrade_apply.go"
    configs: []
    transitions:
      permitted:
        - "one read-only final capture in the report stage when the evidence is stale or missing"
        - "final_running_state unverified with empty digest and image id when no capture after the last up succeeds"
        - "final_running_digest empty with final_running_image_id set for a verified image without an allow-listed registry reference"
      forbidden:
        - "reporting final_running_state verified from accumulator flags or the pinned or rollback target alone"
        - "putting an image id or a local-only reference into final_running_digest"
        - "any mutating Docker call to establish the final running image"
    tests:
      - {file: "cmd/culvert-maint/internal/server/running_evidence_test.go", name: TestRunningEvidence_VerifiedOnlyByACaptureAfterTheLastUp}
      - {file: "cmd/culvert-maint/internal/server/running_evidence_test.go", name: TestApply_FinalRunning_NeverReportsAGuessAsVerified}
      - {file: "cmd/culvert-maint/internal/server/pinned_tag_consistency_test.go", name: TestApply_PinnedTag_UpFailsAfterRecreate_RollbackDisabled_TagNotMoved}
    validation: integration
    compatibility: "Additive result keys final_running_state and final_running_image_id. final_running_digest keeps its key and type; its value changes from an inferred digest to the captured registry digest, or empty when unverified. Consumers must read final_running_state before treating an empty digest as meaningful."

  - id: AGT-007
    area: agent-lifecycle
    status: enforced
    owner_approved: false
    invariant: "The runtime health observer (runtime_health_interval, default off) never begins an operation, never changes Docker, and never writes a journal record or an audit entry; it writes only state_dir/health. It keeps a sample only when the proxy container, its image and the fixed tag were the same before and after the probe and neither the maintenance lock nor the settle window was in the way on either side. last_good.json is written only when the production health gate passed on such a sample and the image has a repo-bound, allow-listed digest reference; no unhealthy, unknown, stale or discarded observation overwrites or clears it."
    authority: "Maintenance agent (cmd/culvert-maint, separate module). Design: docs/adr/0062-maintenance-agent-durable-lifecycle-execution.md slice 5; owner decision 5 (2026-11-24): last-known-good evidence preserved across unhealthy observations."
    code:
      - "cmd/culvert-maint/internal/server/runtime_observer.go"
      - "cmd/culvert-maint/internal/runtimehealth/*.go"
    configs: []
    transitions:
      permitted:
        - "recording an unhealthy or unknown observation over a gated one in latest.json"
        - "replacing last_good with a later image that passes the gate the same way"
        - "skipping a sample while the maintenance lock is held or the settle window is open"
      forbidden:
        - "the observer beginning an operation, running a state-changing Docker command, or writing a journal record or audit entry"
        - "keeping a sample whose container, image, running state or fixed tag changed across the probe"
        - "gating, or writing last_good, while the fixed tag could not be inspected"
        - "writing or clearing last_good from an unhealthy, unknown, stale or discarded observation"
        - "recording as last_good an image without a repo-bound, allow-listed digest reference"
        - "reporting a container id in GET /v1/status runtime_health"
    tests:
      - {file: "cmd/culvert-maint/internal/server/runtime_observer_test.go", name: TestObserver_GatedRecordsLastGood}
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_ObserverTicksTrigger}
      - {file: "cmd/culvert-maint/internal/server/runtime_observer_test.go", name: TestObserver_BadObservationsKeepLastGood}
      - {file: "cmd/culvert-maint/internal/server/runtime_observer_test.go", name: TestObserver_IdentityChangeAcrossTheProbeDiscards}
      - {file: "cmd/culvert-maint/internal/server/runtime_observer_test.go", name: TestObserver_UnreadableTagNeverGates}
      - {file: "cmd/culvert-maint/internal/server/runtime_observer_test.go", name: TestObserver_SkipsWhileTheLockIsHeldOrTheWindowIsOpen}
      - {file: "cmd/culvert-maint/internal/server/runtime_observer_test.go", name: TestObserver_WritesOnlyTheHealthDirectory}
      - {file: "cmd/culvert-maint/internal/server/runtime_observer_test.go", name: TestObserver_GatedWithoutValidatedRefIsNotLastGood}
      - {file: "cmd/culvert-maint/internal/server/runtime_observer_test.go", name: TestObserver_LastGoodIsRepoBoundWhateverTheAllowlist}
      - {file: "cmd/culvert-maint/internal/server/runtime_observer_test.go", name: TestObserver_LastGoodHonoursANarrowAllowlist}
      - {file: "cmd/culvert-maint/internal/runtimehealth/runtimehealth_test.go", name: TestStore_LatestNeverTouchesLastGood}
      - {file: "cmd/culvert-maint/internal/status/status_runtime_health_test.go", name: TestRuntimeHealth_NoContainerID}
      - {file: "cmd/culvert-maint/internal/status/status_runtime_health_test.go", name: TestRuntimeHealth_AbsentWhenOff}
    validation: unit
    compatibility: "New, off by default: with runtime_health_interval unset nothing runs, nothing is written and the GET /v1/status payload is unchanged. When on, it adds state_dir/health/{latest,last_good}.json (schema 1; a reader refuses any other schema, an unknown field or a file over 16 KiB) and the additive status key runtime_health. An older agent ignores the directory; a downgrade leaves it in place unread."

  - id: AGT-008
    area: agent-lifecycle
    status: enforced
    owner_approved: false
    invariant: "The maintenance agent treats an image as able to run on the current data only when the data epoch read through `cli --print-data-epoch` succeeded and lies within the image's io.culvert.data-epoch.min..max labels. An unreadable or absent report, an unlabelled image, one label without the other, or a malformed label is unknown, never compatible; a data epoch outside the range is incompatible."
    authority: "Maintenance agent (cmd/culvert-maint, separate module). Design: docs/adr/0062-maintenance-agent-durable-lifecycle-execution.md slice 6a; owner decision 5 (image and data compatibility before restoring an earlier image) and owner decision 2026-11-28; the proxy side is UPG-003."
    code:
      - "cmd/culvert-maint/internal/server/data_compat.go"
      - "cmd/culvert-maint/internal/runner/data_epoch.go"
    configs: []
    transitions:
      permitted:
        - "reading the data epoch through the profile-gated cli service"
      forbidden:
        - "treating an unlabelled image, or an unreadable data epoch, as compatible"
        - "treating a data epoch outside the image's labelled range as compatible"
        - "accepting a data-epoch report with an unknown field, a missing field or more than one line"
    tests:
      - {file: "cmd/culvert-maint/internal/server/data_compat_test.go", name: TestDataCompat}
      - {file: "cmd/culvert-maint/internal/runner/data_epoch_test.go", name: TestParseDataEpoch}
      - {file: "cmd/culvert-maint/internal/runner/data_epoch_test.go", name: TestParseEpochLabels}
      - {file: "cmd/culvert-maint/internal/runner/data_epoch_test.go", name: TestDataEpochTemplate}
    validation: unit
    compatibility: "Additive: a new read-only template and its fixed-argv sudoers line. An install whose sudoers file predates the line cannot read the data epoch, so every check is unknown and nothing is ever restored (fails closed). No caller acts on it until slice 6."

  - id: AGT-009
    area: agent-lifecycle
    status: enforced
    owner_approved: false
    invariant: "<state_dir>/health/installed.json is written only by an upgrade this agent ran, after its health gate and digest verify passed, and names the image it installed and the image it replaced; an upgrade that failed its gate or was already current writes nothing. <state_dir>/health/gated.json holds at most two distinct images, newest first, and is changed only by a passed runtime gate on an image with a repo-bound, allow-listed digest reference. Both are written only when the runtime health store is on; they are read only by the runtime recovery's admission (AGT-010), which may act on an image only when installed.json or a kept upgrade record of this agent names it, and may restore only an image gated.json holds."
    authority: "Maintenance agent (cmd/culvert-maint, separate module). Design: docs/adr/0062-maintenance-agent-durable-lifecycle-execution.md slice 6 (PR 1); owner decision 2026-11-28 (runtime recovery acts only on images this agent installed)."
    code:
      - "cmd/culvert-maint/internal/runtimehealth/provenance.go"
      - "cmd/culvert-maint/internal/server/runtime_provenance.go"
    configs: []
    transitions:
      permitted:
        - "replacing installed.json with a later verified upgrade"
        - "moving an image already in gated.json to the front when it is gated again"
      forbidden:
        - "writing installed.json for an upgrade that failed, was already current, or did not pass its digest verify"
        - "writing installed.json for an image rollback"
        - "changing gated.json from an unhealthy, unknown, stale or discarded observation"
        - "keeping more than two images, or the same image twice, in gated.json"
    tests:
      - {file: "cmd/culvert-maint/internal/server/runtime_provenance_test.go", name: TestProvenance_VerifiedUpgradeRecordsInstalled}
      - {file: "cmd/culvert-maint/internal/server/runtime_provenance_test.go", name: TestProvenance_OnlyAVerifiedUpgradeWithTheStoreOn}
      - {file: "cmd/culvert-maint/internal/server/runtime_provenance_test.go", name: TestObserver_KeepsTheGatedHistory}
      - {file: "cmd/culvert-maint/internal/runtimehealth/provenance_test.go", name: TestNoteGated_KeepsTwoDistinctNewestFirst}
      - {file: "cmd/culvert-maint/internal/runtimehealth/provenance_test.go", name: TestInstalled_Refusals}
      - {file: "cmd/culvert-maint/internal/runtimehealth/provenance_test.go", name: TestReadGated_Refusals}
    validation: unit
    compatibility: "Additive files under <state_dir>/health (schema 1), written only with runtime_health_interval on. An older agent ignores them; slice 6's executor (AGT-010) reads them only with runtime_recovery on."

  - id: AGT-010
    area: agent-lifecycle
    status: open
    owner_approved: false
    invariant: "With runtime_recovery = \"restore_last_gated\" (default off; accepted only with runtime_health_interval on), the agent changes Docker at runtime only as a runtime.recover operation holding the maintenance lock, begun after 3 consecutive kept not_ready samples of one proxy container and image X, and only when, read fresh under the lock: the settle window is over; that container runs with the fixed tag on X; X is the image installed.json names or the target of a kept upgrade record of this agent; the image R that change replaced is in gated.json, its gated reference passes the repo-bound exact-digest gate and the image allowlist, and it is local as R; R's data-epoch labels admit the data's epoch; and fewer than 2 recoveries were begun for X from that source, counted per (source, image) for every source still in force (installed.json's or a record still in the journal), so two sources authorizing opposite directions cannot alternate past the cap. It counts the attempt and writes the armed runtime.recover record (prior R, target X) before anything moves, both fail-closed, then runs the startup reconcile's armed-rollback plan (AGT-900). Anything else is reported and changes nothing."
    authority: "Maintenance agent (cmd/culvert-maint, separate module). Design: docs/adr/0062-maintenance-agent-durable-lifecycle-execution.md slice 6 (PR 3); owner decision 2026-11-28 (runtime recovery acts only on images this agent installed). Open until the real-Docker qualification (slice 6, PR 4)."
    question: "OPEN until verified on a real Docker daemon (slice 6, PR 4): does the runtime recovery restore the replaced image, refuse every unproven case, and survive a kill at each step, against real Docker in all four cells? If it does, is 3 consecutive not_ready samples the trigger the owner wants?"
    code:
      - "cmd/culvert-maint/internal/server/runtime_recovery.go"
      - "cmd/culvert-maint/internal/server/runtime_recovery_admit.go"
      - "cmd/culvert-maint/internal/runtimehealth/recover_attempts.go"
    configs:
      - "cmd/culvert-maint/internal/config/config.go"
    transitions:
      permitted:
        - "retagging to R's gated, validated reference, `compose up`, a fresh gate and verification by image id, then audit-first retirement of its own record, as the armed-rollback plan of AGT-900"
        - "reporting a refusal in GET /v1/status runtime_recovery without beginning an operation"
      forbidden:
        - "acting with runtime_recovery off, or without the observer"
        - "acting on fewer than 3 consecutive kept not_ready samples of the same container and image"
        - "acting on an image this agent did not install: a hand retag, a hand `compose up`, or an image no installed.json or kept upgrade record of this agent names"
        - "restoring an image not in gated.json, without a repo-bound allow-listed reference, not local as that image, or not proven compatible with the data"
        - "acting while the settle window is open or another operation holds the lock, or when the fixed tag is not on the running image"
        - "moving anything before the attempt is counted and the armed record written, or beyond 2 recoveries begun for one install"
        - "forgetting the count of a source still in force when another is counted, or trimming the counter instead of refusing at its bound"
        - "removing its record before the operation's terminal audit entry is durable (the orchestrator's terminal sequence: stamp the outcome, audit, then settle)"
        - "retiring any record but its own"
    tests:
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_RestoresTheReplacedImage}
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_RefusesWithoutEveryCondition}
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_AdmissionRepeatedUnderTheLock}
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_TheCapIsDurable}
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_FromAKeptUpgradeRecord}
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_NoPingPongBetweenTwoSources}
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_TerminalAuditBeforeTheRecordGoes}
      - {file: "cmd/culvert-maint/internal/runtimehealth/recover_attempts_test.go", name: TestRecoverAttempts_KeepsEverySourceInForce}
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_TriggerCountsConsecutiveNotReady}
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_ObserverTicksTrigger}
      - {file: "cmd/culvert-maint/internal/server/runtime_recovery_test.go", name: TestRuntimeRecovery_WorkerRunsATriggerAndStops}
      - {file: "cmd/culvert-maint/internal/config/config_runtime_recovery_test.go", name: TestLoad_RuntimeRecovery}
      - {file: "cmd/culvert-maint/internal/runtimehealth/recover_attempts_test.go", name: TestRecoverAttempts_Refusals}
    validation: unit
    compatibility: "New, default off: nothing changes unless runtime_recovery is set. Adds <state_dir>/health/recover_attempts.json (schema 1). An agent older than this key refuses to start with it present; one before PR 2 reports a runtime.recover record as an interrupted operation of unknown kind."

  - id: CFG-001
    area: config-compatibility
    status: enforced
    owner_approved: false
    invariant: "Every rollback-surface setting survives capture, apply and re-capture of a configuration version unchanged."
    authority: "Configuration versioning (configversion.go, config_surfaces.go)."
    code:
      - "configversion.go"
      - "config_surfaces.go"
      - "internal/configver/*.go"
    configs: []
    transitions:
      permitted:
        - "adding a surface together with its capture and apply"
      forbidden:
        - "a setting lost or altered by a rollback round trip"
    tests:
      - {file: "config_surfaces_test.go", name: TestConfigSurfaces_RollbackRoundTrip}
    validation: integration
    compatibility: "Stored configuration versions on customer disks must keep applying."

  - id: CFG-002
    area: config-compatibility
