# Product contracts registry.
#
# Each entry is a customer-observable invariant, the code that implements it and
# the tests that must fail if it breaks. Checked by internal/contracts
# (TestRegistry_IsSoundAgainstThisTree, in the ordinary test suite) and by
# `go run ./cmd/contractcheck impact` in CI, which compares against the BASE
# revision of this file. Design: docs/engineering/PRODUCT-CONTRACTS.md.
#
# status: enforced  the listed tests exist, run, and guard the invariant.
#         open      recorded because it matters, but contradictory, undecided or
#                   pending; `question` says what the owner has to decide. An
#                   open entry is NOT an approved rule.
# owner_approved    false until the product owner has confirmed the wording.
#                   Every seed entry is false: they were derived from code,
#                   tests and docs by an audit, not ratified.
#
# To change or remove a contract on purpose, add an `amended` or `retired`
# record with a reason in the same change. The gate is fully automated: an
# unrecorded weakening fails, and a recorded one passes and is listed in the
# gate summary with its reason. No human approval is required.
version: 1

# The gate's own files. Editing them is listed in the gate summary so it never
# passes unseen; it is not refused. Read from the BASE revision. This file is
# not listed: adding an entry stays cheap, and removing or rewording one is
# caught by the base comparison instead.
protected:
  - internal/contracts/**
  - cmd/contractcheck/**
  - .github/workflows/product-contracts.yml

amended:
  - id: AGT-009
    reason: "ADR-0062 slice 6, PR 3: the provenance files are now read, by the runtime recovery's admission only (AGT-010, runtime_recovery on, default off). The invariant said 'nothing in this build acts on them'; it now says who reads them and what they can authorize (acting only on an image installed.json or a kept upgrade record of this agent names; restoring only an image gated.json holds). How they are written is unchanged and no registered test was edited. owner_approved stays false."
  - id: AGT-001
    reason: "ADR-0062 slice 6, PR 3: runtime.recover is a new state-changing kind. It holds the maintenance lock while it runs, like reconcile.startup, so an operator's state-changing request gets 409 naming it; it is begun only when no operation holds the lock. The invariant (one state-changing operation at a time) is unchanged; one permitted holder and one forbidden admission are added, with a test. No registered test was edited (ops_test.go's kind list gains the kind). owner_approved stays false."
  - id: AGT-900
    reason: "ADR-0062 slice 6, PR 2 (owner decision of 2026-11-28: runtime recovery acts only on images this agent installed). The startup reconcile now decides a new record kind, runtime.recover, which slice 6's executor (PR 3, not in this build) writes armed at phase restarted before it moves anything. It is decided by the unchanged armed-rollback branch, so the steps are exactly those already permitted for an armed inline rollback, with one added gate: any verdict that tags or starts the prior needs the prior image's data-epoch labels to admit the data directory's current epoch (AGT-008, read at this start); incompatible or unknown reports recovery_required (restore_incompatible / restore_compatibility_unknown) and changes nothing. A runtime.recover record not armed, or at any phase but restarted, is reported. The invariant is widened by that one clause; upgrade and image-rollback records decide exactly as before (the lifecycle model's decision table is unchanged for them, and the differential test compares the real decision with it over all 580,608 inputs). New permitted and forbidden transitions and tests are added; no registered test was edited. Nothing in this build writes such a record, so behaviour is unchanged until PR 3. owner_approved stays false."
  - id: AGT-900
    reason: "Owner decision of 2026-11-26 (ADR-0062 slice 7): resume an interrupted health gate after a death inside the operation's own compose up when Compose is shown to have finished. Real-Docker qualification showed up_done_unrecorded, the case the owner chose on 2026-11-25, is attributed as a death inside compose up (the agent was killed before its compose up returned to it, though Docker had finished the recreate), which the slice 7 rule 'never resume after a death inside compose up' refused. Asked, the owner chose to allow it with proof: the proxy container runs the identified target and compose ps -a (slice 4's read-only evidence) lists no never-started proxy container; a leftover, unreadable or unread listing resumes nothing. The permitted and forbidden transitions are narrowed to that. The listing is read only with resume_interrupted_gate on and the proxy running, so nothing more is read with the switch off (pinned by the new TestResume_OffDoesNotReadTheComposeListingWithTheStackUp). No registered test is edited; the invariant text is unchanged; owner_approved stays false."
  - id: AGT-900
    reason: "ADR-0062 slice 7 correction (owner decision of 2026-11-25 to cover up_done_unrecorded). The real-Docker qualification showed that case is at phase restarting with no recorded target id (the restart records it in the write the death skipped), which the first slice 7 wording refused, so the owner's case was not covered. The permitted resume now also applies at restarting, with the image identified on fresh facts (container, tag and validated target reference on one id, not the prior's, carrying the pinned digest: the restart's own check, made now); at restarted the recorded id must still agree. The digest condition is now a precondition at both phases (an image without the pinned digest is reported, no longer gated then rolled back). Two registered tests are edited on purpose: TestResume_RefusedWithoutFreshEvidence no longer lists 'the record is at restarting' as a refusal (it now lists a restarting record WITH a recorded id, a second start at restarting, and a recorded id of another image), and TestResume_VerifyMismatchRollsBack now changes the digest after the gate, since a mismatch before it is no longer gated (pinned by the new TestResume_RefusedWhenTheImageLacksThePinnedDigest). The invariant text is unchanged; owner_approved stays false."
  - id: AGT-900
    reason: "ADR-0062 slice 7 (owner decision 4 of 2026-11-24: safe forward resumption of interrupted health gates as a separately qualified slice; owner decision of 2026-11-25: it also covers a gate that never began). With the new resume_interrupted_gate = true (default false, accepted only with converge), the startup reconcile may now ADOPT a target whose interrupted health gate it runs again at this start and that passes it and its digest verify, where it reported recovery_required/target_live_ungated before. The invariant is widened by that one clause; 'never starts an image that has not passed the health gate' and 'adopting or restarting a target that never passed the health gate' are unchanged (the target is adopted only after a passed gate, and nothing is started). A failed resumed gate goes, in the same start, through the unchanged armed-rollback finish. New permitted and forbidden transitions and tests are added; no registered test was edited. With the switch off nothing changes, pinned by TestResume_OffLeavesTheTargetReported and RV19's 'the switch changes no other verdict'. owner_approved stays false: the owner approved the direction, not this wording."
  - id: AGT-900
    reason: "Owner decision of 2026-11-24 (restore_prior), built as ADR-0062 slice 4 on #2051's plan executor and #2103's command attribution. With reconcile_on_startup = \"converge\", a start that finds no proxy container running for an upgrade at restarting or restarted, and that found the previous agent process died inside a `compose up` of that record's own operation, retags to the validated prior reference, runs `compose up` (once more if a fresh read shows nothing running), gates and verifies by image id before retiring the record. Until now that state was always recovery_required (stack_down): an outage until an operator acted (measured on real Docker at kill points 9-12). The invariant's 'or reports recovery_required and changes nothing' is reworded because a restore, like an armed rollback, that fails its gate has changed Docker and then reports. The earlier marker-based design (#2093) was parked after three independent reviews found wrong restores; the attribution it now rests on is per operation, taken once, never decisive on its own (ADR-0062 slice 4 obligations). An independent review found the attribution can outlive a `compose up` that returned while the state directory could not be written, so an operator's later `compose down` would have been undone (B1, reproduced). By the owner's decision of 2026-11-25 a restore also requires Docker's evidence of that death: a proxy service container (not a `compose run` one-off) in state created, listed through a new read-only `compose ps -a` sudoers rule. Without it, or without the rule, nothing is started and the record is reported. Default stays off; owner_approved stays false."
  - id: AGT-004
    reason: "Owner decision 1 on AGT-900 approved an opt-in startup reconcile (reconcile_on_startup = \"converge\", default \"off\"). \"Changes nothing in Docker\" and \"removes no journal record at startup\" now hold for the default \"off\" mode, which is unchanged and still pinned by the same tests; with \"converge\" the startup may retag to the recorded prior image, finish an armed rollback, and retire a record it verified converged, as AGT-900 states. Pulling at startup, and reporting an interrupted operation as succeeded, stay forbidden in both modes."
  - id: AGT-005
    reason: "Owner decision 1 on AGT-900 (recommendation D4): with reconcile_on_startup = \"converge\", the startup reconcile may also retire an interrupted record, but only after it verified convergence by image id and wrote the audit entry first. In the default \"off\" mode retirement is unchanged: only a later successful upgrade or image rollback."
  - id: AGT-005
    reason: "restore.commit is now journaled and an interrupted restore is reported at every start (ADR-0061 addendum, 2026-11-24). Without a way to clear it, the entry of an interrupted restore would stay until the next image change, which on an appliance that is restored but not upgraded is indefinitely. The set of retiring operations is therefore WIDENED by one case: a later restore.commit or rollbacks mode=data that succeeds (its commit command returned success and its health check passed) retires the interrupted records of the restore-class kinds only (restore.commit, rollbacks mode=data), audit entry first, by the same interrupted_superseded mechanism. It never retires an upgrade or image-rollback record, because a restore does not re-pin the image tag; that is a new forbidden transition with its own tests. The existing rules are unchanged and no registered test was edited: a successful upgrade or image rollback still retires every other record, and the converge reconcile still retires only after verified convergence. Not owner-approved; the wording is the implementer's."
  - id: AGT-900
    reason: "Owner decision 1 resolved the open question for an opt-in, conservative converge mode: default off; no adoption of an unverified target; recovery_required when evidence is insufficient; Docker unavailable defers. The invariant is restated for that mode, with its tests; the entry stays open until a real-Docker e2e verifies it (owner, 2026-11-23). owner_approved stays false."
  - id: AGT-900
    reason: "Owner decision 1 (2026-11-23): finish an already-armed rollback. Real-Docker e2e finding 2 (PR #2043): when the journal proves the inline rollback was armed but the agent was killed before the rollback's own `docker tag` (container and tag still on the target that failed its gate), converge reported recovery_required and left the failed image running. It now retags to the record's validated prior reference, rechecks Docker immediately before each mutation (any change its own steps do not explain stops it), runs `compose up`, gates the prior image afresh and verifies container, tag and prior reference by image id, within the persisted attempt cap. No armed record is retired without a fresh ready probe of the prior image: one found with container and tag on the prior, and one realigned by retag alone (container already on the prior), are kept recovery_required until the prior answers ready; an armed record at phase verified contradicts the journal and is reported. The entry stays open and owner_approved stays false."
  - id: POL-004
    reason: "Owner decision of 2026-11-24 (POL-005 widening). The invariant is unchanged. The control at the end of TestPOL004_RollbackKeepsARetainedUnknownActionRule asserted that a restore SKIPS a Redirect rule with no location; a restore no longer skips any stored rule, so the control now asserts that rule is restored beside the unknown-action rule."
  - id: POL-005
    reason: "Owner decision of 2026-11-24, explicitly revising SEC-POLICYDROP-1: the invariant is widened from 'a rule whose ruleType is unrecognised' to 'any rule this build cannot enforce as written' (an access rule carrying a subjectMatch or an auth spec, an invalid auth rule, a null entry). Load and ReplaceAll used to drop such a rule and install the rest; a dropped Block rule under default allow forwarded its traffic (measured: 200, backend reached). The gate, its doors and the eight pre-existing POL-005 tests are unchanged; tests are added. Existing tests elsewhere that asserted the per-rule drop were migrated to assert whole-ruleset refusal. An empty entry (null or {}) is refused at every door. Rollback applies the gate and then restores every stored rule as stored, instead of skipping rules the write-time validator refuses. Record: docs/engineering/security-reviews/2026-11-24-ruleset-refusal-supersedes-per-rule-drop.md."
  - id: AGT-004
    reason: "ADR-0062, owner decision 2 (2026-11-24): the state_dir instance lock is now held in EVERY mode, taken before anything under state_dir is read or rewritten and before the socket is bound, so a second agent on the same state_dir refuses to start (it used to serve and admit operations beside the first, and replace its socket). Off mode still changes nothing in Docker and runs no reconcile; TestOffMode_StatusAndStateUnchanged now asserts the off-mode agent HOLDS the lock instead of asserting no lock file exists. Not owner-approved wording."
  - id: AGT-900
    reason: "ADR-0062, owner decision 2: a second agent process on the same state_dir no longer starts and skips its reconcile; it refuses to start (non-zero exit, no socket, no Docker change, record kept) while the first keeps serving. TestConvergeRecovery_SecondInstanceSkips is replaced by TestConvergeRecovery_SecondInstanceRefusesToStart. The reconcile still takes the lock itself when a server is built without it (tests), so its skipped_second_instance state remains reachable there. Not owner-approved wording."
  - id: POL-005
    reason: "Owner decision of 2026-11-24 (unknown JSON fields: unify the contract across all entry points, prefer explicit rejection, preserve compatibility through an explicit strategy). The invariant is widened again, in the same direction: a rule object carrying a JSON key this build has no field for (a misspelt condition, or one added by a newer release), or the same key twice (the last value won), is a rule it cannot enforce as written, because a condition present in the document is not enforced and the rule matches more than was written. Measured before the change: the policy file, a stored config version, a pending draft and a control-plane snapshot each installed an Allow narrowed only by an unknown key as an Allow for every source. The operator doors already refused an unknown key (400 'invalid JSON') and accepted a duplicate; they now refuse both and name the rule and the keys. The gate, its doors, its Diagnostics code and every registered test are unchanged; tests are added. Compatibility strategy, now part of the contract: every rule key other than the reserved 'annotations' container is an enforcement condition, 'annotations' is carried in canonical form (on which it is bounded) and never interpreted, and a test pins today's key set. A rule list given twice in one document is refused likewise. Key matching stays case-insensitive, documents around rules (ConfigSnapshot sections) stay tolerant, and no legacy key is allowlisted because the available history holds none on a rule. Record: docs/engineering/security-reviews/2026-11-24-unknown-rule-fields-refused.md."
  - id: AGT-004
    reason: "ADR-0062 slice 3 (command attribution). The invariant is unchanged for every start that serves. One start is now refused: when a journal record says the agent died inside a docker compose command (an open command intent) and that start cannot remove the intent from the record, the agent exits before serving, and before any journal record is audited, counted or reported (the idempotency store has already been opened by then, and has marked its own in-flight requests interrupted, as at every start). If several records hold intents and a later one cannot be rewritten, the earlier ones have already had theirs removed, and what they showed is lost with that start; a record a newer agent wrote is detected before any is touched. Until now an unwritable journal never stopped startup. Reason: such a start would report the interruption with the intent still on disk; an operator could react to the report (stop the stack), and the next start would find the same intent, take it for new, and a later recovery could act on it. The first start that can write is then the first to report. A journal that holds no open intent is reported from memory as before (TestInitJournal_ReadOnlyJournalStillReports stands). With an unwritable state directory the agent could not have run any operation, only reported; systemd restarts it. A record written by a newer agent that carries an open intent is refused the same way with its own message, since this build may not rewrite it. This narrowing was agreed between the two engineering sessions working on ADR-0062 and is written into its rule 2; owner_approved stays false and the owner has been told."
  - id: AGT-004
    reason: "ADR-0062 slice 2 (journal schema version). A journal record written by a NEWER agent (schema above this build's) is listed in status like any interrupted record, but this build never rewrites or removes it, so a later successful image change does not clear it: its fields may say the state is unsafe in a way this build cannot read. This narrows 'lists it until a later image change succeeds' for that one case; records this build or an older agent wrote are unchanged, and no registered test was edited (new tests: TestRetire_NewerRecordIsNeverSuperseded, TestNewerSchema_IsNeverRewrittenOrRemoved). Not owner-approved; the wording is the implementer's."
  - id: AGT-005
    reason: "ADR-0062 slice 2. Retirement is narrowed, never widened: a record a newer agent wrote is never removed by this build, neither by a later success nor by the converge reconcile (which reports it recovery_required/record_from_newer_agent without reading Docker), and no interrupted_superseded entry is written for it. Unknown keys of any record now survive every rewrite, and an agent released before slice 2 is fenced off a directory holding schema-2 records (it refuses to serve on the fence record's unknown phase). Existing retirement rules and their tests are unchanged. Not owner-approved; the wording is the implementer's."
  - id: AGT-004
    reason: "ADR-0062 slice 1 (owner decision 1: keep durable operation records until the appliance state is proven safe). A journaled operation that ENDS failed without proving its end state safe now keeps its record: it is listed in status at once and reported by every later start exactly like an interrupted operation, but marked with its own failure reason instead of agent_restart_interrupted, and its interruption audit entry is not written (it has its terminal entry). Startup with reconcile_on_startup = off may now remove one kind of record: one whose operation ENDED (it carries terminal_outcome, written before the terminal audit) and either succeeded or proved its end state safe, and only after that operation's terminal audit entry is on file (written at that start if the audit log lacks it). This finishes the operation's own terminal sequence that a kill cut short; it is not a reconcile, reads no Docker and changes nothing in Docker. The forbidden transition is narrowed from 'removing a journal record at startup' to 'removing the record of an interrupted operation, or of an ended one whose end state is not proven safe'. No registered AGT-004 test was edited. Not owner-approved; the wording is the implementer's."
  - id: AGT-005
    reason: "ADR-0062 slice 1. Before, the orchestrator removed an operation's own record at every terminal state and only then wrote the terminal audit entry. Now: (1) the operation's own record is removed at its end only when it succeeded or proved its end state safe (upgrades.apply: never wrote the write-ahead barrier, or its inline rollback passed its gate and verify; rollbacks.create mode=image: failed before rollback_restart; restore-class: never reached the stopping stage, or committed and passed its health check), and only after its terminal audit entry is durable; (2) otherwise the record is KEPT and is retired exactly like an interrupted record (later successful upgrade or image rollback; for a restore-class record also a later established restore; verified converge), each retirement first completing the kept record's own terminal entry if it was never durable. Two registered tests were edited because they asserted the old removal of the failing operation's OWN record, never a retirement: TestRetireRestore_NotWhenTheRestoreDidNotEstablishItsState now expects the failed restore's own record beside the untouched stale ones when it had stopped the stack, and TestRetireRestore_AuditFailureKeepsRecord now also expects the op's own record to stay (its audit entry could not be written). Every stale-record assertion is unchanged. Not owner-approved; the wording is the implementer's."
  - id: AGT-900
    reason: "ADR-0062 slice 1. With reconcile_on_startup = converge the startup reconcile now also decides records KEPT by operations that ended failed without proving their end state safe, with the same, unchanged decision table and the same retirement rule (verified convergence and the :reconciled audit entry first); before retiring such a record it completes the record's own terminal audit entry if it was never durable. The decision table, the attempt cap and the forbidden transitions are unchanged; the invariant is widened from 'after a crash during an image change' to also cover 'after an image change that failed without proving its end state safe'. Not owner-approved; the wording is the implementer's."
  - id: AGT-002
    reason: "ADR-0062 slice 1, no change to the invariant. Two registered tests (TestApply_PinnedTag_UpFailsBeforeRecreate_RollbackDisabled_TagRestored, TestApply_PinnedTag_RestoreHappensInsideJournalWindow) ended with an incidental assertion that the failed upgrade's journal record was removed. Such an upgrade failed past the write-ahead barrier with no inline rollback that passed its gate, so its record is now KEPT (AGT-005 amendment). The assertion is replaced by a stricter one: exactly the op's own record remains, stamped failed:command_error and audited. Every tag and container assertion is unchanged. Not owner-approved."
retired: []

contracts:
  - id: SWG-001
    area: swg-enforcement
    status: enforced
    owner_approved: false
    invariant: "A CONNECT to a private, loopback or link-local destination is refused before any dial, and re-checked at connect time."
    authority: "Proxy request path (package main); address classification in internal/ssrf."
    code:
      - "proxy_tunnel.go"
      - "security.go"
      - "internal/ssrf/*.go"
    configs: []
    transitions:
      permitted:
        - "CONNECT to a public destination proceeds to policy"
      forbidden:
        - "dialing a private destination for a CONNECT"
        - "removing the connect-time re-check"
    tests:
      - {file: "proxy_test.go", name: TestUNAUTH_CONNECT_SSRFBlocksLoopback}
    validation: integration
    compatibility: "Operators rely on this as the SSRF boundary for tunnels; loosening it is a security-posture change."

  - id: SWG-002
    area: swg-enforcement
    status: enforced
    owner_approved: false
    invariant: "On an inspected tunnel, an inner request whose Host or :authority differs from the CONNECT host is blocked before the upstream is contacted."
    authority: "Inspection pipeline (inspect_host_pin.go)."
    code:
      - "inspect_host_pin.go"
      - "internal/hostpin/pin.go"
      - "proxy_tunnel.go"
    configs: []
    transitions:
      permitted:
        - "inner host equal to the CONNECT host after canonicalization"
        - "any inner host when the CONNECT target is an IP literal"
      forbidden:
        - "forwarding an inner request for a host policy never evaluated"
        - "forwarding a request with no Host"
    tests:
      - {file: "inspect_host_pin_test.go", name: TestInnerHostPin_MismatchIsRefusedBeforeTheUpstreamIsContacted}
    validation: integration
    compatibility: "Clients that reuse a tunnel for another origin receive 403; that is the intended behaviour."

  - id: POL-001
    area: policy
    status: enforced
    owner_approved: false
    invariant: "Enabled access rules are evaluated in priority order and the first match decides; no match returns no decision."
    authority: "Policy engine (policy.go)."
    code:
      - "policy.go"
    configs: []
    transitions:
      permitted:
        - "reordering by changing rule priority"
      forbidden:
        - "a later rule overriding an earlier match"
        - "a disabled rule deciding a request"
    tests:
      - {file: "policy_test.go", name: TestPolicyStore_Evaluate_FirstMatch}
      - {file: "policy_flow_e2e_test.go", name: TestPolicyFlow_PriorityFirstMatchWins}
    validation: integration
    compatibility: "Every stored rulebase depends on this order; changing it changes the meaning of existing customer policies."

  - id: POL-002
    area: policy
    status: enforced
    owner_approved: false
    invariant: "At startup an explicit default action is honoured; an empty one resolves to allow with zero configured rules and to deny with any configured rule."
    authority: "Startup resolution (rewrite_default_action_startup.go)."
    code:
      - "rewrite_default_action_startup.go"
      - "proxy.go"
    configs:
      - "default_action"
      - "CULVERT_DEFAULT_ACTION"
    transitions:
      permitted:
        - "explicit allow or deny chosen by the operator"
      forbidden:
        - "an empty default resolving to allow while rules are configured"
    tests:
      - {file: "rewrite_default_action_startup_test.go", name: TestLoadRewriteAndDefaultAction_EmptyWithRulesDefaultsDeny}
      - {file: "rewrite_default_action_startup_test.go", name: TestLoadRewriteAndDefaultAction_EmptyWithNoRulesDefaultsAllow}
    validation: unit
    compatibility: "Existing installs with no explicit value get their posture from this rule; see POL-900 for the runtime gap."

  - id: POL-003
    area: policy
    status: enforced
    owner_approved: false
    invariant: "A request that matches no rule under default deny receives a block response, not a forwarded request."
    authority: "Proxy request path (proxy.go)."
    code:
      - "proxy.go"
    configs:
      - "default_action"
    transitions:
      permitted:
        - "allow when the operator set default allow"
      forbidden:
        - "forwarding a no-match request under default deny"
    tests:
      - {file: "proxy_test.go", name: TestHandleRequest_DefaultDeny_NoRules}
    validation: integration
    compatibility: "Default-deny deployments rely on this as their fail-closed baseline."

  - id: POL-004
    area: policy
    status: enforced
    owner_approved: false
    invariant: "A matched rule with an unrecognised action blocks the request and is terminal."
    authority: "Policy dispatch (proxy.go, authpolicy.go)."
    code:
      - "proxy.go"
      - "authpolicy.go"
    configs: []
    transitions:
      permitted:
        - "adding a new recognised action together with its dispatch"
      forbidden:
        - "an unrecognised action falling through to allow"
    tests:
      - {file: "policy_unknown_action_test.go", name: TestSECPOLICYACTION1_UnknownActionBlocksAndIsTerminal}
      - {file: "policy_unknown_action_test.go", name: TestSECPOLICYACTION1_ReplaceAllRetainsUnknownActionAndBlocks}
      - {file: "policy_unknown_action_test.go", name: TestSECPOLICYACTION1_LoadRetainsUnknownActionAndBlocks}
      - {file: "policy_unknown_action_e2e_test.go", name: TestPOL004E2E_ReplaceAllUnknownActionNeverReachesBackend}
      - {file: "policy_unknown_action_e2e_test.go", name: TestPOL004E2E_LoadUnknownActionNeverReachesBackend}
      - {file: "policy_unknown_action_doors_test.go", name: TestPOL004_RollbackKeepsARetainedUnknownActionRule}
      - {file: "policy_unknown_action_doors_test.go", name: TestPOL004_DraftCommitIsNotBlockedByAnInheritedUnknownActionRule}
    validation: integration
    compatibility: "A rulebase written by a newer release must not become permissive on an older one."

  - id: POL-005
    area: policy
    status: enforced
    owner_approved: false
    invariant: "A ruleset containing a rule this build cannot enforce as written (an unrecognised ruleType, a JSON key the build has no rule field for, the same key given twice, or any shape the persistability gate refuses) is refused whole at every door, and the running and persisted policy are unchanged. No replacement, normalization, migration or compatibility conversion may silently remove an enforcement rule."
    authority: "Policy store and its bulk doors (policy_ruletype_gate.go, policy.go)."
    code:
      - "policy_ruletype_gate.go"
      - "policy_preflight.go"
      - "policy_unknown_field.go"
    configs: []
    transitions:
      permitted:
        - "adding a new recognised ruleType together with the stage that evaluates it"
      forbidden:
        - "installing a rule of an unrecognised ruleType, which no stage evaluates"
        - "dropping such a rule and applying the rest of the ruleset"
        - "starting with the default action in place of a policy file that was refused"
        - "applying a reloaded default action over the rules of the previous configuration when the reloaded policy file was refused"
        - "reporting, auditing or versioning a refused ruleset as applied"
        - "dropping a rule the build cannot enforce and installing the rest of the ruleset"
        - "restoring a stored config version without one of its rules"
        - "installing an empty rule entry (null or {}), which matches every request"
        - "installing a rule decoded from JSON with a key the build has no field for, the key ignored"
        - "failing to decode a control-plane snapshot because of an unknown top-level section"
        - "installing a rule decoded from JSON in which one field was given twice, the last value kept"
        - "adding a rule key for information that is not an enforcement condition (it belongs inside annotations)"
        - "interpreting the contents of a rule's annotations, or dropping them in the store, the policy file, an export or a snapshot"
        - "raising the size or depth bound of annotations"
        - "bounding annotations on any form other than the canonical one Culvert's encoders write (a ruleset accepted once must stay accepted after save, export and publish)"
        - "keeping only the last of two rule lists given under the same key in one document"
        - "decoding a rule onto anything but a zero value"
    tests:
      - {file: "policy_unknown_ruletype_test.go", name: TestUnknownRuleType_E2E_BulkReplaceIsRefusedAndLastKnownGoodStillBlocks}
      - {file: "policy_unknown_ruletype_test.go", name: TestUnknownRuleType_E2E_PolicyFileReloadIsRefusedAndLastKnownGoodStillBlocks}
      - {file: "policy_unknown_ruletype_test.go", name: TestUnknownRuleType_E2E_SnapshotIsRefusedBeforeAnyMutation}
      - {file: "policy_unknown_ruletype_test.go", name: TestUnknownRuleType_RollbackAndImportAreRefusedWhole}
