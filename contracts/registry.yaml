# Product contracts registry.
#
# Each entry is a customer-observable invariant, the code that implements it and
# the tests that must fail if it breaks. Checked by internal/contracts
# (TestRegistry_IsSoundAgainstThisTree, in the ordinary test suite) and by
# `go run ./cmd/contractcheck impact` in CI, which compares against the BASE
# revision of this file. Design: docs/engineering/PRODUCT-CONTRACTS.md.
#
# status: enforced  the listed tests exist, run, and guard the invariant.
#         open      recorded because it matters, but contradictory, undecided or
#                   pending; `question` says what the owner has to decide. An
#                   open entry is NOT an approved rule.
# owner_approved    false until the product owner has confirmed the wording.
#                   Every seed entry is false: they were derived from code,
#                   tests and docs by an audit, not ratified.
#
# To change or remove a contract on purpose, add an `amended` or `retired`
# record with a reason in the same change. CI then requires an approving review
# from a listed approver who is not the author.
version: 1

# Who may approve a contract change. Read from the BASE revision in CI, so a
# change cannot add its own approver.
approvers:
  - KidCarmi

# Editing these needs the same approval as changing a contract. Also read from
# the BASE revision. This file is not listed: adding an entry stays cheap, and
# removing or rewording one is caught by the base comparison instead.
protected:
  - internal/contracts/**
  - cmd/contractcheck/**
  - .github/workflows/product-contracts.yml
  - .github/CODEOWNERS

amended: []
retired: []

contracts:
  - id: SWG-001
    area: swg-enforcement
    status: enforced
    owner_approved: false
    invariant: "A CONNECT to a private, loopback or link-local destination is refused before any dial, and re-checked at connect time."
    authority: "Proxy request path (package main); address classification in internal/ssrf."
    code:
      - "proxy_tunnel.go"
      - "security.go"
      - "internal/ssrf/*.go"
    configs: []
    transitions:
      permitted:
        - "CONNECT to a public destination proceeds to policy"
      forbidden:
        - "dialing a private destination for a CONNECT"
        - "removing the connect-time re-check"
    tests:
      - {file: "proxy_test.go", name: TestUNAUTH_CONNECT_SSRFBlocksLoopback}
    validation: integration
    compatibility: "Operators rely on this as the SSRF boundary for tunnels; loosening it is a security-posture change."

  - id: SWG-002
    area: swg-enforcement
    status: enforced
    owner_approved: false
    invariant: "On an inspected tunnel, an inner request whose Host or :authority differs from the CONNECT host is blocked before the upstream is contacted."
    authority: "Inspection pipeline (inspect_host_pin.go)."
    code:
      - "inspect_host_pin.go"
      - "proxy_tunnel.go"
    configs: []
    transitions:
      permitted:
        - "inner host equal to the CONNECT host after canonicalization"
        - "any inner host when the CONNECT target is an IP literal"
      forbidden:
        - "forwarding an inner request for a host policy never evaluated"
        - "forwarding a request with no Host"
    tests:
      - {file: "inspect_host_pin_test.go", name: TestInnerHostPin_MismatchIsRefusedBeforeTheUpstreamIsContacted}
    validation: integration
    compatibility: "Clients that reuse a tunnel for another origin receive 403; that is the intended behaviour."

  - id: POL-001
    area: policy
    status: enforced
    owner_approved: false
    invariant: "Enabled access rules are evaluated in priority order and the first match decides; no match returns no decision."
    authority: "Policy engine (policy.go)."
    code:
      - "policy.go"
    configs: []
    transitions:
      permitted:
        - "reordering by changing rule priority"
      forbidden:
        - "a later rule overriding an earlier match"
        - "a disabled rule deciding a request"
    tests:
      - {file: "policy_test.go", name: TestPolicyStore_Evaluate_FirstMatch}
      - {file: "policy_flow_e2e_test.go", name: TestPolicyFlow_PriorityFirstMatchWins}
    validation: integration
    compatibility: "Every stored rulebase depends on this order; changing it changes the meaning of existing customer policies."

  - id: POL-002
    area: policy
    status: enforced
    owner_approved: false
    invariant: "At startup an explicit default action is honoured; an empty one resolves to allow with zero configured rules and to deny with any configured rule."
    authority: "Startup resolution (rewrite_default_action_startup.go)."
    code:
      - "rewrite_default_action_startup.go"
      - "proxy.go"
    configs:
      - "default_action"
      - "CULVERT_DEFAULT_ACTION"
    transitions:
      permitted:
        - "explicit allow or deny chosen by the operator"
      forbidden:
        - "an empty default resolving to allow while rules are configured"
    tests:
      - {file: "rewrite_default_action_startup_test.go", name: TestLoadRewriteAndDefaultAction_EmptyWithRulesDefaultsDeny}
      - {file: "rewrite_default_action_startup_test.go", name: TestLoadRewriteAndDefaultAction_EmptyWithNoRulesDefaultsAllow}
    validation: unit
    compatibility: "Existing installs with no explicit value get their posture from this rule; see POL-900 for the runtime gap."

  - id: POL-003
    area: policy
    status: enforced
    owner_approved: false
    invariant: "A request that matches no rule under default deny receives a block response, not a forwarded request."
    authority: "Proxy request path (proxy.go)."
    code:
      - "proxy.go"
    configs:
      - "default_action"
    transitions:
      permitted:
        - "allow when the operator set default allow"
      forbidden:
        - "forwarding a no-match request under default deny"
    tests:
      - {file: "proxy_test.go", name: TestHandleRequest_DefaultDeny_NoRules}
    validation: integration
    compatibility: "Default-deny deployments rely on this as their fail-closed baseline."

  - id: POL-004
