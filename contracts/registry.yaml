# Product contracts registry.
#
# Each entry is a customer-observable invariant, the code that implements it and
# the tests that must fail if it breaks. Checked by internal/contracts
# (TestRegistry_IsSoundAgainstThisTree, in the ordinary test suite) and by
# `go run ./cmd/contractcheck impact` in CI, which compares against the BASE
# revision of this file. Design: docs/engineering/PRODUCT-CONTRACTS.md.
#
# status: enforced  the listed tests exist, run, and guard the invariant.
#         open      recorded because it matters, but contradictory, undecided or
#                   pending; `question` says what the owner has to decide. An
#                   open entry is NOT an approved rule.
# owner_approved    false until the product owner has confirmed the wording.
#                   Every seed entry is false: they were derived from code,
#                   tests and docs by an audit, not ratified.
#
# To change or remove a contract on purpose, add an `amended` or `retired`
# record with a reason in the same change. The gate is fully automated: an
# unrecorded weakening fails, and a recorded one passes and is listed in the
# gate summary with its reason. No human approval is required.
version: 1

# The gate's own files. Editing them is listed in the gate summary so it never
# passes unseen; it is not refused. Read from the BASE revision. This file is
# not listed: adding an entry stays cheap, and removing or rewording one is
# caught by the base comparison instead.
protected:
  - internal/contracts/**
  - cmd/contractcheck/**
  - .github/workflows/product-contracts.yml

amended:
  - id: POL-001
    reason: "Owner decision C (policy semantics): rules with EQUAL priority now evaluate in stored order (policy file, config-version snapshot, backup or CP snapshot order). Publication used sort.Slice, which is the identity on every sorted input and stable for n <= 12, so steady-state rulebases keep exactly the order they had; only an unsorted input with ties at n >= 13 (gap add, priority edit or move on a tied rulebase, or the first load of a hand-edited unsorted file) used to get an unchosen pdqsort permutation. Proven by a differential test against the old comparator. Existing rules are never renumbered; culvert_policy_priority_ties and the policy_priority_ties diagnostics row report ties. There is no upgrade-time order warning: pre-customer, there is no installed base to migrate (owner, 2026-11-23)."
retired: []

contracts:
  - id: SWG-001
    area: swg-enforcement
    status: enforced
    owner_approved: false
    invariant: "A CONNECT to a private, loopback or link-local destination is refused before any dial, and re-checked at connect time."
    authority: "Proxy request path (package main); address classification in internal/ssrf."
    code:
      - "proxy_tunnel.go"
      - "security.go"
      - "internal/ssrf/*.go"
    configs: []
    transitions:
      permitted:
        - "CONNECT to a public destination proceeds to policy"
      forbidden:
        - "dialing a private destination for a CONNECT"
        - "removing the connect-time re-check"
    tests:
      - {file: "proxy_test.go", name: TestUNAUTH_CONNECT_SSRFBlocksLoopback}
    validation: integration
    compatibility: "Operators rely on this as the SSRF boundary for tunnels; loosening it is a security-posture change."

  - id: SWG-002
    area: swg-enforcement
    status: enforced
    owner_approved: false
    invariant: "On an inspected tunnel, an inner request whose Host or :authority differs from the CONNECT host is blocked before the upstream is contacted."
    authority: "Inspection pipeline (inspect_host_pin.go)."
    code:
      - "inspect_host_pin.go"
      - "internal/hostpin/pin.go"
      - "proxy_tunnel.go"
    configs: []
    transitions:
      permitted:
        - "inner host equal to the CONNECT host after canonicalization"
        - "any inner host when the CONNECT target is an IP literal"
      forbidden:
        - "forwarding an inner request for a host policy never evaluated"
        - "forwarding a request with no Host"
    tests:
      - {file: "inspect_host_pin_test.go", name: TestInnerHostPin_MismatchIsRefusedBeforeTheUpstreamIsContacted}
    validation: integration
    compatibility: "Clients that reuse a tunnel for another origin receive 403; that is the intended behaviour."

  - id: POL-001
    area: policy
    status: enforced
    owner_approved: false
    invariant: "Enabled access rules are evaluated in priority order, rules with equal priority in stored order, and the first match decides; no match returns no decision."
    authority: "Policy engine (policy.go, policy_tie_order.go)."
    code:
      - "policy.go"
      - "policy_tie_order.go"
    configs: []
    transitions:
      permitted:
        - "reordering by changing rule priority"
      forbidden:
        - "a later rule overriding an earlier match"
        - "a disabled rule deciding a request"
        - "a publication reordering rules that share a priority"
        - "renumbering stored priorities without an explicit operator action"
    tests:
      - {file: "policy_test.go", name: TestPolicyStore_Evaluate_FirstMatch}
      - {file: "policy_flow_e2e_test.go", name: TestPolicyFlow_PriorityFirstMatchWins}
      - {file: "policy_tie_order_test.go", name: TestPolicyTieOrder_StableSortMatchesLegacyWhereItMustAgree}
      - {file: "policy_tie_order_test.go", name: TestPolicyTieOrder_UntouchedTiesKeepOrderAcrossWriters}
      - {file: "policy_tie_order_test.go", name: TestPolicyTieOrder_LoadUnsortedTiedFileKeepsStoredOrder}
      - {file: "policy_tie_order_test.go", name: TestPolicyTieOrder_ReplaceAllAndSnapshotKeepTieOrder}
      - {file: "policy_tie_order_test.go", name: TestPolicyTieOrder_EvaluateUnchangedForSortedInputs}
    validation: integration
    compatibility: "Every stored rulebase depends on this order; changing it changes the meaning of existing customer policies. Ties already stored keep the order they have in the file, snapshot or backup; a tied rulebase that drifted under the old sort keeps its persisted (drifted) order."

