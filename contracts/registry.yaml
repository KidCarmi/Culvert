    question: "OPEN until verified on a real Docker daemon (owner, 2026-11-23): does the conservative converge mode hold its safety properties against real Docker (the real-Docker e2e)? If it does, should converge become the default before the first customer release?"
    compatibility: "Opt-in; the default \"off\" is the AGT-004 behaviour. Proven against a fake Docker exec layer and the shell Docker model only, not yet against a real daemon (the proposal's real-Docker e2e is not built). Enabling it by default, and adopting a live target that never passed its gate, are not decided and are excluded by owner decision 1. A record from an agent that predates rollback_armed is never finished as a rollback; it is reported. Finishing an armed rollback whose retag never ran (real-Docker e2e finding 2) is proven against the same fakes only; the real-Docker e2e must be re-run on it."

