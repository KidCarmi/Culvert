  - id: POL-006
    area: policy
    status: enforced
    owner_approved: false
    invariant: "A policy write through the API, a replace-mode configuration import or a draft commit cannot create two rules with the same priority; Load, config-version rollback and CP-to-DP sync restore faithfully and only report an existing tie."
    authority: "Policy write paths (ui_policy.go, ui_authpolicy.go, policy_draft.go, ui_config.go) over the policy store (policy.go)."
    code:
      - "policy.go"
      - "policy_tie_order.go"
      - "policy_draft.go"
      - "ui_config.go"
      - "ui_policy.go"
      - "ui_authpolicy.go"
      - "ui_helpers.go"
    configs: []
    transitions:
      permitted:
        - "a create whose requested priority is taken being reassigned to max+1"
        - "an update by priority whose body has no priority keeping the stored priority"
        - "a draft commit that keeps a tie inherited unchanged from running"
        - "Load, rollback or CP-to-DP sync installing a stored tie verbatim, with a warning and the diagnostics row"
      forbidden:
        - "storing an update body priority of 0 or below verbatim"
        - "a draft commit activating a newly shared priority"
        - "a replace-mode import installing rules that share a priority"
        - "automatically renumbering an existing tie"
    tests:
      - {file: "policy_tie_api_test.go", name: TestPolicyTies_PutByPriorityWithoutBodyPriorityKeepsStoredSlot}
      - {file: "policy_tie_api_test.go", name: TestPolicyTies_DraftCommitRefusesNewTieButKeepsInheritedOne}
      - {file: "policy_tie_api_test.go", name: TestPolicyTies_ReplaceImportRefusesDuplicatePriorities}
      - {file: "policy_tie_order_test.go", name: TestPolicyTieOrder_GaugeAndDiagnosticsRow}
    validation: integration
    compatibility: "New 400s: a replace-mode import (preview and commit) whose rules share a priority, and a draft commit that would create a new shared priority. PUT by priority with no body priority now keeps the rule's slot instead of storing 0. Existing ties are not renumbered."

