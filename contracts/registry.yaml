  - id: AGT-004
    area: agent-lifecycle
    status: enforced
    owner_approved: false
    invariant: "After the maintenance agent dies during an upgrade or rollback, its next start reports the operation as failed with how far it got and lists it in status until a later image change succeeds; an operation that ended failed without proving its end state safe keeps its record and is listed and reported the same way, with its own failure reason. With reconcile_on_startup = \"off\" (the default) startup changes nothing in Docker. What \"converge\" may change is AGT-900."
    authority: "Maintenance agent (cmd/culvert-maint, separate module). Lifecycle: docs/adr/0061-maintenance-agent-crash-journal-lifecycle.md."
    code:
      - "cmd/culvert-maint/main.go"
      - "cmd/culvert-maint/internal/journal/*.go"
      - "cmd/culvert-maint/internal/server/interrupted.go"
      - "cmd/culvert-maint/internal/server/terminal_record.go"
      - "cmd/culvert-maint/internal/ops/orchestrator.go"
      - "cmd/culvert-maint/internal/ops/terminal.go"
      - "cmd/culvert-maint/internal/status/*.go"
      - "cmd/culvert-maint/internal/config/*.go"
    configs: []
    transitions:
      permitted:
        - "reporting the same interrupted operation again at every later start"
        - "starting while Docker is unreachable"
        - "removing, at startup, the record of an operation that ended succeeded or with its end state proven safe, after its terminal audit entry is on file"
      forbidden:
        - "reporting an interrupted operation as succeeded"
        - "reporting a failed operation as succeeded, or a kept failed operation as agent_restart_interrupted"
        - "pulling, tagging or recreating containers at startup with reconcile_on_startup off"
        - "removing the record of an interrupted operation, or of an ended one whose end state is not proven safe, at startup with reconcile_on_startup off"
        - "writing an operation's terminal audit entry twice, or removing its record before that entry is durable"
        - "pulling an image at startup in any mode"
        - "returning an image reference from a journal record that failed the repo-bound digest check"
    tests:
      - {file: "cmd/culvert-maint/startup_crash_recovery_test.go", name: TestCrashRecovery_EveryKillPoint}
      - {file: "cmd/culvert-maint/command_intent_crash_test.go", name: TestCommandIntent_DiedInsideUp}
      - {file: "cmd/culvert-maint/command_intent_crash_test.go", name: TestCommandIntent_KilledAfterTheCommandReturned}
      - {file: "cmd/culvert-maint/startup_intent_consume_test.go", name: TestInitJournal_TakesTheIntentOnceAndInEveryMode}
      - {file: "cmd/culvert-maint/startup_intent_consume_test.go", name: TestTakeCommandIntents_AnIntentThatCannotBeRemovedStopsTheStart}
      - {file: "cmd/culvert-maint/startup_intent_consume_test.go", name: TestInitJournal_ARefusedStartLeavesNothingBehind}
      - {file: "cmd/culvert-maint/command_intent_crash_test.go", name: TestCommandIntent_ASecondAgentDoesNotTakeALiveIntent}
      - {file: "cmd/culvert-maint/startup_crash_recovery_test.go", name: TestCrashRecovery_RepeatedRestartsAreIdempotent}
      - {file: "cmd/culvert-maint/startup_crash_recovery_test.go", name: TestCrashRecovery_DockerUnavailableAtStartup}
      - {file: "cmd/culvert-maint/startup_crash_recovery_test.go", name: TestCrashRecovery_ForgedRecordRefsAreNotRepeated}
      - {file: "cmd/culvert-maint/startup_journal_test.go", name: TestInitJournal_AuditsOnceAndCountsStarts}
      - {file: "cmd/culvert-maint/startup_journal_test.go", name: TestInitJournal_KeptFailedRecord_ReportedWithItsReasonAuditedOnce}
      - {file: "cmd/culvert-maint/startup_journal_test.go", name: TestInitJournal_EndedSucceededRecord_AuditedThenRemoved}
      - {file: "cmd/culvert-maint/startup_journal_test.go", name: TestInitJournal_KillAfterTerminalAudit_NoSecondEntry}
      - {file: "cmd/culvert-maint/startup_journal_test.go", name: TestInitJournal_EndedRecordWithAuditUnavailable_NotRemoved}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestTerminalCrash_KillBeforeAudit_StartupWritesItOnceAndKeeps}
      - {file: "cmd/culvert-maint/internal/ops/terminal_test.go", name: TestTerminal_RecordThenAuditThenSettleThenFinish}
      - {file: "cmd/culvert-maint/internal/status/status_terminal_test.go", name: TestSnapshot_KeptRecordOfThisProcessIsListed}
      - {file: "cmd/culvert-maint/startup_reconcile_converge_test.go", name: TestOffMode_StatusAndStateUnchanged}
      - {file: "cmd/culvert-maint/internal/config/config_reconcile_test.go", name: TestLoad_ReconcileOnStartup}
    validation: integration
    compatibility: "The journal file gains optional keys an older agent ignores. reconcile_on_startup defaults to \"off\"; an agent that predates the key refuses to start with it set (unknown config keys fail to load), so remove it before a downgrade. What startup may change with \"converge\" is AGT-900."

  - id: AGT-005
    area: agent-lifecycle
    status: enforced
    owner_approved: false
    invariant: "An interrupted operation's journal record is removed only when a later upgrade or image rollback succeeds after re-pinning the image tag and passing the health gate; or, for the record of an interrupted restore or data rollback only, when a later restore or data rollback succeeds after its commit returned success and its health check passed; or, with reconcile_on_startup = \"converge\", when the startup reconcile verified convergence by image id. The removal is audited first. A restore or data rollback never removes the record of an interrupted upgrade or image rollback. The same rules retire the record an operation KEPT because it ended failed without proving its end state safe (ADR-0062 slice 1); an operation removes its own record at its end only when it succeeded or proved its end state safe, and only after its terminal audit entry is durable."
    authority: "Maintenance agent (cmd/culvert-maint, separate module). Lifecycle: docs/adr/0061-maintenance-agent-crash-journal-lifecycle.md."
    code:
      - "cmd/culvert-maint/internal/server/journal_retire.go"
      - "cmd/culvert-maint/internal/server/restore_journal.go"
      - "cmd/culvert-maint/internal/server/startup_reconcile.go"
      - "cmd/culvert-maint/internal/server/terminal_record.go"
    configs: []
    transitions:
      permitted:
        - "keeping the record after a failed recovery attempt"
        - "a successful restore or data rollback removing the record of an earlier interrupted restore or data rollback"
        - "a successful upgrade or image rollback removing the record of an interrupted restore or data rollback, as it removes every other record"
        - "keeping the record when the startup reconcile reports recovery_required, defers, or cannot write its audit entry"
      forbidden:
        - "removing the record when a later operation failed"
        - "removing the record on an already-current upgrade, which re-pins nothing"
        - "removing a record without an audit entry"
        - "the startup reconcile removing a record before its audit entry is written or without verified convergence"
        - "a restore or data rollback removing the record of an interrupted upgrade or image rollback"
        - "removing a restore record when the later restore failed, or did not commit and pass its health check"
        - "the startup reconcile removing, or acting on, the record of an interrupted restore or data rollback"
        - "an operation removing its own record after a failure that did not prove its end state safe"
        - "removing an operation's own record before its terminal audit entry is durable"
    tests:
      - {file: "cmd/culvert-maint/startup_crash_recovery_test.go", name: TestCrashRecovery_NewUpgradeConvergesAndRetiresTheRecord}
      - {file: "cmd/culvert-maint/startup_crash_recovery_test.go", name: TestCrashRecovery_AlreadyCurrentUpgradeDoesNotRetire}
      - {file: "cmd/culvert-maint/startup_crash_recovery_test.go", name: TestCrashRecovery_FailedRecoveryKeepsTheRecord}
      - {file: "cmd/culvert-maint/internal/server/journal_retire_test.go", name: TestRetire_SuccessOfAnEstablishingOpRetiresStaleRecords}
      - {file: "cmd/culvert-maint/internal/server/journal_retire_test.go", name: TestRetire_AuditFailureKeepsRecord}
      - {file: "cmd/culvert-maint/internal/server/startup_reconcile_test.go", name: TestStartupReconcile_AuditFailureKeepsRecord}
      - {file: "cmd/culvert-maint/startup_reconcile_converge_test.go", name: TestConvergeRecovery_EveryKillPoint}
      - {file: "cmd/culvert-maint/internal/server/journal_retire_restore_test.go", name: TestRetireRestore_SuccessRetiresRestoreRecordsOnly}
      - {file: "cmd/culvert-maint/internal/server/journal_retire_restore_test.go", name: TestRetireRestore_NeverAnUpgradeRecord}
      - {file: "cmd/culvert-maint/internal/server/journal_retire_restore_test.go", name: TestRetireRestore_NotWhenTheRestoreDidNotEstablishItsState}
      - {file: "cmd/culvert-maint/internal/server/journal_retire_restore_test.go", name: TestRetireRestore_AuditFailureKeepsRecord}
      - {file: "cmd/culvert-maint/internal/server/startup_reconcile_restore_test.go", name: TestStartupReconcile_RestoreRecordIsReportedOnly}
      - {file: "cmd/culvert-maint/startup_restore_crash_test.go", name: TestRestoreCrash_LaterRestoreRetiresTheRecord}
      - {file: "cmd/culvert-maint/startup_restore_crash_test.go", name: TestRestoreCrash_RestoreDoesNotRetireAnInterruptedUpgrade}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestEndState_Apply_FailedBeforeBarrier_Removed}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestEndState_Apply_FailedPastBarrierNoRollback_Kept}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestEndState_Apply_InlineRollbackPassedGate_Removed}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestEndState_Apply_InlineRollbackFailedGate_Kept}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestEndState_ImageRollback_FailedBeforeTagMove_Removed}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestEndState_ImageRollback_FailedInRestart_Kept}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestEndState_ImageRollback_FailedGate_Kept}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestEndState_Restore_FailedBeforeStop_Removed}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestEndState_Restore_FailedAfterStop_Kept}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestEndState_Restore_CommittedAndHealthy_Removed}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestKeptRecord_RetiredByALaterSuccess}
      - {file: "cmd/culvert-maint/internal/server/terminal_record_test.go", name: TestKeptRecord_RetirementCompletesAMissingTerminalEntryFirst}
      - {file: "cmd/culvert-maint/internal/ops/terminal_test.go", name: TestTerminal_AuditFailureNeverSettles}
    validation: integration
    compatibility: "Before this entry a record was never removed and was reported again at every start. Since the ADR-0061 addendum of 2026-11-24 restore.commit is journaled too; an agent that predates that reports such a record as an interrupted operation of unknown kind and retires it on its next successful upgrade or image rollback."

  - id: AGT-900
    area: agent-lifecycle
    status: open
    owner_approved: false
    invariant: "With reconcile_on_startup = \"converge\", after a crash during an image change, or after an image change that failed without proving its end state safe (its record kept, ADR-0062 slice 1), the next start either leaves the fixed tag and the proxy container on the same image, identified by image id as the pre-change image or as a target the journal proves passed its health gate and digest verify (and that answers ready now), or, with resume_interrupted_gate = true, as a target whose interrupted health gate it ran again at this start and that passed it and its digest verify, or reports recovery_required. It changes Docker only to bring back the pre-change image (finishing an armed rollback, including the agent's own runtime recovery (a runtime.recover record) only when the image it restores is proven compatible with the current data, or restoring it when no proxy container runs, this agent start found the previous process died inside a `compose up` of that record's own operation, and Docker still lists the never-started proxy service container such a death leaves), and a change that fails its gate or verification is kept and reported. It never starts an image that has not passed the health gate. With the default \"off\" it changes nothing (AGT-004)."
    authority: "Maintenance agent (cmd/culvert-maint). Owner decision 1 on the AGT-900 recovery proposal; lifecycle docs/adr/0061-maintenance-agent-crash-journal-lifecycle.md."
    code:
      - "cmd/culvert-maint/main.go"
      - "cmd/culvert-maint/internal/server/startup_reconcile.go"
      - "cmd/culvert-maint/internal/server/reconcile_decision_v2.go"
      - "cmd/culvert-maint/internal/server/reconcile_resume.go"
      - "cmd/culvert-maint/internal/server/reconcile_runtime_recover.go"
      - "cmd/culvert-maint/internal/runner/reconcile_read.go"
      - "cmd/culvert-maint/internal/runner/runner.go"
      - "packaging/sudoers/culvert-maint"
      - "cmd/culvert-maint/internal/journal/*.go"
    configs:
      - "cmd/culvert-maint/internal/config/config.go"
    transitions:
      permitted:
        - "retagging to the recorded, validated prior reference while the container provably runs that image"
        - "`compose up` with the fixed tag already on the prior image when the journal records an armed inline rollback, then gating and verifying it"
        - "when the journal records an armed inline rollback whose own retag never ran (container and tag on the target), retagging to the validated prior reference, re-reading Docker, then `compose up`, a fresh health gate and verification by image id"
        - "retiring, without any Docker change, an armed record whose container and tag are on the prior image once it answers ready"
        - "adopting, without any Docker change, a target recorded at phase verified that runs under the tag and answers ready"
        - "deferring, with no action and no attempt counted, while Docker cannot be read"
        - "with resume_interrupted_gate = true (accepted only with converge), for an upgrade at restarted or restarting whose container, fixed tag and validated target reference are freshly read on one image id other than the prior's whose RepoDigests list the pinned digest (at restarted the id the restart recorded, at restarting none recorded yet), no armed rollback, no death inside the operation's `compose up` found by this start unless the proxy container runs and `compose ps -a` lists no never-started proxy container (Compose finished that recreate), and no agent start but this one since the gate began (an open gate:target checkpoint on that id with epoch = interrupted_seen - 1 below two gate runs begun, or no checkpoint at interrupted_seen 1): writing the gate checkpoint ahead fail-closed, a fresh health gate, then verifying container and tag by image id and the running digest, and adopting the target without any Docker change (one `:resumed` audit entry); when that gate or verify fails, writing the result and rollback_armed fail-closed and, in the same start, finishing the rollback exactly as for an armed record whose own retag never ran"
        - "retiring a record after verified convergence and an audit entry"
        - "for a runtime.recover record (the agent's runtime recovery writes it armed at phase restarted, prior = the image an upgrade it installed replaced, target = that installed image), exactly the steps permitted for an armed inline rollback, when the prior image's data-epoch labels admit the data directory's current epoch (AGT-008), read at this start"
        - "when no proxy container runs, the record is an upgrade at restarting or restarted (armed or not), this agent start found that the previous process died inside a `compose up` of that record's own operation (taken once per process), and `compose ps -a` lists a proxy service container (not a `compose run` one-off) in state created, what that death leaves (read again before every Docker change up to the reconcile's own first `up`), retagging to the validated prior reference whose local image is the recorded prior, `compose up` (once more if a fresh read shows nothing running), each after a fresh Docker read that still decides it, then a fresh health gate and verification by image id"
      forbidden:
        - "adopting or restarting a target that never passed the health gate"
        - "pulling an image, `compose down`, or moving the tag to the target at startup"
        - "acting on a record whose references failed validation, or after the attempt cap"
        - "acting without a durable write-ahead attempt, or on a decision Docker no longer supports"
        - "a tag or `compose up` without a fresh Docker read immediately before it that supports it"
        - "`compose up` while the fixed tag is not on the validated prior image, or a second `up` after the gate failed"
        - "finishing a rollback the journal does not prove armed, or an armed record at phase verified"
        - "retiring an armed record found on the prior image without a fresh ready probe"
        - "retiring an armed record after a realign (retag only) without a fresh ready probe of the prior"
        - "starting any container when no proxy container runs unless this start found the agent died inside a `compose up` of that record's own operation and Docker lists a created proxy service container; restoring on the journal's attribution alone, on a `compose run` one-off, or when `compose ps -a` cannot be read or understood (for one, a sudoers file without its rule); restoring over an upgrade at phase verified; restoring a prior that is not local and identical to the recorded one; restoring when the fixed tag is on an image other than the prior or the target"
        - "acting on the command attribution more than once per process, or on the attribution alone without Docker's live state matching the record"
        - "flipping the interrupted operation to succeeded"
        - "resuming a health gate with resume_interrupted_gate off; at phase verified; for an image that does not carry the pinned digest, or whose id disagrees with the one the restart recorded (or, at restarting, with any id recorded); for an armed record; after this start found a death inside the operation's `compose up` while `compose ps -a` lists a never-started proxy container, cannot be read, or was not read; on a checkpoint naming another image, already ended, or seen by another agent start since it began; beyond two gate runs begun; or without the gate checkpoint durably written ahead"
        - "rolling back after a failed resumed gate without rollback_armed durably written, and replaying the interrupted operation's own `docker tag` or `compose up`"
        - "reconciling while another agent process holds the instance lock"
        - "tagging or starting the prior image of a runtime.recover record when its compatibility with the current data is incompatible, or unknown (no or malformed epoch labels, labels that cannot be read, or a data epoch that cannot be read)"
        - "acting on a runtime.recover record that is not armed or not at phase restarted"
    tests:
      - {file: "cmd/culvert-maint/startup_reconcile_converge_test.go", name: TestConvergeRecovery_EveryKillPoint}
      - {file: "cmd/culvert-maint/startup_reconcile_converge_test.go", name: TestConvergeRecovery_VerifiedPhaseAdopts}
